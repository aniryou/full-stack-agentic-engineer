<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="The KV a request holds at each decode step, drawn against time: a 300-token output on a 1,500-token prompt is a thin sliver, a 3,000-token output an area 18.2 times larger." style="color: #E4EAE7">
  <title>The KV a request holds at each decode step, drawn against time: a 300-token output on a 1,500-token prompt is a thin sliver, a 3,000-token output an area 18.2 times larger.</title>
  <rect x="0" y="0" width="880" height="360" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" font-size="11" fill="#97A59F">one request on a 1,500-token prompt: a 300-token output against a 3,000-token output, to scale</text>
    <polygon points="90,290 90,223.3 795,90 795,290" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <polygon points="90,290 90,223.3 160.5,210 160.5,290" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <path d="M90 223.3 L795 223.3" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="300" y="218" font-size="10.5" fill="#97A59F">P = 1,500 prompt tokens, held from the first decode step</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M90 290 L836 290" marker-end="url(#arr)"/>
      <path d="M90 290 L90 62" marker-end="url(#arr)"/>
      <path d="M160.5 290 L160.5 296 M795 290 L795 296 M84 223.3 L90 223.3 M84 90 L90 90 M84 210 L90 210"/>
    </g>
    <text x="90" y="310" font-size="10.5" fill="#97A59F" text-anchor="middle">0</text>
    <text x="160.5" y="310" font-size="10.5" fill="#97A59F" text-anchor="middle">300</text>
    <text x="795" y="310" font-size="10.5" fill="#97A59F" text-anchor="middle">3,000</text>
    <text x="78" y="227" font-size="10.5" fill="#97A59F" text-anchor="end">1,500</text>
    <text x="78" y="94" font-size="10.5" fill="#97A59F" text-anchor="end">4,500</text>
    <text x="78" y="208" font-size="10.5" fill="#97A59F" text-anchor="end">1,800</text>
    <text x="560" y="328" font-size="11" fill="#97A59F" text-anchor="middle">decode step t: at step t the request holds P + t tokens of KV, for L steps</text>
    <text x="30" y="150" font-size="11" fill="#97A59F" text-anchor="middle" transform="rotate(-90 30 150)">KV tokens held</text>
    <text x="178" y="166" font-size="11" fill="#7ADACF">L = 300: 495,150 KV-token-steps</text>
    <text x="178" y="181" font-size="11" fill="#7ADACF">peak 1,800 tokens</text>
    <path d="M176 176 L150 236" fill="none" stroke="#4CC5B7" stroke-width="1"/>
    <text x="478" y="256" font-size="12.5" text-anchor="middle" font-weight="600">L = 3,000: 9,001,500 KV-token-steps = 18.2×</text>
    <text x="478" y="274" font-size="11" text-anchor="middle">peak 4,500 against 1,800 tokens: only 2.5×</text>
    <text x="24" y="350" font-size="11" fill="#97A59F">the area is memory × time per request: KV-token-steps = P·L + L(L + 1)/2 · workload.kv_token_steps()</text>
  </g>
</svg>
