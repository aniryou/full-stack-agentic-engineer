<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-label="A completion is a trajectory of tokens, each sampled from the policy given everything before it; the reward arrives at the end, and one gradient step pushes every token by the same advantage." style="color: #E4EAE7">
  <title>A completion is a trajectory of tokens, each sampled from the policy given everything before it; the reward arrives at the end, and one gradient step pushes every token by the same advantage.</title>
  <rect x="0" y="0" width="880" height="350" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" font-size="11" fill="#97A59F">one completion y of the bracket task: 8 tokens, sampled one at a time from π(a | s)</text>
    <rect x="24" y="44" width="90" height="36" rx="4" fill="#232C29" stroke="#97A59F" stroke-width="1"/>
    <text x="69" y="66" font-size="11" fill="#97A59F" text-anchor="middle">prompt x</text>
    <rect x="136" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="163" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a1</text>
    <rect x="198" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="225" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a2</text>
    <rect x="260" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="287" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a3</text>
    <rect x="322" y="44" width="54" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="349" y="66" font-size="11" fill="#7ADACF" text-anchor="middle" font-family="JetBrains Mono, monospace">a4</text>
    <rect x="384" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="411" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a5</text>
    <rect x="446" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="473" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a6</text>
    <rect x="508" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="535" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a7</text>
    <rect x="570" y="44" width="54" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="597" y="66" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">a8</text>
    <path d="M626 62 L688 62" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="654" y="40" font-size="10.5" fill="#97A59F" text-anchor="middle">the verifier</text>
    <text x="654" y="52" font-size="10.5" fill="#97A59F" text-anchor="middle">reads y</text>
    <rect x="692" y="44" width="164" height="36" rx="4" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="774" y="60" font-size="11.5" text-anchor="middle" font-weight="600">R(y)</text>
    <text x="774" y="74" font-size="10.5" text-anchor="middle">1 for a balanced string</text>
    <path d="M24 92 L314 92" fill="none" stroke="#97A59F" stroke-width="1"/>
    <path d="M24 88 L24 92 M314 88 L314 92" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="169" y="108" font-size="10.5" fill="#97A59F" text-anchor="middle">s4: everything before position 4</text>
    <text x="349" y="108" font-size="10.5" fill="#7ADACF" text-anchor="middle">a4 ~ π(· | s4)</text>
    <text x="504" y="108" font-size="10.5" fill="#97A59F" text-anchor="middle">a5 to a8: each from its own state</text>
    <text x="24" y="136" font-size="11" fill="#97A59F">per token: log π(a_t | s_t), what an engine returns as logprobs · Policy.token_logprobs()</text>
    <text x="24" y="152" font-size="11" fill="#97A59F">under the uniform policy every term is log(1/2), so log π(y) = 8·log(1/2) = −5.545</text>
    <rect x="24" y="178" width="256" height="90" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="152" y="202" text-anchor="middle" font-weight="600">log π(y) = Σ_t log π(a_t | s_t)</text>
    <text x="152" y="222" text-anchor="middle" font-size="11" fill="#97A59F">the sum of the per-token terms</text>
    <text x="152" y="250" text-anchor="middle" font-size="11" fill="#97A59F" font-family="JetBrains Mono, monospace">Policy.seq_logprob()</text>
    <rect x="312" y="178" width="256" height="90" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="440" y="202" text-anchor="middle" font-weight="600">one gradient step</text>
    <text x="440" y="222" text-anchor="middle" font-size="11.5" fill="#7ADACF">(R − b) · ∇ log π(y)</text>
    <text x="440" y="237" text-anchor="middle" font-size="10.5" fill="#7ADACF">the same weight on every token</text>
    <text x="440" y="256" text-anchor="middle" font-size="11" fill="#7ADACF" font-family="JetBrains Mono, monospace">pg.reinforce_grad()</text>
    <rect x="600" y="178" width="256" height="90" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="728" y="202" text-anchor="middle" font-weight="600">advantage R − b</text>
    <text x="728" y="222" text-anchor="middle" font-size="11" fill="#97A59F">b = the batch mean: no bias, less variance</text>
    <text x="728" y="250" text-anchor="middle" font-size="11" fill="#97A59F" font-family="JetBrains Mono, monospace">pg.advantages("mean")</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M280 223 L310 223" marker-end="url(#arr)"/>
      <path d="M600 223 L570 223" marker-end="url(#arr)"/>
      <path d="M774 80 L774 176" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    </g>
    <text x="782" y="132" font-size="10.5" fill="#97A59F">score</text>
    <text x="24" y="300" font-size="11" fill="#97A59F">exact, for the table policy: ∂ log π(a | s) / ∂θ[s, b] = 1[a = b] − π(b | s), and the row sums to zero</text>
    <text x="24" y="316" font-size="11" fill="#97A59F">one token up moves every other token of that state down · Policy.grad_logprob()</text>
    <text x="24" y="338" font-size="11" fill="#97A59F">each method of this primer is a weighted sum of these per-token gradients: the methods differ only in the weights</text>
  </g>
</svg>
