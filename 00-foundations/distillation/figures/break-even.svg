<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Cumulative cost against output tokens: the teacher line from zero, the student line from the one-off bill with a lower slope, and the crossing at 230.6 million tokens." style="color: #E4EAE7">
  <title>Cumulative cost against output tokens: the teacher line from zero, the student line from the one-off bill with a lower slope, and the crossing at 230.6 million tokens.</title>
  <rect x="0" y="0" width="880" height="360" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <path d="M90 282 L790 282" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M90 282 L90 42" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="790" y="274" font-size="11" fill="#97A59F" text-anchor="end">output tokens (millions)</text>
    <text x="82" y="34" font-size="11" fill="#97A59F">cumulative cost, $</text>
    <text x="84" y="296" font-size="11" fill="#97A59F" text-anchor="end">0</text>
    <rect x="91" y="149.9" width="14" height="132.1" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="114" y="107.855625" font-size="11.5" fill="#E39A62" font-weight="600">the one-off bill: $192.21</text>
    <text x="114" y="123.855625" font-size="11" fill="#E39A62">the teacher's tokens $177.91 (93%)</text>
    <text x="114" y="139.855625" font-size="11" fill="#E39A62">SFT of the 1.5B student $14.30</text>
    <path d="M90.0 282.0 L770.0 86.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M90.0 149.9 L770.0 137.5" fill="none" stroke="#4CC5B7" stroke-width="1.8"/>
    <text x="697.75" y="97.00375" font-size="11" text-anchor="end">teacher: Qwen2.5-32B on two H100s, $0.890 per million output tokens</text>
    <text x="765.75" y="161.612625" font-size="11" fill="#7ADACF" text-anchor="end">student: Qwen2.5-1.5B</text>
    <text x="765.75" y="175.612625" font-size="11" fill="#7ADACF" text-anchor="end">$0.0560 per million</text>
    <text x="765.75" y="189.612625" font-size="11" fill="#7ADACF" text-anchor="end">each million tokens saves $0.834</text>
    <line x1="580.025" y1="140.901625" x2="580.025" y2="282" stroke="#4CC5B7" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="580.0" cy="140.9" r="4.5" fill="#4CC5B7"/>
    <text x="580.025" y="300" font-size="11.5" fill="#7ADACF" text-anchor="middle" font-weight="600">break-even: 230.6 million tokens</text>
    <text x="580.025" y="316" font-size="11" fill="#97A59F" text-anchor="middle">4.6 days at 50 million output tokens a day, 46.1 days at 5 million, 230.6 days at 1 million</text>
    <text x="580.025" y="332" font-size="11" fill="#97A59F" text-anchor="middle">($41.68 a day saved at 50 million)</text>
    <text x="856" y="26" font-size="11" fill="#97A59F" text-anchor="end">not drawn: data bought through an API, $1,814.30 one-off, 2,176.5 million tokens to break even</text>
  </g>
</svg>
