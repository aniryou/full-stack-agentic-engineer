[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distillcore"
version = "0.1.0"
description = "Distillation on toy tasks: soft targets and temperature, forward vs reverse KL, sequence-level and on-policy distillation, reasoning traces, distilled drafts, measuring a student and its economics. The T0 core of 00-foundations/distillation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]         # the library is standard library + numpy

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyterlab>=4.0"]
plot = ["matplotlib>=3.8"]             # optional: the notebooks print text charts without it

[tool.setuptools.packages.find]
include = ["distillcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
