<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-label="What each GPU holds and what one MoE layer exchanges: on one GPU, under tensor parallelism, and under expert parallelism with data-parallel attention." style="color: #E4EAE7">
  <title>What each GPU holds and what one MoE layer exchanges: on one GPU, under tensor parallelism, and under expert parallelism with data-parallel attention.</title>
  <rect x="0" y="0" width="1000" height="404" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="16" y="16" width="212" height="372" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="122" y="36" font-size="11.5" fill="#97A59F" text-anchor="middle" font-weight="600">one GPU (§6.1)</text>
    <rect x="28" y="50" width="188" height="236" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="122" y="72" text-anchor="middle" font-weight="600">GPU 0</text>
    <text x="122" y="96" font-size="11.5" text-anchor="middle">attention + the KV cache</text>
    <rect x="47" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="55.0" y="127.0" font-size="11" text-anchor="middle">E₀</text>
    <rect x="66" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="74.0" y="127.0" font-size="11" text-anchor="middle">E₁</text>
    <rect x="85" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="93.0" y="127.0" font-size="11" text-anchor="middle">E₂</text>
    <rect x="104" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="112.0" y="127.0" font-size="11" text-anchor="middle">E₃</text>
    <rect x="123" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="131.0" y="127.0" font-size="11" text-anchor="middle">E₄</text>
    <rect x="142" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="150.0" y="127.0" font-size="11" text-anchor="middle">E₅</text>
    <rect x="161" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="169.0" y="127.0" font-size="11" text-anchor="middle">E₆</text>
    <rect x="180" y="112" width="16" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="188.0" y="127.0" font-size="11" text-anchor="middle">E₇</text>
    <text x="122" y="152" font-size="11" fill="#97A59F" text-anchor="middle">all E experts in HBM</text>
    <text x="122" y="176" font-size="11.5" text-anchor="middle">router · shared expert</text>
    <rect x="42" y="196" width="160" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="122" y="218" font-size="11.5" text-anchor="middle" font-weight="600">one fused launch</text>
    <text x="122" y="238" font-size="11" fill="#97A59F" text-anchor="middle">align the slots by expert,</text>
    <text x="122" y="254" font-size="11" fill="#97A59F" text-anchor="middle">grouped GEMM, combine</text>
    <text x="122" y="318" font-size="11.5" fill="#97A59F" text-anchor="middle">exchange per MoE layer: none</text>
    <rect x="244" y="16" width="328" height="372" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="408" y="36" font-size="11.5" fill="#97A59F" text-anchor="middle" font-weight="600">tensor parallel: the experts sharded (§6.4)</text>
    <rect x="258" y="50" width="134" height="190" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="325" y="72" text-anchor="middle" font-weight="600">GPU 0</text>
    <text x="325" y="96" font-size="11.5" text-anchor="middle">1/p of attention</text>
    <rect x="269.5" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="283.7" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="297.9" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="312.1" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="326.3" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="340.5" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="354.7" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="368.9" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="325" y="142" font-size="11" fill="#97A59F" text-anchor="middle">1/p of every expert</text>
    <text x="325" y="156" font-size="11" fill="#97A59F" text-anchor="middle">(a slice of E₀ … E₇)</text>
    <text x="325" y="184" font-size="11.5" text-anchor="middle">every token</text>
    <rect x="424" y="50" width="134" height="190" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="491" y="72" text-anchor="middle" font-weight="600">GPU 1</text>
    <text x="491" y="96" font-size="11.5" text-anchor="middle">1/p of attention</text>
    <rect x="435.5" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="449.7" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="463.9" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="478.1" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="492.3" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="506.5" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="520.7" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="534.9" y="112" width="12" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="491" y="142" font-size="11" fill="#97A59F" text-anchor="middle">1/p of every expert</text>
    <text x="491" y="156" font-size="11" fill="#97A59F" text-anchor="middle">(a slice of E₀ … E₇)</text>
    <text x="491" y="184" font-size="11.5" text-anchor="middle">every token</text>
    <path d="M392 226 L424 226" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="408" y="262" font-size="11.5" fill="#97A59F" text-anchor="middle">every GPU sees every token</text>
    <text x="408" y="278" font-size="11" fill="#97A59F" text-anchor="middle">all-reduce per layer: restores the layer output</text>
    <rect x="258" y="300" width="300" height="66" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="408" y="322" font-size="11.5" text-anchor="middle">each expert GEMM is divided p ways:</text>
    <text x="408" y="340" font-size="11.5" text-anchor="middle">GEMMs that are already thin get thinner</text>
    <rect x="588" y="16" width="396" height="372" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="786" y="36" font-size="11.5" fill="#97A59F" text-anchor="middle" font-weight="600">expert parallel + data-parallel attention (§6.2, §6.5)</text>
    <rect x="602" y="50" width="155" height="190" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="679.5" y="72" text-anchor="middle" font-weight="600">GPU 0</text>
    <text x="679.5" y="96" font-size="11.5" text-anchor="middle">attention + its own KV</text>
    <rect x="621.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="634.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₀</text>
    <rect x="651.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="664.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₁</text>
    <rect x="681.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="694.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₂</text>
    <rect x="711.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="724.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₃</text>
    <text x="679.5" y="152" font-size="11" fill="#7ADACF" text-anchor="middle">E/p whole experts</text>
    <text x="679.5" y="174" font-size="11" fill="#97A59F" text-anchor="middle">router · shared experts</text>
    <text x="679.5" y="190" font-size="11" fill="#97A59F" text-anchor="middle">embeddings: replicated</text>
    <text x="679.5" y="216" font-size="11.5" text-anchor="middle">its own tokens</text>
    <rect x="817" y="50" width="155" height="190" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="894.5" y="72" text-anchor="middle" font-weight="600">GPU 1</text>
    <text x="894.5" y="96" font-size="11.5" text-anchor="middle">attention + its own KV</text>
    <rect x="836.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="849.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₄</text>
    <rect x="866.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="879.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₅</text>
    <rect x="896.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="909.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₆</text>
    <rect x="926.5" y="112" width="26" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="939.5" y="127.0" font-size="11" fill="#7ADACF" text-anchor="middle">E₇</text>
    <text x="894.5" y="152" font-size="11" fill="#7ADACF" text-anchor="middle">E/p whole experts</text>
    <text x="894.5" y="174" font-size="11" fill="#97A59F" text-anchor="middle">router · shared experts</text>
    <text x="894.5" y="190" font-size="11" fill="#97A59F" text-anchor="middle">embeddings: replicated</text>
    <text x="894.5" y="216" font-size="11.5" text-anchor="middle">its own tokens</text>
    <path d="M757 206 L817 206" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="787" y="199" font-size="11" fill="#7ADACF" text-anchor="middle">dispatch</text>
    <path d="M817 228 L757 228" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="787" y="245" font-size="11" fill="#7ADACF" text-anchor="middle">combine</text>
    <text x="786" y="262" font-size="11" fill="#97A59F" text-anchor="middle">two all-to-alls per MoE layer: the hidden state of each token</text>
    <text x="786" y="278" font-size="11" fill="#97A59F" text-anchor="middle">to the ranks of its k experts, then the k weighted results back</text>
    <rect x="602" y="300" width="370" height="66" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="787" y="322" font-size="11.5" text-anchor="middle">all ranks wait for each other at every exchange:</text>
    <text x="787" y="340" font-size="11.5" text-anchor="middle">the slowest rank sets the layer time (§6.3)</text>
  </g>
</svg>
