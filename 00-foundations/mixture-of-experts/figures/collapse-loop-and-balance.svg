<svg xmlns="http://www.w3.org/2000/svg" width="920" height="316" viewBox="0 0 920 316" role="img" aria-label="The feedback loop of router collapse and where each balance method acts: the auxiliary loss at the scores, the selection bias and expert choice at the top-k, the capacity factor at the training step." style="color: #E4EAE7">
  <title>The feedback loop of router collapse and where each balance method acts: the auxiliary loss at the scores, the selection bias and expert choice at the top-k, the capacity factor at the training step.</title>
  <rect x="0" y="0" width="920" height="316" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="24" y="120" width="200" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="124.0" y="141" text-anchor="middle" font-weight="600">router scores</text>
    <text x="124.0" y="159" font-size="11.5" fill="#97A59F" text-anchor="middle">one per expert</text>
    <rect x="256" y="120" width="200" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="356.0" y="141" text-anchor="middle" font-weight="600">top-k selects expert e</text>
    <text x="356.0" y="159" font-size="11.5" fill="#97A59F" text-anchor="middle">for the token</text>
    <rect x="488" y="120" width="200" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="588.0" y="141" text-anchor="middle" font-weight="600">expert e trains</text>
    <text x="588.0" y="159" font-size="11.5" fill="#97A59F" text-anchor="middle">on the tokens it gets</text>
    <rect x="720" y="120" width="176" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="808.0" y="141" text-anchor="middle" font-weight="600">expert e gets better</text>
    <text x="808.0" y="159" font-size="11.5" fill="#97A59F" text-anchor="middle">at those tokens</text>
    <path d="M224 146 L254 146" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M456 146 L486 146" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M688 146 L718 146" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M808 118 L808 22 Q808 14 800 14 L132 14 Q124 14 124 22 L124 116" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="588" y="32" font-size="11" fill="#7ADACF" text-anchor="middle">the task loss rewards e</text>
    <rect x="24" y="210" width="200" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="124.0" y="230" font-size="11.5" text-anchor="middle" font-weight="600">auxiliary loss (§3.2)</text>
    <text x="124.0" y="247" font-size="11" fill="#97A59F" text-anchor="middle">pushes down the router</text>
    <text x="124.0" y="263" font-size="11" fill="#97A59F" text-anchor="middle">probability of</text>
    <text x="124.0" y="279" font-size="11" fill="#97A59F" text-anchor="middle">loaded experts</text>
    <rect x="256" y="210" width="200" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="356.0" y="230" font-size="11.5" text-anchor="middle" font-weight="600">selection bias (§3.4)</text>
    <text x="356.0" y="247" font-size="11" fill="#97A59F" text-anchor="middle">a bias per expert, stepped</text>
    <text x="356.0" y="263" font-size="11" fill="#97A59F" text-anchor="middle">against the load,</text>
    <text x="356.0" y="279" font-size="11" fill="#97A59F" text-anchor="middle">for selection only</text>
    <rect x="488" y="210" width="200" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="588.0" y="230" font-size="11.5" text-anchor="middle" font-weight="600">capacity factor (§3.3)</text>
    <text x="588.0" y="247" font-size="11" fill="#97A59F" text-anchor="middle">drops the assignments</text>
    <text x="588.0" y="263" font-size="11" fill="#97A59F" text-anchor="middle">above the capacity</text>
    <text x="588.0" y="279" font-size="11" fill="#97A59F" text-anchor="middle">of an expert</text>
    <rect x="256" y="36" width="200" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="356.0" y="56" font-size="11.5" text-anchor="middle" font-weight="600">expert choice (§3.5)</text>
    <text x="356.0" y="73" font-size="11" fill="#97A59F" text-anchor="middle">each expert selects</text>
    <text x="356.0" y="89" font-size="11" fill="#97A59F" text-anchor="middle">its top-C tokens instead</text>
    <path d="M124 208 L124 174" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <path d="M356 208 L356 174" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <path d="M588 208 L588 174" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <path d="M356 102 L356 118" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <rect x="720" y="210" width="176" height="80" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="808.0" y="230" font-size="11.5" text-anchor="middle" font-weight="600">router collapse</text>
    <text x="808.0" y="247" font-size="11" text-anchor="middle">a few experts take</text>
    <text x="808.0" y="263" font-size="11" text-anchor="middle">every token, the rest</text>
    <text x="808.0" y="279" font-size="11" text-anchor="middle">are dead weight in HBM</text>
    <path d="M808 172 L808 208" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
  </g>
</svg>
