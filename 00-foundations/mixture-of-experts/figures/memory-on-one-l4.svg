<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-label="The memory of one 24 GB L4 for Qwen3-30B-A3B in bf16, FP8 and with 4.25-bit experts, and the budget of vLLM for the checkpoint that fits." style="color: #E4EAE7">
  <title>The memory of one 24 GB L4 for Qwen3-30B-A3B in bf16, FP8 and with 4.25-bit experts, and the budget of vLLM for the checkpoint that fits.</title>
  <rect x="0" y="0" width="880" height="392" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="236" y="30" font-size="11" fill="#97A59F">one 24 GB L4 (the driver reports 22.49 GiB)</text>
    <rect x="236" y="40" width="236.03165959333157" height="118" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="224" y="68" font-size="11.5" text-anchor="end">bf16</text>
    <rect x="236" y="52" width="596.8496283251612" height="24" rx="4" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="824.8496283251612" y="68" font-size="11" text-anchor="end">61.1 GB: does not fit</text>
    <text x="224" y="104" font-size="11.5" text-anchor="end">FP8</text>
    <rect x="236" y="88" width="298.4248141625806" height="24" rx="4" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="526.4248141625806" y="104" font-size="11" text-anchor="end">30.5 GB: does not fit</text>
    <text x="224" y="140" font-size="11.5" text-anchor="end">4.25-bit experts, the rest in bf16</text>
    <rect x="236" y="124" width="180.65885461470967" height="24" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="408.65885461470964" y="140" font-size="11" fill="#7ADACF" text-anchor="end">18.5 GB: fits</text>
    <line x1="236" y1="158" x2="236" y2="232" stroke="#97A59F" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="472.0316595933316" y1="158" x2="842" y2="232" stroke="#97A59F" stroke-width="0.8" stroke-dasharray="2 3"/>
    <text x="236" y="218" font-size="11.5" fill="#97A59F">the same L4, zoomed: the budget of vLLM is 0.92 × 22.49 GiB − 1.5 GiB</text>
    <rect x="236" y="232" width="463.83297090373503" height="34" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="467.9164854518675" y="253" font-size="11.5" fill="#7ADACF" text-anchor="middle" font-weight="600">weights: 18.5 GB</text>
    <rect x="699.832970903735" y="232" width="53.26906555691417" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="753.1020364606492" y="232" width="40.41796353935082" height="34" rx="4" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="793.52" y="232" width="48.479999999999976" height="34" rx="4" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="236" y1="276" x2="793.52" y2="276" stroke="#97A59F" stroke-width="1"/>
    <line x1="236" y1="272" x2="236" y2="280" stroke="#97A59F" stroke-width="1"/>
    <line x1="793.52" y1="272" x2="793.52" y2="280" stroke="#97A59F" stroke-width="1"/>
    <text x="514.76" y="292" font-size="11" fill="#97A59F" text-anchor="middle">0.92 of the memory the driver reports</text>
    <line x1="726.4675036821922" y1="266" x2="726.4675036821922" y2="310" stroke="#97A59F" stroke-width="0.8"/>
    <text x="732.4675036821922" y="314" font-size="11" text-anchor="end">KV room: 2.0 GiB, 21,593 tokens, five sequences of 4K</text>
    <line x1="773.3110182303246" y1="266" x2="773.3110182303246" y2="330" stroke="#97A59F" stroke-width="0.8"/>
    <text x="779.3110182303246" y="334" font-size="11" fill="#E39A62" text-anchor="end">1.5 GiB: activations and CUDA graphs</text>
    <line x1="817.76" y1="266" x2="817.76" y2="350" stroke="#97A59F" stroke-width="0.8"/>
    <text x="823.76" y="354" font-size="11" fill="#97A59F" text-anchor="end">not in the budget: 1 − 0.92 of the reported memory</text>
    <text x="236" y="376" font-size="11" fill="#97A59F">The 3B active count sets the prefill FLOPs, not the memory.</text>
  </g>
</svg>
