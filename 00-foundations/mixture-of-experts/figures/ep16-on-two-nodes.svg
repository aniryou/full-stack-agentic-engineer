    <text x="451" y="85" font-size="11" text-anchor="middle" fill="#E39A62">400 Gb/s IB</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M376 71 L404 71" marker-end="url(#arr)"/>
      <path d="M496 71 L522 71" marker-end="url(#arr)"/>
