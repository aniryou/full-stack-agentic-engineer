<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-label="Two 8-GPU nodes under EP 16: each GPU has 7 peers over NVLink in its node and 8 peers in the other node behind its one 400 Gb/s InfiniBand NIC." style="color: #E4EAE7">
  <title>Two 8-GPU nodes under EP 16: each GPU has 7 peers over NVLink in its node and 8 peers in the other node behind its one 400 Gb/s InfiniBand NIC.</title>
