    <text x="451" y="114" font-size="11" fill="#97A59F" text-anchor="middle">one NIC per GPU</text>
    <text x="451" y="130" font-size="11" fill="#97A59F" text-anchor="middle">8 peers</text>
    <text x="460" y="270" font-size="11.5" fill="#97A59F" text-anchor="middle">all-to-alls per step, DeepSeek-V3 at batch 512, 4K context, EP 16 (simulated)</text>
    <text x="460" y="292" text-anchor="middle">0.9 ms if all 16 GPUs share one NVLink domain</text>
    <text x="460" y="314" text-anchor="middle" fill="#E39A62">3.8 ms as two 8-GPU nodes: 22% of a 17.6 ms step with no overlap</text>
