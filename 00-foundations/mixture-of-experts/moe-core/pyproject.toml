[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moecore"
version = "0.1.0"
description = "Mixture-of-experts from first principles in numpy: the router and the experts, load balance, which experts a batch touches, expert parallelism, and sizing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]         # the library is standard library + numpy; no GPU, no torch

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
include = ["moecore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
