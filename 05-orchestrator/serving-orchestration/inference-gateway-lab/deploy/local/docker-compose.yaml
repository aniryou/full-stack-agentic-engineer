# Local stack (T0/T1 on any machine with Docker; no GPU): three vLLM-shaped backends, the lab
# router in front of them, and Prometheus scraping everything.
#
#   PROFILE=sim  ./up.sh   -> 3 x llm-d-inference-sim (the upstream vLLM simulator image)
#   PROFILE=fake ./up.sh   -> 3 x the bundled igwlab fake backend (no GHCR pull; same metric names)
#
# Router: http://localhost:9000/v1/chat/completions  (router metrics: /metrics, decisions: /debug/state)
# Prometheus: http://localhost:9090
name: igw-lab

x-sim: &sim
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2          # (verify) latest release tag, Sep 2026
  profiles: ["sim"]
  # Same emulation knobs as igwlab.fakebackend.EngineProfile().sim_args():
  #   TTFT = 2 ms + 50 us x uncached prompt tokens; 4 ms per output token; 8 batch slots;
  #   2,048 KV blocks of 16 tokens with prefix caching (needs POD_IP).
  command: ["--model", "lab/llm", "--port", "8000", "--max-num-seqs", "8", "--max-model-len", "65536",
            "--latency-calculator", "per-token", "--prefill-overhead", "2ms", "--prefill-time-per-token", "50us",
            "--inter-token-latency", "4ms", "--enable-kvcache=true", "--kv-cache-size", "2048", "--block-size", "16"]

x-fake: &fake
  build: {context: ../.., dockerfile: deploy/local/Dockerfile}
  image: igwlab:local
  profiles: ["fake"]

services:
  sim-a:
    <<: *sim
    environment: {POD_NAME: sim-a, POD_IP: "127.0.0.1"}
  sim-b:
    <<: *sim
    environment: {POD_NAME: sim-b, POD_IP: "127.0.0.1"}
  sim-c:
    <<: *sim
    environment: {POD_NAME: sim-c, POD_IP: "127.0.0.1"}

  fake-a:
    <<: *fake
    command: ["python", "-m", "igwlab.fakebackend", "--name", "fake-a", "--port", "8000"]
  fake-b:
    <<: *fake
    command: ["python", "-m", "igwlab.fakebackend", "--name", "fake-b", "--port", "8000"]
  fake-c:
    <<: *fake
    command: ["python", "-m", "igwlab.fakebackend", "--name", "fake-c", "--port", "8000"]

  router:
    build: {context: ../.., dockerfile: deploy/local/Dockerfile}
    image: igwlab:local
    profiles: ["sim"]
    command: ["python", "-m", "igwlab.router", "--config", "default-weighted", "--port", "9000",
              "--objective", "premium=100", "--objective", "batch=-10",
              "--backend", "sim-a=http://sim-a:8000", "--backend", "sim-b=http://sim-b:8000",
              "--backend", "sim-c=http://sim-c:8000"]
    ports: ["9000:9000"]
    depends_on: [sim-a, sim-b, sim-c]

  router-fake:
    build: {context: ../.., dockerfile: deploy/local/Dockerfile}
    image: igwlab:local
    profiles: ["fake"]
    command: ["python", "-m", "igwlab.router", "--config", "default-weighted", "--port", "9000",
              "--objective", "premium=100", "--objective", "batch=-10",
              "--backend", "fake-a=http://fake-a:8000", "--backend", "fake-b=http://fake-b:8000",
              "--backend", "fake-c=http://fake-c:8000"]
    ports: ["9000:9000"]
    depends_on: [fake-a, fake-b, fake-c]

  prometheus:
    image: prom/prometheus:v3.15.0                           # (verify)
    profiles: ["sim", "fake"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
