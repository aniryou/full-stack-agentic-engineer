# Scale the vLLM Deployment on its queue, not on GPU utilization.
# Metric: the vLLM gauge vllm:num_requests_waiting, collected by Managed Service for Prometheus
# (podmonitoring-vllm.yaml) and served to the HPA by the Custom Metrics Stackdriver Adapter
# (install.sh step 6). Target: 5 waiting requests per pod on average (see notebook 03).
# minReplicas >= 1: scale-to-zero needs the HPAScaleToZero alpha gate (off in 1.34) or KEDA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-qwen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-qwen
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|vllm:num_requests_waiting|gauge   # VERIFY adapter naming
        target:
          type: AverageValue
          averageValue: "5"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1                     # a new L4 node + model load takes minutes: add one at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
