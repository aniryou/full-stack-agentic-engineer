# GKE Inference Gateway = a GKE Gateway (regional external Application Load Balancer) whose
# HTTPRoute points at an InferencePool instead of a Service. For every request the load
# balancer calls the pool's endpoint picker (the llm-d EPP, ext-proc on :9002) to choose the pod.
# Needs the proxy-only subnet from ../gcp/terraform/network.tf.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
spec:
  gatewayClassName: gke-l7-regional-external-managed     # (verify) internal-only: gke-l7-rilb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-qwen
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-qwen                                   # = the Helm release name in install.sh
