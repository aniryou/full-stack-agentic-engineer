# Round-robin, expressed as an EPP config: with no scorers every endpoint totals 0.0, and
# max-score-picker rotates ties with a per-request counter -> exact round-robin.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: max-score-picker
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: max-score-picker
