# The llm-d optimized-baseline shape (Sep 2026): a prefix-cache affinity *filter* keeps only
# endpoints that already hold >= 80% of the prompt, unless their estimated prefill backlog is
# more than maxTTFTPenaltyMs worse than the best other endpoint; a token-load scorer then
# balances the survivors by uncached tokens (in flight + this request's) per endpoint.
# Calibrated for the lab's fake backend: it prefills 20,000 of *its* tokens/s (50 us each), but the
# router counts 4-byte pseudo-tokens, ~1.4 per fake token on the lab's agentic workload, so the
# gate's throughput is 28,000 pseudo-tokens/s. Upstream defaults are peakPrefillThroughput 15928
# (Qwen3-32B, 2xH100 TP=2) and maxTTFTPenaltyMs 18000.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: approx-prefix-cache-producer
- type: inflight-load-producer
- type: prefix-cache-affinity-filter
  parameters:
    affinityThreshold: 0.80
    maxTTFTPenaltyMs: 150
    peakPrefillThroughput: 28000
- type: token-load-scorer
  parameters:
    queueThresholdTokens: 16384
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: prefix-cache-affinity-filter
  - pluginRef: token-load-scorer
