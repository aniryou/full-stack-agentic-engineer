# Guide site for this repo, published to GitHub Pages by .github/workflows/pages.yml.
# The pages under site/layers/ and site/guide/{curriculum,compute,colab}.md are generated from the repo by
# tools/site/build_site_content.py (run it before `mkdocs build` / `mkdocs serve`); see tools/site/README.md.
site_name: Full-stack agentic engineer
site_description: The LLM inference and serving stack, layer by layer — from GPUs and fabric to the agent application.
site_url: https://aniryou.github.io/full-stack-agentic-engineer/
repo_url: https://github.com/aniryou/full-stack-agentic-engineer
repo_name: aniryou/full-stack-agentic-engineer
edit_uri: ""

docs_dir: site
site_dir: site_build
exclude_docs: |
  .gitignore
  overrides/
# Pages that exist but stay out of the sidebar: deploy targets, fixtures, infra and other plumbing, reachable from
# the READMEs that link them. Written by tools/site/build_site_content.py (PLUMBING_DIRS) — do not edit by hand.
# not-in-nav:start
not_in_nav: |
  /layers/**/client/
  /layers/**/deploy/
  /layers/**/fixtures/
  /layers/**/infra/
  /layers/**/notebooks_src/
# not-in-nav:end

theme:
  name: material
  custom_dir: site/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    # Render only the part of the nav the page is in (every page used to carry the whole tree, ~300 KB).
    - navigation.prune
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

# tools/site/hooks.py: content-hashed URLs for the site's own CSS/JS; one shared notebook stylesheet instead of
# ~600 KB of JupyterLab CSS inlined in every notebook page; MathJax (site/javascripts/mathjax.js) only on pages with
# math; notebook table-of-contents anchors that match the headings; solutions left out of search.
hooks:
  - tools/site/hooks.py

extra_javascript:
  - javascripts/tables.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Math only as \( … \) and \[ … \] / \begin{…}: the repo is full of dollar prices, which must stay text.
  # No Markdown page uses math yet; this keeps the rule the same as in notebooks (see site/javascripts/mathjax.js).
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [square, begin]

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      # Nothing links a page's .ipynb copy (pages link GitHub), and the copy is the site's rewritten version.
      include_source: false
      # Page titles come from the nav (build_site_content.nb_title), not from each notebook's first H1: otherwise the
      # sidebar mixes both, depending on the order pages happen to be rendered in.
      ignore_h1_titles: true

