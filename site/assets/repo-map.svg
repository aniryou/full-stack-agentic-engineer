<svg xmlns="http://www.w3.org/2000/svg" width="960" height="582" viewBox="0 0 960 582" role="img" aria-label="The repository map: the eight layers, from the agents (07) at the top down to the hardware (01) and the foundations (00) beneath it, each with its job in one line and its topic folders; the twelve primer + core + lab topics are marked." style="color: #E4EAE7">
  <title>The repository map: the eight layers, from the agents (07) at the top down to the hardware (01) and the foundations (00) beneath it, each with its job in one line and its topic folders; the twelve primer + core + lab topics are marked.</title>
  <rect x="0" y="0" width="960" height="582" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" font-size="11.5" fill="#97A59F">read bottom-up: each layer is built on the one below it</text>
    <text x="24" y="60" font-family="JetBrains Mono, monospace" font-size="12.5">07</text>
    <text x="54" y="60" font-weight="600">Agents and applications</text>
    <text x="301" y="60" font-size="11.5" fill="#97A59F">build the agent: loop, tools, sandboxes, state, memory, durability, evals, RAG</text>
    <rect x="54" y="68" width="136" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="66" y="82" font-size="11">agent-fundamentals</text>
    <rect x="198" y="68" width="141" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="210" y="82" font-size="11">long-running-durable</text>
    <rect x="347" y="68" width="93" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="359" y="82" font-size="11">retrieval-rag</text>
    <rect x="448" y="68" width="152" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="462" cy="78" r="3" fill="#4CC5B7"/>
    <text x="470" y="82" font-size="11" fill="#7ADACF">sandboxed-execution</text>
    <rect x="608" y="68" width="116" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="622" cy="78" r="3" fill="#4CC5B7"/>
    <text x="630" y="82" font-size="11" fill="#7ADACF">agent-memory</text>
    <text x="24" y="116" font-family="JetBrains Mono, monospace" font-size="12.5">06</text>
    <text x="54" y="116" font-weight="600">Gateway</text>
    <text x="301" y="116" font-size="11.5" fill="#97A59F">decide who may run what: identity, policy, model routing, rate limits, admission, cost</text>
    <rect x="54" y="124" width="114" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="66" y="138" font-size="11">identity-security</text>
    <rect x="176" y="124" width="150" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="188" y="138" font-size="11">scaling-admission-cost</text>
    <rect x="334" y="124" width="102" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="348" cy="134" r="3" fill="#4CC5B7"/>
    <text x="356" y="138" font-size="11" fill="#7ADACF">llm-gateway</text>
    <text x="24" y="172" font-family="JetBrains Mono, monospace" font-size="12.5">05</text>
    <text x="54" y="172" font-weight="600">Orchestrator</text>
    <text x="301" y="172" font-size="11.5" fill="#97A59F">run many engine replicas as one service: routing, autoscaling, P/D split</text>
    <rect x="54" y="180" width="152" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="68" cy="190" r="3" fill="#4CC5B7"/>
    <text x="76" y="194" font-size="11" fill="#7ADACF">serving-orchestration</text>
    <text x="24" y="228" font-family="JetBrains Mono, monospace" font-size="12.5">04</text>
    <text x="54" y="228" font-weight="600">Inference engine</text>
    <text x="301" y="228" font-size="11.5" fill="#97A59F">run one model fast: attention kernels, the KV cache, batching, quantization</text>
    <rect x="54" y="236" width="74" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="66" y="250" font-size="11">kv-cache</text>
    <rect x="136" y="236" width="113" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="148" y="250" font-size="11">paged-attention</text>
    <rect x="257" y="236" width="105" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="269" y="250" font-size="11">flash-attention</text>
    <rect x="370" y="236" width="86" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="382" y="250" font-size="11">kernel-core</text>
    <rect x="464" y="236" width="117" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="478" cy="246" r="3" fill="#4CC5B7"/>
    <text x="486" y="250" font-size="11" fill="#7ADACF">serving-engine</text>
    <rect x="589" y="236" width="103" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="603" cy="246" r="3" fill="#4CC5B7"/>
    <text x="611" y="250" font-size="11" fill="#7ADACF">quantization</text>
    <rect x="700" y="236" width="100" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="712" y="250" font-size="11">vllm-internals</text>
    <text x="24" y="284" font-family="JetBrains Mono, monospace" font-size="12.5">03</text>
    <text x="54" y="284" font-weight="600">Kubernetes and GPU scheduling</text>
    <text x="301" y="284" font-size="11.5" fill="#97A59F">make GPUs schedulable: device plugin, scheduler, gangs, quotas, capacity</text>
    <rect x="54" y="292" width="119" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="68" cy="302" r="3" fill="#4CC5B7"/>
    <text x="76" y="306" font-size="11" fill="#7ADACF">gpu-scheduling</text>
    <text x="24" y="340" font-family="JetBrains Mono, monospace" font-size="12.5">02</text>
    <text x="54" y="340" font-weight="600">CUDA, NCCL and runtime</text>
    <text x="301" y="340" font-size="11.5" fill="#97A59F">get from a container to a GPU: driver, CUDA, NCCL, container runtime</text>
    <rect x="54" y="348" width="112" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="68" cy="358" r="3" fill="#4CC5B7"/>
    <text x="76" y="362" font-size="11" fill="#7ADACF">cuda-and-nccl</text>
    <text x="24" y="396" font-family="JetBrains Mono, monospace" font-size="12.5">01</text>
    <text x="54" y="396" font-weight="600">Hardware and fabric</text>
    <text x="301" y="396" font-size="11.5" fill="#97A59F">read the machine: spec sheets, the roofline, fabrics, cost of a token</text>
    <rect x="54" y="404" width="86" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="66" y="418" font-size="11">gpu-primer</text>
    <rect x="148" y="404" width="115" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="160" y="418" font-size="11">gpu-deployment</text>
    <rect x="271" y="404" width="136" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="285" cy="414" r="3" fill="#4CC5B7"/>
    <text x="293" y="418" font-size="11" fill="#7ADACF">roofline-and-fabric</text>
    <line x1="24" y1="440" x2="936" y2="440" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="936" y="454" text-anchor="end" font-size="11" fill="#97A59F">beneath the stack</text>
    <text x="24" y="472" font-family="JetBrains Mono, monospace" font-size="12.5">00</text>
    <text x="54" y="472" font-weight="600">Foundations</text>
    <text x="301" y="472" font-size="11.5" fill="#97A59F">the model itself: transformers, capacity, MoE, RL and thinking, distillation</text>
    <rect x="54" y="480" width="95" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="66" y="494" font-size="11">transformers</text>
    <rect x="157" y="480" width="147" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="169" y="494" font-size="11">gpu-capacity-planning</text>
    <rect x="312" y="480" width="119" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="324" y="494" font-size="11">model-landscape</text>
    <rect x="439" y="480" width="137" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="453" cy="490" r="3" fill="#4CC5B7"/>
    <text x="461" y="494" font-size="11" fill="#7ADACF">mixture-of-experts</text>
    <rect x="584" y="480" width="159" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="598" cy="490" r="3" fill="#4CC5B7"/>
    <text x="606" y="494" font-size="11" fill="#7ADACF">rl-and-thinking-models</text>
    <rect x="751" y="480" width="92" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="765" cy="490" r="3" fill="#4CC5B7"/>
    <text x="773" y="494" font-size="11" fill="#7ADACF">distillation</text>
    <path d="M14 48 L10 48 L10 426 L14 426" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="54" y="518" width="144" height="20" rx="10" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <circle cx="68" cy="528" r="3" fill="#4CC5B7"/>
    <text x="76" y="532" font-size="11" fill="#7ADACF">primer + core + lab</text>
    <text x="208" y="532" font-size="11" fill="#97A59F">twelve topics in this shape: a primer, a from-scratch core, a fuller lab</text>
    <rect x="54" y="546" width="52" height="20" rx="10" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="66" y="560" font-size="11">topic</text>
    <text x="116" y="560" font-size="11" fill="#97A59F">the other topics: a primer with exercises, practice notebooks, or a lab of its own</text>
  </g>
</svg>
