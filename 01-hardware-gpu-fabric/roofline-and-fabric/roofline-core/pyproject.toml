[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roofline"
version = "0.1.0"
description = "Reading the machine: rooflines, memory hierarchy, fabrics, and the cost of a token. The T0 core of layer 01."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []                      # the library is standard-library only

[project.optional-dependencies]
dev = ["pytest>=7.4"]                  # the tests
notebooks = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyterlab>=4.0"]   # JupyterLab, ~250 MB
plot = ["matplotlib>=3.8"]             # optional: the notebooks fall back to text charts

[tool.setuptools.packages.find]
include = ["roofline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
