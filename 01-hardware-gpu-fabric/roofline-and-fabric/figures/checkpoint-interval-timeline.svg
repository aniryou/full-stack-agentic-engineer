<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="A job writes a checkpoint of cost delta every tau seconds; a failure loses the work since the last checkpoint, about tau over two on average, plus a restart R, and the Young interval balances the two losses." style="color: #E4EAE7">
  <title>A job writes a checkpoint of cost delta every tau seconds; a failure loses the work since the last checkpoint, about tau over two on average, plus a restart R, and the Young interval balances the two losses.</title>
  <rect x="0" y="0" width="900" height="350" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="32" font-weight="600">Checkpoints, a failure and a restart on the time line (wasted_fraction(), young_daly_interval())</text>
    <rect x="40" y="150" width="150" height="34" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="190" y="150" width="14" height="34" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="204" y="150" width="150" height="34" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="354" y="150" width="14" height="34" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="368" y="150" width="90.0" height="34" rx="3" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="458.0" y="150" width="66" height="34" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="524.0" y="150" width="90.0" height="34" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="614.0" y="150" width="60.0" height="34" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="674.0" y="150" width="14" height="34" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="688.0" y="150" width="90" height="34" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <line x1="458.0" y1="138" x2="458.0" y2="196" stroke="#E39A62" stroke-width="2.5"/>
    <text x="458.0" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E39A62">failure</text>
    <path d="M40 234 L798.0 234" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="40" y="250" font-size="11" fill="#97A59F">time</text>
    <line x1="204" y1="128" x2="354" y2="128" stroke="#97A59F" stroke-width="1"/>
    <line x1="204" y1="124" x2="204" y2="132" stroke="#97A59F" stroke-width="1"/>
    <line x1="354" y1="124" x2="354" y2="132" stroke="#97A59F" stroke-width="1"/>
    <text x="279.0" y="121" text-anchor="middle" font-size="11" fill="#97A59F">τ, the interval between checkpoints</text>
    <text x="197.0" y="200" text-anchor="middle" font-size="11" fill="#E39A62">δ, one checkpoint write</text>
    <line x1="368" y1="100" x2="458.0" y2="100" stroke="#E39A62" stroke-width="1"/>
    <line x1="368" y1="96" x2="368" y2="104" stroke="#E39A62" stroke-width="1"/>
    <line x1="458.0" y1="96" x2="458.0" y2="104" stroke="#E39A62" stroke-width="1"/>
    <text x="413.0" y="93" text-anchor="middle" font-size="11" fill="#E39A62">lost work since the last checkpoint: τ/2 on average</text>
    <text x="491.0" y="171.0" text-anchor="middle" font-size="11" fill="#E39A62">restart R</text>
    <line x1="524.0" y1="198" x2="614.0" y2="198" stroke="#7ADACF" stroke-width="1"/>
    <line x1="524.0" y1="194" x2="524.0" y2="202" stroke="#7ADACF" stroke-width="1"/>
    <line x1="614.0" y1="194" x2="614.0" y2="202" stroke="#7ADACF" stroke-width="1"/>
    <text x="569.0" y="213" text-anchor="middle" font-size="11" fill="#7ADACF">the lost work, done again</text>
    <rect x="24" y="272" width="14" height="12" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="44" y="282" font-size="11" fill="#97A59F">useful work</text>
    <rect x="140" y="272" width="14" height="12" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="160" y="282" font-size="11" fill="#97A59F">a checkpoint write δ, a restart R</text>
    <rect x="390" y="272" width="14" height="12" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="410" y="282" font-size="11" fill="#97A59F">work lost since the last checkpoint</text>
    <text x="24" y="312" font-size="12.5" font-weight="600">waste ≈ δ/τ + (τ/2 + R)/M,  least at τ* = √(2δM)  (Young, 1974)</text>
    <text x="24" y="332" font-size="11.5" fill="#97A59F">16,384 GPUs, M = 3.09 h:  δ = 60 s → τ* = 19.3 min, waste 10.4%;  a restart R = 10 min adds R/M = 5.4% more</text>
  </g>
</svg>
