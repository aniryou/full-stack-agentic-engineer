    <text x="36" y="402" font-size="11" fill="#97A59F">rail-optimized leaves (§5.4): NIC i of every node in the group connects to the rail-i leaf, and every leaf has uplinks to every spine</text>
    <text x="36" y="420" font-size="11" fill="#97A59F">same-index GPUs of two nodes: one switch hop; cross-rail traffic: three hops, or one when PXN first moves it over NVLink</text>
    <text x="24" y="462" font-size="11" fill="#7ADACF">inside the node: tensor parallelism (§5.3); across nodes: pipeline and data parallelism, one NIC per GPU so that every GPU drives its own rail</text>
