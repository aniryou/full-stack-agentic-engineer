<svg xmlns="http://www.w3.org/2000/svg" width="880" height="308" viewBox="0 0 880 308" role="img" aria-label="Per direction, the NVLink of one GPU carries about 9 times the bandwidth of its NIC: 450 against 50 GB/s for an H100 with a 400 Gb/s NIC, 900 against 100 GB/s for Blackwell with an 800 Gb/s NIC; a division of the bidirectional NVLink total by the one-way NIC rate gives 18 times and counts NVLink two times." style="color: #E4EAE7">
  <title>Per direction, the NVLink of one GPU carries about 9 times the bandwidth of its NIC: 450 against 50 GB/s for an H100 with a 400 Gb/s NIC, 900 against 100 GB/s for Blackwell with an 800 Gb/s NIC; a division of the bidirectional NVLink total by the one-way NIC rate gives 18 times and counts NVLink two times.</title>
  <rect x="0" y="0" width="880" height="308" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">Compare like with like (§5): one GPU, its NVLink against its NIC, per direction. The bars are to scale.</text>

    <!-- H100 -->
    <rect x="24" y="42" width="832" height="100" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">H100 with a 400 Gb/s NIC</text>
    <text x="190" y="84" text-anchor="end" font-size="10.5" fill="#97A59F">NVLink 900 GB/s,</text>
    <text x="190" y="97" text-anchor="end" font-size="10.5" fill="#97A59F">a bidirectional total</text>
    <rect x="200" y="72" width="150" height="28" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="275" y="90" text-anchor="middle" font-size="10.5">450 GB/s one way</text>
    <rect x="350" y="72" width="150" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="425" y="90" text-anchor="middle" font-size="10.5" fill="#97A59F">450 GB/s the other way</text>
    <text x="190" y="126" text-anchor="end" font-size="10.5" fill="#97A59F">NIC 400 Gb/s</text>
    <rect x="200" y="108" width="17" height="28" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="227" y="126" font-size="10.5" fill="#E39A62">50 GB/s per direction: 9× less than the 450 GB/s of NVLink one way</text>

    <!-- Blackwell -->
    <rect x="24" y="154" width="832" height="100" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="172" fill="#97A59F">Blackwell with an 800 Gb/s NIC</text>
    <text x="190" y="196" text-anchor="end" font-size="10.5" fill="#97A59F">NVLink 1.8 TB/s,</text>
    <text x="190" y="209" text-anchor="end" font-size="10.5" fill="#97A59F">a bidirectional total</text>
    <rect x="200" y="184" width="300" height="28" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="350" y="202" text-anchor="middle" font-size="10.5">900 GB/s one way</text>
    <rect x="500" y="184" width="300" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="650" y="202" text-anchor="middle" font-size="10.5" fill="#97A59F">900 GB/s the other way</text>
    <text x="190" y="238" text-anchor="end" font-size="10.5" fill="#97A59F">NIC 800 Gb/s</text>
    <rect x="200" y="220" width="33" height="28" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="243" y="238" font-size="10.5" fill="#E39A62">100 GB/s per direction: 9× less than the 900 GB/s of NVLink one way</text>

    <!-- the wrong comparison -->
    <rect x="24" y="266" width="832" height="30" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="440" y="285" text-anchor="middle" font-size="11.5">18× is the bidirectional NVLink total divided by the one-way NIC rate. It counts NVLink two times.</text>
  </g>
</svg>
