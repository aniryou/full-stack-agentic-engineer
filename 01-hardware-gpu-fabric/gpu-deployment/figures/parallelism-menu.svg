<svg xmlns="http://www.w3.org/2000/svg" width="900" height="364" viewBox="0 0 900 364" role="img" aria-label="Tensor and expert parallelism divide the matrices of each layer or the experts and communicate at every layer, so they stay inside the NVLink domain; pipeline and data parallelism pass only activations or nothing, so they go across the network." style="color: #E4EAE7">
  <title>Tensor and expert parallelism divide the matrices of each layer or the experts and communicate at every layer, so they stay inside the NVLink domain; pipeline and data parallelism pass only activations or nothing, so they go across the network.</title>
  <rect x="0" y="0" width="900" height="364" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">Four of the five ways to divide the work across GPUs (§4). TP and EP stay inside the NVLink domain, PP and DP go across the network.</text>

    <!-- inside the NVLink domain -->
    <rect x="24" y="44" width="424" height="302" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="236" y="62" text-anchor="middle" fill="#97A59F">inside the NVLink domain (scale-up)</text>

    <!-- TP panel: x 40..228 -->
    <rect x="40" y="72" width="188" height="262" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="134" y="92" text-anchor="middle" font-weight="600" font-size="12">tensor parallel (TP)</text>
    <text x="134" y="108" text-anchor="middle" font-size="10.5" fill="#97A59F">a slice of each layer per GPU</text>
    <text x="92" y="130" text-anchor="middle" font-size="10.5" fill="#97A59F">GPU 0</text>
    <text x="176" y="130" text-anchor="middle" font-size="10.5" fill="#97A59F">GPU 1</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="54" y="138" width="76" height="22" rx="3"/><rect x="138" y="138" width="76" height="22" rx="3"/>
      <rect x="54" y="186" width="76" height="22" rx="3"/><rect x="138" y="186" width="76" height="22" rx="3"/>
      <rect x="54" y="234" width="76" height="22" rx="3"/><rect x="138" y="234" width="76" height="22" rx="3"/>
    </g>
    <g font-size="10.5" text-anchor="middle">
      <text x="92" y="153">layer 1</text><text x="176" y="153">layer 1</text>
      <text x="92" y="201">layer 2</text><text x="176" y="201">layer 2</text>
      <text x="92" y="249">layer 3</text><text x="176" y="249">layer 3</text>
    </g>
    <g fill="#16302A" stroke="#4CC5B7" stroke-width="1.2">
      <rect x="54" y="165" width="160" height="16" rx="3"/><rect x="54" y="213" width="160" height="16" rx="3"/>
    </g>
    <g font-size="10" fill="#7ADACF" text-anchor="middle">
      <text x="134" y="177">all-reduce</text><text x="134" y="225">all-reduce</text>
    </g>
    <text x="134" y="284" text-anchor="middle" font-size="10.5" fill="#97A59F">communication: extremely high,</text>
    <text x="134" y="298" text-anchor="middle" font-size="10.5" fill="#97A59F">an all-reduce at each layer</text>
    <text x="134" y="314" text-anchor="middle" font-size="10.5" fill="#E39A62">across a slow network: catastrophic</text>

    <!-- EP panel: x 244..432 -->
    <rect x="244" y="72" width="188" height="262" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="338" y="92" text-anchor="middle" font-weight="600" font-size="12">expert parallel (EP)</text>
    <text x="338" y="108" text-anchor="middle" font-size="10.5" fill="#97A59F">different experts on different GPUs</text>
    <rect x="258" y="124" width="160" height="22" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="338" y="139" text-anchor="middle" font-size="10.5" fill="#7ADACF">tokens: an all-to-all shuffle</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)">
      <path d="M296 148 L296 166"/><path d="M380 148 L380 166"/>
    </g>
    <text x="296" y="182" text-anchor="middle" font-size="10.5" fill="#97A59F">GPU 0</text>
    <text x="380" y="182" text-anchor="middle" font-size="10.5" fill="#97A59F">GPU 1</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="258" y="190" width="76" height="22" rx="3"/><rect x="342" y="190" width="76" height="22" rx="3"/>
      <rect x="258" y="220" width="76" height="22" rx="3"/><rect x="342" y="220" width="76" height="22" rx="3"/>
    </g>
    <g font-size="10.5" text-anchor="middle">
      <text x="296" y="205">expert 0</text><text x="380" y="205">expert 2</text>
      <text x="296" y="235">expert 1</text><text x="380" y="235">expert 3</text>
    </g>
    <text x="338" y="284" text-anchor="middle" font-size="10.5" fill="#97A59F">communication: an all-to-all shuffle,</text>
    <text x="338" y="298" text-anchor="middle" font-size="10.5" fill="#97A59F">it needs much bandwidth</text>
    <text x="338" y="314" text-anchor="middle" font-size="10.5" fill="#E39A62">load imbalance often occurs</text>

    <!-- across the network -->
    <rect x="452" y="44" width="424" height="302" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="664" y="62" text-anchor="middle" fill="#97A59F">across the network (scale-out)</text>

    <!-- PP panel: x 468..656 -->
    <rect x="468" y="72" width="188" height="262" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="562" y="92" text-anchor="middle" font-weight="600" font-size="12">pipeline parallel (PP)</text>
    <text x="562" y="108" text-anchor="middle" font-size="10.5" fill="#97A59F">the model divided by layer</text>
    <rect x="482" y="124" width="160" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="562" y="139" text-anchor="middle" font-size="10.5">GPU 0</text>
    <text x="562" y="152" text-anchor="middle" font-size="10.5" fill="#97A59F">layers 1–20</text>
    <path d="M562 160 L562 172" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="482" y="174" width="160" height="20" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="562" y="188" text-anchor="middle" font-size="10" fill="#7ADACF">only the activations</text>
    <path d="M562 196 L562 208" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="482" y="210" width="160" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="562" y="225" text-anchor="middle" font-size="10.5">GPU 1</text>
    <text x="562" y="238" text-anchor="middle" font-size="10.5" fill="#97A59F">layers 21–40</text>
    <text x="562" y="284" text-anchor="middle" font-size="10.5" fill="#97A59F">communication: low,</text>
    <text x="562" y="298" text-anchor="middle" font-size="10.5" fill="#97A59F">the activations at each boundary</text>
    <text x="562" y="314" text-anchor="middle" font-size="10.5" fill="#E39A62">the cost: pipeline bubbles</text>

    <!-- DP panel: x 672..860 -->
    <rect x="672" y="72" width="188" height="262" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="766" y="92" text-anchor="middle" font-weight="600" font-size="12">data parallel (DP)</text>
    <text x="766" y="108" text-anchor="middle" font-size="10.5" fill="#97A59F">a full copy of the model per replica</text>
    <rect x="716" y="124" width="100" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="766" y="141" text-anchor="middle" font-size="10.5">load balancer</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)">
      <path d="M750 152 L726 182"/><path d="M782 152 L806 182"/>
    </g>
    <text x="766" y="172" text-anchor="middle" font-size="10" fill="#97A59F">requests</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="686" y="186" width="76" height="40" rx="3"/><rect x="770" y="186" width="76" height="40" rx="3"/>
    </g>
    <g font-size="10.5" text-anchor="middle">
      <text x="724" y="202">GPU 0</text><text x="808" y="202">GPU 1</text>
      <text x="724" y="217" fill="#97A59F">the full model</text><text x="808" y="217" fill="#97A59F">the full model</text>
    </g>
    <text x="766" y="284" text-anchor="middle" font-size="10.5" fill="#97A59F">communication: near zero</text>
    <text x="766" y="298" text-anchor="middle" font-size="10.5" fill="#97A59F">for inference</text>
    <text x="766" y="314" text-anchor="middle" font-size="10.5" fill="#7ADACF">it scales the throughput,</text>
    <text x="766" y="328" text-anchor="middle" font-size="10.5" fill="#7ADACF">not the model size</text>
  </g>
</svg>
