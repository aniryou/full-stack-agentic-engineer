<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Prefill reads the whole prompt in one forward pass and is compute-bound; decode loads the full set of weights from HBM at each step to produce one token and is memory-bandwidth-bound, and batching lets one load serve 64 requests." style="color: #E4EAE7">
  <title>Prefill reads the whole prompt in one forward pass and is compute-bound; decode loads the full set of weights from HBM at each step to produce one token and is memory-bandwidth-bound, and batching lets one load serve 64 requests.</title>
  <rect x="0" y="0" width="880" height="340" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">One request on one GPU (§2). Each forward pass loads the weights from HBM. Schematic, not to scale.</text>

    <!-- row A: prefill -->
    <rect x="24" y="42" width="832" height="126" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">prefill: all the input tokens, in parallel, in one forward pass. Compute-bound, and it sets the TTFT.</text>
    <rect x="40" y="78" width="150" height="44" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="115" y="96" text-anchor="middle" font-weight="600">all the weights</text>
    <text x="115" y="112" text-anchor="middle" font-size="11" fill="#97A59F">from HBM, one time</text>
    <path d="M190 100 L218 100" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="220" y="78" width="460" height="44" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="450" y="96" text-anchor="middle" font-weight="600">one forward pass over the whole prompt</text>
    <text x="450" y="112" text-anchor="middle" font-size="11" fill="#7ADACF">much arithmetic for each loaded weight: a high arithmetic intensity</text>
    <path d="M680 100 L708 100" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="710" y="78" width="130" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="775" y="96" text-anchor="middle" font-weight="600">the first token</text>
    <text x="775" y="112" text-anchor="middle" font-size="11" fill="#97A59F">TTFT</text>
    <text x="440" y="150" text-anchor="middle" font-size="11" fill="#97A59F">the work increases with the prompt length, and a single long prompt already uses all of the GPU</text>

    <!-- row B: decode, four steps; each step loads all the weights and gives one token, which feeds the next step -->
    <rect x="24" y="180" width="832" height="146" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="198" fill="#97A59F">decode: one token per step, and the token feeds back in. Memory-bandwidth-bound, and it sets the ITL.</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="104" y="222">step 1</text><text x="298" y="222">step 2</text><text x="492" y="222">step 3</text><text x="686" y="222">step 4</text>
    </g>
    <g fill="#3A2C25" stroke="#E39A62" stroke-width="1.2">
      <rect x="40" y="230" width="128" height="40" rx="6"/>
      <rect x="234" y="230" width="128" height="40" rx="6"/>
      <rect x="428" y="230" width="128" height="40" rx="6"/>
      <rect x="622" y="230" width="128" height="40" rx="6"/>
    </g>
    <g text-anchor="middle" font-size="11.5" font-weight="600">
      <text x="104" y="246">all the weights</text><text x="298" y="246">all the weights</text><text x="492" y="246">all the weights</text><text x="686" y="246">all the weights</text>
    </g>
    <g text-anchor="middle" font-size="11" fill="#97A59F">
      <text x="104" y="262">from HBM again</text><text x="298" y="262">from HBM again</text><text x="492" y="262">from HBM again</text><text x="686" y="262">from HBM again</text>
    </g>
    <g stroke="#4CC5B7" stroke-width="1.2" fill="none" marker-end="url(#arrA)">
      <path d="M168 250 L232 250"/><path d="M362 250 L426 250"/><path d="M556 250 L620 250"/><path d="M750 250 L812 250"/>
    </g>
    <g text-anchor="middle" font-size="11" fill="#7ADACF">
      <text x="201" y="243">1 token</text><text x="395" y="243">1 token</text><text x="589" y="243">1 token</text><text x="781" y="243">1 token</text>
    </g>
    <text x="826" y="254" font-size="12" fill="#97A59F">…</text>
    <text x="440" y="296" text-anchor="middle" font-size="11" fill="#E39A62">each step loads the full set of weights to produce one token: a low arithmetic intensity, and the math units wait for data</text>
    <text x="440" y="314" text-anchor="middle" font-size="11" fill="#7ADACF">with batching, one load of the weights serves 64 requests in the same step, which amortises the high-cost part 64×</text>
  </g>
</svg>
