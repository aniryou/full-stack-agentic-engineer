<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Prefill reads the whole prompt in one forward pass and is compute-bound; decode loads the entire set of weights from HBM at each step to produce one token and is memory-bandwidth-bound, and batching lets one load serve 64 requests." style="color: #E4EAE7">
  <title>Prefill reads the whole prompt in one forward pass and is compute-bound; decode loads the entire set of weights from HBM at each step to produce one token and is memory-bandwidth-bound, and batching lets one load serve 64 requests.</title>
  <rect x="0" y="0" width="880" height="340" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">One request on one GPU (§2). Each forward pass loads the weights from HBM. Schematic, not to scale.</text>

    <!-- row A: prefill -->
    <rect x="24" y="42" width="832" height="126" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">prefill: all the input tokens, in parallel, in one forward pass. Compute-bound, and it sets the TTFT.</text>
    <rect x="40" y="78" width="130" height="44" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="105" y="96" text-anchor="middle" font-weight="600">all the weights</text>
    <text x="105" y="112" text-anchor="middle" font-size="10.5" fill="#97A59F">from HBM, one time</text>
    <path d="M170 100 L198 100" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="200" y="78" width="470" height="44" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="435" y="96" text-anchor="middle" font-weight="600">one forward pass over the whole prompt</text>
    <text x="435" y="112" text-anchor="middle" font-size="10.5" fill="#7ADACF">much arithmetic for each loaded weight: a high arithmetic intensity</text>
    <path d="M670 100 L698 100" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="700" y="78" width="140" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="770" y="96" text-anchor="middle" font-weight="600">the first token</text>
    <text x="770" y="112" text-anchor="middle" font-size="10.5" fill="#97A59F">TTFT</text>
    <text x="440" y="150" text-anchor="middle" font-size="10.5" fill="#97A59F">the work increases with the prompt length, and a single long prompt already uses all of the GPU</text>

    <!-- row B: decode -->
    <rect x="24" y="180" width="832" height="146" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="198" fill="#97A59F">decode: one token per step, and the token feeds back in. Memory-bandwidth-bound, and it sets the ITL.</text>
    <g font-size="10.5" fill="#97A59F" text-anchor="middle">
      <text x="113" y="222">step 1</text><text x="273" y="222">step 2</text><text x="433" y="222">step 3</text><text x="593" y="222">step 4</text><text x="753" y="222">step 5</text>
    </g>
    <g>
      <rect x="40" y="230" width="88" height="40" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
      <text x="84" y="247" text-anchor="middle" font-size="11" font-weight="600">all the weights</text>
      <text x="84" y="262" text-anchor="middle" font-size="10.5" fill="#97A59F">from HBM again</text>
      <rect x="134" y="230" width="52" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="160" y="254" text-anchor="middle" font-size="11">1 token</text>
      <path d="M186 250 L198 250" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

      <rect x="200" y="230" width="88" height="40" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
      <text x="244" y="247" text-anchor="middle" font-size="11" font-weight="600">all the weights</text>
      <text x="244" y="262" text-anchor="middle" font-size="10.5" fill="#97A59F">from HBM again</text>
      <rect x="294" y="230" width="52" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="320" y="254" text-anchor="middle" font-size="11">1 token</text>
      <path d="M346 250 L358 250" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

      <rect x="360" y="230" width="88" height="40" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
      <text x="404" y="247" text-anchor="middle" font-size="11" font-weight="600">all the weights</text>
      <text x="404" y="262" text-anchor="middle" font-size="10.5" fill="#97A59F">from HBM again</text>
      <rect x="454" y="230" width="52" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="480" y="254" text-anchor="middle" font-size="11">1 token</text>
      <path d="M506 250 L518 250" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

      <rect x="520" y="230" width="88" height="40" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
      <text x="564" y="247" text-anchor="middle" font-size="11" font-weight="600">all the weights</text>
      <text x="564" y="262" text-anchor="middle" font-size="10.5" fill="#97A59F">from HBM again</text>
      <rect x="614" y="230" width="52" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="640" y="254" text-anchor="middle" font-size="11">1 token</text>
      <path d="M666 250 L678 250" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

      <rect x="680" y="230" width="88" height="40" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
      <text x="724" y="247" text-anchor="middle" font-size="11" font-weight="600">all the weights</text>
      <text x="724" y="262" text-anchor="middle" font-size="10.5" fill="#97A59F">from HBM again</text>
      <rect x="774" y="230" width="52" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="800" y="254" text-anchor="middle" font-size="11">1 token</text>
      <text x="838" y="254" text-anchor="middle" font-size="12" fill="#97A59F">…</text>
    </g>
    <text x="440" y="296" text-anchor="middle" font-size="10.5" fill="#E39A62">each step loads the entire set of weights to produce one token: a low arithmetic intensity, and the math units wait for data</text>
    <text x="440" y="314" text-anchor="middle" font-size="10.5" fill="#7ADACF">with batching, one load of the weights serves 64 requests in the same step, which amortises the high-cost part 64×</text>
  </g>
</svg>
