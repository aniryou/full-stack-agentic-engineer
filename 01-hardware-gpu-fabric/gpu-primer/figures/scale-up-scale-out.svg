<svg xmlns="http://www.w3.org/2000/svg" width="880" height="428" viewBox="0 0 880 428" role="img" aria-label="Inside a node, NVSwitch makes NVLink an all-to-all fabric between the GPUs, the NVLink domain; between nodes, the NICs carry about 9 times less bandwidth per direction, within one generation, over InfiniBand or high-end Ethernet." style="color: #E4EAE7">
  <title>Inside a node, NVSwitch makes NVLink an all-to-all fabric between the GPUs, the NVLink domain; between nodes, the NICs carry about 9 times less bandwidth per direction, within one generation, over InfiniBand or high-end Ethernet.</title>
  <rect x="0" y="0" width="880" height="428" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">Two tiers of interconnect (§6): NVLink inside the node, the network between nodes.</text>

    <!-- node 1 -->
    <rect x="24" y="46" width="400" height="268" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="224" y="64" text-anchor="middle" fill="#97A59F">node 1: one NVLink domain, the scale-up tier</text>
    <rect x="40" y="78" width="368" height="54" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="224" y="96" text-anchor="middle" font-weight="600" font-size="12">NVSwitch: an all-to-all fabric, not point-to-point</text>
    <text x="224" y="111" text-anchor="middle" font-size="10.5" fill="#7ADACF">NVLink 1.8 TB/s per GPU on Blackwell</text>
    <text x="224" y="125" text-anchor="middle" font-size="10.5" fill="#7ADACF">the sum of both directions, ~14× PCIe Gen5 x16</text>
    <g fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="40" y="162" width="80" height="40" rx="6"/><rect x="136" y="162" width="80" height="40" rx="6"/><rect x="232" y="162" width="80" height="40" rx="6"/><rect x="328" y="162" width="80" height="40" rx="6"/>
    </g>
    <g font-weight="600" text-anchor="middle">
      <text x="80" y="186">GPU</text><text x="176" y="186">GPU</text><text x="272" y="186">GPU</text><text x="368" y="186">GPU</text>
    </g>
    <rect x="40" y="232" width="368" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="224" y="250" text-anchor="middle" font-weight="600">NICs: 400–800 Gb/s per GPU</text>
    <text x="224" y="265" text-anchor="middle" font-size="10.5" fill="#97A59F">50–100 GB/s each way</text>
    <text x="224" y="279" text-anchor="middle" font-size="10.5" fill="#97A59F">~9× below NVLink per direction, within one generation</text>
    <g stroke="#4CC5B7" stroke-width="1.2" fill="none" marker-start="url(#arrA)" marker-end="url(#arrA)">
      <path d="M80 134 L80 160"/><path d="M176 134 L176 160"/><path d="M272 134 L272 160"/><path d="M368 134 L368 160"/>
    </g>
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)">
      <path d="M80 204 L80 230"/><path d="M176 204 L176 230"/><path d="M272 204 L272 230"/><path d="M368 204 L368 230"/>
    </g>

    <!-- node 2 -->
    <rect x="456" y="46" width="400" height="268" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="656" y="64" text-anchor="middle" fill="#97A59F">node 2: another NVLink domain</text>
    <rect x="472" y="78" width="368" height="54" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="656" y="96" text-anchor="middle" font-weight="600" font-size="12">NVSwitch: an all-to-all fabric, not point-to-point</text>
    <text x="656" y="111" text-anchor="middle" font-size="10.5" fill="#7ADACF">NVLink 1.8 TB/s per GPU on Blackwell</text>
    <text x="656" y="125" text-anchor="middle" font-size="10.5" fill="#7ADACF">the sum of both directions, ~14× PCIe Gen5 x16</text>
    <g fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="472" y="162" width="80" height="40" rx="6"/><rect x="568" y="162" width="80" height="40" rx="6"/><rect x="664" y="162" width="80" height="40" rx="6"/><rect x="760" y="162" width="80" height="40" rx="6"/>
    </g>
    <g font-weight="600" text-anchor="middle">
      <text x="512" y="186">GPU</text><text x="608" y="186">GPU</text><text x="704" y="186">GPU</text><text x="800" y="186">GPU</text>
    </g>
    <rect x="472" y="232" width="368" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="656" y="250" text-anchor="middle" font-weight="600">NICs: 400–800 Gb/s per GPU</text>
    <text x="656" y="265" text-anchor="middle" font-size="10.5" fill="#97A59F">50–100 GB/s each way</text>
    <text x="656" y="279" text-anchor="middle" font-size="10.5" fill="#97A59F">~9× below NVLink per direction, within one generation</text>
    <g stroke="#4CC5B7" stroke-width="1.2" fill="none" marker-start="url(#arrA)" marker-end="url(#arrA)">
      <path d="M512 134 L512 160"/><path d="M608 134 L608 160"/><path d="M704 134 L704 160"/><path d="M800 134 L800 160"/>
    </g>
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)">
      <path d="M512 204 L512 230"/><path d="M608 204 L608 230"/><path d="M704 204 L704 230"/><path d="M800 204 L800 230"/>
    </g>

    <!-- the scale-out network -->
    <rect x="24" y="344" width="832" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="440" y="361" text-anchor="middle" font-weight="600">scale-out network: InfiniBand or high-end Ethernet, between nodes</text>
    <text x="440" y="377" text-anchor="middle" font-size="10.5" fill="#97A59F">the slower network, the scale-out tier</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)">
      <path d="M224 288 L224 342"/><path d="M656 288 L656 342"/>
    </g>

    <text x="24" y="410" font-size="11" fill="#97A59F">scale-up: make the NVLink domain larger. GB200 NVL72: 72 GPUs in one domain.</text>
    <text x="856" y="410" text-anchor="end" font-size="11" fill="#97A59F">scale-out: add nodes over the slower network</text>
  </g>
</svg>
