<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="When the 32 lanes of a warp read 32 consecutive floats, the hardware merges the reads into a few wide transactions; when they read 32 scattered addresses, the warp issues 32 transactions and wastes most of their bytes." style="color: #E4EAE7">
  <title>When the 32 lanes of a warp read 32 consecutive floats, the hardware merges the reads into a few wide transactions; when they read 32 scattered addresses, the warp issues 32 transactions and wastes most of their bytes.</title>
  <rect x="0" y="0" width="880" height="330" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">One warp reads 32 floats (§3). The hardware reads HBM in transactions of a set size, usually 32 bytes.</text>

    <!-- panel A: consecutive addresses -->
    <rect x="24" y="42" width="832" height="132" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">32 consecutive addresses: the hardware merges the reads into a few wide transactions</text>
    <text x="92" y="88" text-anchor="end" font-size="11" fill="#97A59F">lanes 0 to 31</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="100" y="72" width="18" height="24" rx="2"/><rect x="120" y="72" width="18" height="24" rx="2"/><rect x="140" y="72" width="18" height="24" rx="2"/><rect x="160" y="72" width="18" height="24" rx="2"/>
      <rect x="180" y="72" width="18" height="24" rx="2"/><rect x="200" y="72" width="18" height="24" rx="2"/><rect x="220" y="72" width="18" height="24" rx="2"/><rect x="240" y="72" width="18" height="24" rx="2"/>
      <rect x="260" y="72" width="18" height="24" rx="2"/><rect x="280" y="72" width="18" height="24" rx="2"/><rect x="300" y="72" width="18" height="24" rx="2"/><rect x="320" y="72" width="18" height="24" rx="2"/>
      <rect x="340" y="72" width="18" height="24" rx="2"/><rect x="360" y="72" width="18" height="24" rx="2"/><rect x="380" y="72" width="18" height="24" rx="2"/><rect x="400" y="72" width="18" height="24" rx="2"/>
      <rect x="420" y="72" width="18" height="24" rx="2"/><rect x="440" y="72" width="18" height="24" rx="2"/><rect x="460" y="72" width="18" height="24" rx="2"/><rect x="480" y="72" width="18" height="24" rx="2"/>
      <rect x="500" y="72" width="18" height="24" rx="2"/><rect x="520" y="72" width="18" height="24" rx="2"/><rect x="540" y="72" width="18" height="24" rx="2"/><rect x="560" y="72" width="18" height="24" rx="2"/>
      <rect x="580" y="72" width="18" height="24" rx="2"/><rect x="600" y="72" width="18" height="24" rx="2"/><rect x="620" y="72" width="18" height="24" rx="2"/><rect x="640" y="72" width="18" height="24" rx="2"/>
      <rect x="660" y="72" width="18" height="24" rx="2"/><rect x="680" y="72" width="18" height="24" rx="2"/><rect x="700" y="72" width="18" height="24" rx="2"/><rect x="720" y="72" width="18" height="24" rx="2"/>
    </g>
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)">
      <path d="M179 100 L179 120"/><path d="M339 100 L339 120"/><path d="M498 100 L498 120"/><path d="M658 100 L658 120"/>
    </g>
    <text x="92" y="140" text-anchor="end" font-size="11" fill="#97A59F">HBM</text>
    <g fill="#16302A" stroke="#4CC5B7" stroke-width="1.2">
      <rect x="100" y="122" width="159" height="28" rx="4"/><rect x="259" y="122" width="160" height="28" rx="4"/><rect x="419" y="122" width="160" height="28" rx="4"/><rect x="579" y="122" width="159" height="28" rx="4"/>
    </g>
    <g font-size="10.5" text-anchor="middle">
      <text x="179" y="140">32-byte transaction</text><text x="339" y="140">32-byte transaction</text><text x="498" y="140">32-byte transaction</text><text x="658" y="140">32-byte transaction</text>
    </g>
    <text x="419" y="166" text-anchor="middle" font-size="10.5" fill="#7ADACF">a few wide transactions for 32 floats</text>

    <!-- panel B: scattered addresses -->
    <rect x="24" y="186" width="832" height="132" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="204" fill="#97A59F">32 scattered addresses: 32 separate transactions, and most of the bytes that you paid for are wasted</text>
    <text x="92" y="232" text-anchor="end" font-size="11" fill="#97A59F">lanes 0 to 31</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="100" y="216" width="18" height="24" rx="2"/><rect x="120" y="216" width="18" height="24" rx="2"/><rect x="140" y="216" width="18" height="24" rx="2"/><rect x="160" y="216" width="18" height="24" rx="2"/>
      <rect x="180" y="216" width="18" height="24" rx="2"/><rect x="200" y="216" width="18" height="24" rx="2"/><rect x="220" y="216" width="18" height="24" rx="2"/><rect x="240" y="216" width="18" height="24" rx="2"/>
      <rect x="260" y="216" width="18" height="24" rx="2"/><rect x="280" y="216" width="18" height="24" rx="2"/><rect x="300" y="216" width="18" height="24" rx="2"/><rect x="320" y="216" width="18" height="24" rx="2"/>
      <rect x="340" y="216" width="18" height="24" rx="2"/><rect x="360" y="216" width="18" height="24" rx="2"/><rect x="380" y="216" width="18" height="24" rx="2"/><rect x="400" y="216" width="18" height="24" rx="2"/>
      <rect x="420" y="216" width="18" height="24" rx="2"/><rect x="440" y="216" width="18" height="24" rx="2"/><rect x="460" y="216" width="18" height="24" rx="2"/><rect x="480" y="216" width="18" height="24" rx="2"/>
      <rect x="500" y="216" width="18" height="24" rx="2"/><rect x="520" y="216" width="18" height="24" rx="2"/><rect x="540" y="216" width="18" height="24" rx="2"/><rect x="560" y="216" width="18" height="24" rx="2"/>
      <rect x="580" y="216" width="18" height="24" rx="2"/><rect x="600" y="216" width="18" height="24" rx="2"/><rect x="620" y="216" width="18" height="24" rx="2"/><rect x="640" y="216" width="18" height="24" rx="2"/>
      <rect x="660" y="216" width="18" height="24" rx="2"/><rect x="680" y="216" width="18" height="24" rx="2"/><rect x="700" y="216" width="18" height="24" rx="2"/><rect x="720" y="216" width="18" height="24" rx="2"/>
    </g>
    <!-- 8 of the 32 transactions: a 32-byte box (warm) with the one float a lane asked for (accent) -->
    <text x="92" y="284" text-anchor="end" font-size="11" fill="#97A59F">HBM</text>
    <g fill="#3A2C25" stroke="#E39A62" stroke-width="1">
      <rect x="100" y="266" width="48" height="28" rx="4"/><rect x="196" y="266" width="48" height="28" rx="4"/><rect x="292" y="266" width="48" height="28" rx="4"/><rect x="388" y="266" width="48" height="28" rx="4"/>
      <rect x="484" y="266" width="48" height="28" rx="4"/><rect x="580" y="266" width="48" height="28" rx="4"/><rect x="676" y="266" width="48" height="28" rx="4"/><rect x="772" y="266" width="48" height="28" rx="4"/>
    </g>
    <g fill="#4CC5B7">
      <rect x="108" y="270" width="6" height="20"/><rect x="226" y="270" width="6" height="20"/><rect x="308" y="270" width="6" height="20"/><rect x="424" y="270" width="6" height="20"/>
      <rect x="488" y="270" width="6" height="20"/><rect x="604" y="270" width="6" height="20"/><rect x="688" y="270" width="6" height="20"/><rect x="804" y="270" width="6" height="20"/>
    </g>
    <g stroke="#97A59F" stroke-width="1" fill="none" marker-end="url(#arr)">
      <path d="M109 242 L111 266"/><path d="M189 242 L229 266"/><path d="M269 242 L311 266"/><path d="M349 242 L427 266"/>
      <path d="M429 242 L491 266"/><path d="M509 242 L607 266"/><path d="M589 242 L691 266"/><path d="M669 242 L807 266"/>
    </g>
    <text x="440" y="310" text-anchor="middle" font-size="10.5" fill="#E39A62">each 32-byte transaction serves one float, and the rest of its bytes are wasted. 8 of the 32 transactions are drawn.</text>
  </g>
</svg>
