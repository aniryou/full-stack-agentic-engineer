# 4 one-GPU pods at once. Without time-slicing a 1-GPU VM runs one and leaves the
# others Pending (Insufficient nvidia.com/gpu); with TIME_SLICING_REPLICAS=4 the node
# advertises 4 and all run, each seeing the same GPU UUID - shared, not isolated.
#
# Generated by tools/render_manifests.py from k8sgpu/gpuvm.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: time-sliced
  namespace: default
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: Exists
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: smi
          image: nvidia/cuda:12.9.1-base-ubuntu24.04
          command:
            - bash
            - -c
            - nvidia-smi -L && sleep 120
          env:
            - name: NVIDIA_DISABLE_REQUIRE
              value: 'true'
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: 1
            limits:
              memory: 256Mi
              nvidia.com/gpu: 1
