# One GPU through the real device plugin: the kubelet's device manager asks the plugin to
# Allocate, the NVIDIA runtime (runtimeClassName: nvidia on k3s) mounts the device and driver
# libraries, and nvidia-smi -L lists the GPU - the step kind cannot show.
#
# Generated by tools/render_manifests.py from k8sgpu/gpuvm.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: Exists
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: smi
          image: nvidia/cuda:12.9.1-base-ubuntu24.04
          command:
            - bash
            - -c
            - nvidia-smi -L && sleep 30
          env:
            - name: NVIDIA_DISABLE_REQUIRE
              value: 'true'
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: 1
            limits:
              memory: 256Mi
              nvidia.com/gpu: 1
