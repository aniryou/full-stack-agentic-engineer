# vLLM on one L4 via the ComputeClass, weights mounted read-only from GCS by the Cloud
# Storage FUSE CSI driver (the pod's KSA gets objectViewer through Workload Identity; see
# deploy/gcp/terraform/storage.tf). apply-examples.sh substitutes ${WEIGHTS_BUCKET}.
# The startup probe allows 10 minutes for the weight load before liveness takes over.
#
# Generated by tools/render_manifests.py from k8sgpu/gke.py - edit there and re-run.
apiVersion: v1
kind: Namespace
metadata:
  name: serving
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-reader
  namespace: serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-l4
  namespace: serving
  labels:
    app: vllm-l4
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-l4
  template:
    metadata:
      labels:
        app: vllm-l4
      annotations:
        gke-gcsfuse/volumes: 'true'
        gke-gcsfuse/cpu-request: 500m
        gke-gcsfuse/memory-request: 1Gi
        gke-gcsfuse/ephemeral-storage-request: 20Gi
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: model-reader
      nodeSelector:
        cloud.google.com/compute-class: l4-spot-first
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          command:
            - vllm
            - serve
          args:
            - /models/qwen2.5-1.5b-instruct
            - --served-model-name
            - qwen2.5-1.5b
            - --max-model-len
            - '4096'
            - --gpu-memory-utilization
            - '0.90'
            - --port
            - '8000'
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: '2'
              memory: 10Gi
              nvidia.com/gpu: 1
            limits:
              memory: 10Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: weights
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: weights
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: ${WEIGHTS_BUCKET}
              mountOptions: implicit-dirs
              fileCacheCapacity: '-1'
              fileCacheForRangeRead: 'true'
              metadataStatCacheCapacity: '-1'
              metadataTypeCacheCapacity: '-1'
              metadataCacheTTLSeconds: '-1'
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-l4
  namespace: serving
spec:
  selector:
    app: vllm-l4
  ports:
    - name: http
      port: 8000
      targetPort: 8000
