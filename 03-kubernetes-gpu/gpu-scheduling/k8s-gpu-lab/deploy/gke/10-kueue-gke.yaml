# Kueue on GKE: two flavors backed by two node pools. l4-spot is plain quota; l4-flex sits
# behind the dws-prov AdmissionCheck, so Kueue files a ProvisioningRequest
# (queued-provisioning.gke.io) and admits only when DWS has provisioned every node.
# Admission on l4-spot means only 'the quota is yours': the pods then wait for the autoscaler,
# and a gang caught half-provisioned is evicted and requeued by Kueue's waitForPodsReady
# (on by default in v0.19: 30 min timeout). No topologyName: Google's TAS examples use the GCE
# topology labels on A3/A4/A4X nodes, not G2/L4 (verify: kubectl get nodes -L
# cloud.google.com/gce-topology-host). Requires Kueue installed (deploy/gke/install-addons.sh)
# and enable_flex_start_pool = true.
#
# Generated by tools/render_manifests.py from k8sgpu/gke.py - edit there and re-run.
apiVersion: v1
kind: Namespace
metadata:
  name: ml
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: l4-spot
spec:
  nodeLabels:
    cloud.google.com/gke-nodepool: l4-spot
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: l4-flex
spec:
  nodeLabels:
    cloud.google.com/gke-nodepool: l4-flex
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: cloud.google.com/gke-queued
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ProvisioningRequestConfig
metadata:
  name: dws-config
spec:
  provisioningClassName: queued-provisioning.gke.io
  managedResources:
    - nvidia.com/gpu
  podSetUpdates:
    nodeSelector:
      - key: autoscaling.gke.io/provisioning-request
        valueFromProvisioningClassDetail: ResizeRequestName
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: dws-prov
spec:
  controllerName: kueue.x-k8s.io/provisioning-request
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: ProvisioningRequestConfig
    name: dws-config
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gke-gpu
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - ml
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: l4-spot
          resources:
            - name: cpu
              nominalQuota: 6
            - name: memory
              nominalQuota: 24Gi
            - name: nvidia.com/gpu
              nominalQuota: 2
        - name: l4-flex
          resources:
            - name: cpu
              nominalQuota: 16
            - name: memory
              nominalQuota: 64Gi
            - name: nvidia.com/gpu
              nominalQuota: 4
  admissionChecksStrategy:
    admissionChecks:
      - name: dws-prov
        onFlavors:
          - l4-flex
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-queue
  namespace: ml
spec:
  clusterQueue: gke-gpu
