# Smoke test for the Spot L4 pool: the pod forces a scale-up from zero, runs nvidia-smi
# (the driver GKE installed is mounted into the container) and exits. The Job gives up after
# 30 minutes so a Spot stockout cannot leave it waiting all weekend.
#
# Generated by tools/render_manifests.py from k8sgpu/gke.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: nvidia-smi
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: l4-spot
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: smi
          image: nvidia/cuda:12.9.1-base-ubuntu24.04
          command:
            - bash
            - -c
            - nvidia-smi && sleep 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: 1
            limits:
              memory: 512Mi
              nvidia.com/gpu: 1
