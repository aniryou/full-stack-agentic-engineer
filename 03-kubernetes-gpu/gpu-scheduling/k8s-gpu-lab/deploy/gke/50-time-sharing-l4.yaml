# Time-sharing (primer §9): with enable_time_sharing_pool = true the l4-shared pool advertises
# 4 nvidia.com/gpu per physical L4, so these 4 one-GPU pods run together on one
# g2-standard-4 and nvidia-smi -L shows each of them the same GPU. No memory or fault isolation;
# a container may request at most 1 shared GPU. Node labels: verify on your cluster.
#
# Generated by tools/render_manifests.py from k8sgpu/gke.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: shared-l4
  namespace: default
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-gpu-sharing-strategy: time-sharing
        cloud.google.com/gke-max-shared-clients-per-gpu: '4'
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: smi
          image: nvidia/cuda:12.9.1-base-ubuntu24.04
          command:
            - bash
            - -c
            - nvidia-smi -L && sleep 120
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: 1
            limits:
              memory: 512Mi
              nvidia.com/gpu: 1
