# A 2-pod gang pinned to the flex-start pool, so Kueue picks the l4-flex flavor and the
# ProvisioningRequest path. maxRunDurationSeconds bounds the lease DWS grants.
#
# Generated by tools/render_manifests.py from k8sgpu/gke.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: dws-l4-gang
  namespace: ml
  labels:
    kueue.x-k8s.io/queue-name: gpu-queue
  annotations:
    provreq.kueue.x-k8s.io/maxRunDurationSeconds: '3600'
spec:
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: l4-flex
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: smi
          image: nvidia/cuda:12.9.1-base-ubuntu24.04
          command:
            - bash
            - -c
            - nvidia-smi -L && sleep 300
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              nvidia.com/gpu: 1
            limits:
              memory: 1Gi
              nvidia.com/gpu: 1
