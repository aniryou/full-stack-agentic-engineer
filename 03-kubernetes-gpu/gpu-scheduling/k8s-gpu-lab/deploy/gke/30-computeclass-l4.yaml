# A custom ComputeClass: GKE creates node pools on demand and tries the rungs in order -
# Spot, then on-demand, then flex-start - for the same L4 shape. Pods opt in with a
# nodeSelector on cloud.google.com/compute-class. Field names: verify against
# `kubectl explain computeclass.spec` on your cluster. gpu.driverVersion: latest because the
# vLLM image in 40 is a CUDA 13 build (driver >= 580); the auto-created pools would otherwise
# get GKE's default driver. Spot first is a cost choice for a lab: for latency-critical
# serving put on-demand (or a reservation) first and Spot last.
#
# Generated by tools/render_manifests.py from k8sgpu/gke.py - edit there and re-run.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: l4-spot-first
spec:
  priorities:
    - machineType: g2-standard-4
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: true
    - machineType: g2-standard-4
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      spot: false
    - machineType: g2-standard-4
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      flexStart:
        enabled: true
        nodeRecycling:
          leadTimeSeconds: 3600
  nodePoolAutoCreation:
    enabled: true
  activeMigration:
    optimizeRulePriority: true
  whenUnsatisfiable: DoNotScaleUp
