# s5: team-a within its nominal quota.
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: a-job-1
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: gpu-queue
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              echo "pod=$HOSTNAME node=$NODE_NAME gpus=$GPUS rank=${JOB_COMPLETION_INDEX:-${LWS_WORKER_INDEX:-0}}"
              ls /dev/nvidia* 2>/dev/null || echo "no /dev/nvidia*: this GPU exists only as node capacity (simulated)"
              sleep 3600
          env:
            - name: GPUS
              value: '4'
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
              nvidia.com/gpu: 4
            limits:
              memory: 320Mi
              nvidia.com/gpu: 4
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
