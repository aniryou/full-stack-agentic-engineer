# s6: Asks for 1 GPU but does not tolerate the nvidia.com/gpu taint.
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: no-toleration
  namespace: zoo
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      containers:
        - name: worker
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              echo "pod=$HOSTNAME node=$NODE_NAME gpus=$GPUS rank=${JOB_COMPLETION_INDEX:-${LWS_WORKER_INDEX:-0}}"
              ls /dev/nvidia* 2>/dev/null || echo "no /dev/nvidia*: this GPU exists only as node capacity (simulated)"
              sleep 3600
          env:
            - name: GPUS
              value: '1'
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              nvidia.com/gpu: 1
            limits:
              memory: 64Mi
              nvidia.com/gpu: 1
