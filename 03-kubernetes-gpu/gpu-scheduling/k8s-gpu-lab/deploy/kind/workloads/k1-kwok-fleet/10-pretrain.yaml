# k1: 16 hosts x 8 H100 = 128 GPUs that must share one block.
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: pretrain
  namespace: fleet
  labels:
    kueue.x-k8s.io/queue-name: fleet-queue
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 16
          completions: 16
          backoffLimit: 0
          completionMode: Indexed
          template:
            metadata:
              annotations:
                kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 5
              nodeSelector:
                cloud.google.com/gke-accelerator: nvidia-h100-80gb
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
                - key: kwok.x-k8s.io/node
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: worker
                  image: busybox:1.38.0
                  command:
                    - sh
                    - -c
                    - |
                      echo "pod=$HOSTNAME node=$NODE_NAME gpus=$GPUS rank=${JOB_COMPLETION_INDEX:-${LWS_WORKER_INDEX:-0}}"
                      ls /dev/nvidia* 2>/dev/null || echo "no /dev/nvidia*: this GPU exists only as node capacity (simulated)"
                      sleep 3600
                  env:
                    - name: GPUS
                      value: '8'
                    - name: NODE_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: spec.nodeName
                  resources:
                    requests:
                      cpu: 100m
                      memory: 320Mi
                      nvidia.com/gpu: 8
                    limits:
                      memory: 320Mi
                      nvidia.com/gpu: 8
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 256Mi
