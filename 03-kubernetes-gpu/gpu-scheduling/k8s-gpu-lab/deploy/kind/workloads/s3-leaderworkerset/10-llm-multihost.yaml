# s3: LeaderWorkerSet, 1 replica of size 2, 4 GPUs per pod, leader and workers
# co-located in one subblock (podset-group-name ties them together).
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llm-multihost
  namespace: team-b
  labels:
    kueue.x-k8s.io/queue-name: gpu-queue
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-subblock
          kueue.x-k8s.io/podset-group-name: llm
      spec:
        terminationGracePeriodSeconds: 5
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-l4
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: worker
            image: busybox:1.38.0
            command:
              - sh
              - -c
              - |
                echo "pod=$HOSTNAME node=$NODE_NAME gpus=$GPUS rank=${JOB_COMPLETION_INDEX:-${LWS_WORKER_INDEX:-0}}"
                ls /dev/nvidia* 2>/dev/null || echo "no /dev/nvidia*: this GPU exists only as node capacity (simulated)"
                sleep 3600
            env:
              - name: GPUS
                value: '4'
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
                nvidia.com/gpu: 4
              limits:
                memory: 64Mi
                nvidia.com/gpu: 4
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi
    workerTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-subblock
          kueue.x-k8s.io/podset-group-name: llm
      spec:
        terminationGracePeriodSeconds: 5
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-l4
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: worker
            image: busybox:1.38.0
            command:
              - sh
              - -c
              - |
                echo "pod=$HOSTNAME node=$NODE_NAME gpus=$GPUS rank=${JOB_COMPLETION_INDEX:-${LWS_WORKER_INDEX:-0}}"
                ls /dev/nvidia* 2>/dev/null || echo "no /dev/nvidia*: this GPU exists only as node capacity (simulated)"
                sleep 3600
            env:
              - name: GPUS
                value: '4'
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
                nvidia.com/gpu: 4
              limits:
                memory: 64Mi
                nvidia.com/gpu: 4
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi
    restartPolicy: RecreateGroupOnPodRestart
