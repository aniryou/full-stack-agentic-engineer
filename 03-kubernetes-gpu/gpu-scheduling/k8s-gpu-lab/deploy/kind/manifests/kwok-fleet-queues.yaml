# KWOK fleet: a flavor for the fake 8-GPU H100 nodes (they also carry the kwok taint),
# one ClusterQueue with the whole 256-GPU fleet, and its LocalQueue.
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: v1
kind: Namespace
metadata:
  name: fleet
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-h100-kwok
spec:
  nodeLabels:
    cloud.google.com/gke-accelerator: nvidia-h100-80gb
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: kwok.x-k8s.io/node
      operator: Exists
      effect: NoSchedule
  topologyName: gke-default
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: fleet-cq
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - fleet
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: gpu-h100-kwok
          resources:
            - name: cpu
              nominalQuota: 2048
            - name: memory
              nominalQuota: 16Ti
            - name: nvidia.com/gpu
              nominalQuota: 256
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: fleet-queue
  namespace: fleet
spec:
  clusterQueue: fleet-cq
