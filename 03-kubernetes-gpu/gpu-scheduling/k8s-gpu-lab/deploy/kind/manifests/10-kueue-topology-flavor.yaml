# Topology-Aware Scheduling: the GCE-style levels (block > subblock > host > node) that
# fake-gpus.sh puts on the kind workers, and one TAS ResourceFlavor for the fake L4 nodes.
# The flavor's toleration is injected into every admitted pod (TAS honours node taints only
# because kubernetes.io/hostname is the lowest level).
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: gke-default
spec:
  levels:
    - nodeLabel: cloud.google.com/gce-topology-block
    - nodeLabel: cloud.google.com/gce-topology-subblock
    - nodeLabel: cloud.google.com/gce-topology-host
    - nodeLabel: kubernetes.io/hostname
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-l4
spec:
  nodeLabels:
    cloud.google.com/gke-accelerator: nvidia-l4
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  topologyName: gke-default
