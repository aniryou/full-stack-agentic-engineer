# Two teams in one cohort. Each owns 8 of the 16 fake GPUs (nominalQuota), may borrow up to
# 4 more from the other when it is idle (borrowingLimit), reclaims its own quota by
# preempting a borrower (reclaimWithinCohort: Any), and lets high priority preempt low
# inside the team (withinClusterQueue: LowerPriority). cpu/memory quotas are generous: GPUs
# are the resource being taught.
#
# Generated by tools/render_manifests.py from k8sgpu/scenarios.py - edit there and re-run.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-a-cq
spec:
  cohortName: gpu-lab
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - team-a
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
    borrowWithinCohort:
      policy: Never
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: gpu-l4
          resources:
            - name: cpu
              nominalQuota: 8
            - name: memory
              nominalQuota: 16Gi
            - name: nvidia.com/gpu
              nominalQuota: 8
              borrowingLimit: 4
---
