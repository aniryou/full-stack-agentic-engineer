[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k8sgpu"
version = "0.1.0"
description = "Kubernetes for GPUs, hands-on: manifest builders, a GPU pod-spec linter, a Pending-pod explainer, a capacity chooser, and a kind cluster with fake GPUs running real Kueue/JobSet/LWS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]          # everything else is standard library

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "nbformat>=5.9",
  "nbclient>=0.9",
  "ipykernel>=6.25",
  "jupyterlab>=4.0",
  "kubernetes-validate>=1.34",   # strict schema checks for the core-kind manifests (tests skip if absent)
  "jsonschema>=4.20",            # tools/check_crds.py validates CRD manifests against the pinned upstream CRDs
]

[project.scripts]
k8sgpu = "k8sgpu.__main__:main"

[tool.setuptools.packages.find]
include = ["k8sgpu*"]

[tool.setuptools.package-data]
k8sgpu = ["fixtures/pending/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
