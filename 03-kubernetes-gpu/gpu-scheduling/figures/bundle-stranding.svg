    <text x="601" y="97" text-anchor="middle" font-weight="600">2 stranded</text>
    <text x="40" y="156" font-weight="600">96 cores</text>
    <text x="40" y="172" font-size="11" fill="#97A59F">16 per pod</text>
    <rect x="160" y="140" width="84" height="32" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
