    <text x="786" y="156" font-size="11.5" fill="#97A59F" text-anchor="middle">16 cores, 64 GiB</text>
    <rect x="716" y="184" width="140" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="786" y="204" text-anchor="middle" font-weight="600">Pending</text>
    <text x="786" y="222" font-family="JetBrains Mono, monospace" font-size="11" fill="#E39A62" text-anchor="middle">Insufficient cpu</text>
    <path d="M714 156 L692 156" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="440" y="294" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F" text-anchor="middle">fits = min(8 GPUs / 1, 96 cores / 16, 768 GiB / 64 GiB) = 6 per node</text>
