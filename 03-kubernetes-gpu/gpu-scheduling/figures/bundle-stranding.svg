    <text x="370" y="161" font-family="JetBrains Mono, monospace" font-size="11" fill="#7ADACF" text-anchor="middle">p3</text>
    <rect x="412" y="140" width="84" height="32" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="454" y="161" font-family="JetBrains Mono, monospace" font-size="11" fill="#7ADACF" text-anchor="middle">p4</text>
    <rect x="496" y="140" width="84" height="32" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
