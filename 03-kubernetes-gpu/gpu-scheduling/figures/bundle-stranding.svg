    <path d="M724 156 L708 156" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="450" y="294" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F" text-anchor="middle">fits = min(8 GPUs / 1, 96 cores / 16, 768 GiB / 64 GiB) = 6 per node</text>
