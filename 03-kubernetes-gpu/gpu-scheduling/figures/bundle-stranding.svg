    <rect x="160" y="204" width="42" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="181" y="225" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">p1</text>
    <rect x="202" y="204" width="42" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="223" y="225" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">p2</text>
    <rect x="244" y="204" width="42" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
