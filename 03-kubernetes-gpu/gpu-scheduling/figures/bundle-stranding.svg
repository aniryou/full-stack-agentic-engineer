<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304" role="img" aria-label="On one 8-GPU node with 96 cores and 768 GiB, six 1-GPU pods of 16 cores and 64 GiB use all the CPU, the seventh pod is Pending on Insufficient cpu, and 2 GPUs are stranded." style="color: #E4EAE7">
  <title>On one 8-GPU node with 96 cores and 768 GiB, six 1-GPU pods of 16 cores and 64 GiB use all the CPU, the seventh pod is Pending on Insufficient cpu, and 2 GPUs are stranded.</title>
