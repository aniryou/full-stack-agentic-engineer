    <text x="307" y="225" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">p4</text>
    <rect x="328" y="204" width="42" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="349" y="225" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">p5</text>
    <rect x="370" y="204" width="42" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="391" y="225" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">p6</text>
    <rect x="412" y="204" width="252" height="32" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="538" y="225" fill="#97A59F" text-anchor="middle">free</text>
    <rect x="716" y="96" width="140" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
