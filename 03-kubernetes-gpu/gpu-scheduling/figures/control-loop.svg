<svg xmlns="http://www.w3.org/2000/svg" width="880" height="408" viewBox="0 0 880 408" role="img" aria-label="The control loop of the layer: a Job goes through Kueue's LocalQueue, ClusterQueue quota and whole-gang admission to kube-scheduler, which places one pod at a time on the integer that the kubelet advertises from the device plugin's healthy devices, and a Pending pod asks the cluster autoscaler for a new node." style="color: #E4EAE7">
  <title>The control loop of the layer: a Job goes through Kueue's LocalQueue, ClusterQueue quota and whole-gang admission to kube-scheduler, which places one pod at a time on the integer that the kubelet advertises from the device plugin's healthy devices, and a Pending pod asks the cluster autoscaler for a new node.</title>
  <rect x="0" y="0" width="880" height="408" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="24" y="66" width="150" height="48" rx="24" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="99" y="95" text-anchor="middle" font-weight="600">Job, JobSet, LWS</text>
    <rect x="256" y="28" width="484" height="112" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4" rx="8"/>
    <text x="498" y="46" fill="#97A59F" text-anchor="middle">Kueue: if and when a job starts</text>
    <rect x="270" y="58" width="100" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="320" y="94" text-anchor="middle" font-weight="600">LocalQueue</text>
    <rect x="390" y="58" width="146" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="463" y="78" text-anchor="middle" font-weight="600">ClusterQueue</text>
    <text x="463" y="96" font-size="11" fill="#97A59F" text-anchor="middle">quota per flavor</text>
    <text x="463" y="112" font-size="11" fill="#97A59F" text-anchor="middle">cohort: lend, reclaim</text>
    <rect x="556" y="58" width="160" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="636" y="78" text-anchor="middle" font-weight="600">admits the whole gang</text>
    <text x="636" y="96" font-size="11" fill="#97A59F" text-anchor="middle">TAS or a</text>
    <text x="636" y="112" font-size="11" fill="#97A59F" text-anchor="middle">ProvisioningRequest</text>
    <rect x="516" y="192" width="240" height="56" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="636" y="214" text-anchor="middle" font-weight="600">kube-scheduler</text>
    <text x="636" y="232" font-size="11.5" fill="#7ADACF" text-anchor="middle">one pod at a time: filter, score, bind</text>
    <rect x="60" y="192" width="190" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="155" y="214" text-anchor="middle" font-weight="600">cluster autoscaler</text>
    <text x="155" y="232" font-size="11" fill="#97A59F" text-anchor="middle">on-demand, Spot, DWS flex-start</text>
    <rect x="256" y="284" width="484" height="104" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4" rx="8"/>
    <text x="498" y="300" fill="#97A59F" text-anchor="middle">GPU node</text>
    <rect x="272" y="312" width="148" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="346" y="332" text-anchor="middle" font-weight="600">device plugin</text>
    <text x="346" y="350" font-size="11" fill="#97A59F" text-anchor="middle">ListAndWatch</text>
    <text x="346" y="366" font-size="11" fill="#97A59F" text-anchor="middle">healthy devices</text>
    <rect x="548" y="312" width="176" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="636" y="332" text-anchor="middle" font-weight="600">kubelet</text>
    <text x="636" y="350" font-size="11" fill="#97A59F" text-anchor="middle">Node status:</text>
    <text x="636" y="366" font-size="11" fill="#97A59F" text-anchor="middle">capacity, allocatable</text>
    <path d="M174 90 L268 90" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="221" y="80" font-size="11" fill="#97A59F" text-anchor="middle">created</text>
    <text x="221" y="106" font-size="11" fill="#97A59F" text-anchor="middle">suspended</text>
    <path d="M370 90 L388 90" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M536 90 L554 90" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M636 122 L636 190" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="624" y="158" font-size="11" fill="#97A59F" text-anchor="end">Job unsuspended,</text>
    <text x="624" y="172" font-size="11" fill="#97A59F" text-anchor="end">pods get the flavor nodeSelector</text>
    <path d="M516 220 L252 220" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="384" y="212" font-size="11" fill="#97A59F" text-anchor="middle">Pending pod</text>
    <path d="M155 248 L155 336 L254 336" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <text x="145" y="322" font-size="11" fill="#97A59F" text-anchor="end">new node: driver,</text>
    <text x="145" y="336" font-size="11" fill="#97A59F" text-anchor="end">device plugin</text>
    <path d="M420 344 L546 344" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="483" y="336" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F" text-anchor="middle">nvidia.com/gpu: 8</text>
    <path d="M620 312 L620 250" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <text x="610" y="274" font-size="11" fill="#97A59F" text-anchor="end">an integer per node</text>
    <path d="M652 248 L652 310" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="662" y="274" font-size="11" fill="#97A59F">bind: the kubelet admits, Allocate</text>
  </g>
</svg>
