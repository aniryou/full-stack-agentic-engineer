<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="One engine step is a loop of schedule(), build_batch(), forward, sample and update(), and the KV cache manager gives blocks and block tables." style="color: #E4EAE7">
  <title>One engine step is a loop of schedule(), build_batch(), forward, sample and update(), and the KV cache manager gives blocks and block tables.</title>
  <rect x="0" y="0" width="880" height="280" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="26" y="70" width="140" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="96" y="95" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace" font-size="11.5">schedule()</text>
    <text x="96" y="115" text-anchor="middle" font-size="11.5" fill="#97A59F">token budget:</text>
    <text x="96" y="131" text-anchor="middle" font-size="11.5" fill="#97A59F">running first</text>
    <rect x="198" y="70" width="140" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="268" y="95" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace" font-size="11.5">build_batch()</text>
    <text x="268" y="115" text-anchor="middle" font-size="11.5" fill="#97A59F">one flat batch,</text>
    <text x="268" y="131" text-anchor="middle" font-size="11.5" fill="#97A59F">no padding</text>
    <rect x="370" y="70" width="140" height="74" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="440" y="95" text-anchor="middle" font-weight="600">forward</text>
    <text x="440" y="115" text-anchor="middle" font-size="11.5" fill="#7ADACF">one pass, the</text>
    <text x="440" y="131" text-anchor="middle" font-size="11.5" fill="#7ADACF">weights read once</text>
    <rect x="542" y="70" width="140" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="612" y="95" text-anchor="middle" font-weight="600">sample</text>
    <text x="612" y="115" text-anchor="middle" font-size="11.5" fill="#97A59F">one token per</text>
    <text x="612" y="131" text-anchor="middle" font-size="11.5" fill="#97A59F">complete prompt</text>
    <rect x="714" y="70" width="140" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="784" y="95" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace" font-size="11.5">update()</text>
    <text x="784" y="115" text-anchor="middle" font-size="11.5" fill="#97A59F">append, finish,</text>
    <text x="784" y="131" text-anchor="middle" font-size="11.5" fill="#97A59F">free blocks</text>
    <rect x="26" y="206" width="312" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="182" y="227" text-anchor="middle" font-weight="600">KV cache manager</text>
    <text x="182" y="245" text-anchor="middle" font-size="11.5" fill="#97A59F">block pool</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M166 107 L196 107" marker-end="url(#arr)"/>
      <path d="M338 107 L368 107" marker-end="url(#arr)"/>
      <path d="M510 107 L540 107" marker-end="url(#arr)"/>
      <path d="M682 107 L712 107" marker-end="url(#arr)"/>
      <path d="M96 144 L96 204" marker-end="url(#arr)" stroke-dasharray="4 3"/>
      <path d="M268 206 L268 146" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    </g>
    <text x="104" y="170" font-size="11" fill="#97A59F">allocate blocks,</text>
    <text x="104" y="185" font-size="11" fill="#97A59F">publish full blocks</text>
    <text x="276" y="179" font-size="11" fill="#97A59F">block tables</text>
    <path d="M784 70 L784 40 L96 40 L96 68" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="440" y="30" text-anchor="middle" font-size="11" fill="#7ADACF">next step</text>
  </g>
</svg>
