<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="One engine step is a loop of schedule(), build_batch(), forward, sample and update(), and the KV cache manager gives blocks and block tables." style="color: #E4EAE7">
  <title>One engine step is a loop of schedule(), build_batch(), forward, sample and update(), and the KV cache manager gives blocks and block tables.</title>
  <rect x="0" y="0" width="880" height="260" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="26" y="70" width="140" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="96" y="96" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace" font-size="12">schedule()</text>
    <text x="96" y="116" text-anchor="middle" font-size="11.5" fill="#97A59F">token budget</text>
    <rect x="198" y="70" width="140" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="268" y="96" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace" font-size="12">build_batch()</text>
    <text x="268" y="116" text-anchor="middle" font-size="11.5" fill="#97A59F">one flat batch</text>
    <rect x="370" y="70" width="140" height="62" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="440" y="96" text-anchor="middle" font-weight="600">forward</text>
    <text x="440" y="116" text-anchor="middle" font-size="11.5" fill="#7ADACF">weights read once</text>
    <rect x="542" y="70" width="140" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="612" y="96" text-anchor="middle" font-weight="600">sample</text>
    <text x="612" y="116" text-anchor="middle" font-size="11.5" fill="#97A59F">one token</text>
    <rect x="714" y="70" width="140" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="784" y="96" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace" font-size="12">update()</text>
    <text x="784" y="116" text-anchor="middle" font-size="11.5" fill="#97A59F">free blocks</text>
    <rect x="26" y="186" width="312" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="182" y="207" text-anchor="middle" font-weight="600">KV cache manager</text>
    <text x="182" y="225" text-anchor="middle" font-size="11.5" fill="#97A59F">block pool</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M166 101 L196 101" marker-end="url(#arr)"/>
      <path d="M338 101 L368 101" marker-end="url(#arr)"/>
      <path d="M510 101 L540 101" marker-end="url(#arr)"/>
      <path d="M682 101 L712 101" marker-end="url(#arr)"/>
      <path d="M96 132 L96 184" marker-end="url(#arr)" stroke-dasharray="4 3"/>
      <path d="M268 186 L268 134" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    </g>
    <text x="104" y="163" font-size="11" fill="#97A59F">allocate blocks</text>
    <text x="276" y="163" font-size="11" fill="#97A59F">block tables</text>
    <path d="M784 70 L784 40 L96 40 L96 68" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="440" y="30" text-anchor="middle" font-size="11" fill="#7ADACF">next step</text>
  </g>
</svg>
