<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="The 24 GB of an L4 for Llama-3.1-8B in bf16: the weights, a flat 1 GB, and a 4.54 GB KV cache of 2,164 blocks." style="color: #E4EAE7">
  <title>The 24 GB of an L4 for Llama-3.1-8B in bf16: the weights, a flat 1 GB, and a 4.54 GB KV cache of 2,164 blocks.</title>
  <rect x="0" y="0" width="880" height="320" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">Llama-3.1-8B in bf16 on an L4 (24 GB), with the core's inputs: <tspan font-family="JetBrains Mono, monospace" font-size="11">perf.kv_cache_blocks()</tspan></text>

    <!-- the 24 GB bar, 33.33 px per GB -->
    <text x="592" y="50" text-anchor="middle" font-size="11" fill="#97A59F">a flat 1 GB: activations and workspace</text>
    <path d="M592 54 L592 66" stroke="#97A59F" stroke-width="1" fill="none"/>
    <rect x="40" y="66" width="535" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="307" y="85" text-anchor="middle" font-weight="600">weights 16.06 GB</text>
    <text x="307" y="101" text-anchor="middle" font-size="11" fill="#97A59F">Llama-3.1-8B in bf16</text>
    <rect x="575" y="66" width="33" height="44" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="608" y="66" width="152" height="44" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="684" y="85" text-anchor="middle" font-weight="600">KV cache 4.54 GB</text>
    <text x="684" y="101" text-anchor="middle" font-size="11" fill="#7ADACF">2,164 blocks</text>
    <rect x="760" y="66" width="80" height="44" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="800" y="92" text-anchor="middle" font-size="11" fill="#97A59F">outside 0.9</text>
    <path d="M760 58 L760 122" stroke="#97A59F" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <text x="752" y="136" text-anchor="end" font-size="11" fill="#97A59F">24 GB × 0.9 (gpu_memory_utilization)</text>
    <text x="40" y="136" font-size="11" fill="#97A59F">0 GB</text>
    <text x="840" y="136" text-anchor="end" font-size="11" fill="#97A59F">24 GB</text>

    <!-- the block pool -->
    <text x="40" y="168" font-size="11.5" fill="#7ADACF">4.54 GB / 2 MiB = 2,164 blocks · one block = 16 tokens × 128 KiB = 2 MiB</text>
    <rect x="40" y="178" width="800" height="34" rx="6" fill="none" stroke="#4CC5B7" stroke-width="1.2"/>
    <g fill="#16302A" stroke="#4CC5B7" stroke-width="1">
      <rect x="46" y="183" width="16" height="24" rx="2"/><rect x="66" y="183" width="16" height="24" rx="2"/><rect x="86" y="183" width="16" height="24" rx="2"/>
      <rect x="106" y="183" width="16" height="24" rx="2"/><rect x="126" y="183" width="16" height="24" rx="2"/><rect x="146" y="183" width="16" height="24" rx="2"/>
      <rect x="166" y="183" width="16" height="24" rx="2"/><rect x="186" y="183" width="16" height="24" rx="2"/><rect x="206" y="183" width="16" height="24" rx="2"/>
      <rect x="226" y="183" width="16" height="24" rx="2"/><rect x="246" y="183" width="16" height="24" rx="2"/><rect x="266" y="183" width="16" height="24" rx="2"/>
      <rect x="598" y="183" width="16" height="24" rx="2"/><rect x="618" y="183" width="16" height="24" rx="2"/><rect x="638" y="183" width="16" height="24" rx="2"/>
      <rect x="658" y="183" width="16" height="24" rx="2"/><rect x="678" y="183" width="16" height="24" rx="2"/><rect x="698" y="183" width="16" height="24" rx="2"/>
      <rect x="718" y="183" width="16" height="24" rx="2"/><rect x="738" y="183" width="16" height="24" rx="2"/><rect x="758" y="183" width="16" height="24" rx="2"/>
      <rect x="778" y="183" width="16" height="24" rx="2"/><rect x="798" y="183" width="16" height="24" rx="2"/><rect x="818" y="183" width="16" height="24" rx="2"/>
    </g>
    <text x="440" y="200" text-anchor="middle" font-size="14" fill="#7ADACF">· · ·</text>
    <text x="40" y="238" font-size="11.5" fill="#97A59F">75 blocks for a 1,000 + 200-token chat request: 28 concurrent requests (§2)</text>
    <text x="40" y="256" font-size="11.5" fill="#97A59F">2,000-token sessions: 17.3 (the §4 table)</text>

    <!-- the start-up check -->
    <rect x="40" y="272" width="800" height="34" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="440" y="293" text-anchor="middle" font-size="11.5">If one <tspan font-family="JetBrains Mono, monospace" font-size="11">max_model_len</tspan> sequence cannot fit, vLLM does not start. The core raises the same error in <tspan font-family="JetBrains Mono, monospace" font-size="11">Scheduler.__init__</tspan>.</text>
  </g>
</svg>
