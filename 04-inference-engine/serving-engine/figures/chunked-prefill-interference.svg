<svg xmlns="http://www.w3.org/2000/svg" width="880" height="296" viewBox="0 0 880 296" role="img" aria-label="An 8,000-token prompt in one step makes the token gap 367 ms, and 17 chunks of 496 tokens keep the worst gap at 29.6 ms." style="color: #E4EAE7">
  <title>An 8,000-token prompt in one step makes the token gap 367 ms, and 17 chunks of 496 tokens keep the worst gap at 29.6 ms.</title>
  <rect x="0" y="0" width="880" height="296" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" fill="#97A59F">An L4 serves Qwen2.5-1.5B to 16 users at 1K context (SIMULATED, notebook 02). One box is one step. Schematic, not to scale.</text>

    <!-- row A: no chunking -->
    <rect x="24" y="44" width="832" height="112" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="64" fill="#97A59F">No chunking: the 8,000-token prompt runs in one step</text>
    <rect x="40" y="76" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="80" y="100" text-anchor="middle" font-size="11.5">16 decodes</text>
    <rect x="128" y="76" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="168" y="100" text-anchor="middle" font-size="11.5">16 decodes</text>
    <rect x="216" y="76" width="392" height="40" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="412" y="100" text-anchor="middle" font-weight="600">16 decodes + the 8,000-token prompt</text>
    <rect x="616" y="76" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="656" y="100" text-anchor="middle" font-size="11.5">16 decodes</text>
    <rect x="704" y="76" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="744" y="100" text-anchor="middle" font-size="11.5">16 decodes</text>
    <text x="124" y="138" text-anchor="middle" font-size="11" fill="#97A59F">token gap 16.7 ms</text>
    <text x="412" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E39A62">token gap 367 ms: every decode waits for the step</text>
    <text x="700" y="138" text-anchor="middle" font-size="11" fill="#97A59F">16.7 ms</text>

    <!-- row B: chunked prefill -->
    <rect x="24" y="168" width="832" height="112" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="188" fill="#97A59F">Chunked prefill, budget 512: the 16 decodes first, then the prompt gets the rest of the budget</text>
    <rect x="40" y="200" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="80" y="224" text-anchor="middle" font-size="11.5">16 decodes</text>
    <rect x="128" y="200" width="68" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="162" y="224" text-anchor="middle" font-size="11.5">16 + 496</text>
    <rect x="204" y="200" width="68" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="238" y="224" text-anchor="middle" font-size="11.5">16 + 496</text>
    <rect x="280" y="200" width="68" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="314" y="224" text-anchor="middle" font-size="11.5">16 + 496</text>
    <rect x="356" y="200" width="68" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="390" y="224" text-anchor="middle" font-size="11.5">16 + 496</text>
    <rect x="432" y="200" width="68" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="466" y="224" text-anchor="middle" font-size="11.5">16 + 496</text>
    <text x="522" y="224" text-anchor="middle" font-size="14" fill="#7ADACF">···</text>
    <rect x="544" y="200" width="68" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="578" y="224" text-anchor="middle" font-size="11.5">16 + 496</text>
    <rect x="620" y="200" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="660" y="224" text-anchor="middle" font-size="11.5">16 decodes</text>
    <rect x="708" y="200" width="80" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="748" y="224" text-anchor="middle" font-size="11.5">16 decodes</text>
    <text x="80" y="262" text-anchor="middle" font-size="11" fill="#97A59F">16.7 ms</text>
    <text x="370" y="262" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ADACF">17 chunks of 496 tokens · worst token gap 29.6 ms</text>
    <text x="704" y="262" text-anchor="middle" font-size="11" fill="#97A59F">16.7 ms</text>
  </g>
</svg>
