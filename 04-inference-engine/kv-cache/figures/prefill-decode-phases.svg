<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Prefill runs one forward pass over the whole prompt and fills the cache, and then each decode step adds one token and reads every weight and the full cache." style="color: #E4EAE7">
  <title>Prefill runs one forward pass over the whole prompt and fills the cache, and then each decode step adds one token and reads every weight and the full cache.</title>
  <rect x="0" y="0" width="880" height="360" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">One request: the prompt in one pass, then the output one token per forward pass (§3)</text>

    <!-- prefill -->
    <rect x="24" y="40" width="832" height="126" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">Prefill · the phase that processes the input prompt · compute-bound</text>
    <rect x="40" y="72" width="340" height="80" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="210" y="94" text-anchor="middle" font-weight="600">one forward pass over all the prompt tokens</text>
    <text x="210" y="111" text-anchor="middle" font-size="11" fill="#7ADACF">in parallel, as large matrix multiplications</text>
    <g fill="none" stroke="#7ADACF" stroke-width="1">
      <rect x="54" y="122" width="22" height="18" rx="3"/><rect x="80" y="122" width="22" height="18" rx="3"/><rect x="106" y="122" width="22" height="18" rx="3"/>
      <rect x="132" y="122" width="22" height="18" rx="3"/><rect x="158" y="122" width="22" height="18" rx="3"/><rect x="184" y="122" width="22" height="18" rx="3"/>
      <rect x="210" y="122" width="22" height="18" rx="3"/><rect x="236" y="122" width="22" height="18" rx="3"/><rect x="262" y="122" width="22" height="18" rx="3"/>
      <rect x="288" y="122" width="22" height="18" rx="3"/>
    </g>
    <text x="318" y="136" font-size="11" fill="#7ADACF">prompt</text>
    <path d="M380 118 L468 118" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="424" y="108" text-anchor="middle" font-size="11" fill="#97A59F">fills the cache</text>
    <rect x="470" y="72" width="190" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="565" y="94" text-anchor="middle" font-weight="600">KV cache</text>
    <text x="565" y="111" text-anchor="middle" font-size="11" fill="#97A59F">the K and V of every</text>
    <text x="565" y="126" text-anchor="middle" font-size="11" fill="#97A59F">prompt token, in HBM</text>
    <text x="565" y="141" text-anchor="middle" font-size="11" fill="#97A59F">(Q is not cached)</text>
    <text x="684" y="94" font-size="11.5">the tensor cores</text>
    <text x="684" y="110" font-size="11.5">are the bottleneck</text>
    <text x="684" y="134" font-size="11" fill="#97A59F">the latency is your</text>
    <text x="684" y="149" font-size="11" fill="#97A59F">time to first token</text>

    <!-- the cache carries over -->
    <path d="M565 162 L565 192" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="578" y="184" font-size="11" fill="#97A59F">the cache stays, and it grows by one token per step</text>

    <!-- decode -->
    <rect x="24" y="194" width="832" height="150" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="214" fill="#97A59F">Decode · the phase that generates the output · memory-bandwidth-bound</text>
    <text x="40" y="250" font-size="11.5">one forward pass,</text>
    <text x="40" y="265" font-size="11.5">one new token</text>
    <text x="40" y="290" font-size="11" fill="#97A59F">reads every model weight</text>
    <text x="40" y="320" font-size="11" fill="#97A59F">reads the full KV cache</text>
    <!-- step columns -->
    <g font-size="11" text-anchor="middle">
      <rect x="200" y="226" width="96" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="248" y="243" font-weight="600" font-size="11.5">step N+1</text>
      <text x="248" y="258" fill="#7ADACF">1 token</text>
      <rect x="312" y="226" width="96" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="360" y="243" font-weight="600" font-size="11.5">step N+2</text>
      <text x="360" y="258" fill="#7ADACF">1 token</text>
      <rect x="424" y="226" width="96" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="472" y="243" font-weight="600" font-size="11.5">step N+3</text>
      <text x="472" y="258" fill="#7ADACF">1 token</text>
      <rect x="536" y="226" width="96" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
      <text x="584" y="243" font-weight="600" font-size="11.5">step N+4</text>
      <text x="584" y="258" fill="#7ADACF">1 token</text>
      <text x="656" y="250" font-size="14" fill="#97A59F">· · ·</text>
      <!-- weights, the same every step -->
      <g fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="200" y="276" width="96" height="22" rx="4"/><rect x="312" y="276" width="96" height="22" rx="4"/>
        <rect x="424" y="276" width="96" height="22" rx="4"/><rect x="536" y="276" width="96" height="22" rx="4"/>
      </g>
      <text x="248" y="291">weights</text><text x="360" y="291">weights</text><text x="472" y="291">weights</text><text x="584" y="291">weights</text>
      <!-- the cache, one token longer every step -->
      <g fill="#3A2C25" stroke="#E39A62" stroke-width="1.2">
        <rect x="200" y="306" width="60" height="22" rx="4"/><rect x="312" y="306" width="72" height="22" rx="4"/>
        <rect x="424" y="306" width="84" height="22" rx="4"/><rect x="536" y="306" width="96" height="22" rx="4"/>
      </g>
      <text x="230" y="321">N+1</text><text x="348" y="321">N+2</text><text x="466" y="321">N+3</text><text x="584" y="321">N+4</text>
    </g>
    <rect x="682" y="226" width="162" height="102" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="763" y="250" text-anchor="middle" font-size="11.5" font-weight="600">the tensor cores are</text>
    <text x="763" y="266" text-anchor="middle" font-size="11.5" font-weight="600">idle most of the time</text>
    <text x="763" y="286" text-anchor="middle" font-size="11" fill="#97A59F">they wait for data</text>
    <text x="763" y="306" text-anchor="middle" font-size="11" fill="#97A59F">the latency is your</text>
    <text x="763" y="320" text-anchor="middle" font-size="11" fill="#97A59F">tokens per second</text>
  </g>
</svg>
