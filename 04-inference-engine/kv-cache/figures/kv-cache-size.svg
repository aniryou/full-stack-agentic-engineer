<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="One token of Llama 3 8B keeps 128 KiB of K and V across 32 layers, and the cache grows to 1 GiB at 8K context, 16 GiB at 128K and 32 GiB for 32 users, against fixed weights of about 16 GB." style="color: #E4EAE7">
  <title>One token of Llama 3 8B keeps 128 KiB of K and V across 32 layers, and the cache grows to 1 GiB at 8K context, 16 GiB at 128K and 32 GiB for 32 users, against fixed weights of about 16 GB.</title>
  <rect x="0" y="0" width="880" height="430" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">KV bytes = 2 × layers × kv_heads × head_dim × seq_len × batch × bytes_per_value · Llama 3 8B, fp16 (§4)</text>

    <!-- left: one token -->
    <rect x="24" y="40" width="330" height="374" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">per token: seq_len = 1, batch = 1</text>
    <text x="40" y="76" font-size="11">32 layers, each with a K row and a V row of 8 KV heads</text>
    <g font-size="10.5" fill="#97A59F">
      <text x="40" y="108">layer 1</text><text x="40" y="128">layer 2</text><text x="40" y="148">layer 3</text><text x="40" y="190">layer 32</text>
      <text x="96" y="93">K</text><text x="216" y="93">V</text>
    </g>
    <text x="68" y="170" font-size="14" fill="#97A59F">⋮</text>
    <g fill="#16302A" stroke="#4CC5B7" stroke-width="1">
      <rect x="94" y="98" width="12" height="12" rx="2"/><rect x="108" y="98" width="12" height="12" rx="2"/><rect x="122" y="98" width="12" height="12" rx="2"/><rect x="136" y="98" width="12" height="12" rx="2"/><rect x="150" y="98" width="12" height="12" rx="2"/><rect x="164" y="98" width="12" height="12" rx="2"/><rect x="178" y="98" width="12" height="12" rx="2"/><rect x="192" y="98" width="12" height="12" rx="2"/>
      <rect x="94" y="118" width="12" height="12" rx="2"/><rect x="108" y="118" width="12" height="12" rx="2"/><rect x="122" y="118" width="12" height="12" rx="2"/><rect x="136" y="118" width="12" height="12" rx="2"/><rect x="150" y="118" width="12" height="12" rx="2"/><rect x="164" y="118" width="12" height="12" rx="2"/><rect x="178" y="118" width="12" height="12" rx="2"/><rect x="192" y="118" width="12" height="12" rx="2"/>
      <rect x="94" y="138" width="12" height="12" rx="2"/><rect x="108" y="138" width="12" height="12" rx="2"/><rect x="122" y="138" width="12" height="12" rx="2"/><rect x="136" y="138" width="12" height="12" rx="2"/><rect x="150" y="138" width="12" height="12" rx="2"/><rect x="164" y="138" width="12" height="12" rx="2"/><rect x="178" y="138" width="12" height="12" rx="2"/><rect x="192" y="138" width="12" height="12" rx="2"/>
      <rect x="94" y="180" width="12" height="12" rx="2"/><rect x="108" y="180" width="12" height="12" rx="2"/><rect x="122" y="180" width="12" height="12" rx="2"/><rect x="136" y="180" width="12" height="12" rx="2"/><rect x="150" y="180" width="12" height="12" rx="2"/><rect x="164" y="180" width="12" height="12" rx="2"/><rect x="178" y="180" width="12" height="12" rx="2"/><rect x="192" y="180" width="12" height="12" rx="2"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="214" y="98" width="12" height="12" rx="2"/><rect x="228" y="98" width="12" height="12" rx="2"/><rect x="242" y="98" width="12" height="12" rx="2"/><rect x="256" y="98" width="12" height="12" rx="2"/><rect x="270" y="98" width="12" height="12" rx="2"/><rect x="284" y="98" width="12" height="12" rx="2"/><rect x="298" y="98" width="12" height="12" rx="2"/><rect x="312" y="98" width="12" height="12" rx="2"/>
      <rect x="214" y="118" width="12" height="12" rx="2"/><rect x="228" y="118" width="12" height="12" rx="2"/><rect x="242" y="118" width="12" height="12" rx="2"/><rect x="256" y="118" width="12" height="12" rx="2"/><rect x="270" y="118" width="12" height="12" rx="2"/><rect x="284" y="118" width="12" height="12" rx="2"/><rect x="298" y="118" width="12" height="12" rx="2"/><rect x="312" y="118" width="12" height="12" rx="2"/>
      <rect x="214" y="138" width="12" height="12" rx="2"/><rect x="228" y="138" width="12" height="12" rx="2"/><rect x="242" y="138" width="12" height="12" rx="2"/><rect x="256" y="138" width="12" height="12" rx="2"/><rect x="270" y="138" width="12" height="12" rx="2"/><rect x="284" y="138" width="12" height="12" rx="2"/><rect x="298" y="138" width="12" height="12" rx="2"/><rect x="312" y="138" width="12" height="12" rx="2"/>
      <rect x="214" y="180" width="12" height="12" rx="2"/><rect x="228" y="180" width="12" height="12" rx="2"/><rect x="242" y="180" width="12" height="12" rx="2"/><rect x="256" y="180" width="12" height="12" rx="2"/><rect x="270" y="180" width="12" height="12" rx="2"/><rect x="284" y="180" width="12" height="12" rx="2"/><rect x="298" y="180" width="12" height="12" rx="2"/><rect x="312" y="180" width="12" height="12" rx="2"/>
    </g>
    <text x="40" y="214" font-size="11" fill="#97A59F">one cell: one KV head, head_dim 128 × 2 bytes (fp16)</text>
    <text x="40" y="240" font-size="11.5" fill="#7ADACF">per token = 2 × 32 × 8 × 128 × 2</text>
    <text x="40" y="257" font-size="11.5" fill="#7ADACF">= 131,072 bytes = 128 KiB</text>

    <text x="40" y="290" font-size="11">Llama 3 8B (GQA: 8 KV heads): 128 KiB</text>
    <rect x="40" y="298" width="40" height="18" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="40" y="340" font-size="11">Llama 2 13B (full MHA: 40 layers, 40 KV heads): 800 KiB</text>
    <rect x="40" y="348" width="250" height="18" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="40" y="386" font-size="11" fill="#97A59F">six times larger per token,</text>
    <text x="40" y="401" font-size="11" fill="#97A59F">for a model only 1.6× bigger (§6: GQA)</text>

    <!-- right: the cache against the weights -->
    <rect x="370" y="40" width="486" height="374" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="386" y="60" fill="#97A59F">the cache grows with seq_len and batch; the weights do not</text>
    <!-- 9.25 px per GiB -->
    <text x="386" y="86" font-size="11.5">weights, fixed</text>
    <text x="386" y="101" font-size="11" fill="#97A59F">~16 GB (15 GiB) in fp16</text>
    <rect x="546" y="76" width="139" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="693" y="94" font-size="11" fill="#97A59F">15 GiB</text>

    <text x="386" y="142" font-size="11.5">1 user, 8K context</text>
    <text x="386" y="157" font-size="11" fill="#97A59F">8,192 tokens × 128 KiB</text>
    <rect x="546" y="132" width="9" height="28" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="563" y="150" font-size="11" fill="#7ADACF">1 GiB (1.07 GB)</text>

    <text x="386" y="198" font-size="11.5">1 user, 128K context</text>
    <text x="386" y="213" font-size="11" fill="#97A59F">131,072 tokens</text>
    <rect x="546" y="188" width="148" height="28" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="702" y="206" font-size="11" fill="#7ADACF">16 GiB (17.2 GB)</text>

    <text x="386" y="254" font-size="11.5">32 users, 8K context each</text>
    <text x="386" y="269" font-size="11" fill="#97A59F">more than the model itself</text>
    <rect x="546" y="244" width="296" height="28" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="834" y="262" text-anchor="end" font-size="11" fill="#7ADACF">32 GiB (34.4 GB)</text>

    <text x="386" y="310" font-size="11.5">An 80 GB H100 has ~64 GB left after the weights:</text>
    <text x="386" y="326" font-size="11.5">at most 59 sessions of 8K tokens with an fp16 cache,</text>
    <text x="386" y="342" font-size="11.5">or 119 with an fp8 cache (an upper bound).</text>
    <text x="386" y="372" font-size="11" fill="#97A59F">At 128K context, decode reads ~16 GB of weights plus ~17 GB of cache</text>
    <text x="386" y="387" font-size="11" fill="#97A59F">per token: roughly half the tokens per second of a short context.</text>
    <text x="386" y="406" font-size="11" fill="#97A59F"><tspan font-family="JetBrains Mono, monospace" font-size="10.5">kerncore.kv.kv_cache_bytes</tspan>, <tspan font-family="JetBrains Mono, monospace" font-size="10.5">sessions_per_gpu</tspan></text>
  </g>
</svg>
