<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="One token of Llama 3 8B keeps 128 KiB of K and V across 32 layers of 8 KV heads, and Llama 2 13B keeps 800 KiB." style="color: #E4EAE7">
  <title>One token of Llama 3 8B keeps 128 KiB of K and V across 32 layers of 8 KV heads, and Llama 2 13B keeps 800 KiB.</title>
  <rect x="0" y="0" width="720" height="350" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">KV bytes = 2 × layers × kv_heads × head_dim × seq_len × batch × bytes_per_value (§4)</text>

    <rect x="24" y="40" width="672" height="294" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">Llama 3 8B, fp16, per token: seq_len = 1, batch = 1</text>
    <text x="40" y="76" font-size="11">32 layers, each with a K row and a V row of 8 KV heads</text>
    <g font-size="11" fill="#97A59F">
      <text x="40" y="108">layer 1</text><text x="40" y="128">layer 2</text><text x="40" y="148">layer 3</text><text x="40" y="190">layer 32</text>
      <text x="96" y="93">K</text><text x="216" y="93">V</text>
    </g>
    <text x="68" y="170" font-size="14" fill="#97A59F">⋮</text>
    <g fill="#16302A" stroke="#4CC5B7" stroke-width="1">
      <rect x="94" y="98" width="12" height="12" rx="2"/><rect x="108" y="98" width="12" height="12" rx="2"/><rect x="122" y="98" width="12" height="12" rx="2"/><rect x="136" y="98" width="12" height="12" rx="2"/><rect x="150" y="98" width="12" height="12" rx="2"/><rect x="164" y="98" width="12" height="12" rx="2"/><rect x="178" y="98" width="12" height="12" rx="2"/><rect x="192" y="98" width="12" height="12" rx="2"/>
      <rect x="94" y="118" width="12" height="12" rx="2"/><rect x="108" y="118" width="12" height="12" rx="2"/><rect x="122" y="118" width="12" height="12" rx="2"/><rect x="136" y="118" width="12" height="12" rx="2"/><rect x="150" y="118" width="12" height="12" rx="2"/><rect x="164" y="118" width="12" height="12" rx="2"/><rect x="178" y="118" width="12" height="12" rx="2"/><rect x="192" y="118" width="12" height="12" rx="2"/>
      <rect x="94" y="138" width="12" height="12" rx="2"/><rect x="108" y="138" width="12" height="12" rx="2"/><rect x="122" y="138" width="12" height="12" rx="2"/><rect x="136" y="138" width="12" height="12" rx="2"/><rect x="150" y="138" width="12" height="12" rx="2"/><rect x="164" y="138" width="12" height="12" rx="2"/><rect x="178" y="138" width="12" height="12" rx="2"/><rect x="192" y="138" width="12" height="12" rx="2"/>
      <rect x="94" y="180" width="12" height="12" rx="2"/><rect x="108" y="180" width="12" height="12" rx="2"/><rect x="122" y="180" width="12" height="12" rx="2"/><rect x="136" y="180" width="12" height="12" rx="2"/><rect x="150" y="180" width="12" height="12" rx="2"/><rect x="164" y="180" width="12" height="12" rx="2"/><rect x="178" y="180" width="12" height="12" rx="2"/><rect x="192" y="180" width="12" height="12" rx="2"/>
    </g>
    <g fill="#16302A" stroke="#4CC5B7" stroke-width="1">
      <rect x="214" y="98" width="12" height="12" rx="2"/><rect x="228" y="98" width="12" height="12" rx="2"/><rect x="242" y="98" width="12" height="12" rx="2"/><rect x="256" y="98" width="12" height="12" rx="2"/><rect x="270" y="98" width="12" height="12" rx="2"/><rect x="284" y="98" width="12" height="12" rx="2"/><rect x="298" y="98" width="12" height="12" rx="2"/><rect x="312" y="98" width="12" height="12" rx="2"/>
      <rect x="214" y="118" width="12" height="12" rx="2"/><rect x="228" y="118" width="12" height="12" rx="2"/><rect x="242" y="118" width="12" height="12" rx="2"/><rect x="256" y="118" width="12" height="12" rx="2"/><rect x="270" y="118" width="12" height="12" rx="2"/><rect x="284" y="118" width="12" height="12" rx="2"/><rect x="298" y="118" width="12" height="12" rx="2"/><rect x="312" y="118" width="12" height="12" rx="2"/>
      <rect x="214" y="138" width="12" height="12" rx="2"/><rect x="228" y="138" width="12" height="12" rx="2"/><rect x="242" y="138" width="12" height="12" rx="2"/><rect x="256" y="138" width="12" height="12" rx="2"/><rect x="270" y="138" width="12" height="12" rx="2"/><rect x="284" y="138" width="12" height="12" rx="2"/><rect x="298" y="138" width="12" height="12" rx="2"/><rect x="312" y="138" width="12" height="12" rx="2"/>
      <rect x="214" y="180" width="12" height="12" rx="2"/><rect x="228" y="180" width="12" height="12" rx="2"/><rect x="242" y="180" width="12" height="12" rx="2"/><rect x="256" y="180" width="12" height="12" rx="2"/><rect x="270" y="180" width="12" height="12" rx="2"/><rect x="284" y="180" width="12" height="12" rx="2"/><rect x="298" y="180" width="12" height="12" rx="2"/><rect x="312" y="180" width="12" height="12" rx="2"/>
    </g>

    <text x="372" y="112" font-size="11" fill="#97A59F">one cell: one KV head, head_dim 128 × 2 bytes (fp16)</text>
    <text x="372" y="146" font-size="12.5" fill="#7ADACF">per token = 2 × 32 × 8 × 128 × 2</text>
    <text x="372" y="166" font-size="12.5" fill="#7ADACF">= 131,072 bytes = 128 KiB</text>

    <text x="40" y="232" font-size="11">Llama 3 8B (GQA: 8 KV heads): 128 KiB</text>
    <rect x="40" y="240" width="56" height="18" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="40" y="286" font-size="11">Llama 2 13B (full MHA: 40 layers, 40 KV heads): 800 KiB</text>
    <rect x="40" y="294" width="350" height="18" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="410" y="300" font-size="11" fill="#97A59F">six times larger per token,</text>
    <text x="410" y="315" font-size="11" fill="#97A59F">for a model only 1.6× bigger (§6: GQA)</text>
  </g>
</svg>
