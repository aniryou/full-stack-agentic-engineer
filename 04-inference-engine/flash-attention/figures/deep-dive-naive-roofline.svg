<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Naive attention at 62.1 FLOP/B sits below the ridge of the H100 (295) and the L4 (403), and the compulsory traffic of a fused schedule at 2,040 FLOP/B is past both." style="color: #E4EAE7">
  <title>Naive attention at 62.1 FLOP/B sits below the ridge of the H100 (295) and the L4 (403), and the compulsory traffic of a fused schedule at 2,040 FLOP/B is past both.</title>
  <rect x="0" y="0" width="880" height="420" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" fill="#97A59F">One head, d = 128, bf16, N = 4,096 · attainable = min(peak, HBM bandwidth × intensity)</text>
    <text x="24" y="46" fill="#97A59F" font-family="JetBrains Mono, monospace" font-size="11">fa_calculators.roofline()</text>
    <path d="M70.0 60 L70.0 350" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M260.0 60 L260.0 350" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M450.0 60 L450.0 350" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M640.0 60 L640.0 350" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M830.0 60 L830.0 350" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M70 350.0 L830 350.0" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M70 235.0 L830 235.0" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M70 120.0 L830 120.0" fill="none" stroke="#2A3634" stroke-width="0.6"/>
    <path d="M70 350 L830 350" fill="none" stroke="#97A59F" stroke-width="1"/>
    <path d="M70 350 L70 60" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="70.0" y="368" text-anchor="middle" font-size="11" fill="#97A59F">1</text>
    <text x="260.0" y="368" text-anchor="middle" font-size="11" fill="#97A59F">10</text>
    <text x="450.0" y="368" text-anchor="middle" font-size="11" fill="#97A59F">100</text>
    <text x="640.0" y="368" text-anchor="middle" font-size="11" fill="#97A59F">1,000</text>
    <text x="830.0" y="368" text-anchor="middle" font-size="11" fill="#97A59F">10,000</text>
    <text x="62" y="354.0" text-anchor="end" font-size="11" fill="#97A59F">10</text>
    <text x="62" y="239.0" text-anchor="end" font-size="11" fill="#97A59F">100</text>
    <text x="62" y="124.0" text-anchor="end" font-size="11" fill="#97A59F">1,000</text>
    <text x="450" y="392" text-anchor="middle" font-size="11" fill="#97A59F">arithmetic intensity, FLOP/B (log scale)</text>
    <text x="22" y="205" text-anchor="middle" font-size="11" fill="#97A59F" transform="rotate(-90 22 205)">attainable TFLOP/s (log scale)</text>
    <path d="M160.2 350 L539.3 120.5 L830 120.5" fill="none" stroke="#E4EAE7" stroke-width="1.6"/>
    <path d="M359.3 350 L565.0 225.5 L830 225.5" fill="none" stroke="#97A59F" stroke-width="1.6"/>
    <text x="826" y="109" text-anchor="end" font-size="11">H100 SXM: 989.4 TFLOP/s, 3.35 TB/s</text>
    <text x="826" y="214" text-anchor="end" font-size="11" fill="#97A59F">L4: 121 TFLOP/s, 0.30 TB/s</text>
    <text x="545.3" y="137" font-size="11" fill="#97A59F">ridge 295</text>
    <text x="571.0" y="242" font-size="11" fill="#97A59F">ridge 403</text>
    <path d="M410.7 350 L410.7 198.4" fill="none" stroke="#E39A62" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="410.7" cy="198.4" r="5" fill="#3A2C25" stroke="#E39A62" stroke-width="1.6"/>
    <circle cx="410.7" cy="319.0" r="5" fill="#3A2C25" stroke="#E39A62" stroke-width="1.6"/>
    <text x="396.7" y="190" text-anchor="end" font-size="11" fill="#E39A62">naive, three kernels: 62.1 FLOP/B</text>
    <text x="396.7" y="205" text-anchor="end" font-size="11" fill="#E39A62">S and P go through HBM: 138.4 MB</text>
    <text x="420.7" y="216" font-size="11" fill="#E39A62">H100: 208 TFLOP/s (21% of peak)</text>
    <text x="420.7" y="336" font-size="11" fill="#E39A62">L4: 18.6 TFLOP/s (15% of peak)</text>
    <path d="M698.8 350 L698.8 120.5" fill="none" stroke="#4CC5B7" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="698.8" cy="120.5" r="5" fill="#16302A" stroke="#4CC5B7" stroke-width="1.6"/>
    <circle cx="698.8" cy="225.5" r="5" fill="#16302A" stroke="#4CC5B7" stroke-width="1.6"/>
    <text x="690.8" y="268" text-anchor="end" font-size="11" fill="#7ADACF">fused: Q, K, V read once, O written once</text>
    <text x="690.8" y="283" text-anchor="end" font-size="11" fill="#7ADACF">4.2 MB, 2,040 FLOP/B: compute-bound</text>
    <text x="690.8" y="298" text-anchor="end" font-size="11" fill="#7ADACF">8.7 µs (H100), 71 µs (L4)</text>
  </g>
</svg>
