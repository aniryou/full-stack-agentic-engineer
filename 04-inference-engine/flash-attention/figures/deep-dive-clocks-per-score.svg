<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" role="img" aria-label="Clocks per score per SM when each unit runs alone, d = 128: the tensor-core bar halves from A100 to H100 to B200 while the EX2 bar stays at 0.0625." style="color: #E4EAE7">
  <title>Clocks per score per SM when each unit runs alone, d = 128: the tensor-core bar halves from A100 to H100 to B200 while the EX2 bar stays at 0.0625.</title>
  <rect x="0" y="0" width="880" height="356" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" fill="#97A59F">Clocks per score per SM when each unit runs alone, d = 128: 512 MMA FLOPs, one EX2, ≈ 5 FP32 instructions (§4.3)</text>
    <text x="24" y="46" fill="#97A59F" font-family="JetBrains Mono, monospace" font-size="11">fa_calculators.clocks_per_score()</text>
    <text x="24" y="84" font-weight="600">A100</text>
    <text x="166" y="83" text-anchor="end" font-size="11" fill="#97A59F">tensor cores</text>
    <rect x="176" y="70" width="480" height="18" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="664" y="83" font-size="11" fill="#7ADACF">0.25</text>
    <text x="166" y="107" text-anchor="end" font-size="11" fill="#97A59F">EX2 on MUFU</text>
    <rect x="176" y="94" width="120" height="18" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="304" y="107" font-size="11" fill="#E39A62">0.0625 (25% of MMA time)</text>
    <text x="166" y="131" text-anchor="end" font-size="11" fill="#97A59F">≈ 5 FP32 instr.</text>
    <rect x="176" y="118" width="150" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="334" y="131" font-size="11" fill="#97A59F">0.078 (31%)</text>
    <text x="24" y="174" font-weight="600">H100</text>
    <text x="166" y="173" text-anchor="end" font-size="11" fill="#97A59F">tensor cores</text>
    <rect x="176" y="160" width="240" height="18" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="424" y="173" font-size="11" fill="#7ADACF">0.125</text>
    <text x="166" y="197" text-anchor="end" font-size="11" fill="#97A59F">EX2 on MUFU</text>
    <rect x="176" y="184" width="120" height="18" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="304" y="197" font-size="11" fill="#E39A62">0.0625 (50%)</text>
    <text x="166" y="221" text-anchor="end" font-size="11" fill="#97A59F">≈ 5 FP32 instr.</text>
    <rect x="176" y="208" width="75" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="259" y="221" font-size="11" fill="#97A59F">0.039 (31%)</text>
    <text x="24" y="264" font-weight="600">B200</text>
    <text x="166" y="263" text-anchor="end" font-size="11" fill="#97A59F">tensor cores</text>
    <rect x="176" y="250" width="120" height="18" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="304" y="263" font-size="11" fill="#7ADACF">0.0625</text>
    <text x="166" y="287" text-anchor="end" font-size="11" fill="#97A59F">EX2 on MUFU</text>
    <rect x="176" y="274" width="120" height="18" rx="3" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="304" y="287" font-size="11" fill="#E39A62">0.0625 (100%)</text>
    <text x="166" y="311" text-anchor="end" font-size="11" fill="#97A59F">≈ 5 FP32 instr.</text>
    <rect x="176" y="298" width="75" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="259" y="311" font-size="11" fill="#97A59F">0.039 (62.5%)</text>
    <path d="M176 60 L176 330" fill="none" stroke="#2A3634" stroke-width="0.8"/>
    <text x="24" y="350" font-size="11.5" fill="#97A59F">16 MUFU instructions per SM per clock on all three, against 2,048, 4,096 and ≈ 8,192 dense bf16 tensor-core FLOPs</text>
  </g>
</svg>
