<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img" aria-label="The Triton forward launches one program per Q block and (batch, head) pair; each program loads its Q block once, walks the K/V tiles up to hi, and stores one O block and one LSE row." style="color: #E4EAE7">
  <title>The Triton forward launches one program per Q block and (batch, head) pair; each program loads its Q block once, walks the K/V tiles up to hi, and stores one O block and one LSE row.</title>
  <rect x="0" y="0" width="900" height="416" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" fill="#97A59F" font-family="JetBrains Mono, monospace" font-size="11">grid = (triton.cdiv(N, block_m), B·H): one program instance per cell (§11.1)</text>
    <rect x="24" y="50" width="300" height="318" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="174" y="70" text-anchor="middle" fill="#97A59F">the program grid</text>
    <text x="190" y="90" text-anchor="middle" font-size="10.5" fill="#97A59F" font-family="JetBrains Mono, monospace">pid_bh = tl.program_id(1): (batch, head)</text>
    <path d="M100 100 L300 100" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="44" y="230" text-anchor="middle" fill="#97A59F" font-family="JetBrains Mono, monospace" font-size="11" transform="rotate(-90 44 230)">pid_m = tl.program_id(0): Q block</text>
    <path d="M54 110 L54 330" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="76" y="112" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="132" y="112" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="188" y="112" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="244" y="112" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="76" y="156" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="132" y="156" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="188" y="156" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="244" y="156" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="76" y="200" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="132" y="200" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="188" y="200" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="244" y="200" width="50" height="38" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1"/>
    <rect x="76" y="244" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="132" y="244" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="188" y="244" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="244" y="244" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="76" y="288" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="132" y="288" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="188" y="288" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <rect x="244" y="288" width="50" height="38" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="269" y="216" text-anchor="middle" font-size="10.5" fill="#7ADACF">this</text>
    <text x="269" y="230" text-anchor="middle" font-size="10.5" fill="#7ADACF">program</text>
    <text x="174" y="356" text-anchor="middle" font-size="11" fill="#97A59F">BLOCK_M rows of Q each</text>
    <path d="M296 219 L340 219 L340 100 L358 100" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="360" y="50" width="516" height="318" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="618" y="70" text-anchor="middle" fill="#97A59F">one program: pid_m, pid_bh</text>
    <rect x="380" y="82" width="476" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="618" y="98" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, monospace">q = tl.load(Q block) once: BLOCK_M × D, rows past N_CTX masked to 0</text>
    <text x="618" y="114" text-anchor="middle" font-size="11" fill="#97A59F">stays on chip for the whole loop</text>
    <rect x="380" y="134" width="476" height="40" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="618" y="150" text-anchor="middle" font-size="10.5" fill="#7ADACF" font-family="JetBrains Mono, monospace">m_i = −inf, l_i = 0, acc = 0: BLOCK_M rows in fp32</text>
    <text x="618" y="166" text-anchor="middle" font-size="11" fill="#7ADACF">the identity state (m, l, o) of §2.3</text>
    <rect x="380" y="186" width="476" height="118" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="396" y="204" font-size="10.5" font-family="JetBrains Mono, monospace">for start_n in range(0, hi, BLOCK_N):</text>
    <text x="396" y="220" font-size="10.5" fill="#97A59F" font-family="JetBrains Mono, monospace">hi = N_CTX, or min((pid_m + 1)·BLOCK_M, N_CTX) if CAUSAL</text>
    <text x="396" y="240" font-size="10.5" font-family="JetBrains Mono, monospace">K tile: s = tl.dot(q, kt)·qk_scale, then tl.where(valid, s, −inf)</text>
    <text x="396" y="256" font-size="10.5" font-family="JetBrains Mono, monospace">m_new = max(m_i, rowmax s) · alpha = exp2(m_i − m_new)</text>
    <text x="396" y="272" font-size="10.5" font-family="JetBrains Mono, monospace">p = exp2(s − m_new) · l_i = l_i·alpha + rowsum p</text>
    <text x="396" y="288" font-size="10.5" font-family="JetBrains Mono, monospace">V tile: acc = acc·alpha + tl.dot(p.to(v.dtype), v) · m_i = m_new</text>
    <rect x="380" y="316" width="476" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="618" y="332" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, monospace">store acc / l_i → O block · m_i + log2(l_i) → LSE row (base 2)</text>
    <text x="618" y="348" text-anchor="middle" font-size="11" fill="#97A59F">normalized once, written once</text>
    <path d="M618 122 L618 132" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M618 174 L618 184" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M618 304 L618 314" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="24" y="396" font-size="11" fill="#97A59F">defaults: block_m = 128, block_n = 64, num_warps = 4, num_stages = 2 · the valid mask covers the ragged tail and, with CAUSAL, the diagonal tile</text>
  </g>
</svg>
