<svg xmlns="http://www.w3.org/2000/svg" width="880" height="464" viewBox="0 0 880 464" role="img" aria-label="One step with structured output: EngineCore fills the grammar bitmask on the CPU while the GPU runs the forward, the worker applies the bitmask to the logits before sampling, and a row of the bitmask is 4,008 int32 words." style="color: #E4EAE7">
  <title>One step with structured output: EngineCore fills the grammar bitmask on the CPU while the GPU runs the forward, the worker applies the bitmask to the logits before sampling, and a row of the bitmask is 4,008 int32 words.</title>
  <rect x="0" y="0" width="880" height="464" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" fill="#97A59F">StructuredOutputManager lives in EngineCore. One step, in time, and the shape of the mask it sends to the worker.</text>

    <!-- before the first step -->
    <rect x="24" y="42" width="832" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="440" y="62" text-anchor="middle" font-weight="600">before the first step: compile</text>
    <text x="440" y="80" text-anchor="middle" font-size="11" fill="#97A59F">preprocess_add_request calls grammar_init. A thread pool compiles the grammar.</text>
    <text x="440" y="96" text-anchor="middle" font-size="11" fill="#97A59F">The request waits in <tspan font-family="JetBrains Mono, monospace" font-size="10.5">WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR</tspan>, and the scheduler skips it.</text>

    <!-- lane 1: EngineCore -->
    <text x="24" y="128" font-size="11" fill="#97A59F">EngineCore, on the CPU</text>
    <rect x="24" y="134" width="110" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="79" y="156" text-anchor="middle" font-size="11.5">schedule()</text>
    <rect x="144" y="134" width="270" height="36" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="279" y="150" text-anchor="middle" font-weight="600">get_grammar_bitmask</text>
    <text x="279" y="164" text-anchor="middle" font-size="10.5" fill="#7ADACF">fills the packed int32 bitmask</text>
    <rect x="684" y="134" width="172" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="770" y="150" text-anchor="middle" font-size="11">update_from_output</text>
    <text x="770" y="164" text-anchor="middle" font-size="10.5" fill="#97A59F">accept_tokens</text>

    <!-- lane 2: GPU worker -->
    <text x="24" y="188" font-size="11" fill="#97A59F">GPU worker</text>
    <rect x="144" y="194" width="270" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="279" y="216" text-anchor="middle" font-size="11.5">execute_model: the forward</text>
    <rect x="424" y="194" width="250" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="549" y="210" text-anchor="middle" font-size="11">sample_tokens: logits,</text>
    <text x="549" y="224" text-anchor="middle" font-size="10.5" fill="#97A59F">apply_grammar_bitmask, sampler</text>

    <path d="M380 170 L450 194" stroke="#4CC5B7" stroke-width="1.2" fill="none" marker-end="url(#arrA)"/>
    <text x="462" y="186" font-size="10.5" fill="#7ADACF">grammar_output</text>
    <path d="M660 194 L700 170" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="712" y="188" font-size="10.5" fill="#97A59F">ModelRunnerOutput</text>
    <path d="M24 246 L856 246" stroke="#97A59F" stroke-width="1" fill="none" marker-end="url(#arr)"/>
    <text x="24" y="262" font-size="10.5" fill="#97A59F">time, one step. The fill of the bitmask and the forward overlap (EngineCore.step).</text>

    <!-- the mask -->
    <text x="24" y="290" font-size="11" fill="#97A59F">the bitmask: a row for each structured request and for each speculative position, one bit per vocabulary entry</text>
    <text x="24" y="318" font-size="11" fill="#97A59F">row 0</text>
    <g fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="80" y="300" width="52" height="26" rx="4"/><rect x="132" y="300" width="52" height="26" rx="4"/><rect x="184" y="300" width="52" height="26" rx="4"/>
      <rect x="236" y="300" width="52" height="26" rx="4"/><rect x="288" y="300" width="52" height="26" rx="4"/><rect x="340" y="300" width="52" height="26" rx="4"/>
      <rect x="392" y="300" width="52" height="26" rx="4"/><rect x="444" y="300" width="52" height="26" rx="4"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="10.5" text-anchor="middle">
      <text x="106" y="317">0</text><text x="158" y="317">1</text><text x="210" y="317">2</text><text x="262" y="317">3</text>
      <text x="314" y="317">4</text><text x="366" y="317">…</text><text x="418" y="317">4,006</text><text x="470" y="317">4,007</text>
    </g>
    <text x="512" y="317" font-size="11" fill="#97A59F">int32 words: ceil(128256 / 32) = 4,008, that is 16,032 B per row</text>
    <text x="24" y="354" font-size="11" fill="#97A59F">row 1</text>
    <g fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="4 3">
      <rect x="80" y="336" width="52" height="26" rx="4"/><rect x="132" y="336" width="52" height="26" rx="4"/><rect x="184" y="336" width="52" height="26" rx="4"/>
      <rect x="236" y="336" width="52" height="26" rx="4"/><rect x="288" y="336" width="52" height="26" rx="4"/><rect x="340" y="336" width="52" height="26" rx="4"/>
      <rect x="392" y="336" width="52" height="26" rx="4"/><rect x="444" y="336" width="52" height="26" rx="4"/>
    </g>
    <text x="512" y="353" font-size="11" fill="#97A59F">256 rows are 4.1 MB, and 1,024 rows are 16.4 MB</text>
    <text x="24" y="384" font-size="11" fill="#97A59F">…</text>

    <rect x="512" y="368" width="344" height="44" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="684" y="386" text-anchor="middle" font-size="11" font-weight="600">the shared-memory chunk of the executor: 24 MiB</text>
    <text x="684" y="402" text-anchor="middle" font-size="10.5" fill="#97A59F">large enough for the bitmask of a 1,024-request batch (5.1)</text>

    <text x="24" y="434" font-size="11" fill="#97A59F">advance: update_from_output calls accept_tokens. validate_tokens validates the drafts in advance, and an invalid draft</text>
    <text x="24" y="450" font-size="11" fill="#97A59F">becomes −1, which the rejection sampler always rejects. The backend (xgrammar, guidance, outlines, lm-format-enforcer) is one per engine.</text>
  </g>
</svg>
