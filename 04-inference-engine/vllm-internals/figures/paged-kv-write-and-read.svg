<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="One attention layer in one step: the slot mapping sends the K and V of position 42 to slot 202 in block 12 of the paged KV tensor, and one varlen call reads the whole mixed batch through the block tables." style="color: #E4EAE7">
  <title>One attention layer in one step: the slot mapping sends the K and V of position 42 to slot 202 in block 12 of the paged KV tensor, and one varlen call reads the whole mixed batch through the block tables.</title>
  <rect x="0" y="0" width="880" height="400" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" fill="#97A59F">One layer, one step: (1) write the K and V of each scheduled token to its slot, then (2) read with one varlen call for the whole batch</text>

    <!-- slot mapping of request 2 -->
    <rect x="24" y="56" width="276" height="170" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="162" y="78" text-anchor="middle" font-weight="600">block table of request 2: [7, 3, 12]</text>
    <g font-size="10.5" fill="#97A59F" text-anchor="middle">
      <text x="102" y="94">index 0</text><text x="162" y="94">1</text><text x="222" y="94">2</text>
    </g>
    <rect x="76" y="98" width="52" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="136" y="98" width="52" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="196" y="98" width="52" height="26" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <g font-family="JetBrains Mono, monospace" font-size="11.5" text-anchor="middle">
      <text x="102" y="116">7</text><text x="162" y="116">3</text><text x="222" y="116" fill="#7ADACF">12</text>
    </g>
    <text x="162" y="144" text-anchor="middle" font-size="11" fill="#97A59F">position 42: 42 // 16 = 2, so block 12,</text>
    <text x="162" y="160" text-anchor="middle" font-size="11" fill="#97A59F">and the offset is 42 % 16 = 10</text>
    <text x="162" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7ADACF">slot = 12 × 16 + 10 = 202</text>
    <text x="162" y="198" text-anchor="middle" font-size="10.5" fill="#97A59F">BlockTables.compute_slot_mappings, a Triton kernel</text>
    <text x="162" y="214" text-anchor="middle" font-size="10.5" fill="#97A59F">the tail is padded with PAD_SLOT_ID</text>

    <!-- the KV tensor of one layer -->
    <rect x="330" y="56" width="526" height="200" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="346" y="74" font-size="11" fill="#97A59F">kv_cache of one layer: [num_blocks, num_kv_heads, block_size, 2 × head_size]</text>
    <g font-size="9.5" fill="#97A59F" text-anchor="middle">
      <text x="423" y="90">offset 0</text><text x="683" y="90">10</text><text x="813" y="90">15</text>
    </g>
    <!-- block 3 -->
    <text x="400" y="112" text-anchor="end" font-size="11" fill="#97A59F">block 3</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="410" y="96" width="26" height="24"/><rect x="436" y="96" width="26" height="24"/><rect x="462" y="96" width="26" height="24"/><rect x="488" y="96" width="26" height="24"/>
      <rect x="514" y="96" width="26" height="24"/><rect x="540" y="96" width="26" height="24"/><rect x="566" y="96" width="26" height="24"/><rect x="592" y="96" width="26" height="24"/>
      <rect x="618" y="96" width="26" height="24"/><rect x="644" y="96" width="26" height="24"/><rect x="670" y="96" width="26" height="24"/><rect x="696" y="96" width="26" height="24"/>
      <rect x="722" y="96" width="26" height="24"/><rect x="748" y="96" width="26" height="24"/><rect x="774" y="96" width="26" height="24"/><rect x="800" y="96" width="26" height="24"/>
    </g>
    <!-- block 7 -->
    <text x="400" y="148" text-anchor="end" font-size="11" fill="#97A59F">block 7</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="410" y="132" width="26" height="24"/><rect x="436" y="132" width="26" height="24"/><rect x="462" y="132" width="26" height="24"/><rect x="488" y="132" width="26" height="24"/>
      <rect x="514" y="132" width="26" height="24"/><rect x="540" y="132" width="26" height="24"/><rect x="566" y="132" width="26" height="24"/><rect x="592" y="132" width="26" height="24"/>
      <rect x="618" y="132" width="26" height="24"/><rect x="644" y="132" width="26" height="24"/><rect x="670" y="132" width="26" height="24"/><rect x="696" y="132" width="26" height="24"/>
      <rect x="722" y="132" width="26" height="24"/><rect x="748" y="132" width="26" height="24"/><rect x="774" y="132" width="26" height="24"/><rect x="800" y="132" width="26" height="24"/>
    </g>
    <!-- block 12 -->
    <text x="400" y="184" text-anchor="end" font-size="11" fill="#97A59F">block 12</text>
    <g fill="none" stroke="currentColor" stroke-width="1">
      <rect x="410" y="168" width="26" height="24"/><rect x="436" y="168" width="26" height="24"/><rect x="462" y="168" width="26" height="24"/><rect x="488" y="168" width="26" height="24"/>
      <rect x="514" y="168" width="26" height="24"/><rect x="540" y="168" width="26" height="24"/><rect x="566" y="168" width="26" height="24"/><rect x="592" y="168" width="26" height="24"/>
      <rect x="618" y="168" width="26" height="24"/><rect x="644" y="168" width="26" height="24"/><rect x="696" y="168" width="26" height="24"/>
      <rect x="722" y="168" width="26" height="24"/><rect x="748" y="168" width="26" height="24"/><rect x="774" y="168" width="26" height="24"/><rect x="800" y="168" width="26" height="24"/>
    </g>
    <rect x="670" y="168" width="26" height="24" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="683" y="184" text-anchor="middle" font-size="9.5" fill="#7ADACF">K V</text>
    <text x="410" y="214" font-size="11" fill="#97A59F">16 slots per block, per KV head</text>
    <text x="840" y="238" text-anchor="end" font-size="11" fill="#7ADACF">slot_mapping[i] = 202: reshape_and_cache_flash writes the K and V of position 42 here</text>
    <path d="M683 224 L683 194" stroke="#4CC5B7" stroke-width="1.2" fill="none" marker-end="url(#arrA)"/>

    <!-- the read -->
    <rect x="330" y="272" width="526" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="593" y="292" text-anchor="middle" font-weight="600">read: one flash_attn_varlen_func call for the whole mixed batch</text>
    <text x="593" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5">(q, key_cache, value_cache, cu_seqlens_q=query_start_loc,</text>
    <text x="593" y="326" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5">seqused_k=seq_lens, block_table=..., causal=True, ...)</text>
    <text x="593" y="343" text-anchor="middle" font-size="10.5" fill="#97A59F">prefill rows and decode rows share the launch. The kernel goes through the block table of each row.</text>
    <path d="M440 270 L440 258" stroke="#97A59F" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M300 112 L328 112" stroke="#97A59F" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="314" y="104" text-anchor="middle" font-size="9.5" fill="#97A59F">ids</text>

    <text x="24" y="372" font-size="11" fill="#97A59F">The last dimension holds K and V together: kv_cache.transpose(1, 2).split(head_size, dim=-1) divides them (FlashAttentionImpl.forward).</text>
    <text x="24" y="388" font-size="11" fill="#97A59F">num_common_prefix_blocks: when every RUNNING request shares a prefix, cascade attention computes that prefix one time.</text>
  </g>
</svg>
