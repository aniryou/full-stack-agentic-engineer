<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="The two kernel families: a weight-only W4A16 kernel reads a quarter of the weight bytes and dequantizes in registers but does the BF16 math, and a W8A8 FP8 kernel also quantizes the activations and runs FP8 MMA at twice the BF16 rate." style="color: #E4EAE7">
  <title>The two kernel families: a weight-only W4A16 kernel reads a quarter of the weight bytes and dequantizes in registers but does the BF16 math, and a W8A8 FP8 kernel also quantizes the activations and runs FP8 MMA at twice the BF16 rate.</title>
  <rect x="0" y="0" width="900" height="372" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- lane A: W4A16 -->
    <rect x="20" y="24" width="860" height="150" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="32" y="42" font-size="11" fill="#97A59F">weight-only W4A16, for example Marlin (choose_mp_linear_kernel)</text>

    <rect x="32" y="54" width="200" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="132" y="74" text-anchor="middle" font-weight="600">checkpoint and load</text>
    <text x="132" y="91" text-anchor="middle" font-size="10.5" fill="#97A59F">int32-packed 4-bit weights,</text>
    <text x="132" y="105" text-anchor="middle" font-size="10.5" fill="#97A59F">per-group FP16 scales.</text>
    <text x="132" y="121" text-anchor="middle" font-size="10.5" fill="#97A59F">process_weights_after_loading:</text>
    <text x="132" y="135" text-anchor="middle" font-size="10.5" fill="#97A59F">gptq_marlin_repack,</text>
    <text x="132" y="149" text-anchor="middle" font-size="10.5" fill="#97A59F">marlin_permute_scales</text>

    <rect x="244" y="54" width="200" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="344" y="74" text-anchor="middle" font-weight="600">read from HBM</text>
    <text x="344" y="91" text-anchor="middle" font-size="10.5" fill="#97A59F">the packed 4-bit weights and</text>
    <text x="344" y="105" text-anchor="middle" font-size="10.5" fill="#97A59F">their per-group FP16 scales:</text>
    <text x="344" y="121" text-anchor="middle" font-size="10.5" fill="#97A59F">a quarter of the weight bytes</text>
    <text x="344" y="135" text-anchor="middle" font-size="10.5" fill="#97A59F">(4.16 bits per weight)</text>

    <rect x="456" y="54" width="200" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="556" y="74" text-anchor="middle" font-weight="600">dequantize in registers</text>
    <text x="556" y="91" text-anchor="middle" font-size="10.5" fill="#97A59F">to FP16/BF16, before the MMA.</text>
    <text x="556" y="105" text-anchor="middle" font-size="10.5" fill="#97A59F">The activations stay 16-bit.</text>
    <text x="556" y="121" text-anchor="middle" font-size="10.5" fill="#97A59F">The dequantization</text>
    <text x="556" y="135" text-anchor="middle" font-size="10.5" fill="#97A59F">adds real cost.</text>

    <rect x="668" y="54" width="200" height="104" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="768" y="74" text-anchor="middle" font-weight="600">16-bit tensor-core MMA</text>
    <text x="768" y="91" text-anchor="middle" font-size="10.5" fill="#97A59F">FP32 accumulation.</text>
    <text x="768" y="105" text-anchor="middle" font-size="10.5" fill="#97A59F">Exactly the BF16 math, so the</text>
    <text x="768" y="121" text-anchor="middle" font-size="10.5" fill="#97A59F">step is compute-bound past</text>
    <text x="768" y="135" text-anchor="middle" font-size="10.5" fill="#97A59F">about 120 tokens on an L4</text>
    <text x="768" y="149" text-anchor="middle" font-size="10.5" fill="#97A59F">(85 on an H100)</text>

    <!-- lane B: W8A8 FP8 -->
    <rect x="20" y="190" width="860" height="150" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="32" y="208" font-size="11" fill="#97A59F">W8A8 FP8: FlashInfer, CUTLASS or the torch _scaled_mm variants (_POSSIBLE_FP8_KERNELS)</text>

    <rect x="32" y="220" width="200" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="132" y="240" text-anchor="middle" font-weight="600">checkpoint and load</text>
    <text x="132" y="257" text-anchor="middle" font-size="10.5" fill="#97A59F">FP8 weights, static or dynamic</text>
    <text x="132" y="271" text-anchor="middle" font-size="10.5" fill="#97A59F">activation scales.</text>
    <text x="132" y="287" text-anchor="middle" font-size="10.5" fill="#97A59F">process_weights_after_loading:</text>
    <text x="132" y="301" text-anchor="middle" font-size="10.5" fill="#97A59F">three shards with three scales</text>
    <text x="132" y="315" text-anchor="middle" font-size="10.5" fill="#97A59F">become one weight, one scale</text>

    <rect x="244" y="220" width="200" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="344" y="240" text-anchor="middle" font-weight="600">quantize the activations</text>
    <text x="344" y="257" text-anchor="middle" font-size="10.5" fill="#97A59F">to FP8, with a per-tensor or</text>
    <text x="344" y="271" text-anchor="middle" font-size="10.5" fill="#97A59F">a per-token scale: static from</text>
    <text x="344" y="287" text-anchor="middle" font-size="10.5" fill="#97A59F">the checkpoint, or computed</text>
    <text x="344" y="301" text-anchor="middle" font-size="10.5" fill="#97A59F">at run time</text>

    <rect x="456" y="220" width="200" height="104" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="556" y="240" text-anchor="middle" font-weight="600">FP8 MMA</text>
    <text x="556" y="257" text-anchor="middle" font-size="10.5" fill="#7ADACF">at twice the BF16 rate.</text>
    <text x="556" y="271" text-anchor="middle" font-size="10.5" fill="#7ADACF">It halves both ceilings,</text>
    <text x="556" y="287" text-anchor="middle" font-size="10.5" fill="#7ADACF">memory time and math time,</text>
    <text x="556" y="301" text-anchor="middle" font-size="10.5" fill="#7ADACF">so it helps at every M</text>

    <rect x="668" y="220" width="200" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="768" y="240" text-anchor="middle" font-weight="600">epilogue</text>
    <text x="768" y="257" text-anchor="middle" font-size="10.5" fill="#97A59F">applies scale_a × scale_w</text>
    <text x="768" y="271" text-anchor="middle" font-size="10.5" fill="#97A59F">to the FP32 accumulator.</text>
    <text x="768" y="287" text-anchor="middle" font-size="10.5" fill="#97A59F">It needs FP8 tensor cores</text>
    <text x="768" y="301" text-anchor="middle" font-size="10.5" fill="#97A59F">(Ada, Hopper, Blackwell)</text>

    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M232 106 L242 106" marker-end="url(#arr)"/>
      <path d="M444 106 L454 106" marker-end="url(#arr)"/>
      <path d="M656 106 L666 106" marker-end="url(#arr)"/>
      <path d="M232 272 L242 272" marker-end="url(#arr)"/>
      <path d="M444 272 L454 272" marker-end="url(#arr)"/>
      <path d="M656 272 L666 272" marker-end="url(#arr)"/>
    </g>

    <text x="20" y="362" font-size="11" fill="#97A59F">The down_proj of Llama-3.1-8B on an L4, roofline time: M = 1: BF16 392 µs, W4A16 102 µs, W8A8 FP8 196 µs. M = 2,048: 1,988, 1,988 and 992 µs.</text>
  </g>
</svg>
