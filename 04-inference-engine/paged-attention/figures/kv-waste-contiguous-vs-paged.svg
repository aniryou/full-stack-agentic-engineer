<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-label="Before paging, each request reserves one contiguous tensor at the maximum length and three kinds of waste appear. With paging, each request holds fixed-size blocks at any position in the pool, and the waste is at most one partial block per sequence." style="color: #E4EAE7">
  <title>Before paging, each request reserves one contiguous tensor at the maximum length and three kinds of waste appear. With paging, each request holds fixed-size blocks at any position in the pool, and the waste is at most one partial block per sequence.</title>
  <rect x="0" y="0" width="880" height="404" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">The KV memory of one GPU for three requests A, B and C (illustrative proportions)</text>

    <rect x="24" y="40" width="832" height="160" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="60" fill="#97A59F">Before paging: one contiguous tensor per request, reserved at the start at the maximum possible sequence length</text>
    <g stroke-width="1.2">
      <rect x="40" y="76" width="90" height="44" fill="#16302A" stroke="#4CC5B7"/>
      <rect x="130" y="76" width="70" height="44" fill="#3A2C25" stroke="#E39A62"/>
      <rect x="200" y="76" width="140" height="44" fill="#3A2C25" stroke="#E39A62" stroke-dasharray="4 3"/>
      <rect x="340" y="76" width="40" height="44" fill="none" stroke="#97A59F" stroke-dasharray="4 3"/>
      <rect x="380" y="76" width="90" height="44" fill="#16302A" stroke="#4CC5B7"/>
      <rect x="470" y="76" width="50" height="44" fill="#3A2C25" stroke="#E39A62"/>
      <rect x="520" y="76" width="80" height="44" fill="#3A2C25" stroke="#E39A62" stroke-dasharray="4 3"/>
      <rect x="600" y="76" width="40" height="44" fill="none" stroke="#97A59F" stroke-dasharray="4 3"/>
      <rect x="640" y="76" width="60" height="44" fill="#16302A" stroke="#4CC5B7"/>
      <rect x="700" y="76" width="40" height="44" fill="#3A2C25" stroke="#E39A62"/>
      <rect x="740" y="76" width="100" height="44" fill="#3A2C25" stroke="#E39A62" stroke-dasharray="4 3"/>
    </g>
    <g font-weight="600" text-anchor="middle">
      <text x="85" y="102">A</text><text x="425" y="102">B</text><text x="670" y="102">C</text>
    </g>
    <g font-size="11">
      <rect x="40" y="130" width="14" height="12" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1"/>
      <text x="62" y="140">token state: the K and V of generated tokens</text>
      <rect x="440" y="130" width="14" height="12" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1"/>
      <text x="462" y="140">reservation waste: slots the request will use later, empty now</text>
      <rect x="40" y="150" width="14" height="12" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="62" y="160">internal fragmentation: slots for output that the model never generates</text>
      <rect x="440" y="150" width="14" height="12" rx="2" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="462" y="160">external fragmentation: a gap too small for a new request</text>
    </g>
    <text x="40" y="186" font-size="11.5" fill="#97A59F">The paper measured that only about 20–40% of KV cache memory in these systems held actual token state.</text>

    <rect x="24" y="216" width="832" height="176" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="236" fill="#97A59F">With paging: fixed-size KV blocks (16 tokens by default in vLLM), allocated on demand, at any position in the pool</text>
    <g font-size="12">
      <rect x="40" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="58" y="275" text-anchor="middle" font-weight="600">B</text><rect x="80" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="98" y="275" text-anchor="middle" font-weight="600">A</text><rect x="120" y="252" width="36" height="36" rx="4" fill="none" stroke="#4CC5B7" stroke-width="1.2"/><rect x="121" y="253" width="20" height="34" rx="3" fill="#16302A"/><text x="138" y="275" text-anchor="middle" font-weight="600">A</text><rect x="160" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="178" y="275" text-anchor="middle" font-weight="600">C</text><rect x="200" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="218" y="275" text-anchor="middle" font-weight="600">A</text><rect x="240" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="258" y="275" text-anchor="middle" font-weight="600">B</text><rect x="280" y="252" width="36" height="36" rx="4" fill="none" stroke="#4CC5B7" stroke-width="1.2"/><rect x="281" y="253" width="9" height="34" rx="3" fill="#16302A"/><text x="298" y="275" text-anchor="middle" font-weight="600">C</text><rect x="320" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="338" y="275" text-anchor="middle" font-weight="600">A</text><rect x="360" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="400" y="252" width="36" height="36" rx="4" fill="none" stroke="#4CC5B7" stroke-width="1.2"/><rect x="401" y="253" width="27" height="34" rx="3" fill="#16302A"/><text x="418" y="275" text-anchor="middle" font-weight="600">B</text><rect x="440" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="480" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="498" y="275" text-anchor="middle" font-weight="600">C</text><rect x="520" y="252" width="36" height="36" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/><text x="538" y="275" text-anchor="middle" font-weight="600">C</text><rect x="560" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="600" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="640" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="680" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="720" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="760" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/><rect x="800" y="252" width="36" height="36" rx="4" fill="none" stroke="#97A59F" stroke-width="1"/>
    </g>
    <g font-size="10.5" fill="#97A59F">
      <text x="58" y="304" text-anchor="middle">0</text><text x="98" y="304" text-anchor="middle">1</text><text x="138" y="304" text-anchor="middle">2</text><text x="178" y="304" text-anchor="middle">3</text><text x="218" y="304" text-anchor="middle">4</text><text x="258" y="304" text-anchor="middle">5</text><text x="298" y="304" text-anchor="middle">6</text><text x="338" y="304" text-anchor="middle">7</text><text x="378" y="304" text-anchor="middle">8</text><text x="418" y="304" text-anchor="middle">9</text><text x="458" y="304" text-anchor="middle">10</text><text x="498" y="304" text-anchor="middle">11</text><text x="538" y="304" text-anchor="middle">12</text><text x="578" y="304" text-anchor="middle">13</text><text x="618" y="304" text-anchor="middle">14</text><text x="658" y="304" text-anchor="middle">15</text><text x="698" y="304" text-anchor="middle">16</text><text x="738" y="304" text-anchor="middle">17</text><text x="778" y="304" text-anchor="middle">18</text><text x="818" y="304" text-anchor="middle">19</text>
    </g>
    <text x="40" y="330" font-size="11.5">A holds blocks 7, 1, 4 and 2, and block 2 holds 9 of 16 tokens (the sketch of the next section). B and C hold their own blocks.</text>
    <text x="40" y="350" font-size="11.5">Waste collapses to at most one partially filled block per sequence: less than 4% in the paper's measurements, against 60–80% before.</text>
    <text x="40" y="370" font-size="11.5" fill="#97A59F">A physical block can be at any position in the pool. The engine allocates one on demand, only when the current block is full.</text>
  </g>
</svg>
