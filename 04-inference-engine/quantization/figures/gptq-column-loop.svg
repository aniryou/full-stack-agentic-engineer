<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="One GPTQ step: the loop rounds column j, and the error goes to the columns not yet rounded, in proportion to row j of U." style="color: #E4EAE7">
  <title>One GPTQ step: the loop rounds column j, and the error goes to the columns not yet rounded, in proportion to row j of U.</title>
  <rect x="0" y="0" width="900" height="372" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">GPTQ (§4, <tspan font-family="JetBrains Mono, monospace" font-size="11">gptq.gptq()</tspan>): one pass over the input columns of W, from left to right</text>

    <!-- the pipeline from the calibration inputs to U -->
    <rect x="24" y="70" width="190" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="119" y="92" text-anchor="middle" font-weight="600">calibration inputs X</text>
    <text x="119" y="110" text-anchor="middle" font-size="11" fill="#97A59F">n tokens × in</text>
    <path d="M119 122 L119 138" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="24" y="140" width="190" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="119" y="162" text-anchor="middle" font-weight="600">H = 2/n Σ xₜ xₜᵀ</text>
    <text x="119" y="180" text-anchor="middle" font-size="11" fill="#97A59F">in × in, from the activations</text>
    <text x="119" y="194" text-anchor="middle" font-size="11" fill="#97A59F">damping: + 0.01 · mean(diag H) · I</text>
    <path d="M119 204 L119 220" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="24" y="222" width="190" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="119" y="244" text-anchor="middle" font-weight="600">U = chol(H⁻¹)ᵀ</text>
    <text x="119" y="262" text-anchor="middle" font-size="11" fill="#97A59F">upper triangular, H⁻¹ = UᵀU</text>
    <text x="119" y="276" text-anchor="middle" font-size="11" fill="#97A59F">row j weights the update</text>
    <path d="M214 270 L298 270" stroke="#4CC5B7" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrA)"/>

    <!-- W, one pass -->
    <text x="300" y="60" font-size="11" fill="#97A59F">W (out × in) · act-order visits the columns from the largest H[j, j] to the smallest</text>
    <rect x="300" y="70" width="560" height="160" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="308" y="78" width="204" height="144" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="410" y="142" text-anchor="middle" font-weight="600">columns 0 … j−1</text>
    <text x="410" y="160" text-anchor="middle" font-size="11" fill="#97A59F">already rounded:</text>
    <text x="410" y="175" text-anchor="middle" font-size="11" fill="#97A59F">the codes are fixed</text>
    <rect x="520" y="78" width="36" height="144" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="538" y="145" text-anchor="middle" font-weight="600" fill="#7ADACF">col</text>
    <text x="538" y="161" text-anchor="middle" font-weight="600" fill="#7ADACF">j</text>
    <rect x="564" y="78" width="288" height="144" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="708" y="100" text-anchor="middle" font-weight="600">columns j+1 … in−1</text>
    <text x="708" y="116" text-anchor="middle" font-size="11" fill="#97A59F">not yet rounded</text>
    <g stroke="#4CC5B7" stroke-width="1.2" fill="none">
      <path d="M556 140 L690 140" marker-end="url(#arrA)"/>
      <path d="M556 165 L690 165" marker-end="url(#arrA)"/>
      <path d="M556 190 L690 190" marker-end="url(#arrA)"/>
    </g>
    <text x="700" y="160" font-size="11" fill="#7ADACF">each absorbs a share</text>
    <text x="700" y="175" font-size="11" fill="#7ADACF">of the error: row j of U</text>

    <!-- the three lines of the loop body -->
    <rect x="300" y="244" width="560" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g font-family="JetBrains Mono, monospace" font-size="11">
      <text x="316" y="266">q = quantize(W[:, j])                   <tspan fill="#97A59F"># on the grid of the group of column j</tspan></text>
      <text x="316" y="284">err = (W[:, j] − q) / U[j, j]</text>
      <text x="316" y="302">W[:, j+1:] −= outer(err, U[j, j+1:])    <tspan fill="#97A59F"># the Optimal Brain Surgeon update</tspan></text>
    </g>

    <text x="24" y="340" font-size="11.5" fill="#97A59F">Group scales: one per row per g columns, set when the loop gets to the group (llm-compressor: from the weight observer at the start).</text>
    <text x="24" y="358" font-size="11.5" fill="#97A59F">Tiny model, INT4 g32: RTN 83.7%, GPTQ 89.7% (KL 0.259 → 0.048). With uncorrelated inputs, H is diagonal and GPTQ is RTN.</text>
  </g>
</svg>
