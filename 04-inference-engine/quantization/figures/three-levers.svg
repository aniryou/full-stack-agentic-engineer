<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="One step of a quantized model and its three levers: the weight bytes, the FLOPs of the GEMM and the KV bytes." style="color: #E4EAE7">
  <title>One step of a quantized model and its three levers: the weight bytes, the FLOPs of the GEMM and the KV bytes.</title>
  <rect x="0" y="0" width="900" height="400" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">One step of a quantized model (§1, §4 to §6): where the bytes stream, and where the math happens</text>

    <!-- HBM -->
    <rect x="24" y="44" width="224" height="320" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="136" y="62" text-anchor="middle" fill="#97A59F">HBM</text>
    <rect x="38" y="76" width="196" height="70" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="136" y="98" text-anchor="middle" font-weight="600">LM head: stays 16-bit</text>
    <text x="136" y="116" text-anchor="middle" font-size="11">1.05 GB of the 4.65 GB an</text>
    <text x="136" y="131" text-anchor="middle" font-size="11">INT4 decode step streams</text>
    <rect x="38" y="162" width="196" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="136" y="200" text-anchor="middle" font-weight="600">linear weights</text>
    <text x="136" y="220" text-anchor="middle" font-size="11" fill="#97A59F">packed codes + scales</text>
    <text x="136" y="236" text-anchor="middle" font-size="11" fill="#97A59F">streamed in every decode step</text>
    <rect x="38" y="282" width="196" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="136" y="304" text-anchor="middle" font-weight="600">KV cache</text>
    <text x="136" y="322" text-anchor="middle" font-size="11" fill="#97A59F">quantized one time at write,</text>
    <text x="136" y="337" text-anchor="middle" font-size="11" fill="#97A59F">dequantized at every read</text>

    <!-- SMs -->
    <rect x="420" y="44" width="456" height="320" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="648" y="62" text-anchor="middle" fill="#97A59F">SMs</text>
    <rect x="436" y="76" width="424" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="648" y="97" text-anchor="middle" font-weight="600">activations x, from the previous layer</text>
    <text x="648" y="116" text-anchor="middle" font-size="11" fill="#97A59F">weight-only: 16-bit · W8A8, W4A4: quantized per token at run time</text>
    <rect x="436" y="162" width="424" height="104" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="648" y="184" text-anchor="middle" font-weight="600">GEMM of each linear layer</text>
    <text x="648" y="203" text-anchor="middle" font-size="11" fill="#7ADACF">lever 2, the FLOPs: only formats the tensor cores multiply natively</text>
    <text x="648" y="222" text-anchor="middle" font-size="11" fill="#97A59F">weight-only (W4A16): dequantize to 16-bit in registers, then the</text>
    <text x="648" y="237" text-anchor="middle" font-size="11" fill="#97A59F">ordinary 16-bit MMA, so the FLOPs are the same</text>
    <text x="648" y="256" text-anchor="middle" font-size="11" fill="#97A59F">W8A8, W4A4: 8-bit or FP4 MMA, the scales applied in the epilogue</text>
    <rect x="436" y="282" width="424" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="648" y="304" text-anchor="middle" font-weight="600">attention over the KV cache</text>
    <text x="648" y="322" text-anchor="middle" font-size="11" fill="#97A59F">not a weight GEMM: weight quantization does not change it,</text>
    <text x="648" y="337" text-anchor="middle" font-size="11" fill="#97A59F">and only KV quantization decreases its bytes</text>

    <!-- edges -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M234 214 L434 214" marker-end="url(#arr)"/>
      <path d="M234 317 L434 317" marker-end="url(#arr)"/>
      <path d="M648 132 L648 160" marker-end="url(#arr)"/>
    </g>
    <text x="334" y="188" text-anchor="middle" font-size="11.5" fill="#7ADACF">lever 1: the weight bytes</text>
    <text x="334" y="204" text-anchor="middle" font-size="11" fill="#97A59F">decode at small batch</text>
    <text x="334" y="233" text-anchor="middle" font-size="11" fill="#97A59F">W4A16: an 8B model</text>
    <text x="334" y="247" text-anchor="middle" font-size="11" fill="#97A59F">~3× faster at batch 1</text>
    <text x="334" y="293" text-anchor="middle" font-size="11.5" fill="#7ADACF">lever 3: the KV bytes</text>
    <text x="334" y="308" text-anchor="middle" font-size="11" fill="#97A59F">long context × large batch</text>
    <text x="334" y="336" text-anchor="middle" font-size="11" fill="#97A59F">FP8 KV halves it and</text>
    <text x="334" y="350" text-anchor="middle" font-size="11" fill="#97A59F">doubles the sessions per GPU</text>

    <text x="24" y="386" font-size="11.5" fill="#97A59F">Native formats: FP8 W8A8 on Ada, Hopper and Blackwell · INT8 W8A8 on Turing to Hopper · FP4 W4A4 on Blackwell.</text>
  </g>
</svg>
