    <text x="636" y="392" font-size="11" fill="#97A59F">one E8M0 scale per 32 values: a power of two</text>
    <text x="636" y="407" font-size="11" fill="#97A59F">4.25 bits per weight</text>
    <text x="24" y="438" font-weight="600">NVFP4</text>
    <text x="24" y="451" font-size="11" fill="#97A59F">16 × E2M1</text>
