    <text x="468" y="441" font-size="11" fill="#97A59F" text-anchor="middle">FP32 per tensor</text>
    <text x="540" y="436" font-size="11" fill="#97A59F">one E4M3 scale per 16, plus one FP32 scale per tensor</text>
