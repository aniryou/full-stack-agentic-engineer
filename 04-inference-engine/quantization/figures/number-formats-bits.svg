<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="The bit layouts of the single-value formats from FP16 to INT4 and of the block formats MXFP4 and NVFP4 with their shared scales." style="color: #E4EAE7">
  <title>The bit layouts of the single-value formats from FP16 to INT4 and of the block formats MXFP4 and NVFP4 with their shared scales.</title>
  <rect x="0" y="0" width="900" height="500" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="26" fill="#97A59F">The number formats of §2, bit by bit: one row is one value, and the panel below is one block</text>
    <text x="24" y="70" font-weight="600">FP16</text>
    <text x="24" y="83" font-size="11" fill="#97A59F">1-5-10</text>
    <rect x="140" y="56" width="24" height="30" rx="3" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="152.0" y="75" font-size="11" fill="#97A59F" text-anchor="middle">s</text>
    <rect x="164" y="56" width="120" height="30" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="224.0" y="75" font-size="11" fill="#7ADACF" text-anchor="middle">e 5</text>
    <rect x="284" y="56" width="240" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="404.0" y="75" font-size="11" text-anchor="middle">m 10</text>
    <text x="540" y="75" font-size="11" fill="#97A59F">largest 65,504 · max relative error 0.05%</text>
    <text x="24" y="112" font-weight="600">BF16</text>
    <text x="24" y="125" font-size="11" fill="#97A59F">1-8-7</text>
    <rect x="140" y="98" width="24" height="30" rx="3" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="152.0" y="117" font-size="11" fill="#97A59F" text-anchor="middle">s</text>
    <rect x="164" y="98" width="192" height="30" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="260.0" y="117" font-size="11" fill="#7ADACF" text-anchor="middle">e 8</text>
    <rect x="356" y="98" width="168" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="440.0" y="117" font-size="11" text-anchor="middle">m 7</text>
    <text x="540" y="117" font-size="11" fill="#97A59F">largest ~3.4 × 10³⁸ · max relative error 0.39% · the range of fp32</text>
    <text x="24" y="154" font-weight="600">FP8 E4M3</text>
    <text x="24" y="167" font-size="11" fill="#97A59F">1-4-3</text>
    <rect x="140" y="140" width="24" height="30" rx="3" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="152.0" y="159" font-size="11" fill="#97A59F" text-anchor="middle">s</text>
    <rect x="164" y="140" width="96" height="30" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="212.0" y="159" font-size="11" fill="#7ADACF" text-anchor="middle">e 4</text>
    <rect x="260" y="140" width="72" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="296.0" y="159" font-size="11" text-anchor="middle">m 3</text>
    <text x="348" y="159" font-size="11" fill="#97A59F">bias 7 · largest 448 · no infinities: S.1111.111 is NaN · max relative error 6.25%</text>
    <text x="24" y="196" font-weight="600">FP8 E5M2</text>
    <text x="24" y="209" font-size="11" fill="#97A59F">1-5-2</text>
    <rect x="140" y="182" width="24" height="30" rx="3" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="152.0" y="201" font-size="11" fill="#97A59F" text-anchor="middle">s</text>
    <rect x="164" y="182" width="120" height="30" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="224.0" y="201" font-size="11" fill="#7ADACF" text-anchor="middle">e 5</text>
    <rect x="284" y="182" width="48" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="308.0" y="201" font-size="11" text-anchor="middle">m 2</text>
    <text x="348" y="201" font-size="11" fill="#97A59F">bias 15 · largest 57,344 · IEEE infinities · max relative error 12.5%</text>
    <text x="24" y="238" font-weight="600">FP4 E2M1</text>
    <text x="24" y="251" font-size="11" fill="#97A59F">1-2-1</text>
    <rect x="140" y="224" width="24" height="30" rx="3" fill="none" stroke="#97A59F" stroke-width="1"/>
    <text x="152.0" y="243" font-size="11" fill="#97A59F" text-anchor="middle">s</text>
    <rect x="164" y="224" width="48" height="30" rx="3" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="188.0" y="243" font-size="11" fill="#7ADACF" text-anchor="middle">e 2</text>
    <rect x="212" y="224" width="24" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="224.0" y="243" font-size="11" text-anchor="middle">m 1</text>
    <text x="252" y="243" font-size="11" fill="#97A59F">bias 1 · the full grid {0, 0.5, 1, 1.5, 2, 3, 4, 6} · largest 6</text>
    <text x="24" y="280" font-weight="600">INT8</text>
    <text x="24" y="293" font-size="11" fill="#97A59F">8 bits</text>
    <rect x="140" y="266" width="192" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="236.0" y="285" font-size="11" text-anchor="middle">8-bit integer code</text>
    <text x="348" y="285" font-size="11" fill="#97A59F">code = clip(round(x / scale) + zero, qmin, qmax) · x̂ = (code − zero) × scale</text>
    <text x="24" y="322" font-weight="600">INT4</text>
    <text x="24" y="335" font-size="11" fill="#97A59F">4 bits</text>
    <rect x="140" y="308" width="96" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="188.0" y="327" font-size="11" text-anchor="middle">4-bit code</text>
    <text x="252" y="327" font-size="11" fill="#97A59F">codes −8…7 (full), −7…7 (restricted) or 0…15 with a zero point (asymmetric)</text>
    <text x="24" y="362" font-size="11.5" fill="#97A59F">Block formats: E2M1 elements that share one scale (the cells here are not at the scale of the rows above)</text>
    <text x="24" y="394" font-weight="600">MXFP4</text>
    <text x="24" y="407" font-size="11" fill="#97A59F">32 × E2M1</text>
