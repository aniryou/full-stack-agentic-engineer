[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcore"
version = "0.1.0"
description = "Quantization for inference from first principles in numpy: number formats, scale granularity, GPTQ/AWQ/SmoothQuant, W8A8, KV-cache quantization, FP4 block formats, and what each scheme buys on a GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]         # the library is standard library + numpy; no GPU, no torch

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
include = ["quantcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
