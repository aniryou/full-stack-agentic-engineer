# Every lab's tests, the notebook rebuilds, the docs checks and the generators, on every pull request and
# every push to main. The lab list and each lab's install/test commands live in tools/ci/labs.json; the job
# bodies are the scripts in tools/ci/, so `tools/ci/run_local.sh` runs the same thing on a laptop.
# Everything here is T0: no torch, no GPU, no Docker, no keys. The solutions job (executes every solution
# notebook and checks every blank stops at its first exercise) is manual: Actions → tests → Run workflow.
# Actions are pinned to a commit (the release tag in the comment), so a moved tag cannot change what runs here.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  matrix:
    name: lab list
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.labs.outputs.labs }}
      solutions: ${{ steps.labs.outputs.solutions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Every directory with tests is in tools/ci/labs.json
        run: python3 tools/ci/ci.py check
      - id: labs
        name: Build the matrices
        run: |
          echo "labs=$(python3 tools/ci/ci.py matrix)" >> "$GITHUB_OUTPUT"
          echo "solutions=$(python3 tools/ci/ci.py matrix --solutions)" >> "$GITHUB_OUTPUT"

  tests:
    name: tests (${{ matrix.id }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.labs) }}
    env:
      LAB: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            tools/ci/labs.json
            ${{ matrix.dir }}/pyproject.toml
            ${{ matrix.dir }}/requirements*.txt
      - name: Install (as the lab's README says)
        run: python tools/ci/ci.py run "$LAB" install
      - name: Test
        run: python tools/ci/ci.py run "$LAB" test

  notebooks:
    name: notebook rebuilds are no-ops
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/ci/embeddings-lab-build.txt
      - name: Install the builders' dependencies
        run: python -m pip install -r tools/ci/embeddings-lab-build.txt
      - name: Run every builder and the Colab injector, then require a clean tree
        run: bash tools/ci/notebooks.sh

  docs:
    name: site and links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Install the site dependencies
        run: python -m pip install -r requirements-site.txt
      - name: Site generator tests, mkdocs.yml up to date, strict build, relative links
        run: bash tools/ci/docs.sh

  colab-index:
    name: Colab links up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Regenerate the per-layer Colab links and COLAB.md, then require a clean tree
        run: bash tools/ci/colab_index.sh

  solutions:
    name: solutions (${{ matrix.id }})
    if: github.event_name == 'workflow_dispatch'
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.solutions) }}
    env:
      LAB: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            tools/ci/labs.json
            ${{ matrix.dir }}/pyproject.toml
            ${{ matrix.dir }}/requirements*.txt
      - name: Install (as the lab's README says)
        run: python tools/ci/ci.py run "$LAB" install
      - name: Execute the solutions; blanks must stop at their first exercise
        run: python tools/ci/ci.py run "$LAB" solutions
