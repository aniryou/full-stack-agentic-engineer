<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424" role="img" aria-label="The InfoNCE batch as a similarity matrix: each row is a query, the diagonal holds its positive, the other cells of the batch are free in-batch negatives, extra columns hold mined hard negatives, one cell can be a false negative, and a small temperature tau sharpens the softmax over a row so that the loss concentrates on the hardest negatives." style="color: #E4EAE7">
  <title>The InfoNCE batch as a similarity matrix: each row is a query, the diagonal holds its positive, the other cells of the batch are free in-batch negatives, extra columns hold mined hard negatives, one cell can be a false negative, and a small temperature tau sharpens the softmax over a row so that the loss concentrates on the hardest negatives.</title>
  <rect x="0" y="0" width="900" height="424" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="30" font-weight="600">one batch of B queries and their positives: s(q<tspan font-size="9" dy="3">i</tspan><tspan dy="-3">, d</tspan><tspan font-size="9" dy="3">j</tspan><tspan dy="-3">) / τ</tspan></text>
    <text x="95" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₁⁺</text>
    <text x="145" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₂⁺</text>
    <text x="195" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₃⁺</text>
    <text x="245" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₄⁺</text>
    <text x="311" y="76" text-anchor="middle" font-size="12" fill="#E39A62">d⁻</text>
    <text x="361" y="76" text-anchor="middle" font-size="12" fill="#E39A62">d⁻</text>
    <text x="170" y="56" text-anchor="middle" font-size="11" fill="#97A59F">the positives of the batch</text>
    <text x="336" y="56" text-anchor="middle" font-size="11" fill="#E39A62">hard negatives</text>
    <text x="60" y="116" text-anchor="end" font-size="12">q₁</text>
    <rect x="70" y="86" width="50" height="50" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="95" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="120" y="86" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="145" y="116" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="170" y="86" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="195" y="116" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="220" y="86" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="245" y="116" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="286" y="86" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="311" y="116" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="336" y="86" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="361" y="116" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <text x="60" y="166" text-anchor="end" font-size="12">q₂</text>
    <rect x="70" y="136" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="95" y="166" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="120" y="136" width="50" height="50" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="145" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="170" y="136" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="195" y="166" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="220" y="136" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="245" y="159" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <text x="245" y="176" text-anchor="middle" font-size="11" fill="currentColor">false?</text>
    <rect x="286" y="136" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="311" y="166" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="336" y="136" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="361" y="166" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <text x="60" y="216" text-anchor="end" font-size="12">q₃</text>
    <rect x="70" y="186" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="95" y="216" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="120" y="186" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="145" y="216" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="170" y="186" width="50" height="50" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="195" y="216" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="220" y="186" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="245" y="216" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="286" y="186" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="311" y="216" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="336" y="186" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="361" y="216" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <text x="60" y="266" text-anchor="end" font-size="12">q₄</text>
    <rect x="70" y="236" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="95" y="266" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="120" y="236" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="145" y="266" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="170" y="236" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="195" y="266" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="220" y="236" width="50" height="50" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="245" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="286" y="236" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="311" y="266" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="336" y="236" width="50" height="50" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="361" y="266" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="223" y="139" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/>
    <rect x="66" y="132" width="324" height="58" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="24" y="310" font-size="11" fill="#7ADACF">one row, one query: a softmax over the cells</text>
    <text x="24" y="325" font-size="11" fill="#7ADACF">of the row at temperature τ. The loss of the row</text>
    <text x="24" y="340" font-size="11" fill="#7ADACF">is −log of the share of its + cell (InfoNCE).</text>
    <text x="24" y="364" font-size="11" fill="#97A59F">the plain cells: in-batch negatives, the positive of every other</text>
    <text x="24" y="379" font-size="11" fill="#97A59F">example is a free negative, so the signal scales with the batch size</text>
    <text x="24" y="394" font-size="11" fill="#97A59F">(effective batches of 16k–64k: GradCache, cross-device negatives)</text>
    <rect x="412" y="56" width="464" height="80" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="428" y="76" font-weight="600">temperature τ: small for cosine, 0.01–0.05</text>
    <text x="428" y="92" font-size="11" fill="#7ADACF">A small τ sharpens the softmax, so the loss concentrates on</text>
    <text x="428" y="108" font-size="11" fill="#7ADACF">the hardest negatives. Too small: instability and hubness.</text>
    <text x="428" y="124" font-size="11" fill="#7ADACF">A learnable τ is common.</text>
    <rect x="412" y="148" width="464" height="80" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="428" y="168" font-weight="600">hard negatives (the warm columns)</text>
    <text x="428" y="184" font-size="11" fill="currentColor">passages that look relevant but are not relevant. Sources: the</text>
    <text x="428" y="200" font-size="11" fill="currentColor">BM25 top-k, dense retrieval from an earlier checkpoint (ANCE,</text>
    <text x="428" y="216" font-size="11" fill="currentColor">with an asynchronous refresh), candidates a cross-encoder scored.</text>
    <rect x="412" y="240" width="464" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="428" y="260" font-weight="600">false negatives: the dominant source of noise</text>
    <text x="428" y="276" font-size="11" fill="#97A59F">a "negative" that is in fact an unlabeled positive. Skip it</text>
    <text x="428" y="292" font-size="11" fill="#97A59F">if s(neg) &gt; s(pos) − margin, or discard what a cross-encoder</text>
    <text x="428" y="308" font-size="11" fill="#97A59F">scores as a likely positive (the denoised negatives of RocketQA).</text>
    <rect x="412" y="332" width="464" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="428" y="352" font-weight="600">directions</text>
    <text x="428" y="368" font-size="11" fill="#97A59F">retrieval: one direction, with a query-side prefix. STS and duplicates:</text>
    <text x="428" y="384" font-size="11" fill="#97A59F">both directions. The lab's info_nce(Za, Zb, tau) uses both (rows and columns).</text>
  </g>
</svg>
