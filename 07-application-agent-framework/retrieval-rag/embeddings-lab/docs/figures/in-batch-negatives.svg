<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The InfoNCE batch as a similarity matrix: each row is a query, the diagonal holds its positive, the other columns of the batch are free in-batch negatives, extra columns hold mined hard negatives, one cell can be a false negative, and the softmax over a row at temperature tau puts the loss on the hardest negatives." style="color: #E4EAE7">
  <title>The InfoNCE batch as a similarity matrix: each row is a query, the diagonal holds its positive, the other columns of the batch are free in-batch negatives, extra columns hold mined hard negatives, one cell can be a false negative, and the softmax over a row at temperature tau puts the loss on the hardest negatives.</title>
  <rect x="0" y="0" width="900" height="420" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="30" font-weight="600">one batch of B queries and their positives: s(q<tspan font-size="9" dy="3">i</tspan><tspan dy="-3">, d</tspan><tspan font-size="9" dy="3">j</tspan><tspan dy="-3">) / τ</tspan></text>
    <text x="92.0" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₁⁺</text>
    <text x="136.0" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₂⁺</text>
    <text x="180.0" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₃⁺</text>
    <text x="224.0" y="76" text-anchor="middle" font-size="12" fill="currentColor">d₄⁺</text>
    <text x="284.0" y="76" text-anchor="middle" font-size="12" fill="#E39A62">d⁻</text>
    <text x="328.0" y="76" text-anchor="middle" font-size="12" fill="#E39A62">d⁻</text>
    <text x="306" y="58" text-anchor="middle" font-size="11" fill="#E39A62">hard negatives</text>
    <text x="158" y="58" text-anchor="middle" font-size="11" fill="#97A59F">the positives of the batch</text>
    <text x="60" y="112.0" text-anchor="end" font-size="12">q₁</text>
    <rect x="70" y="86" width="44" height="44" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="92.0" y="113.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="114" y="86" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="136.0" y="113.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="158" y="86" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="180.0" y="113.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="202" y="86" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="224.0" y="113.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="262" y="86" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="284.0" y="113.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="306" y="86" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="328.0" y="113.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <text x="60" y="156.0" text-anchor="end" font-size="12">q₂</text>
    <rect x="70" y="130" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="92.0" y="157.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="114" y="130" width="44" height="44" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="136.0" y="157.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="158" y="130" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="180.0" y="157.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="202" y="130" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="224.0" y="157.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="262" y="130" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="284.0" y="157.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="306" y="130" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="328.0" y="157.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <text x="60" y="200.0" text-anchor="end" font-size="12">q₃</text>
    <rect x="70" y="174" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="92.0" y="201.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="114" y="174" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="136.0" y="201.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="158" y="174" width="44" height="44" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="180.0" y="201.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="202" y="174" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="224.0" y="201.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="262" y="174" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="284.0" y="201.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="306" y="174" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="328.0" y="201.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <text x="60" y="244.0" text-anchor="end" font-size="12">q₄</text>
    <rect x="70" y="218" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="92.0" y="245.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="114" y="218" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="136.0" y="245.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="158" y="218" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.7"/>
    <text x="180.0" y="245.0" text-anchor="middle" font-size="14" fill="#97A59F">−</text>
    <rect x="202" y="218" width="44" height="44" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="224.0" y="245.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7ADACF">+</text>
    <rect x="262" y="218" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="284.0" y="245.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="306" y="218" width="44" height="44" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="328.0" y="245.0" text-anchor="middle" font-size="14" fill="#E39A62">−</text>
    <rect x="205" y="133" width="38" height="38" fill="none" stroke="#E4EAE7" stroke-width="1.4" stroke-dasharray="2 2"/>
    <text x="224.0" y="168" text-anchor="middle" font-size="9" fill="#E4EAE7">false?</text>
    <rect x="66" y="126" width="288" height="52" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="24" y="284" font-size="11" fill="#7ADACF">one row, one query: a softmax over the cells of the row at temperature τ.</text>
    <text x="24" y="300" font-size="11" fill="#7ADACF">The loss of the row is −log of the share of its + cell (InfoNCE).</text>
    <text x="24" y="324" font-size="11" fill="#97A59F">the plain cells: in-batch negatives, the positive of every other</text>
    <text x="24" y="340" font-size="11" fill="#97A59F">example is a free negative, so the signal scales with the batch size</text>
    <text x="24" y="356" font-size="11" fill="#97A59F">(effective batches of 16k–64k: GradCache, cross-device negatives)</text>
    <rect x="412" y="56" width="464" height="80" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="424" y="76" font-weight="600">temperature τ: small for cosine, 0.01–0.05</text>
    <text x="424" y="92" font-size="11" fill="#7ADACF">A small τ sharpens the softmax, so the loss concentrates on</text>
    <text x="424" y="108" font-size="11" fill="#7ADACF">the hardest negatives. Too small: instability and hubness.</text>
    <text x="424" y="124" font-size="11" fill="#7ADACF">A learnable τ is common.</text>
    <rect x="412" y="148" width="464" height="80" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="424" y="168" font-weight="600">hard negatives (the warm columns)</text>
    <text x="424" y="184" font-size="11" fill="currentColor">passages that look relevant but are not relevant. Sources: the</text>
    <text x="424" y="200" font-size="11" fill="currentColor">BM25 top-k, dense retrieval from an earlier checkpoint (ANCE,</text>
    <text x="424" y="216" font-size="11" fill="currentColor">with an asynchronous refresh), candidates a cross-encoder scored.</text>
    <rect x="412" y="240" width="464" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="424" y="260" font-weight="600">false negatives: the dominant source of noise</text>
    <text x="424" y="276" font-size="11" fill="#97A59F">a "negative" that is in fact an unlabeled positive. Skip it</text>
    <text x="424" y="292" font-size="11" fill="#97A59F">if s(neg) &gt; s(pos) − margin, or discard what a cross-encoder</text>
    <text x="424" y="308" font-size="11" fill="#97A59F">scores as a likely positive (the denoised negatives of RocketQA).</text>
    <rect x="412" y="332" width="464" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="424" y="352" font-weight="600">directions</text>
    <text x="424" y="368" font-size="11" fill="#97A59F">retrieval: one direction, with a query-side prefix. STS and duplicates:</text>
    <text x="424" y="384" font-size="11" fill="#97A59F">both directions. The lab's info_nce(Za, Zb, tau) uses both (rows and columns).</text>
  </g>
</svg>
