    <text x="44" y="149" font-size="11" fill="#97A59F">upper layer</text>
    <rect x="32" y="208" width="424" height="64" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-opacity="0.7"/>
    <text x="44" y="225" font-size="11" fill="#97A59F">bottom layer: every point</text>
