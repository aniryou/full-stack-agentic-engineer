    <text x="32" y="300" font-size="11.5" fill="#7ADACF">the search is greedy best-first, and it goes down the layers</text>
    <text x="32" y="322" font-size="11" fill="#97A59F"><tspan font-family="JetBrains Mono, monospace">M</tspan>: edges per node, memory ∝ N · M</text>
