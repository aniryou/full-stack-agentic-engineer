    <text x="244" y="381" text-anchor="middle" font-size="11.5">RAM-resident: 10M × 1024-d is ~40 GB of raw vectors alone</text>
    <text x="504" y="70" font-size="11" fill="#97A59F">IVF: k-means puts the vectors into <tspan font-family="JetBrains Mono, monospace">n_list</tspan> centroids</text>
    <rect x="508" y="82" width="62" height="58" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="3 3"/>
