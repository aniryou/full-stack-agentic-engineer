<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Two index families: HNSW is a multi-layer proximity graph that a greedy search descends from a sparse top layer to the bottom layer that holds every point, and IVF-PQ scans only the n_probe nearest of n_list k-means lists and stores each vector as one byte per sub-vector." style="color: #E4EAE7">
  <title>Two index families: HNSW is a multi-layer proximity graph that a greedy search descends from a sparse top layer to the bottom layer that holds every point, and IVF-PQ scans only the n_probe nearest of n_list k-means lists and stores each vector as one byte per sub-vector.</title>
