<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-label="HNSW is a multi-layer graph that a greedy search goes down from the sparse upper layers to the dense bottom layer that holds every point, and IVF-PQ scans only the n_probe nearest of the n_list lists and stores one byte per sub-vector." style="color: #E4EAE7">
  <title>HNSW is a multi-layer graph that a greedy search goes down from the sparse upper layers to the dense bottom layer that holds every point, and IVF-PQ scans only the n_probe nearest of the n_list lists and stores one byte per sub-vector.</title>
