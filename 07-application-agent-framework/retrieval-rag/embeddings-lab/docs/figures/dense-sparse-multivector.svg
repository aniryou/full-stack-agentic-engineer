    <rect x="260.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="172.0" y="226" text-anchor="middle" font-size="11" fill="#7ADACF">one vector of d dims, computed in advance</text>
    <path d="M172.0 232 L172.0 248" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="44" y="250" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="172.0" y="268" text-anchor="middle" font-size="11">score = f(q) · g(d), a dot product or cosine</text>
    <text x="172.0" y="284" text-anchor="middle" font-size="11" fill="#97A59F">one forward pass for q, then an ANN lookup</text>
    <text x="172.0" y="318" text-anchor="middle" font-size="11" fill="#97A59F">the documents are embedded and indexed in advance.</text>
    <text x="172.0" y="334" text-anchor="middle" font-size="11" fill="#97A59F">The token-level interaction between the query and</text>
    <text x="172.0" y="350" text-anchor="middle" font-size="11" fill="#97A59F">the document is lost, so a reranker comes after it.</text>
    <rect x="44" y="378" width="256" height="44" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="172.0" y="396" text-anchor="middle" font-size="11" font-weight="600">one vector of dimension d has a capacity limit:</text>
    <text x="172.0" y="412" text-anchor="middle" font-size="11">the sign-rank bound on the top-k subsets (LIMIT)</text>
    <rect x="352" y="126" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480.0" y="144" text-anchor="middle" font-size="11">the MLM head projects every token onto the vocabulary,</text>
    <text x="480.0" y="160" text-anchor="middle" font-size="11" fill="#97A59F">log(1 + ReLU(·)), then a max-pool over the positions</text>
    <path d="M480.0 170 L480.0 186" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
