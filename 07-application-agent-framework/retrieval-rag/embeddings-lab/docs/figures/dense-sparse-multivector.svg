    <text x="402" y="244" text-anchor="middle" font-size="11" fill="#7ADACF">heart</text>
    <text x="438" y="260" text-anchor="middle" font-size="11" fill="#7ADACF">cardiac</text>
    <text x="534" y="244" text-anchor="middle" font-size="11" fill="#7ADACF">…</text>
    <text x="600" y="244" text-anchor="end" font-size="11" fill="#97A59F">|V| dims</text>
    <path d="M480 268 L480 284" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="352" y="286" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480" y="304" text-anchor="middle" font-size="11" fill="currentColor">learned term weights and term expansion:</text>
    <text x="480" y="320" text-anchor="middle" font-size="11" fill="#97A59F">a passage about "cardiac" activates "heart"</text>
    <path d="M480 330 L480 346" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="352" y="348" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480" y="366" text-anchor="middle" font-size="11">an ordinary inverted index</text>
    <text x="480" y="400" text-anchor="middle" font-size="11" fill="#97A59F">the exact-match strength of BM25 plus learned</text>
    <text x="480" y="415" text-anchor="middle" font-size="11" fill="#97A59F">semantics, strong out of domain. A FLOPS</text>
    <text x="480" y="430" text-anchor="middle" font-size="11" fill="#97A59F">regularizer keeps the vector sparse.</text>
    <text x="788" y="144" text-anchor="middle" font-size="11" fill="currentColor">the encoder keeps one vector per token,</text>
    <text x="788" y="160" text-anchor="middle" font-size="11" fill="#97A59F">each projected to ~128-d,</text>
    <text x="788" y="176" text-anchor="middle" font-size="11" fill="#97A59F">computed in advance</text>
