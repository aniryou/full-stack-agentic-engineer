    <rect x="706" y="204" width="10" height="16" fill="#16302A" stroke="#4CC5B7" stroke-width="1"/>
    <text x="696" y="234" text-anchor="middle" font-size="10" fill="#7ADACF">d<tspan font-size="8" dy="3">1</tspan></text>
