<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-label="Three representation formats side by side: a dense model pools the tokens into one vector of d dims and scores with a dot product, a learned sparse model projects them onto the vocabulary with learned term weights and expansion for an inverted index, and a late-interaction model keeps one vector per token and scores with MaxSim, the sum over query tokens of the best document token." style="color: #E4EAE7">
  <title>Three representation formats side by side: a dense model pools the tokens into one vector of d dims and scores with a dot product, a learned sparse model projects them onto the vocabulary with learned term weights and expansion for an inverted index, and a late-interaction model keeps one vector per token and scores with MaxSim, the sum over query tokens of the best document token.</title>
  <rect x="0" y="0" width="960" height="474" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor" transform="translate(0 -20)">
    <rect x="24" y="44" width="296" height="430" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="172" y="66" text-anchor="middle" font-weight="600">one dense vector (bi-encoder)</text>
    <rect x="44" y="80" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="172" y="98" text-anchor="middle" font-size="11">a text: tokens t<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> … t</tspan><tspan font-size="8" dy="3">n</tspan></text>
    <path d="M172 108 L172 124" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="44" y="126" width="256" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M172 186 L172 202" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="332" y="44" width="296" height="430" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="480" y="66" text-anchor="middle" font-weight="600">learned sparse (SPLADE)</text>
    <rect x="352" y="80" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480" y="98" text-anchor="middle" font-size="11">a text: tokens t<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> … t</tspan><tspan font-size="8" dy="3">n</tspan></text>
    <path d="M480 108 L480 124" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="352" y="126" width="256" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M480 186 L480 202" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="640" y="44" width="296" height="430" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="788" y="66" text-anchor="middle" font-weight="600">multi-vector, late interaction (ColBERT)</text>
    <rect x="660" y="80" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="788" y="98" text-anchor="middle" font-size="11">a text: tokens t<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> … t</tspan><tspan font-size="8" dy="3">n</tspan></text>
    <path d="M788 108 L788 124" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="660" y="126" width="256" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M788 186 L788 202" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="172" y="152" text-anchor="middle" font-size="11" fill="currentColor">encoder, then pooling</text>
    <text x="172" y="168" text-anchor="middle" font-size="11" fill="#97A59F">mean, [CLS] or last token (section 3)</text>
    <rect x="62" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="84" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="106" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
