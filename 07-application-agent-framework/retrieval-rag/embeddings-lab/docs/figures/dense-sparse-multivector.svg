    <text x="884.0" y="300" font-size="11" fill="#7ADACF">Σ over</text>
    <text x="884.0" y="314" font-size="11" fill="#7ADACF">the rows</text>
    <text x="788.0" y="368" text-anchor="middle" font-size="11">MaxSim: score(q, d) = Σ<tspan font-size="8" dy="3">i∈q</tspan><tspan dy="-3"> max</tspan><tspan font-size="8" dy="3">j∈d</tspan><tspan dy="-3"> q</tspan><tspan font-size="8" dy="3">i</tspan><tspan dy="-3"> · d</tspan><tspan font-size="8" dy="3">j</tspan></text>
    <text x="788.0" y="394" text-anchor="middle" font-size="11" fill="#97A59F">the match stays at the token level: rare terms,</text>
    <text x="788.0" y="410" text-anchor="middle" font-size="11" fill="#97A59F">entities, out-of-domain robustness. PLAID prunes</text>
    <text x="788.0" y="426" text-anchor="middle" font-size="11" fill="#97A59F">with centroids, ColBERTv2 compresses the residuals.</text>
