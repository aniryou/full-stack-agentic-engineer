    <rect x="194" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="216" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="238" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="260" y="204" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <text x="172" y="244" text-anchor="middle" font-size="11" fill="#7ADACF">one vector of d dims, computed in advance</text>
    <path d="M172 250 L172 266" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="44" y="268" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="172" y="286" text-anchor="middle" font-size="11" fill="currentColor">score = f(q) · g(d), a dot product or cosine</text>
    <text x="172" y="302" text-anchor="middle" font-size="11" fill="#97A59F">one forward pass for q, then an ANN lookup</text>
    <text x="172" y="334" text-anchor="middle" font-size="11" fill="#97A59F">the documents are embedded and indexed</text>
    <text x="172" y="349" text-anchor="middle" font-size="11" fill="#97A59F">in advance. The token-level interaction</text>
    <text x="172" y="364" text-anchor="middle" font-size="11" fill="#97A59F">between the query and the document is</text>
    <text x="172" y="379" text-anchor="middle" font-size="11" fill="#97A59F">lost, so a reranker comes after it.</text>
    <rect x="44" y="400" width="256" height="60" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="172" y="418" text-anchor="middle" font-size="11" fill="currentColor" font-weight="600">the capacity bound of a single vector</text>
    <text x="172" y="434" text-anchor="middle" font-size="11" fill="currentColor">of dimension d: the sign-rank bound</text>
    <text x="172" y="450" text-anchor="middle" font-size="11" fill="currentColor">on the top-k subsets (LIMIT)</text>
    <text x="480" y="144" text-anchor="middle" font-size="11" fill="currentColor">the MLM head projects every token</text>
    <text x="480" y="160" text-anchor="middle" font-size="11" fill="currentColor">onto the vocabulary, log(1 + ReLU(·)),</text>
    <text x="480" y="176" text-anchor="middle" font-size="11" fill="currentColor">then a max-pool over the positions</text>
    <rect x="360" y="204" width="12" height="22" fill="none" stroke="#97A59F" stroke-width="0.8" stroke-opacity="0.6"/>
    <rect x="372" y="204" width="12" height="22" fill="none" stroke="#97A59F" stroke-width="0.8" stroke-opacity="0.6"/>
