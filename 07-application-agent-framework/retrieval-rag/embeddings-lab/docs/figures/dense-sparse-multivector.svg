<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Three representation formats side by side: a dense model pools the tokens into one vector of d dims and scores with a dot product, a learned sparse model projects them onto the vocabulary with learned term weights and expansion for an inverted index, and a late-interaction model keeps one vector per token and scores with MaxSim, the sum over query tokens of the best document token." style="color: #E4EAE7">
  <title>Three representation formats side by side: a dense model pools the tokens into one vector of d dims and scores with a dot product, a learned sparse model projects them onto the vocabulary with learned term weights and expansion for an inverted index, and a late-interaction model keeps one vector per token and scores with MaxSim, the sum over query tokens of the best document token.</title>
  <rect x="0" y="0" width="960" height="470" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="24" y="44" width="296" height="400" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="172.0" y="66" text-anchor="middle" font-weight="600">one dense vector (bi-encoder)</text>
    <rect x="44" y="80" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="172.0" y="98" text-anchor="middle" font-size="11">a text: tokens t<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> … t</tspan><tspan font-size="8" dy="3">n</tspan></text>
    <path d="M172.0 108 L172.0 124" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="332" y="44" width="296" height="400" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="480.0" y="66" text-anchor="middle" font-weight="600">learned sparse (SPLADE)</text>
    <rect x="352" y="80" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480.0" y="98" text-anchor="middle" font-size="11">a text: tokens t<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> … t</tspan><tspan font-size="8" dy="3">n</tspan></text>
    <path d="M480.0 108 L480.0 124" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="640" y="44" width="296" height="400" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="788.0" y="66" text-anchor="middle" font-weight="600">multi-vector, late interaction (ColBERT)</text>
    <rect x="660" y="80" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="788.0" y="98" text-anchor="middle" font-size="11">a text: tokens t<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> … t</tspan><tspan font-size="8" dy="3">n</tspan></text>
    <path d="M788.0 108 L788.0 124" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="44" y="126" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="172.0" y="144" text-anchor="middle" font-size="11">encoder, then pooling</text>
    <text x="172.0" y="160" text-anchor="middle" font-size="11" fill="#97A59F">mean, [CLS] or last token (§3)</text>
    <path d="M172.0 170 L172.0 186" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="62.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="84.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="106.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="128.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="150.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="172.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
    <rect x="194.0" y="188" width="22" height="22" fill="#16302A" stroke="#4CC5B7" stroke-width="1.2"/>
