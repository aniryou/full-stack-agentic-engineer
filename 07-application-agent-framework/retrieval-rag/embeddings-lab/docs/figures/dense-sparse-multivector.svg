    <text x="402.0" y="228" text-anchor="middle" font-size="11" fill="#7ADACF">heart</text>
    <text x="438.0" y="244" text-anchor="middle" font-size="11" fill="#7ADACF">cardiac</text>
    <text x="534.0" y="228" text-anchor="middle" font-size="11" fill="#7ADACF">…</text>
    <text x="608.0" y="203" font-size="11" fill="#97A59F">|V| dims</text>
    <path d="M480.0 248 L480.0 264" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="352" y="266" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480.0" y="284" text-anchor="middle" font-size="11">learned term weights and term expansion:</text>
    <text x="480.0" y="300" text-anchor="middle" font-size="11" fill="#97A59F">a passage about "cardiac" activates "heart"</text>
    <path d="M480.0 310 L480.0 326" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="352" y="328" width="256" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480.0" y="346" text-anchor="middle" font-size="11">an ordinary inverted index, as for BM25</text>
    <text x="480.0" y="380" text-anchor="middle" font-size="11" fill="#97A59F">the exact-match strength of BM25 plus learned</text>
    <text x="480.0" y="396" text-anchor="middle" font-size="11" fill="#97A59F">semantics, strong out of domain. A FLOPS</text>
    <text x="480.0" y="412" text-anchor="middle" font-size="11" fill="#97A59F">regularizer keeps the vector sparse.</text>
    <rect x="660" y="126" width="256" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="788.0" y="144" text-anchor="middle" font-size="11">the encoder keeps one vector per token,</text>
    <text x="788.0" y="160" text-anchor="middle" font-size="11" fill="#97A59F">each projected to ~128-d, computed in advance</text>
