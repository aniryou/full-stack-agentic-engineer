    <text x="776" y="365" text-anchor="middle" font-size="10" fill="#7ADACF">max</text>
    <rect x="790" y="348" width="28" height="26" fill="none" stroke="#97A59F" stroke-width="0.8" stroke-opacity="0.6"/>
    <rect x="818" y="348" width="28" height="26" fill="none" stroke="#97A59F" stroke-width="0.8" stroke-opacity="0.6"/>
    <path d="M850 361 L868 361" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="874" y="331" font-size="11" fill="#7ADACF">Σ over</text>
    <text x="874" y="345" font-size="11" fill="#7ADACF">the rows</text>
    <text x="788" y="394" text-anchor="middle" font-size="11">MaxSim: score(q, d) = Σ<tspan font-size="8" dy="3">i∈q</tspan><tspan dy="-3"> max</tspan><tspan font-size="8" dy="3">j∈d</tspan><tspan dy="-3"> q</tspan><tspan font-size="8" dy="3">i</tspan><tspan dy="-3"> · d</tspan><tspan font-size="8" dy="3">j</tspan></text>
    <text x="788" y="416" text-anchor="middle" font-size="11" fill="#97A59F">the match stays at the token level:</text>
    <text x="788" y="431" text-anchor="middle" font-size="11" fill="#97A59F">rare terms, entities, out-of-domain robustness.</text>
    <text x="788" y="446" text-anchor="middle" font-size="11" fill="#97A59F">PLAID prunes with centroids, ColBERTv2</text>
    <text x="788" y="461" text-anchor="middle" font-size="11" fill="#97A59F">compresses the residuals.</text>
