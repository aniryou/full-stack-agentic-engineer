<svg xmlns="http://www.w3.org/2000/svg" width="964" height="452" viewBox="0 0 964 452" role="img" aria-label="Inside a transformer: the tokenizer splits the text, the embedding matrix E starts the residual stream, the blocks add to it layer by layer from lexical to semantic content, the unembedding maps the final residual to logits, the logit lens reads a prediction at each layer, and pooling collapses the token states into one embedding vector." style="color: #E4EAE7">
  <title>Inside a transformer: the tokenizer splits the text, the embedding matrix E starts the residual stream, the blocks add to it layer by layer from lexical to semantic content, the unembedding maps the final residual to logits, the logit lens reads a prediction at each layer, and pooling collapses the token states into one embedding vector.</title>
  <rect x="0" y="0" width="964" height="452" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="290" y="18" width="400" height="46" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="490" y="37" text-anchor="middle" font-weight="600">logit lens</text>
    <text x="490" y="54" text-anchor="middle" font-size="11" fill="#97A59F">W<tspan font-size="9" dy="3">U</tspan><tspan dy="-3"> applied to an intermediate residual: the prediction at that layer</tspan></text>
    <rect x="20" y="158" width="108" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="74" y="184" text-anchor="middle" font-weight="600">tokenizer</text>
    <text x="74" y="200" text-anchor="middle" font-size="11" fill="#97A59F">text into tokens</text>
    <text x="74" y="240" text-anchor="middle" font-size="11" fill="#E39A62">numbers, code</text>
    <text x="74" y="255" text-anchor="middle" font-size="11" fill="#E39A62">identifiers, product</text>
    <text x="74" y="270" text-anchor="middle" font-size="11" fill="#E39A62">codes and rare names</text>
    <text x="74" y="285" text-anchor="middle" font-size="11" fill="#E39A62">become fragments</text>
    <rect x="150" y="158" width="100" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="200" y="184" text-anchor="middle" font-weight="600">E</text>
    <text x="200" y="200" text-anchor="middle" font-size="11" fill="#97A59F">|V| × d_model</text>
    <text x="200" y="131" text-anchor="middle" font-size="11" fill="#97A59F">E[token] +</text>
    <text x="200" y="146" text-anchor="middle" font-size="11" fill="#97A59F">positional information</text>
    <rect x="280" y="100" width="420" height="140" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="490" y="121" text-anchor="middle" font-weight="600">the residual stream</text>
    <text x="490" y="138" text-anchor="middle" font-size="11" fill="#7ADACF">the attention and MLP blocks add to it, layer by layer</text>
    <rect x="289" y="148" width="96" height="80" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="337" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">lower layers</text>
    <text x="337" y="192" text-anchor="middle" font-size="11" fill="#7ADACF">surface and</text>
    <text x="337" y="207" text-anchor="middle" font-size="11" fill="#7ADACF">lexical</text>
    <path d="M385 188 L391 188" stroke="#7ADACF" stroke-width="1.4"/>
    <path d="M337 98 L337 66" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="391" y="148" width="96" height="80" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="439" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">middle layers</text>
    <text x="439" y="200" text-anchor="middle" font-size="11" fill="#7ADACF">syntax</text>
    <path d="M487 188 L493 188" stroke="#7ADACF" stroke-width="1.4"/>
    <path d="M439 98 L439 66" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="493" y="148" width="96" height="80" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="541" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">upper layers</text>
    <text x="541" y="200" text-anchor="middle" font-size="11" fill="#7ADACF">semantics</text>
    <path d="M589 188 L595 188" stroke="#7ADACF" stroke-width="1.4"/>
    <path d="M541 98 L541 66" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="595" y="148" width="96" height="80" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="643" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">final layer</text>
    <text x="643" y="192" text-anchor="middle" font-size="11" fill="#7ADACF">the pretraining</text>
    <text x="643" y="207" text-anchor="middle" font-size="11" fill="#7ADACF">objective</text>
    <path d="M643 98 L643 66" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="730" y="158" width="120" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="790" y="184" text-anchor="middle" font-weight="600">W<tspan font-size="9" dy="3">U</tspan></text>
    <text x="790" y="200" text-anchor="middle" font-size="11" fill="#97A59F">the unembedding</text>
    <text x="790" y="240" text-anchor="middle" font-size="11" fill="#97A59F">small models frequently</text>
    <text x="790" y="257" text-anchor="middle" font-size="11" fill="#97A59F">tie W<tspan font-size="8" dy="3">U</tspan><tspan dy="-3"> = E</tspan><tspan font-size="8" dy="-6">T</tspan></text>
    <rect x="872" y="158" width="72" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="908" y="184" text-anchor="middle" font-weight="600">logits</text>
    <text x="908" y="200" text-anchor="middle" font-size="11" fill="#97A59F">over |V|</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M128 188 L148 188" marker-end="url(#arr)"/>
      <path d="M250 188 L278 188" marker-end="url(#arr)"/>
      <path d="M700 188 L728 188" marker-end="url(#arr)"/>
      <path d="M850 188 L870 188" marker-end="url(#arr)"/>
    </g>
    <path d="M490 240 L490 270" fill="none" stroke="#97A59F" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="259" y="272" width="462" height="156" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="490" y="291" text-anchor="middle" font-size="11" fill="#7ADACF">pooling for an embedding model: the token states collapse into one vector</text>
    <rect x="269" y="302" width="142" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="340" y="330" text-anchor="middle" font-weight="600">[CLS] token</text>
    <text x="340" y="346" text-anchor="middle" font-size="11" fill="#97A59F">only if training</text>
    <text x="340" y="361" text-anchor="middle" font-size="11" fill="#97A59F">taught its use</text>
    <rect x="419" y="302" width="142" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="490" y="324" text-anchor="middle" font-weight="600">mean over tokens</text>
    <text x="490" y="340" text-anchor="middle" font-size="11" fill="#97A59F">the robust default</text>
    <text x="490" y="355" text-anchor="middle" font-size="11" fill="#97A59F">for bidirectional</text>
    <text x="490" y="370" text-anchor="middle" font-size="11" fill="#97A59F">encoders</text>
    <rect x="569" y="302" width="142" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="640" y="324" text-anchor="middle" font-weight="600">last token (EOS)</text>
    <text x="640" y="340" text-anchor="middle" font-size="11" fill="#97A59F">after an instruction</text>
    <text x="640" y="355" text-anchor="middle" font-size="11" fill="#97A59F">template, for</text>
    <text x="640" y="370" text-anchor="middle" font-size="11" fill="#97A59F">decoder-only models</text>
    <rect x="269" y="390" width="442" height="28" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="490" y="408" text-anchor="middle" font-size="11" fill="currentColor">mean pooling of a causal model: early tokens know nothing about later tokens</text>
  </g>
</svg>
