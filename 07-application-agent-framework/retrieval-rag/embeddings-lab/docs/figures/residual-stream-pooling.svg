<svg xmlns="http://www.w3.org/2000/svg" width="940" height="456" viewBox="0 0 940 456" role="img" aria-label="Inside a transformer: the tokenizer splits the text, the embedding matrix E starts the residual stream, the blocks add to it layer by layer from lexical to semantic content, the unembedding maps the final residual to logits, the logit lens reads a prediction at each layer, and pooling collapses the token states into one embedding vector." style="color: #E4EAE7">
  <title>Inside a transformer: the tokenizer splits the text, the embedding matrix E starts the residual stream, the blocks add to it layer by layer from lexical to semantic content, the unembedding maps the final residual to logits, the logit lens reads a prediction at each layer, and pooling collapses the token states into one embedding vector.</title>
  <rect x="0" y="0" width="940" height="456" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="330" y="30" width="320" height="44" rx="6" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="490.0" y="48" text-anchor="middle" font-weight="600">logit lens</text>
    <text x="490.0" y="64" text-anchor="middle" font-size="11" fill="#97A59F">W<tspan font-size="9" dy="3">U</tspan><tspan dy="-3"> applied to an intermediate residual: the prediction at that layer</tspan></text>
    <rect x="24" y="160" width="126" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="87.0" y="186" text-anchor="middle" font-weight="600">tokenizer</text>
    <text x="87.0" y="202" text-anchor="middle" font-size="11" fill="#97A59F">text into tokens</text>
    <text x="87" y="240" text-anchor="middle" font-size="11" fill="#E39A62">numbers, code identifiers,</text>
    <text x="87" y="255" text-anchor="middle" font-size="11" fill="#E39A62">product codes and rare</text>
    <text x="87" y="270" text-anchor="middle" font-size="11" fill="#E39A62">names become fragments</text>
    <rect x="180" y="160" width="110" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="235.0" y="186" text-anchor="middle" font-weight="600">E</text>
    <text x="235.0" y="202" text-anchor="middle" font-size="11" fill="#97A59F">|V| × d_model</text>
    <text x="235" y="148" text-anchor="middle" font-size="11" fill="#97A59F">E[token] + positional information</text>
    <rect x="330" y="110" width="320" height="160" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="490" y="130" text-anchor="middle" font-weight="600">the residual stream</text>
    <text x="490" y="146" text-anchor="middle" font-size="11" fill="#7ADACF">the attention and MLP blocks add to it, layer by layer</text>
    <rect x="338" y="156" width="72" height="100" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="374" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">lower layers</text>
    <text x="374" y="197" text-anchor="middle" font-size="11" fill="#7ADACF">surface and</text>
    <text x="374" y="212" text-anchor="middle" font-size="11" fill="#7ADACF">lexical</text>
    <path d="M410 206 L415 206" stroke="#7ADACF" stroke-width="1.4"/>
    <path d="M374 108 L374 78" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="415" y="156" width="72" height="100" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="451" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">middle layers</text>
    <text x="451" y="197" text-anchor="middle" font-size="11" fill="#7ADACF">syntax</text>
    <path d="M487 206 L492 206" stroke="#7ADACF" stroke-width="1.4"/>
    <path d="M451 108 L451 78" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="492" y="156" width="72" height="100" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="528" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">upper layers</text>
    <text x="528" y="197" text-anchor="middle" font-size="11" fill="#7ADACF">semantics</text>
    <path d="M564 206 L569 206" stroke="#7ADACF" stroke-width="1.4"/>
    <path d="M528 108 L528 78" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="569" y="156" width="72" height="100" rx="4" fill="none" stroke="#7ADACF" stroke-width="1" stroke-opacity="0.8"/>
    <text x="605" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#7ADACF">final layer</text>
    <text x="605" y="197" text-anchor="middle" font-size="11" fill="#7ADACF">the pretraining</text>
    <text x="605" y="212" text-anchor="middle" font-size="11" fill="#7ADACF">objective</text>
    <path d="M605 108 L605 78" fill="none" stroke="#4CC5B7" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
    <rect x="690" y="160" width="100" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="740.0" y="186" text-anchor="middle" font-weight="600">W<tspan font-size="9" dy="3">U</tspan></text>
    <text x="740.0" y="202" text-anchor="middle" font-size="11" fill="#97A59F">the unembedding</text>
    <text x="740" y="238" text-anchor="middle" font-size="11" fill="#97A59F">small models: W<tspan font-size="8" dy="3">U</tspan><tspan dy="-3"> = E</tspan><tspan font-size="8" dy="-6">T</tspan></text>
    <rect x="820" y="160" width="96" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="868.0" y="186" text-anchor="middle" font-weight="600">logits</text>
    <text x="868.0" y="202" text-anchor="middle" font-size="11" fill="#97A59F">over |V|</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M150 190 L178 190" marker-end="url(#arr)"/>
      <path d="M290 190 L328 190" marker-end="url(#arr)"/>
      <path d="M650 190 L688 190" marker-end="url(#arr)"/>
      <path d="M790 190 L818 190" marker-end="url(#arr)"/>
    </g>
    <text x="250" y="306" font-size="11" fill="#7ADACF">pooling for an embedding model: the token states collapse into one vector</text>
    <path d="M345 270 L345 314" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M505 270 L505 314" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <path d="M665 270 L665 314" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <rect x="270" y="316" width="150" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="345.0" y="342" text-anchor="middle" font-weight="600">[CLS] token</text>
    <text x="345.0" y="358" text-anchor="middle" font-size="11" fill="#97A59F">only if training</text>
    <text x="345.0" y="374" text-anchor="middle" font-size="11" fill="#97A59F">taught its use</text>
    <rect x="430" y="316" width="150" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="505.0" y="334" text-anchor="middle" font-weight="600">mean over tokens</text>
    <text x="505.0" y="350" text-anchor="middle" font-size="11" fill="#97A59F">the robust default</text>
    <text x="505.0" y="366" text-anchor="middle" font-size="11" fill="#97A59F">for bidirectional</text>
    <text x="505.0" y="382" text-anchor="middle" font-size="11" fill="#97A59F">encoders</text>
    <rect x="590" y="316" width="150" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="665.0" y="334" text-anchor="middle" font-weight="600">last token (EOS)</text>
    <text x="665.0" y="350" text-anchor="middle" font-size="11" fill="#97A59F">after an instruction</text>
    <text x="665.0" y="366" text-anchor="middle" font-size="11" fill="#97A59F">template, for</text>
    <text x="665.0" y="382" text-anchor="middle" font-size="11" fill="#97A59F">decoder-only models</text>
    <rect x="270" y="404" width="470" height="32" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="505.0" y="424" text-anchor="middle" font-size="11" fill="currentColor">mean pooling of a causal model: early tokens know nothing about later tokens</text>
  </g>
</svg>
