<svg xmlns="http://www.w3.org/2000/svg" width="960" height="374" viewBox="0 0 960 374" role="img" aria-label="The retrieval pipeline of §12: the ingest path parses, chunks, embeds and upserts the source content into the vector database, and the query path embeds the query, retrieves candidates from the database, fuses the lists, reranks the candidates and logs the outcomes." style="color: #E4EAE7">
  <title>The retrieval pipeline of §12: the ingest path parses, chunks, embeds and upserts the source content into the vector database, and the query path embeds the query, retrieves candidates from the database, fuses the lists, reranks the candidates and logs the outcomes.</title>
  <rect x="0" y="0" width="960" height="374" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="12" y="12" width="936" height="112" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="26" y="30" font-size="11.5" fill="#97A59F">ingest</text>
    <rect x="12" y="238" width="936" height="122" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="26" y="256" font-size="11.5" fill="#97A59F">query</text>
    <rect x="24" y="42" width="158" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="103" y="70.5" text-anchor="middle" font-weight="600">raw source</text>
    <text x="103" y="88.5" text-anchor="middle" font-size="11.5" fill="#97A59F">system of record</text>
    <rect x="212" y="42" width="158" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="291" y="79.5" text-anchor="middle" font-weight="600">parse and clean</text>
    <rect x="400" y="42" width="158" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="479" y="70.5" text-anchor="middle" font-weight="600">chunk (§13)</text>
    <text x="479" y="88.5" text-anchor="middle" font-size="11.5" fill="#97A59F">attach metadata</text>
    <rect x="588" y="42" width="158" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="667" y="70.5" text-anchor="middle" font-weight="600">embed in batches</text>
    <text x="667" y="88.5" text-anchor="middle" font-size="11.5" fill="#97A59F">model name + version</text>
    <rect x="776" y="42" width="158" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="855" y="70.5" text-anchor="middle" font-weight="600">upsert</text>
    <text x="855" y="88.5" text-anchor="middle" font-size="11.5" fill="#97A59F">idempotent ids</text>
    <rect x="360" y="152" width="240" height="56" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="480" y="175.5" text-anchor="middle" font-weight="600">the vector database</text>
    <text x="480" y="193.5" text-anchor="middle" font-size="11.5" fill="#7ADACF">vectors, payload, filter indexes</text>
    <rect x="24" y="268" width="108" height="76" rx="18" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="78" y="310.5" text-anchor="middle" font-weight="600">a query</text>
    <rect x="158" y="268" width="108" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="212" y="301.5" text-anchor="middle" font-weight="600">rewrite</text>
    <text x="212" y="319.5" text-anchor="middle" font-size="11.5" fill="#97A59F">optional</text>
    <rect x="292" y="268" width="108" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="346" y="292.5" text-anchor="middle" font-weight="600">embed</text>
    <text x="346" y="310.5" text-anchor="middle" font-size="11.5" fill="#97A59F">same model</text>
    <text x="346" y="328.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">20–50 ms</text>
    <rect x="426" y="268" width="108" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="480" y="292.5" text-anchor="middle" font-weight="600">retrieve</text>
    <text x="480" y="310.5" text-anchor="middle" font-size="11.5" fill="#97A59F">candidates</text>
    <text x="480" y="328.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">5–30 ms</text>
    <rect x="560" y="268" width="108" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="614" y="301.5" text-anchor="middle" font-weight="600">fuse (RRF)</text>
    <text x="614" y="319.5" text-anchor="middle" font-size="11.5" fill="#97A59F">the lists</text>
    <rect x="694" y="268" width="108" height="76" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="748" y="292.5" text-anchor="middle" font-weight="600">rerank</text>
    <text x="748" y="310.5" text-anchor="middle" font-size="11.5" fill="#97A59F">the final k</text>
    <text x="748" y="328.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#E39A62">50–200 ms</text>
    <rect x="828" y="268" width="108" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="882" y="301.5" text-anchor="middle" font-weight="600">assemble</text>
    <text x="882" y="319.5" text-anchor="middle" font-size="11.5" fill="#97A59F">context, log</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M182 75 L210 75" marker-end="url(#arr)"/>
      <path d="M370 75 L398 75" marker-end="url(#arr)"/>
      <path d="M558 75 L586 75" marker-end="url(#arr)"/>
      <path d="M746 75 L774 75" marker-end="url(#arr)"/>
      <path d="M855 108 L855 180 L602 180" marker-end="url(#arr)"/>
      <path d="M132 306 L156 306" marker-end="url(#arr)"/>
      <path d="M266 306 L290 306" marker-end="url(#arr)"/>
      <path d="M400 306 L424 306" marker-end="url(#arr)"/>
      <path d="M534 306 L558 306" marker-end="url(#arr)"/>
      <path d="M668 306 L692 306" marker-end="url(#arr)"/>
      <path d="M802 306 L826 306" marker-end="url(#arr)"/>
    </g>
    <path d="M480 210 L480 266" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-start="url(#arrA)" marker-end="url(#arrA)"/>
    <text x="490" y="232" font-size="11" fill="#7ADACF">dense ANN with filters</text>
  </g>
</svg>
