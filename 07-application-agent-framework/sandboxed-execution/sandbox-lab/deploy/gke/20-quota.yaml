# ResourceQuota and LimitRange for the sandbox namespace. (GKE Sandbox target: runtimeClassName gvisor, images from Artifact Registry - apply.sh substitutes LOCATION and PROJECT_ID.)
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: sandbox
spec:
  hard:
    pods: '20'
    requests.cpu: '10'
    limits.cpu: '10'
    requests.memory: 6400Mi
    limits.memory: 6400Mi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 4Gi
    count/jobs.batch: '100'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
  namespace: sandbox
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 320Mi
        ephemeral-storage: 128Mi
      defaultRequest:
        cpu: 500m
        memory: 320Mi
        ephemeral-storage: 128Mi
      max:
        cpu: '1'
        memory: 1Gi
        ephemeral-storage: 512Mi
