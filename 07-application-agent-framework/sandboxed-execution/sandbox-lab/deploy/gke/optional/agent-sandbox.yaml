# OPTIONAL: the warm pool as kubernetes-sigs/agent-sandbox objects (install the controller first:
# deploy/gke/README.md). SandboxTemplate + SandboxWarmPool + one SandboxClaim.
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-sandbox
  namespace: sandbox
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
        app.kubernetes.io/part-of: sandboxlab
        app: agent-sandbox
    spec:
      runtimeClassName: gvisor
      serviceAccountName: sandbox-exec
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 0
      hostAliases:
        - ip: 10.30.0.200
          hostnames:
            - egress-proxy
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        options:
          - name: ndots
            value: '1'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65534
      containers:
        - name: run
          image: LOCATION-docker.pkg.dev/PROJECT_ID/sandbox/python:3.12-slim
          command:
            - python3
            - -I
            - -c
            - |-
              import time
              while True:
                  time.sleep(3600)
          workingDir: /work
          env:
            - name: SANDBOX_PROXY_URL
              value: http://egress-proxy:8080
          resources:
            requests:
              cpu: 500m
              memory: 320Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 320Mi
              cpu: 500m
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: wrapper
              mountPath: /opt/sandbox
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: wrapper
          configMap:
            name: sandbox-wrapper
            defaultMode: 292
  networkPolicyManagement: Unmanaged
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-sandbox-pool
  namespace: sandbox
spec:
  replicas: 2
  sandboxTemplateRef:
    name: python-sandbox
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: example-claim
  namespace: sandbox
spec:
  warmPoolRef:
    name: python-sandbox-pool
