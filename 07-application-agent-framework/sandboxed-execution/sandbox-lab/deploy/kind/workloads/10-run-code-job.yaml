# One execution as one Job (what the Runner creates). Its pod reaches only the proxy.
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: run-example-0001
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: sandboxlab
    sandboxlab/execution-id: example-0001
    sandboxlab/mode: one-shot
  annotations:
    sandboxlab/idempotency-key: turn-1:step-1:call-0:9f2c
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
        app.kubernetes.io/part-of: sandboxlab
        sandboxlab/execution-id: example-0001
        sandboxlab/mode: one-shot
    spec:
      runtimeClassName: sandbox-runc
      serviceAccountName: sandbox-exec
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 0
      hostAliases:
        - ip: 10.96.0.200
          hostnames:
            - egress-proxy
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        options:
          - name: ndots
            value: '1'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65534
      containers:
        - name: run
          image: python:3.12-slim
          command:
            - python3
            - -I
            - /opt/sandbox/wrapper.py
            - --code-env
            - SANDBOX_CODE
            - --workspace
            - /work
            - --budgets
            - '{"cpu_s":2.0,"wall_s":10.0,"memory_mib":256,"file_mib":8,"nofile":64,"output_bytes":65536,"output_kill_bytes":1048576}'
            - --pass-env
            - SANDBOX_PROXY_URL
          workingDir: /work
          env:
            - name: SANDBOX_CODE
              value: |
                import json, os, urllib.request
                print(sum(range(10)))
                print(json.load(urllib.request.urlopen(os.environ['SANDBOX_PROXY_URL'] + '/api-stub/whoami')))
            - name: SANDBOX_PROXY_URL
              value: http://egress-proxy:8080
          resources:
            requests:
              cpu: 500m
              memory: 320Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 320Mi
              cpu: 500m
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: wrapper
              mountPath: /opt/sandbox
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: wrapper
          configMap:
            name: sandbox-wrapper
            defaultMode: 292
