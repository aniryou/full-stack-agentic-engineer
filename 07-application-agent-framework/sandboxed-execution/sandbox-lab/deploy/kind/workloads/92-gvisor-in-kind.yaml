# MUST FAIL on kind: a RuntimeClass with handler runsc is accepted, and its pod ends Failed (kind's containerd has no runsc handler). On a gVisor-capable cluster the pod prints the Sentry's dmesg.
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: sandboxlab
handler: runsc
---
apiVersion: v1
kind: Pod
metadata:
  name: needs-gvisor
  namespace: sandbox-demo
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 65534
  containers:
    - name: probe
      image: busybox:1.38.0
      command:
        - sh
        - -c
        - dmesg | head -1; uname -a
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 32Mi
          cpu: 50m
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
