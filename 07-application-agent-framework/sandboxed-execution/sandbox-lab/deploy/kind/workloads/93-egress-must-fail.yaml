# MUST FAIL (the direct connections): a sandbox pod that reaches the api-stub and kube-dns directly, bypassing the proxy.
# If either prints CONNECTED, NetworkPolicy is not enforced on this cluster (kindnetd fails open) - see README.
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: run-egress-check-0001
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox
    app.kubernetes.io/part-of: sandboxlab
    sandboxlab/execution-id: egress-check-0001
    sandboxlab/mode: one-shot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
        app.kubernetes.io/part-of: sandboxlab
        sandboxlab/execution-id: egress-check-0001
        sandboxlab/mode: one-shot
    spec:
      runtimeClassName: sandbox-runc
      serviceAccountName: sandbox-exec
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 0
      hostAliases:
        - ip: 10.96.0.200
          hostnames:
            - egress-proxy
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        options:
          - name: ndots
            value: '1'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65534
      containers:
        - name: run
          image: python:3.12-slim
          command:
            - python3
            - -I
            - /opt/sandbox/wrapper.py
            - --code-env
            - SANDBOX_CODE
            - --workspace
            - /work
            - --budgets
            - '{"cpu_s":2.0,"wall_s":10.0,"memory_mib":256,"file_mib":8,"nofile":64,"output_bytes":65536,"output_kill_bytes":1048576}'
            - --pass-env
            - SANDBOX_PROXY_URL
          workingDir: /work
          env:
            - name: SANDBOX_CODE
              value: |
                import os, socket, urllib.request
                try:
                    r = urllib.request.urlopen(os.environ['SANDBOX_PROXY_URL'] + '/api-stub/whoami', timeout=4)
                    print('via-proxy: reachable', r.status)
                except Exception as e:
                    print('via-proxy: FAILED', type(e).__name__)
                for name, host, port in (('direct-to-api-stub', '10.96.0.201', 8081),
                                         ('direct-to-kube-dns', '10.96.0.10', 53)):
                    try:
                        socket.create_connection((host, port), timeout=2).close()
                        print(f'{name} {host}:{port}: CONNECTED')
                    except OSError as e:
                        print(f'{name} {host}:{port}: blocked ({type(e).__name__})')
            - name: SANDBOX_PROXY_URL
              value: http://egress-proxy:8080
          resources:
            requests:
              cpu: 500m
              memory: 320Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 320Mi
              cpu: 500m
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: wrapper
              mountPath: /opt/sandbox
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: wrapper
          configMap:
            name: sandbox-wrapper
            defaultMode: 292
