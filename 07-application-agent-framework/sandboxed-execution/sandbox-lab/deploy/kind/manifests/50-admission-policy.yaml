# ValidatingAdmissionPolicies: sandbox pod hardening, and budgets on sandbox Jobs.
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxlab-pod-hardening
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers
  variables:
    - name: containers
      expression: object.spec.containers
    - name: initContainers
      expression: 'has(object.spec.initContainers) ? object.spec.initContainers : []'
    - name: ephemeralContainers
      expression: 'has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []'
  validations:
    - expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName in ['sandbox-runc']
      message: sandbox pods must set runtimeClassName to one of ['sandbox-runc']
      reason: Forbidden
    - expression: has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: 'sandbox pods must set automountServiceAccountToken: false (no Kubernetes API credentials inside)'
      reason: Forbidden
    - expression: '!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID)
        && !(has(object.spec.hostIPC) && object.spec.hostIPC)'
      message: sandbox pods must not share the node's network, PID or IPC namespace
      reason: Forbidden
    - expression: has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot
        == true && has(object.spec.securityContext.runAsUser) && object.spec.securityContext.runAsUser != 0
      message: 'sandbox pods must set pod-level runAsNonRoot: true and a numeric non-zero runAsUser'
      reason: Forbidden
    - expression: has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type
        in ['RuntimeDefault', 'Localhost']
      message: sandbox pods must set a pod-level seccompProfile of RuntimeDefault or Localhost
      reason: Forbidden
    - expression: variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
        && c.securityContext.allowPrivilegeEscalation == false) && variables.initContainers.all(c, has(c.securityContext)
        && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
        && variables.ephemeralContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
        && c.securityContext.allowPrivilegeEscalation == false)
      message: 'every container must set allowPrivilegeEscalation: false (it defaults to true)'
      reason: Forbidden
    - expression: variables.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
        && c.securityContext.readOnlyRootFilesystem == true) && variables.initContainers.all(c, has(c.securityContext)
        && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true) &&
        variables.ephemeralContainers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
        && c.securityContext.readOnlyRootFilesystem == true)
      message: 'every container must set readOnlyRootFilesystem: true (write to the sized emptyDir only)'
      reason: Forbidden
    - expression: variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop)
        && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add)
        == 0)) && variables.initContainers.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
        && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add)
        || size(c.securityContext.capabilities.add) == 0)) && variables.ephemeralContainers.all(c, has(c.securityContext)
        && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop
        && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: every container must drop ALL capabilities and add none
      reason: Forbidden
    - expression: variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits
        && 'memory' in c.resources.limits) && variables.initContainers.all(c, has(c.resources) && has(c.resources.limits)
        && 'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: every container must have cpu and memory limits (the LimitRange fills defaults before this runs)
      reason: Forbidden
    - expression: variables.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom)
        || !has(e.valueFrom.secretKeyRef)))) && variables.initContainers.all(c, !has(c.envFrom) && (!has(c.env)
        || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)))) && variables.ephemeralContainers.all(c,
        !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))))
      message: 'no Secrets in a sandbox''s environment: credentials live in the egress proxy'
      reason: Forbidden
    - expression: '!has(object.spec.volumes) || object.spec.volumes.all(v, (has(v.emptyDir) && has(v.emptyDir.sizeLimit))
        || has(v.configMap))'
      message: sandbox pods may mount only sized emptyDir volumes and ConfigMaps (no Secrets, no hostPath, no PVCs)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxlab-pod-hardening
spec:
  policyName: sandboxlab-pod-hardening
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - sandbox
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxlab-job-budgets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - jobs
  validations:
    - expression: has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds <= 600
      message: sandbox Jobs must set activeDeadlineSeconds <= 600
      reason: Forbidden
    - expression: object.spec.backoffLimit == 0
      message: 'sandbox Jobs must set backoffLimit: 0 (the default is 6: model-generated code would run up to 7
        times)'
      reason: Forbidden
    - expression: has(object.spec.ttlSecondsAfterFinished)
      message: sandbox Jobs must set ttlSecondsAfterFinished (finished Jobs and their Pods are deleted)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxlab-job-budgets
spec:
  policyName: sandboxlab-job-budgets
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - sandbox
