# Identities: sandbox-exec (runs the code; no Role, no token) and agent-runner (creates Jobs, reads logs, execs into warm pods; sandbox namespace only).
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-exec
  namespace: sandbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
  namespace: sandbox-control
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-runner
  namespace: sandbox
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runner
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-runner
subjects:
  - kind: ServiceAccount
    name: agent-runner
    namespace: sandbox-control
