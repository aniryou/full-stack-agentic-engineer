# The execution-contract wrapper (sandboxlab/wrapper.py), mounted read-only into sandbox pods.
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-wrapper
  namespace: sandbox
data:
  wrapper.py: "\"\"\"wrapper.py \u2014 the execution contract, enforced from *inside* whatever isolation you chose.\n\
    \nOne idea: the same ~250-line, standard-library file runs untrusted code at every level of the\nisolation ladder\
    \ (PRIMER \xA72) \u2014 as a plain process on a laptop, as the entrypoint of a hardened\n``docker run``, inside\
    \ a Kubernetes pod under gVisor \u2014 and always returns the same result shape\n(PRIMER \xA73 \"The execution\
    \ contract\"). Isolation decides *what the code can reach*; the wrapper\ndecides *how much it may use and what\
    \ comes back*: CPU seconds, wall time, address space, file\nsize, open files, processes, output bytes, and one\
    \ exit reason.\n\n    python3 -I wrapper.py --stdin --budgets '{\"cpu_s\": 2, \"wall_s\": 5}' < code.py\n  \
    \  python3 -I wrapper.py --code-env SANDBOX_CODE --workspace /work        # inside a pod\n\nIt prints exactly\
    \ one line to stdout: ``@@SANDBOX_RESULT@@ {json}``. Everything the untrusted\ncode printed is inside that JSON,\
    \ truncated to the budget \u2014 so the result survives ``docker run``,\n``kubectl logs`` and ``kubectl exec``\
    \ without any other channel.\n\nDesign notes (the pitfalls this file exists to avoid):\n* It is **single-threaded**,\
    \ so ``preexec_fn`` is safe here (it is not in a threaded parent).\n* The child gets a **new session** and the\
    \ wall timeout kills the **process group** \u2014 killing\n  only the direct child leaves grandchildren running\
    \ (``subprocess.run(timeout=)`` does that).\n* ``RLIMIT_CPU`` counts CPU seconds; sleeping code never reaches\
    \ it, so there is a wall clock too.\n  Soft limit < hard limit: SIGXCPU first, SIGKILL one second later.\n*\
    \ ``RLIMIT_NPROC`` counts **every process of the real UID, system-wide**, and is ignored for root.\n  It only\
    \ means something with a dedicated UID (``--uid``); inside containers use the pids cgroup.\n* ``RLIMIT_AS``\
    \ is virtual memory: too low and the interpreter (or numpy's OpenBLAS) cannot start.\n* A process group is advisory:\
    \ code can call ``setsid()`` and leave it. With a dedicated UID\n  (``--kill-uid``) the wrapper sweeps every\
    \ process of that UID after the run \u2014 the process-level\n  stand-in for what a container's cgroup or PID\
    \ namespace does for free.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport\
    \ os\nimport selectors\nimport signal\nimport subprocess\nimport sys\nimport time\n\nMARKER = \"@@SANDBOX_RESULT@@\"\
    \nDEFAULTS = {\n    \"cpu_s\": 2.0,             # RLIMIT_CPU (soft); hard = soft + 1\n    \"wall_s\": 5.0, \
    \           # wall clock, then SIGKILL to the process group\n    \"memory_mib\": 256,        # RLIMIT_AS (0\
    \ = do not set: containers use the memory cgroup)\n    \"pids\": 32,               # RLIMIT_NPROC headroom (only\
    \ with --nproc)\n    \"file_mib\": 8,            # RLIMIT_FSIZE, per file\n    \"nofile\": 64,             #\
    \ RLIMIT_NOFILE\n    \"output_bytes\": 65536,    # kept per stream; the rest is counted and dropped\n    \"\
    output_kill_bytes\": 1048576,  # total output that ends the run (exit reason output_limit)\n}\nCLEAN_PATH =\
    \ \"/usr/local/bin:/usr/bin:/bin\"\n\n\ndef _uid_process_count(uid: int) -> int:\n    \"\"\"Processes whose\
    \ real UID is ``uid`` (Linux ``/proc``); -1 where there is no ``/proc``.\"\"\"\n    if not os.path.isdir(\"\
    /proc/self\"):\n        return -1\n    n = 0\n    for pid in os.listdir(\"/proc\"):\n        if not pid.isdigit():\n\
    \            continue\n        try:\n            with open(f\"/proc/{pid}/status\") as f:\n                for\
    \ line in f:\n                    if line.startswith(\"Uid:\"):\n                        n += int(line.split()[1])\
    \ == uid\n                        break\n        except OSError:\n            continue\n    return n\n\n\ndef\
    \ _kill_uid(uid: int) -> int:\n    \"\"\"SIGKILL every live process whose real UID is ``uid``; returns how many\
    \ distinct ones.\"\"\"\n    killed: set[int] = set()\n    for _ in range(3):   # a process can fork while we\
    \ sweep; repeat until nothing live is left\n        found = 0\n        for pid in os.listdir(\"/proc\"):\n \
    \           if not pid.isdigit() or int(pid) == os.getpid():\n                continue\n            try:\n \
    \               with open(f\"/proc/{pid}/status\") as f:\n                    fields = dict(l.split(\":\", 1)\
    \ for l in f if \":\" in l)\n                real, state = int(fields[\"Uid\"].split()[0]), fields[\"State\"\
    ].split()[0]\n            except (OSError, KeyError, ValueError, IndexError):\n                continue\n  \
    \          if real == uid and state != \"Z\":          # zombies are already dead\n                found +=\
    \ 1\n                killed.add(int(pid))\n                try:\n                    os.kill(int(pid), signal.SIGKILL)\n\
    \                except OSError:\n                    pass\n        if not found:\n            break\n     \
    \   time.sleep(0.05)\n    return len(killed)\n\n\ndef _no_new_privs() -> bool:\n    \"\"\"prctl(PR_SET_NO_NEW_PRIVS):\
    \ setuid binaries and file capabilities stop working (Linux).\"\"\"\n    try:\n        import ctypes\n     \
    \   return ctypes.CDLL(None, use_errno=True).prctl(38, 1, 0, 0, 0) == 0\n    except Exception:\n        return\
    \ False\n\n\ndef _limits(b: dict, uid: int | None, gid: int | None, nproc: int | None):\n    \"\"\"Runs in the\
    \ child between fork and exec. Order matters: limits first, identity last.\"\"\"\n    import resource\n\n  \
    \  def lim(res, soft, hard=None):\n        try:\n            resource.setrlimit(res, (int(soft), int(hard if\
    \ hard is not None else soft)))\n        except (ValueError, OSError):\n            pass   # e.g. RLIMIT_AS\
    \ on macOS; the result's notes say which limits were applied\n\n    def apply():\n        lim(resource.RLIMIT_CPU,\
    \ max(1, int(b[\"cpu_s\"] + 0.999)), max(1, int(b[\"cpu_s\"] + 0.999)) + 1)\n        if b.get(\"memory_mib\"\
    ):\n            lim(resource.RLIMIT_AS, b[\"memory_mib\"] * 2**20)\n        lim(resource.RLIMIT_FSIZE, b[\"\
    file_mib\"] * 2**20)\n        lim(resource.RLIMIT_NOFILE, b[\"nofile\"])\n        lim(resource.RLIMIT_CORE,\
    \ 0)\n        if nproc is not None:\n            lim(resource.RLIMIT_NPROC, nproc)\n        _no_new_privs()\n\
    \        if gid is not None:\n            os.setgroups([])\n            os.setgid(gid)\n        if uid is not\
    \ None:\n            os.setuid(uid)\n    return apply\n\n\ndef classify(rc: int | None, preset: str | None,\
    \ stderr_tail: str, cpu_s: float | None, cpu_budget: float) -> str:\n    \"\"\"One exit reason per run, in the\
    \ primer's vocabulary (PRIMER \xA73; ``sandboxcore.contract.EXIT_REASONS``).\n    The order encodes which evidence\
    \ wins. Reasons read from ``stderr_tail`` are the program's own say-so\n    (it can print ``MemoryError`` and\
    \ exit 1); signals and the presets are observed by the wrapper.\"\"\"\n    if preset:\n        return preset\n\
    \    if rc is None:\n        return \"sandbox_error\"\n    if rc == 0:\n        return \"ok\"\n    if rc < 0:\n\
    \        sig = -rc\n        if sig == signal.SIGXCPU or (sig == signal.SIGKILL and cpu_s is not None and cpu_s\
    \ >= cpu_budget - 0.05):\n            return \"cpu_time\"\n        if sig == getattr(signal, \"SIGXFSZ\", 25):\n\
    \            return \"file_too_large\"\n        return \"killed\"\n    if \"MemoryError\" in stderr_tail or\
    \ \"Cannot allocate memory\" in stderr_tail:\n        return \"memory\"\n    if \"[Errno 27]\" in stderr_tail\
    \ or \"File too large\" in stderr_tail:\n        return \"file_too_large\"\n    if \"[Errno 11]\" in stderr_tail\
    \ and (\"fork\" in stderr_tail or \"BlockingIOError\" in stderr_tail):\n        return \"pids\"\n    return\
    \ \"error\"\n\n\ndef run(code: str, budgets: dict, workspace: str, *, uid: int | None = None, gid: int | None\
    \ = None,\n        use_nproc: bool = False, kill_uid: bool = False, extra_env: dict | None = None,\n       \
    \ python: str | None = None) -> dict:\n    b = {**DEFAULTS, **(budgets or {})}\n    os.makedirs(workspace, exist_ok=True)\n\
    \    main = os.path.join(workspace, \"main.py\")\n    with open(main, \"w\") as f:\n        f.write(code)\n\
    \    notes = []\n    if uid is not None:\n        try:\n            os.chown(workspace, uid, gid if gid is not\
    \ None else uid)\n            os.chown(main, uid, gid if gid is not None else uid)\n        except OSError as\
    \ e:\n            notes.append(f\"could not chown the workspace to uid {uid}: {e}\")\n    nproc = None\n   \
    \ if use_nproc:\n        who = uid if uid is not None else os.getuid()\n        if who == 0:\n            notes.append(\"\
    RLIMIT_NPROC not applied: it is not enforced for root\")\n        else:\n            base = _uid_process_count(who)\n\
    \            if base < 0:\n                notes.append(\"RLIMIT_NPROC not applied: no /proc to count this UID's\
    \ processes\")\n            else:\n                nproc = base + int(b[\"pids\"])\n                notes.append(f\"\
    RLIMIT_NPROC = {nproc} ({base} processes of uid {who} already running + {b['pids']})\")\n    env = {\"PATH\"\
    : CLEAN_PATH, \"HOME\": workspace, \"TMPDIR\": workspace, \"LANG\": \"C.UTF-8\",\n           \"OPENBLAS_NUM_THREADS\"\
    : \"1\", \"PYTHONDONTWRITEBYTECODE\": \"1\", \"PYTHONUNBUFFERED\": \"1\"}\n    env.update(extra_env or {})\n\
    \    before = _rusage_children()\n    oom_before = _oom_kills()\n    t0 = time.monotonic()\n    try:\n     \
    \   p = subprocess.Popen([python or sys.executable, \"-I\", main], cwd=workspace, env=env,\n               \
    \              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,\n                 \
    \            start_new_session=True, preexec_fn=_limits(b, uid, gid, nproc))\n    except OSError as e:\n   \
    \     return {\"exit_reason\": \"sandbox_error\", \"returncode\": None, \"stdout\": \"\", \"stderr\": str(e),\n\
    \                \"stdout_bytes\": 0, \"stderr_bytes\": 0, \"stdout_truncated\": False, \"stderr_truncated\"\
    : False,\n                \"wall_s\": 0.0, \"cpu_s\": None, \"max_rss_kib\": None, \"stragglers_killed\": 0,\n\
    \                \"budgets\": b, \"notes\": notes + [f\"could not start: {e}\"]}\n    keep = int(b[\"output_bytes\"\
    ])\n    out = {\"stdout\": bytearray(), \"stderr\": bytearray()}\n    total = {\"stdout\": 0, \"stderr\": 0}\n\
    \    sel = selectors.DefaultSelector()\n    sel.register(p.stdout, selectors.EVENT_READ, \"stdout\")\n    sel.register(p.stderr,\
    \ selectors.EVENT_READ, \"stderr\")\n    deadline = t0 + float(b[\"wall_s\"])\n    preset = None\n    exited_at\
    \ = None\n    while sel.get_map():\n        now = time.monotonic()\n        remaining = deadline - now\n   \
    \     if remaining <= 0:\n            preset = \"wall_timeout\"\n            break\n        if exited_at is\
    \ None and p.poll() is not None:\n            exited_at = now\n        if exited_at is not None and now - exited_at\
    \ > 0.3:\n            # the main process is gone but something it started still holds stdout/stderr open\n \
    \           notes.append(\"a background process kept the output pipes open after the main process exited\")\n\
    \            break\n        for key, _ in sel.select(timeout=min(remaining, 0.25)):\n            chunk = os.read(key.fileobj.fileno(),\
    \ 65536)\n            if not chunk:\n                sel.unregister(key.fileobj)\n                continue\n\
    \            name = key.data\n            total[name] += len(chunk)\n            room = keep - len(out[name])\n\
    \            if room > 0:\n                out[name] += chunk[:room]\n        if total[\"stdout\"] + total[\"\
    stderr\"] > int(b[\"output_kill_bytes\"]):\n            preset = \"output_limit\"\n            break\n    if\
    \ preset:\n        _killpg(p.pid)\n    try:\n        rc = p.wait(timeout=5)\n    except subprocess.TimeoutExpired:\n\
    \        _killpg(p.pid)\n        rc = p.wait()\n    wall = time.monotonic() - t0\n    _killpg(p.pid)       \
    \               # anything left in the child's process group\n    stragglers = _kill_uid(uid) if (kill_uid and\
    \ uid is not None) else 0\n    if stragglers:\n        notes.append(f\"killed {stragglers} process(es) of uid\
    \ {uid} that outlived the run (setsid or double fork)\")\n    after = _rusage_children()\n    cpu = None if\
    \ before is None or after is None else round(after[0] - before[0], 3)\n    rss = None if after is None else\
    \ after[1]\n    stderr_text = out[\"stderr\"].decode(\"utf-8\", \"replace\")\n    oom_after = _oom_kills()\n\
    \    if oom_before is not None and oom_after is not None and oom_after > oom_before and not preset:\n      \
    \  preset = \"memory\"               # the cgroup's OOM killer, not a budget the wrapper enforced\n        notes.append(f\"\
    memory cgroup oom_kill {oom_before} -> {oom_after}\")\n    reason = classify(rc, preset, stderr_text[-2000:],\
    \ cpu, float(b[\"cpu_s\"]))\n    return {\"exit_reason\": reason, \"returncode\": rc,\n            \"stdout\"\
    : out[\"stdout\"].decode(\"utf-8\", \"replace\"), \"stderr\": stderr_text,\n            \"stdout_bytes\": total[\"\
    stdout\"], \"stderr_bytes\": total[\"stderr\"],\n            \"stdout_truncated\": total[\"stdout\"] > keep,\
    \ \"stderr_truncated\": total[\"stderr\"] > keep,\n            \"wall_s\": round(wall, 4), \"cpu_s\": cpu, \"\
    max_rss_kib\": rss, \"stragglers_killed\": stragglers,\n            \"budgets\": b, \"notes\": notes}\n\n\n\
    def _killpg(pgid: int) -> None:\n    try:\n        os.killpg(pgid, signal.SIGKILL)\n    except OSError:\n  \
    \      pass\n\n\ndef _oom_kills() -> int | None:\n    \"\"\"The memory cgroup's ``oom_kill`` counter (cgroup\
    \ v2, visible inside containers and pods).\"\"\"\n    try:\n        with open(\"/sys/fs/cgroup/memory.events\"\
    ) as f:\n            return next(int(l.split()[1]) for l in f if l.startswith(\"oom_kill \"))\n    except (OSError,\
    \ StopIteration, ValueError):\n        return None\n\n\ndef _rusage_children():\n    try:\n        import resource\n\
    \        r = resource.getrusage(resource.RUSAGE_CHILDREN)\n        return (r.ru_utime + r.ru_stime, r.ru_maxrss)\n\
    \    except Exception:\n        return None\n\n\ndef main(argv=None) -> int:\n    ap = argparse.ArgumentParser(description=__doc__.split(\"\
    \\n\\n\")[0])\n    src = ap.add_mutually_exclusive_group(required=True)\n    src.add_argument(\"--stdin\", action=\"\
    store_true\", help=\"read the code from stdin\")\n    src.add_argument(\"--code-file\")\n    src.add_argument(\"\
    --code-env\", help=\"read the code from this environment variable\")\n    ap.add_argument(\"--budgets\", default=\"\
    {}\", help=\"JSON object overriding DEFAULTS\")\n    ap.add_argument(\"--workspace\", default=os.environ.get(\"\
    SANDBOX_WORKSPACE\", \"/work\"))\n    ap.add_argument(\"--uid\", type=int)\n    ap.add_argument(\"--gid\", type=int)\n\
    \    ap.add_argument(\"--nproc\", action=\"store_true\", help=\"apply RLIMIT_NPROC (process mode only)\")\n\
    \    ap.add_argument(\"--kill-uid\", action=\"store_true\", help=\"after the run, kill every process of --uid\"\
    )\n    ap.add_argument(\"--pass-env\", action=\"append\", default=[], help=\"copy this variable into the child\"\
    )\n    ap.add_argument(\"--python\", help=\"interpreter for the child (default: this one)\")\n    a = ap.parse_args(argv)\n\
    \    if a.stdin:\n        code = sys.stdin.read()\n    elif a.code_file:\n        with open(a.code_file) as\
    \ f:\n            code = f.read()\n    else:\n        code = os.environ.get(a.code_env, \"\")\n    extra = {k:\
    \ os.environ[k] for k in a.pass_env if k in os.environ}\n    res = run(code, json.loads(a.budgets), a.workspace,\
    \ uid=a.uid, gid=a.gid, use_nproc=a.nproc,\n              kill_uid=a.kill_uid, extra_env=extra, python=a.python)\n\
    \    sys.stdout.write(f\"{MARKER} {json.dumps(res, separators=(',', ':'))}\\n\")\n    sys.stdout.flush()\n \
    \   return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
