# The egress proxy and the stand-in upstream. Create the Secrets first (deploy scripts: egress-credentials and api-stub-token, one random value).
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-code
  namespace: sandbox-egress
data:
  server.py: "\"\"\"server.py \u2014 an allowlisting egress proxy that holds the credentials so the sandbox never\
    \ does.\n\nOne idea: a sandbox that needs *some* network gets exactly one reachable address \u2014 this proxy\
    \ \u2014\nand the proxy decides everything else (PRIMER \xA74 \"Network and secrets\"). It is the identity\n\
    primer's \"gateway path\" (06-gateway, identity primer \xA75: the credential is injected at the edge\nand the\
    \ caller never sees it) moved one layer down, to the boundary of the code sandbox.\n\nTwo ways in:\n\n* **Routes\
    \ (preferred).** ``GET http://egress-proxy:8080/<route>/<path>``: plain HTTP from the\n  sandbox to the proxy;\
    \ the proxy maps ``<route>`` to an upstream the operator configured, strips\n  any credential the caller sent,\
    \ injects the real one (from a file or an env var \u2014 a Kubernetes\n  Secret mounted *only into the proxy*),\
    \ and speaks HTTPS upstream if the route says so. The code\n  never learns the key or even the upstream's hostname.\n\
    * **Forward proxy.** ``HTTP_PROXY=http://egress-proxy:8080``: absolute-form requests to hosts on\n  ``forward_allow``\
    \ (exact names or ``*.suffix``), resolved once and refused if any address is\n  private, loopback or link-local\
    \ (the metadata server at 169.254.169.254); the proxy then connects\n  to **the address it checked**, not the\
    \ name, so a rebinding DNS answer (public on the first lookup,\n  169.254.169.254 on the second) cannot slip\
    \ between the check and the connect. NetworkPolicy on the\n  proxy's own egress is the second guard. ``CONNECT``\
    \ is refused by default: through an HTTPS tunnel\n  the proxy can neither inject a credential nor see the request,\
    \ so it could only allow or deny a\n  hostname.\n\nEvery decision is one JSON line on stdout (``kubectl logs\
    \ deploy/egress-proxy`` is the egress\naudit trail) in the shape of the identity lab's ``AuditEvent`` (``event_type:\
    \ \"egress\"``).\nResponses are capped and any occurrence of an injected secret is redacted: an upstream that\n\
    echoes request headers back would otherwise hand the key to the sandbox.\n\nStandard library only and a single\
    \ file, so it runs from a ConfigMap in ``python:3.12-slim``:\n\n    python3 server.py --config proxy.json --port\
    \ 8080\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport datetime as dt\nimport hashlib\n\
    import http.client\nimport ipaddress\nimport json\nimport os\nimport socket\nimport socketserver\nimport ssl\n\
    import sys\nimport threading\nimport time\nimport uuid\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\
    from urllib.parse import urlsplit\n\nHOP_BY_HOP = {\"connection\", \"keep-alive\", \"proxy-authenticate\", \"\
    proxy-authorization\", \"te\", \"trailer\",\n              \"transfer-encoding\", \"upgrade\", \"proxy-connection\"\
    }\nCALLER_CREDENTIALS = {\"authorization\", \"cookie\", \"proxy-authorization\", \"x-api-key\", \"x-goog-api-key\"\
    }\nREDACTED = \"[REDACTED]\"\n\n\n# ---- policy: pure functions, tested without sockets ----------------------------------------------------\n\
    def resolve(host: str, port: int) -> set[str]:\n    \"\"\"Every address ``host`` resolves to (one lookup; the\
    \ forward proxy then connects to one of these).\"\"\"\n    return {ai[4][0] for ai in socket.getaddrinfo(host,\
    \ port, proto=socket.IPPROTO_TCP)}\n\n\n# The connection classes, by scheme (a seam the tests use to see where\
    \ the proxy connects).\nCONNECTION_CLASSES = {\"http\": http.client.HTTPConnection, \"https\": http.client.HTTPSConnection}\n\
    \n\ndef normalise_host(host: str) -> str:\n    return (host or \"\").strip().rstrip(\".\").lower()\n\n\ndef\
    \ host_allowed(host: str, patterns: list[str]) -> bool:\n    \"\"\"Exact names, or ``*.example.com`` for subdomains\
    \ only (not the apex, not ``evilexample.com``).\"\"\"\n    h = normalise_host(host)\n    if not h:\n       \
    \ return False\n    for p in patterns:\n        p = normalise_host(p)\n        if p.startswith(\"*.\"):\n  \
    \          if h.endswith(p[1:]) and h != p[2:]:\n                return True\n        elif h == p:\n       \
    \     return True\n    return False\n\n\ndef is_public_ip(ip: str) -> bool:\n    a = ipaddress.ip_address(ip)\n\
    \    return not (a.is_private or a.is_loopback or a.is_link_local or a.is_multicast or a.is_reserved\n     \
    \           or a.is_unspecified)\n\n\ndef split_route(path: str) -> tuple[str, str]:\n    \"\"\"``/api-stub/whoami?x=1``\
    \ -> ``(\"api-stub\", \"/whoami?x=1\")``.\"\"\"\n    rest = path.lstrip(\"/\")\n    name, _, tail = rest.partition(\"\
    /\")\n    return name, \"/\" + tail\n\n\ndef clean_headers(headers, drop: set[str]) -> dict[str, str]:\n   \
    \ \"\"\"Remove hop-by-hop headers, anything named in ``Connection``, and ``drop`` (caller creds).\"\"\"\n  \
    \  named = {h.strip().lower() for h in (headers.get(\"Connection\") or \"\").split(\",\") if h.strip()}\n  \
    \  return {k: v for k, v in headers.items() if k.lower() not in HOP_BY_HOP | named | drop and k.lower() != \"\
    host\"}\n\n\ndef redact(data: bytes, secrets: list[str]) -> tuple[bytes, int]:\n    n = 0\n    for s in secrets:\n\
    \        if s and s.encode() in data:\n            n += data.count(s.encode())\n            data = data.replace(s.encode(),\
    \ REDACTED.encode())\n    return data, n\n\n\ndef read_secret(ref: str) -> str:\n    \"\"\"``env:NAME`` or ``file:/path``\
    \ (a mounted Secret; re-read per request, so rotation works).\"\"\"\n    kind, _, where = ref.partition(\":\"\
    )\n    if kind == \"env\":\n        return os.environ.get(where, \"\")\n    if kind == \"file\":\n        try:\n\
    \            with open(where) as f:\n                return f.read().strip()\n        except OSError:\n    \
    \        return \"\"\n    raise ValueError(f\"secret reference must be env:NAME or file:/path, got {ref!r}\"\
    )\n\n\ndef audit_event(decision: str, reasons: list[str], **extra) -> dict:\n    \"\"\"The identity lab's AuditEvent\
    \ fields (agentsec.audit.log), event_type \"egress\".\"\"\"\n    return {\"event_type\": \"egress\", \"agent\"\
    : extra.pop(\"agent\", \"sandbox\"), \"authority\": \"own\",\n            \"tool\": extra.pop(\"tool\", \"http\"\
    ), \"decision\": decision, \"reasons\": reasons,\n            \"latency_ms\": extra.pop(\"latency_ms\", None),\
    \ \"ts\": dt.datetime.now(dt.timezone.utc).isoformat(),\n            \"id\": uuid.uuid4().hex, \"extra\": extra}\n\
    \n\nDEFAULT_CONFIG = {\"routes\": {}, \"forward_allow\": [], \"allow_connect\": False, \"block_private\": True,\n\
    \                  \"max_request_bytes\": 65536, \"max_response_bytes\": 1048576, \"timeout_s\": 10.0}\n\n\n\
    # ---- the server -----------------------------------------------------------------------------------------\n\
    class _UnixHTTPServer(socketserver.ThreadingMixIn, socketserver.UnixStreamServer):\n    \"\"\"HTTP over a path-based\
    \ Unix socket. A path is a filesystem object, not part of a network\n    namespace: a process in an empty netns\
    \ (or a container with ``--network none`` and the socket\n    bind-mounted) can reach the proxy and nothing\
    \ else.\"\"\"\n    daemon_threads = True\n\n    def get_request(self):\n        req, _ = super().get_request()\n\
    \        return req, (\"unix\", 0)\n\n\nclass EgressProxy:\n    \"\"\"Holds the config and the audit trail;\
    \ ``serve()`` runs the HTTP server in a thread.\n    Listens on TCP (``host``/``port``) or, with ``unix_path``,\
    \ on a Unix socket (mode 0666).\"\"\"\n\n    def __init__(self, config: dict, *, host: str = \"127.0.0.1\",\
    \ port: int = 0, emit=None,\n                 unix_path: str | None = None):\n        self.config = {**DEFAULT_CONFIG,\
    \ **config}\n        self.events: list[dict] = []\n        self._emit = emit\n        self._lock = threading.Lock()\n\
    \        proxy = self\n\n        class Handler(BaseHTTPRequestHandler):\n            protocol_version = \"HTTP/1.1\"\
    \n            server_version = \"sandboxlab-egress/0.1\"\n\n            def log_message(self, *a):         \
    \ # the audit line replaces the access log\n                pass\n\n            def do_CONNECT(self):\n    \
    \            proxy._connect(self)\n\n            def _any(self):\n                proxy._handle(self)\n\n  \
    \          do_GET = do_POST = do_PUT = do_PATCH = do_DELETE = do_HEAD = _any\n\n        self.unix_path = unix_path\n\
    \        if unix_path:\n            if os.path.exists(unix_path):\n                os.unlink(unix_path)\n  \
    \          self.httpd = _UnixHTTPServer(unix_path, Handler)\n            os.chmod(unix_path, 0o666)\n      \
    \      self.port = None\n            self.url = f\"unix:{unix_path}\"\n        else:\n            self.httpd\
    \ = ThreadingHTTPServer((host, port), Handler)\n            self.httpd.daemon_threads = True\n            self.port\
    \ = self.httpd.server_address[1]\n            self.url = f\"http://{host}:{self.port}\"\n        self._thread:\
    \ threading.Thread | None = None\n\n    # -- lifecycle\n    def serve(self) -> \"EgressProxy\":\n        self._thread\
    \ = threading.Thread(target=self.httpd.serve_forever, daemon=True)\n        self._thread.start()\n        return\
    \ self\n\n    def close(self):\n        self.httpd.shutdown()\n        self.httpd.server_close()\n        if\
    \ self.unix_path and os.path.exists(self.unix_path):\n            os.unlink(self.unix_path)\n\n    def __enter__(self):\n\
    \        return self.serve()\n\n    def __exit__(self, *exc):\n        self.close()\n\n    # -- audit\n    def\
    \ record(self, decision: str, reasons: list[str], **extra) -> dict:\n        ev = audit_event(decision, reasons,\
    \ **extra)\n        with self._lock:\n            self.events.append(ev)\n        if self._emit:\n         \
    \   self._emit(ev)\n        return ev\n\n    # -- request handling\n    def _deny(self, h, status: int, reason:\
    \ str, **extra):\n        self.record(\"deny\", [reason], method=h.command, target=h.path[:200], client=h.client_address[0],\n\
    \                    status=status, **extra)\n        body = json.dumps({\"error\": \"egress_denied\", \"reason\"\
    : reason}).encode()\n        h.send_response(status)\n        h.send_header(\"Content-Type\", \"application/json\"\
    )\n        h.send_header(\"Content-Length\", str(len(body)))\n        h.send_header(\"Connection\", \"close\"\
    )\n        h.end_headers()\n        if h.command != \"HEAD\":\n            h.wfile.write(body)\n        h.close_connection\
    \ = True\n\n    def _connect(self, h):\n        host, _, port = h.path.rpartition(\":\")\n        if not self.config[\"\
    allow_connect\"]:\n            return self._deny(h, 403, \"CONNECT refused: an HTTPS tunnel hides the request,\
    \ so no credential can be \"\n                                       \"injected; use a route (http://proxy/<route>/...)\"\
    , host=host)\n        return self._deny(h, 501, \"CONNECT tunnelling is not implemented in the lab proxy\",\
    \ host=host)\n\n    def _handle(self, h):\n        t0 = time.monotonic()\n        cfg = self.config\n      \
    \  if h.path == \"/healthz\":                                  # readiness probe; not audited\n            h.send_response(200)\n\
    \            h.send_header(\"Content-Length\", \"2\")\n            h.end_headers()\n            h.wfile.write(b\"\
    ok\")\n            return\n        length = int(h.headers.get(\"Content-Length\") or 0)\n        if length >\
    \ cfg[\"max_request_bytes\"]:\n            return self._deny(h, 413, f\"request body {length} B > {cfg['max_request_bytes']}\
    \ B\")\n        body = h.rfile.read(length) if length else None\n        secrets: list[str] = []\n        if\
    \ h.path.startswith(\"/\"):                               # route form\n            name, tail = split_route(h.path)\n\
    \            route = cfg[\"routes\"].get(name)\n            if route is None:\n                return self._deny(h,\
    \ 403, f\"no route {name!r}\", route=name)\n            if h.command not in route.get(\"methods\", [\"GET\"\
    ]):\n                return self._deny(h, 405, f\"method {h.command} not allowed on route {name!r}\", route=name)\n\
    \            up = urlsplit(route[\"upstream\"])\n            scheme, host, port = up.scheme, up.hostname, up.port\
    \ or (443 if up.scheme == \"https\" else 80)\n            path = (up.path.rstrip(\"/\") + tail) if up.path else\
    \ tail\n            headers = clean_headers(h.headers, CALLER_CREDENTIALS)\n            inj = route.get(\"inject\"\
    )\n            if inj:\n                secret = read_secret(inj[\"value_from\"])\n                if not secret:\n\
    \                    return self._deny(h, 503, f\"route {name!r}: credential {inj['value_from']} is empty\"\
    , route=name)\n                headers[inj.get(\"header\", \"Authorization\")] = inj.get(\"format\", \"{}\"\
    ).format(secret)\n                secrets.append(secret)\n            ctx = {\"route\": name, \"upstream_host\"\
    : host}\n            connect_to = host                                    # operator-configured upstream\n \
    \       else:                                                    # absolute-form (forward proxy)\n         \
    \   u = urlsplit(h.path)\n            if u.scheme != \"http\" or not u.hostname:\n                return self._deny(h,\
    \ 400, \"absolute-form http:// URL expected\")\n            host = normalise_host(u.hostname)\n            if\
    \ not host_allowed(host, cfg[\"forward_allow\"]):\n                return self._deny(h, 403, f\"host {host!r}\
    \ is not on the egress allowlist\", host=host)\n            connect_to = host\n            if cfg[\"block_private\"\
    ]:\n                try:\n                    addrs = resolve(host, u.port or 80)\n                except OSError\
    \ as e:\n                    return self._deny(h, 502, f\"cannot resolve {host}: {e}\", host=host)\n       \
    \         private = sorted(a for a in addrs if not is_public_ip(a))\n                if private:\n         \
    \           return self._deny(h, 403, f\"{host} resolves to non-public {private}\", host=host)\n           \
    \     connect_to = sorted(addrs)[0]          # connect to the vetted address: no second lookup\n           \
    \ scheme, port = \"http\", u.port or 80\n            path = (u.path or \"/\") + (f\"?{u.query}\" if u.query\
    \ else \"\")\n            headers = clean_headers(h.headers, {\"proxy-authorization\"})\n            ctx = {\"\
    host\": host}\n        try:\n            conn_cls = CONNECTION_CLASSES[scheme]\n            kw = {\"context\"\
    : ssl.create_default_context()} if scheme == \"https\" else {}\n            conn = conn_cls(connect_to, port,\
    \ timeout=cfg[\"timeout_s\"], **kw)   # Host header carries the name\n            conn.request(h.command, path,\
    \ body=body, headers={**headers, \"Host\": host if port in (80, 443) else f\"{host}:{port}\"})\n           \
    \ resp = conn.getresponse()\n            data = resp.read(cfg[\"max_response_bytes\"] + 1)\n            conn.close()\n\
    \        except (OSError, http.client.HTTPException) as e:\n            return self._deny(h, 502, f\"upstream\
    \ error: {type(e).__name__}: {e}\", **ctx)\n        truncated = len(data) > cfg[\"max_response_bytes\"]\n  \
    \      data = data[: cfg[\"max_response_bytes\"]]\n        data, n_red = redact(data, secrets)\n        out_headers\
    \ = {k: v for k, v in resp.getheaders() if k.lower() not in HOP_BY_HOP | {\"content-length\"}}\n        for\
    \ k in list(out_headers):\n            out_headers[k], n = redact(out_headers[k].encode(\"latin-1\", \"replace\"\
    ), secrets)\n            out_headers[k] = out_headers[k].decode(\"latin-1\")\n            n_red += n\n     \
    \   reasons = [\"allowlisted route\" if \"route\" in ctx else \"allowlisted host\"]\n        if n_red:\n   \
    \         reasons.append(f\"redacted {n_red} occurrence(s) of the injected credential from the response\")\n\
    \        if truncated:\n            reasons.append(f\"response truncated to {cfg['max_response_bytes']} B\"\
    )\n        self.record(\"allow\", reasons, method=h.command, client=h.client_address[0], status=resp.status,\n\
    \                    bytes=len(data), injected=bool(secrets),\n                    path_sha256=hashlib.sha256(path.encode()).hexdigest()[:16],\n\
    \                    latency_ms=round((time.monotonic() - t0) * 1000, 1), **ctx)\n        h.send_response(resp.status)\n\
    \        for k, v in out_headers.items():\n            h.send_header(k, v)\n        h.send_header(\"Content-Length\"\
    , str(len(data)))\n        if truncated:\n            h.send_header(\"X-Egress-Truncated\", \"1\")\n       \
    \ h.end_headers()\n        if h.command != \"HEAD\":\n            h.wfile.write(data)\n\n\ndef main(argv=None)\
    \ -> int:\n    ap = argparse.ArgumentParser(description=\"allowlisting egress proxy with credential injection\"\
    )\n    ap.add_argument(\"--config\", required=True, help=\"JSON: routes, forward_allow, limits\")\n    ap.add_argument(\"\
    --host\", default=\"0.0.0.0\")\n    ap.add_argument(\"--port\", type=int, default=8080)\n    ap.add_argument(\"\
    --unix\", help=\"listen on this Unix socket path instead of TCP\")\n    a = ap.parse_args(argv)\n    with open(a.config)\
    \ as f:\n        cfg = json.load(f)\n\n    def emit(ev):\n        sys.stdout.write(json.dumps(ev, separators=(\"\
    ,\", \":\")) + \"\\n\")\n        sys.stdout.flush()\n\n    proxy = EgressProxy(cfg, host=a.host, port=a.port,\
    \ emit=emit, unix_path=a.unix)\n    sys.stdout.write(json.dumps({\"event_type\": \"proxy.start\", \"listen\"\
    : proxy.url,\n                                 \"routes\": sorted(proxy.config[\"routes\"]),\n             \
    \                    \"forward_allow\": proxy.config[\"forward_allow\"]}) + \"\\n\")\n    sys.stdout.flush()\n\
    \    try:\n        proxy.httpd.serve_forever()\n    except KeyboardInterrupt:\n        pass\n    return 0\n\n\
    \nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-config
  namespace: sandbox-egress
data:
  proxy.json: |
    {
      "routes": {
        "api-stub": {
          "upstream": "http://api-stub.sandbox-upstream.svc.cluster.local:8081",
          "methods": [
            "GET",
            "POST"
          ],
          "inject": {
            "header": "Authorization",
            "value_from": "file:/etc/egress/token",
            "format": "Bearer {}"
          }
        }
      },
      "forward_allow": [],
      "allow_connect": false,
      "block_private": true,
      "max_request_bytes": 65536,
      "max_response_bytes": 1048576,
      "timeout_s": 10
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: sandbox-egress
  labels:
    app: egress-proxy
    app.kubernetes.io/part-of: sandboxlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-proxy
      app.kubernetes.io/part-of: sandboxlab
  template:
    metadata:
      labels:
        app: egress-proxy
        app.kubernetes.io/part-of: sandboxlab
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65534
      containers:
        - name: egress-proxy
          image: python:3.12-slim
          command:
            - python3
            - -I
            - /app/server.py
            - --config
            - /etc/proxy/proxy.json
            - --port
            - '8080'
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 128Mi
              cpu: 100m
              ephemeral-storage: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: credential
              mountPath: /etc/egress
              readOnly: true
            - name: config
              mountPath: /etc/proxy
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: egress-proxy-code
            defaultMode: 292
        - name: credential
          secret:
            secretName: egress-credentials
            defaultMode: 288
        - name: config
          configMap:
            name: egress-proxy-config
            defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: sandbox-egress
spec:
  clusterIP: 10.96.0.200
  selector:
    app: egress-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-stub-code
  namespace: sandbox-upstream
data:
  stub.py: "\"\"\"stub.py \u2014 a stand-in for the third-party API the agent is allowed to call.\n\nOne idea: to\
    \ show that the sandbox never holds the key, you need an upstream that *checks* the\nkey and one that *misbehaves*.\
    \ ``/whoami`` answers whether the expected bearer token arrived\n(and never echoes it); ``/echo`` returns the\
    \ request headers verbatim \u2014 the reflection channel an\nattacker would use to read an injected credential\
    \ back through the proxy; ``/data`` returns a\nsmall JSON document for the agent demos; ``/page/<name>`` serves\
    \ text an attacker wrote (the\nprompt-injection payloads of ``agent/scenarios.py``). Standard library only,\
    \ one file (it runs from a\nConfigMap in kind/GKE as the ``api-stub`` Deployment).\n\n    python3 stub.py --port\
    \ 8081 --token-file /etc/stub/token\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\n\
    import hmac\nimport json\nimport os\nimport threading\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\
    \nDATA = {\"city\": \"Lisbon\", \"forecast\": [{\"day\": \"Mon\", \"high_c\": 24}, {\"day\": \"Tue\", \"high_c\"\
    : 26},\n                                       {\"day\": \"Wed\", \"high_c\": 23}]}\n\n\nclass StubAPI:\n  \
    \  def __init__(self, token: str | None = None, *, token_file: str | None = None, host: str = \"127.0.0.1\"\
    ,\n                 port: int = 0, pages: dict[str, str] | None = None):\n        self._token, self._token_file\
    \ = token, token_file\n        self.pages = dict(pages or {})           # /page/<name>: text an attacker controls\
    \ (the injection)\n        self.requests: list[dict] = []          # what arrived (header *names* only, never\
    \ values)\n        stub = self\n\n        class Handler(BaseHTTPRequestHandler):\n            protocol_version\
    \ = \"HTTP/1.1\"\n\n            def log_message(self, *a):\n                pass\n\n            def do_GET(self):\n\
    \                stub._handle(self)\n\n            do_POST = do_GET\n\n        self.httpd = ThreadingHTTPServer((host,\
    \ port), Handler)\n        self.httpd.daemon_threads = True\n        self.port = self.httpd.server_address[1]\n\
    \        self.url = f\"http://{host}:{self.port}\"\n\n    def token(self) -> str:\n        if self._token_file:\n\
    \            try:\n                with open(self._token_file) as f:\n                    return f.read().strip()\n\
    \            except OSError:\n                return \"\"\n        return self._token or \"\"\n\n    def _handle(self,\
    \ h):\n        n = int(h.headers.get(\"Content-Length\") or 0)\n        if n:\n            h.rfile.read(n)\n\
    \        auth = h.headers.get(\"Authorization\") or \"\"\n        ok = bool(self.token()) and hmac.compare_digest(auth,\
    \ f\"Bearer {self.token()}\")\n        self.requests.append({\"path\": h.path, \"method\": h.command, \"authorized\"\
    : ok,\n                              \"header_names\": sorted(h.headers.keys())})\n        path = h.path.split(\"\
    ?\")[0]\n        if path == \"/whoami\":\n            body = {\"authorized\": ok, \"token_sha256_prefix\": hashlib.sha256(auth.encode()).hexdigest()[:12]\
    \ if auth else None}\n            status = 200 if ok else 401\n        elif path == \"/echo\":             \
    \       # deliberately unsafe: reflects every header back\n            body, status = {\"headers\": dict(h.headers.items())},\
    \ 200\n        elif path == \"/data\":\n            body, status = (DATA, 200) if ok else ({\"error\": \"unauthorized\"\
    }, 401)\n        elif path.startswith(\"/page/\") and path[6:] in self.pages:\n            body, status = {\"\
    url\": path, \"text\": self.pages[path[6:]]}, 200\n        else:\n            body, status = {\"error\": \"\
    not found\"}, 404\n        raw = json.dumps(body).encode()\n        h.send_response(status)\n        h.send_header(\"\
    Content-Type\", \"application/json\")\n        h.send_header(\"Content-Length\", str(len(raw)))\n        h.end_headers()\n\
    \        h.wfile.write(raw)\n\n    def serve(self) -> \"StubAPI\":\n        threading.Thread(target=self.httpd.serve_forever,\
    \ daemon=True).start()\n        return self\n\n    def close(self):\n        self.httpd.shutdown()\n       \
    \ self.httpd.server_close()\n\n    def __enter__(self):\n        return self.serve()\n\n    def __exit__(self,\
    \ *exc):\n        self.close()\n\n\ndef main(argv=None) -> int:\n    ap = argparse.ArgumentParser(description=__doc__.split(\"\
    \\n\\n\")[0])\n    ap.add_argument(\"--host\", default=\"0.0.0.0\")\n    ap.add_argument(\"--port\", type=int,\
    \ default=8081)\n    ap.add_argument(\"--token-file\", default=os.environ.get(\"STUB_TOKEN_FILE\"))\n    a =\
    \ ap.parse_args(argv)\n    StubAPI(token_file=a.token_file, host=a.host, port=a.port).httpd.serve_forever()\n\
    \    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-stub
  namespace: sandbox-upstream
  labels:
    app: api-stub
    app.kubernetes.io/part-of: sandboxlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-stub
      app.kubernetes.io/part-of: sandboxlab
  template:
    metadata:
      labels:
        app: api-stub
        app.kubernetes.io/part-of: sandboxlab
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65534
      containers:
        - name: api-stub
          image: python:3.12-slim
          command:
            - python3
            - -I
            - /app/stub.py
            - --port
            - '8081'
            - --token-file
            - /etc/stub/token
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 128Mi
              cpu: 100m
              ephemeral-storage: 64Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: credential
              mountPath: /etc/stub
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: api-stub-code
            defaultMode: 292
        - name: credential
          secret:
            secretName: api-stub-token
            defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: api-stub
  namespace: sandbox-upstream
spec:
  clusterIP: 10.96.0.201
  selector:
    app: api-stub
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
