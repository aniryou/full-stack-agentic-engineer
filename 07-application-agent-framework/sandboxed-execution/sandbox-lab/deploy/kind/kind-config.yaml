# kind cluster for the sandbox lab: control plane, a system worker, a sandbox worker (tainted by up.sh).
# The kubelet patch sets podPidsLimit for every node (kubeadm reads KubeletConfiguration from the first node).
#
# Generated by tools/render_manifests.py from sandboxlab/k8s/policy.py - edit there and re-run.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        podPidsLimit: 128
  - role: worker
    labels:
      sandboxlab/pool: system
  - role: worker
    labels:
      sandboxlab/pool: sandbox
