[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxlab"
version = "0.1.0"
description = "Run model-generated code without ambient authority: hardened Docker, pod-per-execution on kind and GKE Sandbox (gVisor), an egress proxy that brokers credentials, and an agent whose run_code tool goes through them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The sandbox itself (wrapper, process sandbox, proxy, agent) is standard library only, so the same
# files run inside python:3.12-slim containers. PyYAML renders and reads the Kubernetes manifests.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyterlab>=4.0",
       "kubernetes-validate>=1.34"]
# Evaluates the ValidatingAdmissionPolicy's CEL expressions offline in the tests (optional; the
# tests that need it are skipped without it). cel-python pins a newer PyYAML than some distros ship.
cel = ["cel-python>=0.5"]

[project.scripts]
sandboxlab = "sandboxlab.__main__:main"

[tool.setuptools.packages.find]
include = ["sandboxlab*"]

[tool.setuptools.package-data]
sandboxlab = ["data/*.json", "data/samples/*.json", "data/samples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
