[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxcore"
version = "0.1.0"
description = "Run model-generated code without ambient authority: attack probes, a process sandbox, the execution contract, policy as data rendered to Kubernetes, a credential-injecting egress proxy, warm-pool queueing and audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []                      # the library is standard library only (Linux/macOS; POSIX rlimits)

[project.optional-dependencies]
# pyyaml and kubernetes-validate are only for the tests that parse and validate the rendered manifests.
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25", "jupyterlab>=4.0",
       "pyyaml>=6.0", "kubernetes-validate>=1.34"]

[tool.setuptools.packages.find]
include = ["sandboxcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
