name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ipykernel install --user --name python3
      - name: Unit tests
        run: python -m pytest -q -m "not slow"
      - name: Rebuild notebooks and check sources are in sync
        run: |
          python tools/build_notebooks.py
          git diff --stat --exit-code -- notebooks solutions || (echo "notebooks/ or solutions/ out of date: run make notebooks" && exit 1)
      - name: Execute every solution notebook
        run: python tools/run_notebooks.py solutions
      - name: Exercise notebooks stop at the first unsolved cell
        run: python tools/run_notebooks.py notebooks --expect-fail
