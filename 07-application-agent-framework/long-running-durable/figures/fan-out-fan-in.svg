<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="A planner LLM makes N subtasks, idempotent workers do them, and the write that reaches N on the run document enqueues the named aggregate task." style="color: #E4EAE7">
  <title>A planner LLM makes N subtasks, idempotent workers do them, and the write that reaches N on the run document enqueues the named aggregate task.</title>
  <rect x="0" y="0" width="960" height="390" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="24" y="36" width="176" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="112" y="60" text-anchor="middle" font-weight="600">1. Planner LLM</text>
    <text x="112" y="78" text-anchor="middle" font-size="11.5" fill="#97A59F">makes N subtasks</text>
    <rect x="24" y="142" width="176" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="112" y="166" text-anchor="middle" font-weight="600">2. Pub/Sub topic</text>
    <text x="112" y="184" text-anchor="middle" font-size="11.5" fill="#97A59F">or N Cloud Tasks</text>
    <rect x="252" y="36" width="172" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="338" y="60" text-anchor="middle" font-weight="600">3. Worker</text>
    <text x="338" y="78" text-anchor="middle" font-size="11.5" fill="#97A59F">idempotent</text>
    <rect x="252" y="142" width="172" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="338" y="166" text-anchor="middle" font-weight="600">3. Worker</text>
    <text x="338" y="184" text-anchor="middle" font-size="11.5" fill="#97A59F">idempotent</text>
    <rect x="252" y="248" width="172" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="338" y="272" text-anchor="middle" font-weight="600">3. Worker</text>
    <text x="338" y="290" text-anchor="middle" font-size="11.5" fill="#97A59F">idempotent, N of them</text>
    <rect x="468" y="112" width="184" height="106" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="560" y="138" text-anchor="middle" font-weight="600">4. Run document</text>
    <text x="560" y="158" text-anchor="middle" font-size="11.5" fill="#7ADACF">a transactional counter</text>
    <text x="560" y="184" text-anchor="middle" font-size="11" fill="#97A59F">the side effects stay</text>
    <text x="560" y="200" text-anchor="middle" font-size="11" fill="#97A59F">outside the transaction</text>
    <rect x="768" y="142" width="176" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="856" y="165" text-anchor="middle" font-weight="600">Named task</text>
    <text x="856" y="184" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">aggregate</text>
    <text x="856" y="202" text-anchor="middle" font-size="11" fill="#97A59F">also from a late duplicate</text>
    <rect x="768" y="262" width="176" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="856" y="287" text-anchor="middle" font-weight="600">6. Synthesis LLM</text>
    <text x="856" y="306" text-anchor="middle" font-size="11.5" fill="#97A59F">combines the results</text>
    <rect x="462" y="270" width="236" height="96" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="580" y="293" text-anchor="middle" font-weight="600">Writes contend (~1 write/s)</text>
    <text x="580" y="312" text-anchor="middle" font-size="11" fill="#97A59F">one document for each subtask</text>
    <text x="580" y="329" text-anchor="middle" font-size="11" fill="#97A59F">and a count query,</text>
    <text x="580" y="346" text-anchor="middle" font-size="11" fill="#97A59F">or Cloud Workflows parallel</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M112 92 L112 140" marker-end="url(#arr)"/>
      <path d="M200 170 C226 170, 224 64, 250 64" marker-end="url(#arr)"/>
      <path d="M200 170 L250 170" marker-end="url(#arr)"/>
      <path d="M200 170 C226 170, 224 276, 250 276" marker-end="url(#arr)"/>
      <path d="M424 64 C446 64, 444 140, 466 140" marker-end="url(#arr)"/>
      <path d="M424 170 L466 170" marker-end="url(#arr)"/>
      <path d="M424 276 C446 276, 444 200, 466 200" marker-end="url(#arr)"/>
      <path d="M856 214 L856 260" marker-end="url(#arr)"/>
      <path d="M560 218 L560 268" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    </g>
    <path d="M652 170 L766 170" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="710" y="146" text-anchor="middle" font-size="11" fill="#7ADACF">5. the write</text>
    <text x="710" y="160" text-anchor="middle" font-size="11" fill="#7ADACF">that reaches N</text>
    <text x="568" y="248" font-size="11" fill="#97A59F">N &gt; ~50 writers</text>
  </g>
</svg>
