<svg xmlns="http://www.w3.org/2000/svg" width="980" height="612" viewBox="0 0 980 612" role="img" aria-label="One step of a run from one wake-up to the next, as eight stages in sequence: wake-up, lease, read the run, decide, intent, act, checkpoint and enqueue next; beside each stage, the invariant that protects it and its mechanism in code." style="color: #E4EAE7">
  <title>One step of a run from one wake-up to the next, as eight stages in sequence: wake-up, lease, read the run, decide, intent, act, checkpoint and enqueue next; beside each stage, the invariant that protects it and its mechanism in code.</title>
  <rect x="0" y="0" width="980" height="612" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="28" font-size="11" fill="#97A59F">one step of a run, from one wake-up to the next: the stage on the left, the invariant that protects it on the right (§3.1 to §3.5)</text>

    <!-- stage 1: wake-up -->
    <rect x="70" y="50" width="190" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="165" y="70" text-anchor="middle" font-weight="600">wake-up</text>
    <text x="165" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">task run-step-N</text>
    <text x="284" y="67" font-size="12" font-weight="600" fill="#7ADACF">idempotent actions</text>
    <text x="284" y="82" font-size="11.5" fill="#97A59F">The delivery is at-least-once (§3.2). Each wake-up is one HTTP request from a queue (§2).</text>
    <text x="284" y="96" font-size="11.5" fill="#97A59F">Two Cloud Run instances can receive the same task with 50 ms between them (§3.3).</text>

    <!-- stage 2: lease -->
    <rect x="70" y="116" width="190" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="165" y="136" text-anchor="middle" font-weight="600">lease</text>
    <text x="165" y="154" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">acquire_lease</text>
    <text x="284" y="133" font-size="12" font-weight="600" fill="#7ADACF">exclusive progress</text>
    <text x="284" y="148" font-size="11.5" fill="#97A59F">A transactional compare-and-set with a TTL (§3.3). The second instance fails fast: HTTP 503 or 429.</text>
    <text x="284" y="162" font-size="11.5" fill="#97A59F">The lease expires, thus a dead worker cannot block the run. A long step extends it (a heartbeat).</text>

    <!-- stage 3: read the run -->
    <rect x="70" y="182" width="190" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="165" y="202" text-anchor="middle" font-weight="600">read the run</text>
    <text x="165" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">journal, state, version</text>
    <text x="284" y="199" font-size="12" font-weight="600" fill="#7ADACF">idempotent actions</text>
    <text x="284" y="214" font-size="11.5" fill="#97A59F">Duplicate-delivery guard: if the journal already has this step, enqueue the next task and return 200.</text>
    <text x="284" y="228" font-size="11.5" fill="#97A59F">A pending STARTED record: execute the same call with the same key. Never ask the model again.</text>

    <!-- stage 4: decide -->
    <rect x="70" y="248" width="190" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="165" y="268" text-anchor="middle" font-weight="600">decide</text>
    <text x="165" y="286" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">check_budget, the model</text>
    <text x="284" y="265" font-size="12" font-weight="600" fill="#7ADACF">bounded execution · hygienic context</text>
    <text x="284" y="280" font-size="11.5" fill="#97A59F">The code examines max_steps, max_tokens, max_cost_usd and the deadline before each model call (§3.4).</text>
    <text x="284" y="294" font-size="11.5" fill="#97A59F">A replay of the journal builds the prompt (§2). Each fact lives in state, not in the transcript (§3.5).</text>

    <!-- stage 5: intent, save #1 -->
    <rect x="70" y="314" width="190" height="50" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="165" y="334" text-anchor="middle" font-weight="600">intent, save #1</text>
    <text x="165" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7ADACF">STARTED + key</text>
    <text x="284" y="331" font-size="12" font-weight="600" fill="#7ADACF">durable state · idempotent actions</text>
    <text x="284" y="346" font-size="11.5" fill="#97A59F">Write-ahead intent: TOOL(name, args, idempotency_key) STARTED goes to the journal. Save. Then call (§3.2).</text>
    <text x="284" y="360" font-size="11.5" fill="#97A59F">The key is run_id:step_index: the same for all retries of a step, different for each run.</text>

    <!-- stage 6: act -->
    <rect x="70" y="380" width="190" height="50" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="165" y="400" text-anchor="middle" font-weight="600">act</text>
    <text x="165" y="418" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">the tool call</text>
    <text x="284" y="397" font-size="12" font-weight="600" fill="#7ADACF">idempotent actions · hygienic context</text>
    <text x="284" y="412" font-size="11.5" fill="#97A59F">The key goes downstream (an Idempotency-Key header, §3.2). It closes the crash window after the call.</text>
    <text x="284" y="426" font-size="11.5" fill="#97A59F">before_tool_callback examines each fact that can change again, immediately before the call (§3.5).</text>

    <!-- stage 7: checkpoint, save #2 -->
    <rect x="70" y="446" width="190" height="50" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="165" y="466" text-anchor="middle" font-weight="600">checkpoint, save #2</text>
    <text x="165" y="484" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7ADACF">result, version</text>
    <text x="284" y="463" font-size="12" font-weight="600" fill="#7ADACF">durable state · exclusive progress</text>
    <text x="284" y="478" font-size="11.5" fill="#97A59F">The second save: the result after the side effect (§3.1), and the result under idempotency_keys/{key}.</text>
    <text x="284" y="492" font-size="11.5" fill="#97A59F">Each save sends the version that it read. The check finds the race that the lease did not find (§3.3).</text>

    <!-- stage 8: enqueue next -->
    <rect x="70" y="512" width="190" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="165" y="532" text-anchor="middle" font-weight="600">enqueue next</text>
    <text x="165" y="550" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">task run-step-N+1</text>
    <text x="284" y="529" font-size="12" font-weight="600" fill="#7ADACF">idempotent actions</text>
    <text x="284" y="544" font-size="11.5" fill="#97A59F">Cloud Tasks rejects a task if it saw the name recently (§3.2). Two enqueues of a step become one task.</text>
    <text x="284" y="558" font-size="11.5" fill="#97A59F">Then the run waits. A run that waits costs nothing except its storage and one scheduled task (§7).</text>

    <!-- the sequence -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)">
      <path d="M165 100 L165 114"/>
      <path d="M165 166 L165 180"/>
      <path d="M165 232 L165 246"/>
      <path d="M165 298 L165 312"/>
      <path d="M165 364 L165 378"/>
      <path d="M165 430 L165 444"/>
      <path d="M165 496 L165 510"/>
    </g>
    <!-- the next wake-up -->
    <path d="M165 562 L165 584 L46 584 L46 75 L68 75" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <text x="184" y="588" font-size="11" fill="#7ADACF">the next wake-up: one HTTP request from the queue (§2)</text>
  </g>
</svg>
