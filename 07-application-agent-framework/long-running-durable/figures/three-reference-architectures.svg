<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="496" viewBox="0 0 1000 496" role="img" aria-label="The three reference architectures as three panels, each read from the top: what wakes the run, who owns the orchestration, where the steps run, where the state lives and the main cost; A is a durable loop on Cloud Run, B is Cloud Workflows as the orchestrator, C is ADK 2 on Cloud Run with Cloud SQL sessions." style="color: #E4EAE7">
  <title>The three reference architectures as three panels, each read from the top: what wakes the run, who owns the orchestration, where the steps run, where the state lives and the main cost; A is a durable loop on Cloud Run, B is Cloud Workflows as the orchestrator, C is ADK 2 on Cloud Run with Cloud SQL sessions.</title>
  <rect x="0" y="0" width="1000" height="496" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- panel A -->
    <rect x="24" y="40" width="312" height="422" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="180" y="58" text-anchor="middle" font-size="11.5" font-weight="600" fill="#97A59F">A · a durable loop on Cloud Run</text>
    <rect x="36" y="68" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="180" y="85" text-anchor="middle" font-weight="600">what wakes the run</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="180" y="99">Cloud Tasks: named tasks, OIDC</text>
      <text x="180" y="112">Scheduler, Pub/Sub: /internal/scheduler/tick</text>
      <text x="180" y="125">webhooks: /internal/callbacks</text>
    </g>
    <rect x="36" y="148" width="288" height="62" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="180" y="165" text-anchor="middle" font-weight="600">your durable loop (P1)</text>
    <g font-size="11" fill="#7ADACF" text-anchor="middle">
      <text x="180" y="179">Cloud Run (FastAPI) and Gemini</text>
      <text x="180" y="192">one small stateless request for each step</text>
      <text x="180" y="205">full control, the lowest cost at scale</text>
    </g>
    <rect x="36" y="228" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="180" y="245" text-anchor="middle" font-weight="600">where the steps run</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="180" y="259">the same Cloud Run service: HTTP handlers</text>
      <text x="180" y="272">for steps, approvals, callbacks, the tick</text>
      <text x="180" y="285">the tick: expiries, the heartbeat agents</text>
    </g>
    <rect x="36" y="308" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="180" y="325" text-anchor="middle" font-weight="600">where the state lives</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="180" y="339">Firestore: runs, keys</text>
      <text x="180" y="352">the journal, the state, the lease, the version</text>
      <text x="180" y="365">the journal is the audit trail (§9)</text>
    </g>
    <rect x="36" y="388" width="288" height="62" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="180" y="405" text-anchor="middle" font-weight="600">the main cost</text>
    <g font-size="11" text-anchor="middle">
      <text x="180" y="421">you own the orchestration bugs</text>
      <text x="180" y="436">three services to make secure</text>
    </g>

    <!-- panel B -->
    <rect x="344" y="40" width="312" height="422" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="500" y="58" text-anchor="middle" font-size="11.5" font-weight="600" fill="#97A59F">B · Cloud Workflows as the orchestrator</text>
    <rect x="356" y="68" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="500" y="85" text-anchor="middle" font-weight="600">what wakes the run</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="500" y="99">await_callback for people</text>
      <text x="500" y="112">sys.sleep for polls, retry blocks</text>
      <text x="500" y="125">parallel fan-out, all in the YAML</text>
    </g>
    <rect x="356" y="148" width="288" height="62" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="500" y="165" text-anchor="middle" font-weight="600">the Workflows execution</text>
    <g font-size="11" fill="#7ADACF" text-anchor="middle">
      <text x="500" y="179">the YAML holds the graph</text>
      <text x="500" y="192">durability, waits and retries: declarative</text>
      <text x="500" y="205">an execution can wait up to a year</text>
    </g>
    <rect x="356" y="228" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="500" y="245" text-anchor="middle" font-weight="600">where the steps run</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="500" y="259">Cloud Run endpoints:</text>
      <text x="500" y="272">/worker, /aggregate, /notify, /approve</text>
      <text x="500" y="285">Cloud Run does the LLM steps (§5.1)</text>
    </g>
    <rect x="356" y="308" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="500" y="325" text-anchor="middle" font-weight="600">where the state lives</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="500" y="339">the execution, with shared variables</text>
      <text x="500" y="352">across parallel branches (§5)</text>
      <text x="500" y="365">the execution history is the audit log</text>
    </g>
    <rect x="356" y="388" width="288" height="62" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="500" y="405" text-anchor="middle" font-weight="600">the main cost</text>
    <g font-size="11" text-anchor="middle">
      <text x="500" y="419">static YAML: a dynamic control flow</text>
      <text x="500" y="432">that the model selects is not easy</text>
      <text x="500" y="445">per-step pricing: tight loops are high-cost</text>
    </g>

    <!-- panel C -->
    <rect x="664" y="40" width="312" height="422" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="820" y="58" text-anchor="middle" font-size="11.5" font-weight="600" fill="#97A59F">C · ADK 2 on Cloud Run, Cloud SQL sessions</text>
    <rect x="676" y="68" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="820" y="85" text-anchor="middle" font-weight="600">what wakes the run</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="820" y="99">Cloud Scheduler, Pub/Sub: /wake</text>
      <text x="820" y="112">/wake resumes the session</text>
      <text x="820" y="125">that already exists</text>
    </g>
    <rect x="676" y="148" width="288" height="62" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="820" y="165" text-anchor="middle" font-weight="600">the ADK 2 Workflow</text>
    <g font-size="11" fill="#7ADACF" text-anchor="middle">
      <text x="820" y="179">get_fast_api_app(...) in one container</text>
      <text x="820" y="192">RequestInput interrupts, resume and</text>
      <text x="820" y="205">compaction are native to the framework</text>
    </g>
    <rect x="676" y="228" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="820" y="245" text-anchor="middle" font-weight="600">where the steps run</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="820" y="259">the nodes of the Workflow graph</text>
      <text x="820" y="272">the same agent code, byte for byte,</text>
      <text x="820" y="285">on a laptop (adk web, SQLite) and Cloud Run</text>
    </g>
    <rect x="676" y="308" width="288" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="820" y="325" text-anchor="middle" font-weight="600">where the state lives</text>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="820" y="339">Cloud SQL sessions:</text>
      <text x="820" y="352">session_service_uri=postgresql+asyncpg://…</text>
      <text x="820" y="365">artifacts: artifact_service_uri=gs://…</text>
    </g>
    <rect x="676" y="388" width="288" height="62" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="820" y="405" text-anchor="middle" font-weight="600">the main cost</text>
    <g font-size="11" text-anchor="middle">
      <text x="820" y="421">resume is best-effort and at-least-once:</text>
      <text x="820" y="436">the tools must be idempotent</text>
    </g>

    <!-- the arrows between the rows -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)">
      <path d="M180 130 L180 146"/>
      <path d="M180 210 L180 226"/>
      <path d="M180 290 L180 306"/>
      <path d="M180 370 L180 386"/>
      <path d="M500 130 L500 146"/>
      <path d="M500 210 L500 226"/>
      <path d="M500 290 L500 306"/>
      <path d="M500 370 L500 386"/>
      <path d="M820 130 L820 146"/>
      <path d="M820 210 L820 226"/>
      <path d="M820 290 L820 306"/>
      <path d="M820 370 L820 386"/>
    </g>

    <text x="500" y="482" text-anchor="middle" font-size="11" fill="#97A59F">D · the same ADK agent on Agent Runtime: replace the runner, keep the agent, send the wake-ups from outside (lra-gcp/examples/adk_agent_engine/)</text>
  </g>
</svg>
