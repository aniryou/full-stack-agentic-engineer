[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lra"
version = "0.1.0"
description = "Long-Running Agents on GCP: durable-execution engine, design patterns, and reference services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Everything needed to run against real Google Cloud services.
gcp = [
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
    "google-cloud-tasks>=2.16",
    "google-genai>=1.0",
    "google-auth>=2.29",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-gcp-trace>=1.6",
]
# Cloud Run services (control-plane API + step worker).
services = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
# Managed-runtime path (Agent Development Kit + Agent Engine).
adk = [
    "google-adk>=1.0",
    "google-cloud-aiplatform[agent_engines]>=1.90",
]
dev = [
    "pytest>=8",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
