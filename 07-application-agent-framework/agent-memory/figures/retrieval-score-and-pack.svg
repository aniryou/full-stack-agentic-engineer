<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" aria-label="Retrieval inside one partition: the hashing embedder gives a cosine per candidate, score() ranks by recency, importance and relevance, and pack() takes each record that fits the token budget, in rank order." style="color: #E4EAE7">
  <title>Retrieval inside one partition: the hashing embedder gives a cosine per candidate, score() ranks by recency, importance and relevance, and pack() takes each record that fits the token budget, in rank order.</title>
  <rect x="0" y="0" width="900" height="346" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- row 1: query, embedder, partition, score -->
    <rect x="24" y="64" width="110" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="79" y="94" text-anchor="middle" font-weight="600">query</text>
    <text x="79" y="114" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">retrieve(query)</text>

    <rect x="178" y="64" width="150" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="253" y="88" text-anchor="middle" font-weight="600">HashingEmbedder</text>
    <text x="253" y="106" text-anchor="middle" font-size="11" fill="#97A59F">crc32, 1,024 buckets</text>
    <text x="253" y="122" text-anchor="middle" font-size="11" fill="#97A59F">lexical, offline</text>

    <rect x="378" y="64" width="216" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="486" y="88" text-anchor="middle" font-weight="600">one partition (tenant, user)</text>
    <text x="486" y="106" text-anchor="middle" font-size="11" fill="#97A59F">candidates: active, not expired</text>
    <text x="486" y="122" text-anchor="middle" font-size="11" fill="#97A59F">as_of=t adds facts valid at t</text>

    <rect x="626" y="56" width="250" height="88" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="751" y="78" text-anchor="middle" font-weight="600">score(): rank by three terms</text>
    <text x="751" y="96" text-anchor="middle" font-size="11.5" fill="#7ADACF">recency · importance · relevance</text>
    <text x="751" y="112" text-anchor="middle" font-size="11" fill="#97A59F">each min-max normalised to [0, 1]</text>
    <text x="751" y="128" text-anchor="middle" font-size="11" fill="#97A59F">weights: paper 1, 1, 1 · code 0.5, 2, 3</text>

    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M134 100 L176 100" marker-end="url(#arr)"/>
      <path d="M328 100 L376 100" marker-end="url(#arr)"/>
      <path d="M594 100 L624 100" marker-end="url(#arr)"/>
      <path d="M650 144 L650 174" marker-end="url(#arr)"/>
      <path d="M700 232 L730 232" marker-end="url(#arr)"/>
    </g>
    <text x="352" y="91" text-anchor="middle" font-size="11" fill="#97A59F">cosine</text>
    <text x="658" y="164" font-size="11" fill="#97A59F">in rank order</text>

    <!-- row 2: pack into the budget -->
    <rect x="368" y="176" width="332" height="136" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="534" y="196" text-anchor="middle" font-weight="600">pack(): take each record that fits, in rank order</text>
    <text x="384" y="216" font-size="11" fill="#97A59F">ranked list:</text>
    <g font-size="11">
      <rect x="384" y="224" width="44" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="406" y="238" text-anchor="middle">fact</text>
      <rect x="432" y="224" width="48" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="456" y="238" text-anchor="middle">fact</text>
      <rect x="484" y="224" width="50" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="509" y="238" text-anchor="middle">fact</text>
      <rect x="538" y="224" width="104" height="20" rx="4" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/><text x="590" y="238" text-anchor="middle">a long record</text>
      <rect x="646" y="224" width="44" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1"/><text x="668" y="238" text-anchor="middle">fact</text>
    </g>
    <text x="534" y="260" text-anchor="middle" font-size="11" fill="#97A59F">pack() skips a record that does not fit and tries the next one</text>
    <text x="384" y="278" font-size="11" fill="#97A59F">the per-turn token budget:</text>
    <rect x="384" y="284" width="300" height="22" rx="4" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <g font-size="10.5" fill="#7ADACF">
      <rect x="387" y="287" width="44" height="16" rx="3" fill="#4CC5B7" fill-opacity="0.22" stroke="#7ADACF" stroke-width="1"/><text x="409" y="299" text-anchor="middle">fact</text>
      <rect x="434" y="287" width="48" height="16" rx="3" fill="#4CC5B7" fill-opacity="0.22" stroke="#7ADACF" stroke-width="1"/><text x="458" y="299" text-anchor="middle">fact</text>
      <rect x="485" y="287" width="50" height="16" rx="3" fill="#4CC5B7" fill-opacity="0.22" stroke="#7ADACF" stroke-width="1"/><text x="510" y="299" text-anchor="middle">fact</text>
      <rect x="538" y="287" width="44" height="16" rx="3" fill="#4CC5B7" fill-opacity="0.22" stroke="#7ADACF" stroke-width="1"/><text x="560" y="299" text-anchor="middle">fact</text>
    </g>

    <rect x="732" y="200" width="144" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="804" y="224" text-anchor="middle" font-weight="600">Recall</text>
    <text x="804" y="240" text-anchor="middle" font-size="11" fill="#97A59F">the packed records,</text>
    <text x="804" y="254" text-anchor="middle" font-size="11" fill="#97A59F">into the prompt</text>

    <!-- a read is also a write -->
    <path d="M804 264 L804 330 L350 330 L350 160 L486 160 L486 138" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="802" y="326" text-anchor="end" font-size="11" fill="#97A59F">touch: last_accessed = now (a read is also a write)</text>
  </g>
</svg>
