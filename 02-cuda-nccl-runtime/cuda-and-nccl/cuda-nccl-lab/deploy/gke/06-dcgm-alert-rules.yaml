# Generated by gpurt.dcgm.rules_manifest(): edit RULES in gpurt/dcgm.py, not this file.
# ClusterRules for Google Managed Prometheus: cluster-scoped, because a namespaced Rules object only
# evaluates metrics from its own namespace and the DCGM exporter runs elsewhere (GKE system or gmp-public).
# Firing alerts go to Alertmanager (GMP: the managed one, configured by a Secret in gmp-public;
# see deploy/gke/README.md), not to Cloud Monitoring alerting policies.
# Field prerequisites: stock dcgm-exporter lacks DCGM_FI_DEV_CLOCKS_EVENT_REASONS and DCGM_FI_PROF_SM_ACTIVE;
# Google's GMP DCGM example list (which GKE's managed package resembles, verify) lacks the XID, remap and
# clock fields. deploy/any-gpu/dcgm-counters.csv has them all (self-managed exporter);
# gpurt.dcgm.rules_that_cannot_fire(fields) lists the rules a given exporter can never trigger.
# VERIFY: the apiVersion; the workload labels (exported_pod, exported_namespace: a scraper's own target labels
# pod/namespace take precedence); the field names your exporter version exposes
# (DCGM_FI_DEV_CLOCKS_EVENT_REASONS was DCGM_FI_DEV_CLOCK_THROTTLE_REASONS in older DCGM).
apiVersion: monitoring.googleapis.com/v1
kind: ClusterRules
metadata:
  name: gpu-health
spec:
  groups:
  - name: gpu-health
    interval: 60s
    rules:
    - alert: GpuXidHardware
      expr: (DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 74 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 95) and changes(DCGM_FI_DEV_XID_ERRORS[15m]) > 0
      labels:
        severity: critical
      annotations:
        summary: 'Hardware XID {{ $value }} on {{ $labels.Hostname }} gpu {{ $labels.gpu }}: drain now'
    - alert: GpuXidNode
      expr: (DCGM_FI_DEV_XID_ERRORS == 61 or DCGM_FI_DEV_XID_ERRORS == 62 or DCGM_FI_DEV_XID_ERRORS == 63 or DCGM_FI_DEV_XID_ERRORS == 92 or DCGM_FI_DEV_XID_ERRORS == 94 or DCGM_FI_DEV_XID_ERRORS == 119 or DCGM_FI_DEV_XID_ERRORS == 120) and changes(DCGM_FI_DEV_XID_ERRORS[15m]) > 0
      labels:
        severity: warning
      annotations:
        summary: 'XID {{ $value }} on {{ $labels.Hostname }}: drain and reset the GPU when convenient'
    - alert: GpuXidApplication
      expr: (DCGM_FI_DEV_XID_ERRORS == 13 or DCGM_FI_DEV_XID_ERRORS == 31 or DCGM_FI_DEV_XID_ERRORS == 43 or DCGM_FI_DEV_XID_ERRORS == 45) and changes(DCGM_FI_DEV_XID_ERRORS[15m]) > 0
      labels:
        severity: info
      annotations:
        summary: 'XID {{ $value }} on {{ $labels.Hostname }}: an application fault; tell its owner'
    - alert: GpuXidUnknown
      expr: (DCGM_FI_DEV_XID_ERRORS > 0 unless (DCGM_FI_DEV_XID_ERRORS == 13 or DCGM_FI_DEV_XID_ERRORS == 31 or DCGM_FI_DEV_XID_ERRORS == 43 or DCGM_FI_DEV_XID_ERRORS == 45 or DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 61 or DCGM_FI_DEV_XID_ERRORS == 62 or DCGM_FI_DEV_XID_ERRORS == 63 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 74 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 92 or DCGM_FI_DEV_XID_ERRORS == 94 or DCGM_FI_DEV_XID_ERRORS == 95 or DCGM_FI_DEV_XID_ERRORS == 119 or DCGM_FI_DEV_XID_ERRORS == 120)) and changes(DCGM_FI_DEV_XID_ERRORS[15m]) > 0
      labels:
        severity: warning
      annotations:
        summary: 'XID {{ $value }} on {{ $labels.Hostname }} is not in the lab''s table: look it up, collect nvidia-bug-report.sh'
    - alert: GpuRowRemapFailure
      expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
      labels:
        severity: critical
      annotations:
        summary: 'Row remapping failed: the GPU cannot repair its memory, replace it'
    - alert: GpuUncorrectableRemappedRows
      expr: DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS > 0
      labels:
        severity: warning
      annotations:
        summary: 'Rows remapped after uncorrectable errors: reset pending; watch the trend'
    - alert: GpuThermalThrottling
      expr: floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 32) % 4 > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 'Thermal slowdown (SW or HW) on {{ $labels.Hostname }} gpu {{ $labels.gpu }}: facilities ticket'
    - alert: GpuHardwareSlowdown
      expr: floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 8) % 2 > 0 or floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 128) % 2 > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 'HW slowdown / power brake: check power supply and cooling'
    - alert: GpuBusyButUnderfilled
      expr: DCGM_FI_DEV_GPU_UTIL > 90 and on (Hostname, gpu) DCGM_FI_PROF_SM_ACTIVE < 0.3
      for: 15m
      labels:
        severity: info
      annotations:
        summary: 'GPU_UTIL high but few SMs busy: batch more, fuse kernels, or capture CUDA Graphs'
    - alert: GpuIdleWhileAllocated
      expr: DCGM_FI_DEV_GPU_UTIL{exported_pod!=""} < 5
      for: 30m
      labels:
        severity: info
      annotations:
        summary: 'A pod holds a GPU it is not using: {{ $labels.exported_namespace }}/{{ $labels.exported_pod }}'
