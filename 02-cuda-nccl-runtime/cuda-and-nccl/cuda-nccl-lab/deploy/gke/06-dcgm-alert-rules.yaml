# Generated by gpurt.dcgm.rules_manifest(): edit RULES in gpurt/dcgm.py, not this file.
# Rules for Google Managed Prometheus.
# VERIFY: the apiVersion, and the DCGM field names your exporter version exposes
# (DCGM_FI_DEV_CLOCKS_EVENT_REASONS was DCGM_FI_DEV_CLOCK_THROTTLE_REASONS in older DCGM).
apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: gpu-health
  namespace: gpu-lab
spec:
  groups:
  - name: gpu-health
    interval: 60s
    rules:
    - alert: GpuXidHardware
      expr: DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 74 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 95
      labels:
        severity: critical
      annotations:
        summary: 'Hardware XID {{ $value }} on {{ $labels.Hostname }} gpu {{ $labels.gpu }}: drain now'
    - alert: GpuXidNode
      expr: DCGM_FI_DEV_XID_ERRORS == 61 or DCGM_FI_DEV_XID_ERRORS == 62 or DCGM_FI_DEV_XID_ERRORS == 63 or DCGM_FI_DEV_XID_ERRORS == 92 or DCGM_FI_DEV_XID_ERRORS == 94 or DCGM_FI_DEV_XID_ERRORS == 119 or DCGM_FI_DEV_XID_ERRORS == 120
      labels:
        severity: warning
      annotations:
        summary: 'XID {{ $value }} on {{ $labels.Hostname }}: drain and reset the GPU when convenient'
    - alert: GpuXidApplication
      expr: DCGM_FI_DEV_XID_ERRORS > 0 unless (DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 74 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 95 or DCGM_FI_DEV_XID_ERRORS == 61 or DCGM_FI_DEV_XID_ERRORS == 62 or DCGM_FI_DEV_XID_ERRORS == 63 or DCGM_FI_DEV_XID_ERRORS == 92 or DCGM_FI_DEV_XID_ERRORS == 94 or DCGM_FI_DEV_XID_ERRORS == 119 or DCGM_FI_DEV_XID_ERRORS == 120)
      labels:
        severity: info
      annotations:
        summary: 'XID {{ $value }} on {{ $labels.Hostname }}: usually the application; tell its owner'
    - alert: GpuRowRemapFailure
      expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
      labels:
        severity: critical
      annotations:
        summary: 'Row remapping failed: the GPU cannot repair its memory, replace it'
    - alert: GpuUncorrectableRemappedRows
      expr: DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS > 0
      labels:
        severity: warning
      annotations:
        summary: 'Rows remapped after uncorrectable errors: reset pending; watch the trend'
    - alert: GpuThermalThrottling
      expr: floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 32) % 4 > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 'Thermal slowdown (SW or HW) on {{ $labels.Hostname }} gpu {{ $labels.gpu }}: facilities ticket'
    - alert: GpuHardwareSlowdown
      expr: floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 8) % 2 > 0 or floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 128) % 2 > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 'HW slowdown / power brake: check power supply and cooling'
    - alert: GpuBusyButUnderfilled
      expr: DCGM_FI_DEV_GPU_UTIL > 90 and on (Hostname, gpu) DCGM_FI_PROF_SM_ACTIVE < 0.3
      for: 15m
      labels:
        severity: info
      annotations:
        summary: 'GPU_UTIL high but few SMs busy: batch more, fuse kernels, or capture CUDA Graphs'
    - alert: GpuIdleWhileAllocated
      expr: DCGM_FI_DEV_GPU_UTIL{pod!=""} < 5
      for: 30m
      labels:
        severity: info
      annotations:
        summary: 'A pod holds a GPU it is not using: {{ $labels.namespace }}/{{ $labels.pod }}'
