<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-label="A kernel launch is a grid of blocks of warps of threads; each block goes to one SM, whose four sub-partitions hold 8 warps each at 2,048 registers per warp, so 32 of 48 warps are resident: 4 blocks, 67% occupancy, limited by the registers." style="color: #E4EAE7">
  <title>A kernel launch is a grid of blocks of warps of threads; each block goes to one SM, whose four sub-partitions hold 8 warps each at 2,048 registers per warp, so 32 of 48 warps are resident: 4 blocks, 67% occupancy, limited by the registers.</title>
  <rect x="0" y="0" width="900" height="512" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="24" y="30" width="196" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="122.0" y="55" text-anchor="middle" font-weight="600">grid</text>
    <text x="122.0" y="76" text-anchor="middle" font-size="11" fill="#97A59F">the blocks of one kernel launch</text>
    <rect x="262" y="30" width="196" height="64" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="360.0" y="55" text-anchor="middle" font-weight="600">block (CTA)</text>
    <text x="360.0" y="76" text-anchor="middle" font-size="11" fill="#7ADACF">up to 1,024 threads; here 256 = 8 warps</text>
    <rect x="500" y="30" width="196" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="598.0" y="55" text-anchor="middle" font-weight="600">warp</text>
    <text x="598.0" y="76" text-anchor="middle" font-size="11" fill="#97A59F">32 threads, one instruction stream</text>
    <rect x="738" y="30" width="138" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="807.0" y="55" text-anchor="middle" font-weight="600">thread</text>
    <text x="807.0" y="76" text-anchor="middle" font-size="11" fill="#97A59F">here 64 registers</text>
