    <text x="360.0" y="70" text-anchor="middle" font-size="11" fill="#7ADACF">up to 1,024 threads;</text>
    <text x="360.0" y="85" text-anchor="middle" font-size="11" fill="#7ADACF">here 256 = 8 warps</text>
    <rect x="500" y="26" width="196" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="598.0" y="50" text-anchor="middle" font-weight="600">warp</text>
    <text x="598.0" y="70" text-anchor="middle" font-size="11" fill="#97A59F">32 threads, one</text>
    <text x="598.0" y="85" text-anchor="middle" font-size="11" fill="#97A59F">instruction stream</text>
    <rect x="738" y="26" width="138" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="807.0" y="50" text-anchor="middle" font-weight="600">thread</text>
    <text x="807.0" y="70" text-anchor="middle" font-size="11" fill="#97A59F">here 64 registers</text>
    <text x="807.0" y="85" text-anchor="middle" font-size="11" fill="#97A59F">per thread</text>
