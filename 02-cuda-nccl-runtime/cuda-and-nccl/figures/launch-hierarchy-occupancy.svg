    <text x="122.0" y="50" text-anchor="middle" font-weight="600">grid</text>
    <text x="122.0" y="70" text-anchor="middle" font-size="11" fill="#97A59F">the blocks of one</text>
    <text x="122.0" y="85" text-anchor="middle" font-size="11" fill="#97A59F">kernel launch</text>
    <rect x="262" y="26" width="196" height="72" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
