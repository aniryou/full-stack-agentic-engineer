    <rect x="24" y="152" width="852" height="278" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="450" y="170" text-anchor="middle" fill="#97A59F">one SM of an L4 (CC 8.9): 4 sub-partitions, each with a warp scheduler that issues one instruction per cycle; 48 warps maximum</text>
