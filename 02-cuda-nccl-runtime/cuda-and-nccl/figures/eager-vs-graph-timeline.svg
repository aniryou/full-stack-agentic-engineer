<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="In eager mode each 5 µs launch precedes a 2 µs kernel, so the GPU is idle 60% of the time; a CUDA Graph costs one 10 µs launch and then runs the kernels back to back." style="color: #E4EAE7">
