# The lab's gateway (T0): two fake providers speaking two dialects, three aliases, three tenants.
# `${VAR:-default}` is filled from the environment; gwlab.stack sets the provider URLs to the fakes' ports.
# Prices are dated rows from gwlab/gateway/metering.py (2026-09-26, verify) borrowed by the fake models so the
# ledger shows realistic dollars; the fakes are not those models.
gateway:
  admin_token: ${GWLAB_ADMIN_TOKEN:-dev-admin-token}      # guards /admin/*; set a real secret outside a laptop
  salt_secret: ${GWLAB_SALT_SECRET:-dev-salt-secret}      # derives each tenant's cache_salt (HMAC); keep secret
  db: ${GWLAB_DB:-:memory:}                               # sqlite3: keys (hashed), cache, ledger
  spans: ${GWLAB_SPANS:-}                                 # JSON-lines file of OTLP/JSON spans ("" = keep in memory)

providers:
  acme:                                  # an OpenAI-dialect provider (a fake here; vLLM speaks the same dialect)
    dialect: openai
    base_url: ${ACME_URL:-http://127.0.0.1:8101}
    key: ${ACME_API_KEY:-acme-key-1}
    region: us
    first_byte_timeout_s: 2.0
    cache_salt: true                     # the fake honours vLLM's cache_salt
  bolt:                                  # an Anthropic-dialect provider
    dialect: anthropic
    base_url: ${BOLT_URL:-http://127.0.0.1:8102}
    key: ${BOLT_API_KEY:-bolt-key-1}
    region: eu
    first_byte_timeout_s: 2.0

models:                                  # the catalogue: what each (provider, model) can do and costs
  acme/fast:   {provider: acme, upstream: fast-1, context_window: 8192, tools: true, price: gpt-5.4-mini}
  acme/strong: {provider: acme, upstream: strong-1, context_window: 32768, tools: true, price: gemini-3.5-flash}
  bolt/haiku:  {provider: bolt, upstream: claude-haiku-4-5, context_window: 200000, tools: true, price: claude-haiku-4-5}

aliases:                                 # what clients name; an ordered chain of targets
  chat:        {policy: ordered, targets: [acme/fast, bolt/haiku]}
  chat-strong: {policy: ordered, targets: [acme/strong, bolt/haiku]}
  chat-cheap:  {policy: cheapest, targets: [acme/strong, bolt/haiku, acme/fast]}

tenants:
  team-a:  {aliases: [chat, chat-strong, chat-cheap], rpm: 600, tpm: 200000, tier: premium}
  team-b:  {aliases: [chat, chat-cheap], rpm: 600, tpm: 200000, tier: standard}
  team-eu: {aliases: [chat], rpm: 600, tpm: 200000, regions: [eu]}

limits:
  mode: reserve                          # reserve -> stream -> reconcile (per_request for the comparison)
  minute_s: 60
  default_output_estimate: 512
  hard_output_cap: 2048
  per_request_output_guess: 64
  global_tpm: 0

cache:
  exact: true
  semantic: true
  threshold: 0.92
  entity_guard: true
  ttl_s: 3600

guardrails:
  input: "off"
  output: "off"
  window_tokens: 16
  check_ms: 20

breaker:                                 # consecutive failures, as 07.2's CircuitBreaker counts them
  failure_threshold: 3
  recovery_timeout_s: 5
