<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img" aria-label="The class of the route sends a request to no cache, the exact cache or the semantic cache, and a miss calls the model." style="color: #E4EAE7">
  <title>The class of the route sends a request to no cache, the exact cache or the semantic cache, and a miss calls the model.</title>
  <rect x="0" y="0" width="900" height="416" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="16" y="24" width="164" height="56" rx="28" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="98" y="47" text-anchor="middle">a request on a route</text>
    <text x="98" y="65" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">metadata.cache_class</text>
    <polygon points="98,154 176,212 98,270 20,212" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="98" y="200" text-anchor="middle" font-size="12">class on the</text>
    <text x="98" y="215" text-anchor="middle" font-size="12">allowlist,</text>
    <text x="98" y="230" text-anchor="middle" font-size="12">no tools?</text>
    <rect x="296" y="30" width="150" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="371" y="48" text-anchor="middle">call the model,</text>
    <text x="371" y="64" text-anchor="middle">store nothing</text>
    <rect x="296" y="114" width="150" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="371" y="136" text-anchor="middle" font-weight="600">SHA-256 key</text>
    <text x="371" y="153" text-anchor="middle" font-size="11" fill="#97A59F">tenant and fields</text>
    <rect x="566" y="116" width="140" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="636" y="136" text-anchor="middle">serve the</text>
    <text x="636" y="152" text-anchor="middle">stored answer</text>
    <rect x="506" y="218" width="140" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="576" y="244" text-anchor="middle" font-weight="600">call the model</text>
    <rect x="750" y="202" width="140" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="820" y="222" text-anchor="middle">store the answer</text>
    <text x="820" y="237" text-anchor="middle">with a TTL</text>
    <text x="820" y="253" text-anchor="middle" font-size="11" fill="#97A59F">in the tenant's</text>
    <text x="820" y="267" text-anchor="middle" font-size="11" fill="#97A59F">namespace</text>
    <rect x="296" y="320" width="150" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="371" y="340" text-anchor="middle">embed, find the</text>
    <text x="371" y="355" text-anchor="middle">nearest cached</text>
    <text x="371" y="370" text-anchor="middle">query</text>
    <polygon points="540,306 604,350 540,394 476,350" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="540" y="346" text-anchor="middle" font-size="12">similarity at</text>
    <text x="540" y="361" text-anchor="middle" font-size="12">or above τ?</text>
    <polygon points="676,310 728,350 676,390 624,350" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="676" y="346" text-anchor="middle" font-size="12">entities</text>
    <text x="676" y="361" text-anchor="middle" font-size="12">equal?</text>
    <rect x="756" y="312" width="134" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="823" y="332" text-anchor="middle">serve the</text>
    <text x="823" y="347" text-anchor="middle">answer of the</text>
    <text x="823" y="362" text-anchor="middle">nearest cached</text>
    <text x="823" y="377" text-anchor="middle">query</text>
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M98 80 L98 152" marker-end="url(#arr)"/>
      <path d="M176 212 L206 212"/>
      <path d="M206 52 L206 350"/>
      <path d="M206 52 L294 52" marker-end="url(#arr)"/>
      <path d="M206 140 L294 140" marker-end="url(#arr)"/>
      <path d="M206 350 L294 350" marker-end="url(#arr)"/>
      <path d="M446 140 L564 140" marker-end="url(#arr)"/>
      <path d="M371 166 L371 240 L504 240" marker-end="url(#arr)"/>
      <path d="M646 240 L748 240" marker-end="url(#arr)"/>
      <path d="M446 350 L474 350" marker-end="url(#arr)"/>
      <path d="M604 350 L622 350" marker-end="url(#arr)"/>
      <path d="M728 350 L754 350" marker-end="url(#arr)"/>
      <path d="M540 306 L540 264" marker-end="url(#arr)"/>
      <path d="M676 310 L676 288 L620 288 L620 264" marker-end="url(#arr)"/>
    </g>
    <g font-size="11" fill="#97A59F">
      <text x="250" y="45" text-anchor="middle">no</text>
      <text x="250" y="133" text-anchor="middle">yes: exact</text>
      <text x="250" y="343" text-anchor="middle">yes: semantic</text>
      <text x="505" y="132" text-anchor="middle">the same key</text>
      <text x="379" y="207">no such key</text>
      <text x="697" y="219" text-anchor="middle" font-family="JetBrains Mono, monospace">finish_reason:</text>
      <text x="697" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace">stop</text>
      <text x="548" y="290">no</text>
      <text x="684" y="302">no</text>
      <text x="613" y="342" text-anchor="middle">yes</text>
      <text x="741" y="342" text-anchor="middle">yes</text>
    </g>
  </g>
</svg>
