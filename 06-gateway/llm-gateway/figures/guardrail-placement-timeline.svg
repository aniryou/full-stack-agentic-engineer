<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" aria-label="Six guardrail placements on one 300-token answer, as bars on a time axis, with the time that each adds before the first token reaches the client." style="color: #E4EAE7">
  <title>Six guardrail placements on one 300-token answer, as bars on a time axis, with the time that each adds before the first token reaches the client.</title>
  <rect x="0" y="0" width="900" height="452" rx="8" fill="#161E1C"/>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="24" y="30" font-weight="600">Where a guardrail sits, and what it adds before the first token</text>
    <text x="24" y="50" font-size="11.5" fill="#97A59F">one 300-token answer: TTFT 0.4 s, ITL 20 ms, end to end 6.38 s <tspan font-family="JetBrains Mono, monospace" font-size="11">guardrails.added_latency()</tspan></text>
    <text x="24" y="82" font-weight="600">no check</text>
    <text x="24" y="98" font-size="11" fill="#97A59F">the reference answer</text>
    <rect x="262.0" y="75.0" width="36.7" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="298.7" y="75.0" width="548.0" height="18" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M298.7 65 L298.7 97" stroke="#4CC5B7" stroke-width="1.4"/><text x="303.7" y="71" font-size="11.5" fill="#7ADACF" text-anchor="start">first token at 0.4 s</text>
    <path d="M24 111 L876 111" stroke="#97A59F" stroke-width="0.4" stroke-dasharray="2 4"/>
    <text x="24" y="134" font-weight="600">inline input</text>
    <text x="24" y="150" font-size="11" fill="#97A59F">a 19.3 ms check, then the model</text>
    <rect x="262.0" y="127.0" width="1.8" height="18" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="263.8" y="127.0" width="36.7" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="300.4" y="127.0" width="548.0" height="18" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M300.4 117 L300.4 149" stroke="#4CC5B7" stroke-width="1.4"/><text x="305.4" y="123" font-size="11.5" fill="#7ADACF" text-anchor="start">+ 19.3 ms</text>
    <path d="M24 163 L876 163" stroke="#97A59F" stroke-width="0.4" stroke-dasharray="2 4"/>
    <text x="24" y="186" font-weight="600">parallel input</text>
    <text x="24" y="202" font-size="11" fill="#97A59F">check and model start together</text>
    <rect x="262.0" y="179.0" width="1.8" height="8" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="262.0" y="189.0" width="36.7" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="298.7" y="179.0" width="548.0" height="18" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M298.7 169 L298.7 201" stroke="#4CC5B7" stroke-width="1.4"/><text x="303.7" y="175" font-size="11.5" fill="#7ADACF" text-anchor="start">adds nothing</text>
    <path d="M24 215 L876 215" stroke="#97A59F" stroke-width="0.4" stroke-dasharray="2 4"/>
    <text x="24" y="238" font-weight="600">held-back window, W = 200</text>
    <text x="24" y="254" font-size="11" fill="#97A59F">a 150 ms check per window</text>
    <rect x="262.0" y="231.0" width="36.7" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="298.7" y="231.0" width="364.7" height="18" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="663.4" y="231.0" width="13.7" height="18" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="677.1" y="231.0" width="183.3" height="18" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="481.0" y="244" font-size="11" fill="#E39A62" text-anchor="middle">199 tokens generated, held back</text>
    <path d="M677.1 221 L677.1 253" stroke="#4CC5B7" stroke-width="1.4"/><text x="682.1" y="227" font-size="11.5" fill="#7ADACF" text-anchor="start">+ 4.13 s</text>
    <path d="M24 267 L876 267" stroke="#97A59F" stroke-width="0.4" stroke-dasharray="2 4"/>
    <text x="24" y="290" font-weight="600">held-back window, W = 50</text>
    <text x="24" y="306" font-size="11" fill="#97A59F">a 150 ms check per window</text>
    <rect x="262.0" y="283.0" width="36.7" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="298.7" y="283.0" width="89.8" height="18" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="388.5" y="283.0" width="13.7" height="18" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <rect x="402.2" y="283.0" width="458.2" height="18" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="343.6" y="296" font-size="11" fill="#E39A62" text-anchor="middle">49 tokens held</text>
    <path d="M402.2 273 L402.2 305" stroke="#4CC5B7" stroke-width="1.4"/><text x="407.2" y="279" font-size="11.5" fill="#7ADACF" text-anchor="start">+ 1.13 s</text>
    <path d="M24 319 L876 319" stroke="#97A59F" stroke-width="0.4" stroke-dasharray="2 4"/>
    <text x="24" y="342" font-weight="600">final</text>
    <text x="24" y="358" font-size="11" fill="#97A59F">whole answer, then a 150 ms check</text>
    <rect x="262.0" y="335.0" width="36.7" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="298.7" y="335.0" width="548.0" height="18" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <rect x="846.7" y="335.0" width="13.7" height="18" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="572.7" y="348" font-size="11" fill="#E39A62" text-anchor="middle">299 tokens generated, held back</text>
    <path d="M860.4 325 L860.4 357" stroke="#4CC5B7" stroke-width="1.4"/><text x="855.4" y="331" font-size="11.5" fill="#7ADACF" text-anchor="end">+ 6.13 s, no streaming</text>
    <path d="M262 382 L876 382" stroke="#97A59F" stroke-width="1"/>
    <path d="M262.0 382 L262.0 387" stroke="#97A59F" stroke-width="1"/>
    <text x="262.0" y="400" font-size="11" fill="#97A59F" text-anchor="middle">0</text>
    <path d="M353.6 382 L353.6 387" stroke="#97A59F" stroke-width="1"/>
    <text x="353.6" y="400" font-size="11" fill="#97A59F" text-anchor="middle">1</text>
    <path d="M445.3 382 L445.3 387" stroke="#97A59F" stroke-width="1"/>
    <text x="445.3" y="400" font-size="11" fill="#97A59F" text-anchor="middle">2</text>
    <path d="M536.9 382 L536.9 387" stroke="#97A59F" stroke-width="1"/>
    <text x="536.9" y="400" font-size="11" fill="#97A59F" text-anchor="middle">3</text>
    <path d="M628.6 382 L628.6 387" stroke="#97A59F" stroke-width="1"/>
    <text x="628.6" y="400" font-size="11" fill="#97A59F" text-anchor="middle">4</text>
    <path d="M720.2 382 L720.2 387" stroke="#97A59F" stroke-width="1"/>
    <text x="720.2" y="400" font-size="11" fill="#97A59F" text-anchor="middle">5</text>
    <path d="M811.9 382 L811.9 387" stroke="#97A59F" stroke-width="1"/>
    <text x="811.9" y="400" font-size="11" fill="#97A59F" text-anchor="middle">6</text>
    <text x="876" y="400" font-size="11" fill="#97A59F" text-anchor="end">seconds</text>
    <rect x="24.0" y="416.0" width="22.0" height="12" rx="2" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="54" y="426" font-size="11" fill="#97A59F">a check</text>
    <rect x="128.0" y="416.0" width="22.0" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="158" y="426" font-size="11" fill="#97A59F">the model, before its first token</text>
    <rect x="399.0" y="416.0" width="22.0" height="12" rx="2" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="429" y="426" font-size="11" fill="#97A59F">tokens generated but held back</text>
    <rect x="651.0" y="416.0" width="22.0" height="12" rx="2" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="681" y="426" font-size="11" fill="#97A59F">tokens reach the client</text>
  </g>
</svg>
