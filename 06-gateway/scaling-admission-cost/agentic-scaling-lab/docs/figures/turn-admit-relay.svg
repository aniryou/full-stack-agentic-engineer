<svg xmlns="http://www.w3.org/2000/svg" width="940" height="446" viewBox="0 0 940 446" role="img" aria-label="A sequence diagram of the gateway side of one turn: the client posts a message, the gateway admits or sheds it, creates the turn, publishes it to Pub/Sub, opens the SSE stream and later relays the stream events from Redis." style="color: #E4EAE7">
  <title>A sequence diagram of the gateway side of one turn: the client posts a message, the gateway admits or sheds it, creates the turn, publishes it to Pub/Sub, opens the SSE stream and later relays the stream events from Redis.</title>
  <rect x="0" y="0" width="940" height="446" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="24" y="136" width="336" height="50" rx="4" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="M70 56 L70 430" stroke="#97A59F" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <path d="M310 56 L310 430" stroke="#97A59F" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <path d="M560 56 L560 430" stroke="#97A59F" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <path d="M720 56 L720 430" stroke="#97A59F" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <path d="M870 56 L870 430" stroke="#97A59F" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <rect x="28" y="139" width="60" height="15" fill="#161E1C"/>
    <text x="32" y="150" font-size="11" fill="#97A59F"><tspan font-weight="600">alt</tspan>  shed</text>
    <rect x="24" y="320" width="892" height="32" rx="4" fill="#161E1C" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="470.0" y="340.0" text-anchor="middle" font-size="11.5" fill="#97A59F">the orchestrator runs the turn (next figure)</text>
    <rect x="20.0" y="18" width="100" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="70" y="42" text-anchor="middle" font-weight="600">Client</text>
    <rect x="255.0" y="18" width="110" height="38" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="310" y="42" text-anchor="middle" font-weight="600" fill="#7ADACF">gateway</text>
    <rect x="510.0" y="18" width="100" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="560" y="42" text-anchor="middle" font-weight="600">Redis</text>
    <rect x="665.0" y="18" width="110" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="720" y="42" text-anchor="middle" font-weight="600">Firestore</text>
    <rect x="820.0" y="18" width="100" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="870" y="42" text-anchor="middle" font-weight="600">Pub/Sub</text>
    <path d="M73 92 L307 92" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="76" y="73" width="200" height="16" fill="#161E1C"/>
    <text x="80" y="86" font-size="11.5">POST /v1/sessions/{id}/messages</text>
    <path d="M313 122 L557 122" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="316" y="103" width="219" height="16" fill="#161E1C"/>
    <text x="320" y="116" font-size="11.5">tenant bucket · level · inflight+1</text>
    <path d="M307 174 L73 174" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <rect x="166" y="155" width="138" height="16" fill="#161E1C"/>
    <text x="300" y="168" text-anchor="end" font-size="11.5">429/503 + Retry-After</text>
    <path d="M313 214 L717 214" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="316" y="195" width="132" height="16" fill="#161E1C"/>
    <text x="320" y="208" font-size="11.5">create turn (queued)</text>
    <path d="M313 244 L867 244" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="316" y="225" width="306" height="16" fill="#161E1C"/>
    <text x="320" y="238" font-size="11.5">publish {session, turn} (ordering key = session)</text>
    <path d="M313 274 L557 274" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <rect x="316" y="255" width="107" height="16" fill="#161E1C"/>
    <text x="320" y="268" font-size="11.5">XADD turn.queued</text>
    <path d="M307 304 L73 304" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <rect x="197" y="285" width="107" height="16" fill="#161E1C"/>
    <text x="300" y="298" text-anchor="end" font-size="11.5">SSE stream opens</text>
    <path d="M557 384 L313 384" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <rect x="465" y="365" width="89" height="16" fill="#161E1C"/>
    <text x="550" y="378" text-anchor="end" font-size="11.5">stream events</text>
    <path d="M307 414 L73 414" stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <rect x="129" y="395" width="175" height="16" fill="#161E1C"/>
    <text x="300" y="408" text-anchor="end" font-size="11.5">SSE events … turn.completed</text>
  </g>
</svg>
