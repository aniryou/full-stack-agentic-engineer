<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="556" viewBox="0 0 1000 556" role="img" aria-label="The reference architecture of Part 4: the client, the load balancer, the gateway, Pub/Sub, the orchestrator with the model gateway and the tool executor, Gemini, the tool services and the two stores." style="color: #E4EAE7">
  <title>The reference architecture of Part 4: the client, the load balancer, the gateway, Pub/Sub, the orchestrator with the model gateway and the tool executor, Gemini, the tool services and the two stores.</title>
  <rect x="0" y="0" width="1000" height="556" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- client and edge -->
    <rect x="16" y="24" width="168" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="100" y="51" text-anchor="middle" font-weight="600">App / web portal</text>
    <rect x="16" y="96" width="168" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="100" y="120" text-anchor="middle" font-weight="600">Global external ALB</text>
    <text x="100" y="141" text-anchor="middle" font-size="11.5" fill="#97A59F">Cloud Armor rate limits</text>
    <text x="100" y="158" text-anchor="middle" font-size="11.5" fill="#97A59F">+ WAF · IAP</text>
    <!-- gateway -->
    <rect x="16" y="204" width="168" height="136" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="100" y="228" text-anchor="middle" font-weight="600">gateway</text>
    <text x="100" y="246" text-anchor="middle" font-size="11.5" fill="#7ADACF">Cloud Run</text>
    <text x="100" y="268" text-anchor="middle" font-size="11.5">auth · admission</text>
    <text x="100" y="285" text-anchor="middle" font-size="11.5">enqueue · SSE relay</text>
    <text x="100" y="307" text-anchor="middle" font-size="11.5" fill="#97A59F">request-based</text>
    <text x="100" y="324" text-anchor="middle" font-size="11.5" fill="#97A59F">concurrency 250, min 2</text>
    <!-- Pub/Sub -->
    <ellipse cx="365" cy="226" rx="95" ry="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M270 226 L270 318 A95 8 0 0 0 460 318 L460 226" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="365" y="256" text-anchor="middle" font-weight="600">Pub/Sub agent-turns</text>
    <text x="365" y="276" text-anchor="middle" font-size="11.5" fill="#97A59F">ack 600 s</text>
    <text x="365" y="293" text-anchor="middle" font-size="11.5" fill="#97A59F">retry 10–600 s</text>
    <text x="365" y="310" text-anchor="middle" font-size="11.5" fill="#97A59F">DLQ after 5</text>
    <!-- orchestrator -->
    <rect x="536" y="204" width="190" height="136" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="631" y="228" text-anchor="middle" font-weight="600">orchestrator</text>
    <text x="631" y="246" text-anchor="middle" font-size="11.5" fill="#7ADACF">Cloud Run</text>
    <text x="631" y="268" text-anchor="middle" font-size="11.5">durable loop · budgets</text>
    <text x="631" y="285" text-anchor="middle" font-size="11.5">checkpoints</text>
    <text x="631" y="307" text-anchor="middle" font-size="11.5" fill="#97A59F">instance-based</text>
    <text x="631" y="324" text-anchor="middle" font-size="11.5" fill="#97A59F">concurrency 80, min 2</text>
    <!-- model gateway and Gemini -->
    <rect x="536" y="40" width="190" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="631" y="64" text-anchor="middle" font-weight="600">model gateway</text>
    <text x="631" y="85" text-anchor="middle" font-size="11.5" fill="#97A59F">routing · buckets · retry</text>
    <text x="631" y="102" text-anchor="middle" font-size="11.5" fill="#97A59F">breaker · fallback</text>
    <rect x="796" y="40" width="184" height="80" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="888" y="64" text-anchor="middle" font-weight="600">Gemini</text>
    <text x="888" y="85" text-anchor="middle" font-size="11.5">global endpoint</text>
    <text x="888" y="102" text-anchor="middle" font-size="11.5">PT + spill-over</text>
    <!-- tools -->
    <rect x="796" y="232" width="184" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="888" y="256" text-anchor="middle" font-weight="600">tool executor</text>
    <text x="888" y="277" text-anchor="middle" font-size="11.5" fill="#97A59F">bulkhead · breaker</text>
    <text x="888" y="294" text-anchor="middle" font-size="11.5" fill="#97A59F">cache · idempotency</text>
    <rect x="796" y="372" width="184" height="100" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="888" y="396" text-anchor="middle" font-weight="600">tool services</text>
    <text x="888" y="414" text-anchor="middle" font-size="11.5" fill="#97A59F">Cloud Run</text>
    <text x="888" y="436" text-anchor="middle" font-size="11.5">profile · policy admin</text>
    <text x="888" y="453" text-anchor="middle" font-size="11.5">claims · documents · MCP</text>
    <!-- Memorystore Valkey -->
    <ellipse cx="365" cy="376" rx="95" ry="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M270 376 L270 444 A95 8 0 0 0 460 444 L460 376" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="365" y="402" text-anchor="middle" font-weight="600">Memorystore Valkey</text>
    <text x="365" y="420" text-anchor="middle" font-size="11.5" fill="#97A59F">streams · locks · buckets</text>
    <text x="365" y="437" text-anchor="middle" font-size="11.5" fill="#97A59F">idempotency · level</text>
    <!-- Firestore -->
    <ellipse cx="365" cy="476" rx="95" ry="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M270 476 L270 538 A95 8 0 0 0 460 538 L460 476" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="365" y="501" text-anchor="middle" font-weight="600">Firestore</text>
    <text x="365" y="518" text-anchor="middle" font-size="11.5" fill="#97A59F">sessions · turns</text>
    <text x="365" y="534" text-anchor="middle" font-size="11.5" fill="#97A59F">steps · TTL</text>
    <!-- edges -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M100 68 L100 94" marker-end="url(#arr)"/>
      <path d="M100 176 L100 202" marker-end="url(#arr)"/>
      <path d="M184 272 L268 272" marker-end="url(#arr)"/>
      <path d="M460 272 L534 272" marker-end="url(#arr)"/>
      <path d="M631 204 L631 122" marker-end="url(#arr)"/>
      <path d="M726 80 L794 80" marker-end="url(#arr)"/>
      <path d="M726 272 L794 272" marker-end="url(#arr)"/>
      <path d="M888 312 L888 370" marker-end="url(#arr)"/>
      <path d="M150 342 L150 410 L268 410" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <path d="M60 340 L60 506 L268 506" marker-end="url(#arr)"/>
      <path d="M600 340 L600 410 L462 410" marker-end="url(#arr)"/>
      <path d="M690 342 L690 506 L462 506" marker-start="url(#arr)" marker-end="url(#arr)"/>
    </g>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="227" y="234">publish,</text>
      <text x="227" y="249">ordering key</text>
      <text x="227" y="264">= session</text>
      <text x="498" y="249">push</text>
      <text x="498" y="264">+ OIDC</text>
    </g>
  </g>
</svg>
