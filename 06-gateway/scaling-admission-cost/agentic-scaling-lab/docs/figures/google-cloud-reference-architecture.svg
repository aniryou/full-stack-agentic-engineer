<svg xmlns="http://www.w3.org/2000/svg" width="900" height="556" viewBox="0 0 900 556" role="img" aria-label="The reference architecture of Part 4: the gateway and the orchestrator on Cloud Run, Pub/Sub between them, and the parts and stores they use." style="color: #E4EAE7">
  <title>The reference architecture of Part 4: the gateway and the orchestrator on Cloud Run, Pub/Sub between them, and the parts and stores they use.</title>
  <rect x="0" y="0" width="900" height="556" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- client and edge -->
    <rect x="16" y="24" width="164" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="98" y="51" text-anchor="middle" font-weight="600">App / web portal</text>
    <rect x="16" y="96" width="164" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="98" y="120" text-anchor="middle" font-weight="600">Global external ALB</text>
    <text x="98" y="141" text-anchor="middle" font-size="11.5" fill="#97A59F">Cloud Armor rate limits</text>
    <text x="98" y="158" text-anchor="middle" font-size="11.5" fill="#97A59F">+ WAF · IAP</text>
    <!-- gateway -->
    <rect x="16" y="204" width="164" height="136" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="98" y="228" text-anchor="middle" font-weight="600">gateway</text>
    <text x="98" y="246" text-anchor="middle" font-size="11.5" fill="#7ADACF">Cloud Run</text>
    <text x="98" y="268" text-anchor="middle" font-size="11.5">auth · admission</text>
    <text x="98" y="285" text-anchor="middle" font-size="11.5">enqueue · SSE relay</text>
    <text x="98" y="307" text-anchor="middle" font-size="11.5" fill="#97A59F">request-based</text>
    <text x="98" y="324" text-anchor="middle" font-size="11.5" fill="#97A59F">concurrency 250, min 2</text>
    <!-- Pub/Sub -->
    <ellipse cx="336" cy="226" rx="84" ry="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M252 226 L252 318 A84 8 0 0 0 420 318 L420 226" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="336" y="256" text-anchor="middle" font-weight="600">Pub/Sub agent-turns</text>
    <text x="336" y="276" text-anchor="middle" font-size="11.5" fill="#97A59F">ack 600 s</text>
    <text x="336" y="293" text-anchor="middle" font-size="11.5" fill="#97A59F">retry 10–600 s</text>
    <text x="336" y="310" text-anchor="middle" font-size="11.5" fill="#97A59F">DLQ after 5</text>
    <!-- orchestrator -->
    <rect x="484" y="204" width="172" height="136" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="570" y="228" text-anchor="middle" font-weight="600">orchestrator</text>
    <text x="570" y="246" text-anchor="middle" font-size="11.5" fill="#7ADACF">Cloud Run</text>
    <text x="570" y="268" text-anchor="middle" font-size="11.5">durable loop · budgets</text>
    <text x="570" y="285" text-anchor="middle" font-size="11.5">checkpoints</text>
    <text x="570" y="307" text-anchor="middle" font-size="11.5" fill="#97A59F">instance-based</text>
    <text x="570" y="324" text-anchor="middle" font-size="11.5" fill="#97A59F">concurrency 80, min 2</text>
    <!-- model gateway and Gemini -->
    <rect x="484" y="40" width="172" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="570" y="64" text-anchor="middle" font-weight="600">model gateway</text>
    <text x="570" y="85" text-anchor="middle" font-size="11.5" fill="#97A59F">routing · buckets · retry</text>
    <text x="570" y="102" text-anchor="middle" font-size="11.5" fill="#97A59F">breaker · fallback</text>
    <rect x="716" y="40" width="168" height="80" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="800" y="64" text-anchor="middle" font-weight="600">Gemini</text>
    <text x="800" y="85" text-anchor="middle" font-size="11.5">global endpoint</text>
    <text x="800" y="102" text-anchor="middle" font-size="11.5">PT + spill-over</text>
    <!-- tools -->
    <rect x="716" y="232" width="168" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="800" y="256" text-anchor="middle" font-weight="600">tool executor</text>
    <text x="800" y="277" text-anchor="middle" font-size="11.5" fill="#97A59F">bulkhead · breaker</text>
    <text x="800" y="294" text-anchor="middle" font-size="11.5" fill="#97A59F">cache · idempotency</text>
    <rect x="716" y="372" width="168" height="100" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="800" y="396" text-anchor="middle" font-weight="600">tool services</text>
    <text x="800" y="414" text-anchor="middle" font-size="11.5" fill="#97A59F">Cloud Run</text>
    <text x="800" y="436" text-anchor="middle" font-size="11.5">profile · policy admin</text>
    <text x="800" y="453" text-anchor="middle" font-size="11.5">claims · documents · MCP</text>
    <!-- Memorystore Valkey -->
    <ellipse cx="336" cy="376" rx="84" ry="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M252 376 L252 444 A84 8 0 0 0 420 444 L420 376" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="336" y="402" text-anchor="middle" font-weight="600">Memorystore Valkey</text>
    <text x="336" y="420" text-anchor="middle" font-size="11.5" fill="#97A59F">streams · locks · buckets</text>
    <text x="336" y="437" text-anchor="middle" font-size="11.5" fill="#97A59F">idempotency · level</text>
    <!-- Firestore -->
    <ellipse cx="336" cy="476" rx="84" ry="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M252 476 L252 538 A84 8 0 0 0 420 538 L420 476" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="336" y="501" text-anchor="middle" font-weight="600">Firestore</text>
    <text x="336" y="518" text-anchor="middle" font-size="11.5" fill="#97A59F">sessions · turns</text>
    <text x="336" y="534" text-anchor="middle" font-size="11.5" fill="#97A59F">steps · TTL</text>
    <!-- edges -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M98 68 L98 94" marker-end="url(#arr)"/>
      <path d="M98 176 L98 202" marker-end="url(#arr)"/>
      <path d="M180 272 L250 272" marker-end="url(#arr)"/>
      <path d="M420 272 L482 272" marker-end="url(#arr)"/>
      <path d="M570 204 L570 122" marker-end="url(#arr)"/>
      <path d="M656 80 L714 80" marker-end="url(#arr)"/>
      <path d="M656 272 L714 272" marker-end="url(#arr)"/>
      <path d="M800 312 L800 370" marker-end="url(#arr)"/>
      <path d="M144 342 L144 410 L250 410" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <path d="M56 340 L56 506 L250 506" marker-end="url(#arr)"/>
      <path d="M530 340 L530 410 L422 410" marker-end="url(#arr)"/>
      <path d="M616 342 L616 506 L422 506" marker-start="url(#arr)" marker-end="url(#arr)"/>
    </g>
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="216" y="219">publish,</text>
      <text x="216" y="234">ordering</text>
      <text x="216" y="249">key =</text>
      <text x="216" y="264">session</text>
      <text x="451" y="249">push</text>
      <text x="451" y="264">+ OIDC</text>
    </g>
  </g>
</svg>
