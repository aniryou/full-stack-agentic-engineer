name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: execute notebooks
        run: |
          mkdir -p build/nb
          for nb in notebooks/*.ipynb notebooks/solutions/*.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=180 --output-dir build/nb "$nb"
          done
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.13.3" }
      - run: cd infra/terraform && terraform init -backend=false -input=false && terraform fmt -check -recursive && terraform validate
