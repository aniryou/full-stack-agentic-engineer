<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-label="The user's prompt and each tool result go through a check before the model reads them, and the answer goes through screen_response()." style="color: #E4EAE7">
  <title>The user's prompt and each tool result go through a check before the model reads them, and the answer goes through screen_response().</title>
  <rect x="0" y="0" width="1000" height="452" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC5B7"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="16" y="44" width="134" height="56" rx="28" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="83" y="68" text-anchor="middle" font-weight="600">the user's</text>
    <text x="83" y="86" text-anchor="middle" font-weight="600">prompt</text>

    <rect x="186" y="44" width="160" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="266" y="68" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">screen_prompt()</text>
    <text x="266" y="86" text-anchor="middle" font-size="11.5" fill="#97A59F">Model Armor</text>

    <rect x="434" y="44" width="160" height="56" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="514" y="68" text-anchor="middle" font-weight="600">the model</text>
    <text x="514" y="86" text-anchor="middle" font-size="11.5" fill="#7ADACF">one context window</text>

    <rect x="630" y="44" width="160" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="710" y="68" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">screen_response()</text>
    <text x="710" y="86" text-anchor="middle" font-size="11.5" fill="#97A59F">Model Armor</text>

    <rect x="830" y="44" width="150" height="56" rx="28" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="905" y="68" text-anchor="middle" font-weight="600">the answer</text>
    <text x="905" y="86" text-anchor="middle" font-weight="600">to the user</text>

    <rect x="610" y="168" width="200" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="710" y="190" text-anchor="middle" font-weight="600">tool input schemas</text>
    <text x="710" y="208" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#97A59F">EgressPolicy.check(url)</text>

    <rect x="650" y="270" width="120" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="710" y="302" text-anchor="middle" font-weight="600">the tool</text>

    <rect x="368" y="366" width="240" height="68" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="488" y="388" text-anchor="middle" font-weight="600">untrusted content</text>
    <text x="488" y="405" text-anchor="middle" font-size="11.5" fill="#97A59F">web pages, documents, tickets,</text>
    <text x="488" y="420" text-anchor="middle" font-size="11.5" fill="#97A59F">emails, messages from other agents</text>

    <rect x="166" y="268" width="200" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="266" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">sanitize_tool_output()</text>
    <text x="266" y="305" text-anchor="middle" font-size="11.5" fill="#97A59F">removes control characters</text>
    <text x="266" y="320" text-anchor="middle" font-size="11.5" fill="#97A59F">and instruction patterns</text>

    <rect x="166" y="168" width="200" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="266" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">wrap_untrusted()</text>
    <text x="266" y="208" text-anchor="middle" font-size="11.5" fill="#97A59F">a Provenance tag</text>

    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M150 72 L184 72" marker-end="url(#arr)"/>
      <path d="M346 72 L432 72" marker-end="url(#arr)"/>
      <path d="M594 72 L628 72" marker-end="url(#arr)"/>
      <path d="M790 72 L828 72" marker-end="url(#arr)"/>
      <path d="M554 100 L554 134 L710 134 L710 166" marker-end="url(#arr)"/>
      <path d="M710 224 L710 268" marker-end="url(#arr)"/>
      <path d="M710 326 L710 400 L610 400" marker-end="url(#arr)"/>
      <path d="M368 400 L266 400 L266 336" marker-end="url(#arr)"/>
      <path d="M266 268 L266 226" marker-end="url(#arr)"/>
    </g>
    <path d="M266 168 L266 134 L474 134 L474 102" fill="none" stroke="#4CC5B7" stroke-width="1.2" marker-end="url(#arrA)"/>
    <g font-size="11" fill="#97A59F">
      <text x="389" y="64" text-anchor="middle">not blocked</text>
      <text x="632" y="127" text-anchor="middle">a tool call</text>
      <text x="720" y="368">returns</text>
      <text x="319" y="392" text-anchor="middle">a tool result</text>
    </g>
    <text x="370" y="127" text-anchor="middle" font-size="11" fill="#7ADACF">data, never instructions</text>
  </g>
</svg>
