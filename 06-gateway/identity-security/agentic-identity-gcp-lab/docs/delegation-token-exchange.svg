<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="250" viewBox="0 0 1030 250" role="img" aria-label="A user's token and the agent's certificate-bound actor token are exchanged at the STS for one delegated token naming the user as subject and the agent as actor, bound to the agent's certificate and scoped to one MCP server, which validates audience, scope and binding." style="color: #E4EAE7">
  <title>A user's token and the agent's certificate-bound actor token are exchanged at the STS for one delegated token naming the user as subject and the agent as actor, bound to the agent's certificate and scoped to one MCP server, which validates audience, scope and binding.</title>
  <rect x="0" y="0" width="1030" height="250" rx="8" fill="#161E1C"/>
          <defs>
            <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
          </defs>
          <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
            <!-- user -->
            <rect x="24" y="40" width="170" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="109" y="64" text-anchor="middle" font-weight="600">User (front-end)</text>
            <text x="109" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">id token · sub=u-ana</text>
            <!-- agent -->
            <rect x="24" y="150" width="170" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="109" y="174" text-anchor="middle" font-weight="600">Agent (runtime)</text>
            <text x="109" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">actor token · cnf=cert</text>
            <!-- STS -->
            <rect x="300" y="92" width="200" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="400" y="118" text-anchor="middle" font-weight="600">STS / Auth Manager</text>
            <text x="400" y="138" text-anchor="middle" font-size="11.5">RFC 8693 token exchange</text>
            <!-- token -->
            <rect x="580" y="72" width="250" height="110" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
            <text x="705" y="94" text-anchor="middle" font-weight="600">Delegated token</text>
            <g font-family="JetBrains Mono, monospace" font-size="11">
              <text x="596" y="114">sub: u-ana</text>
              <text x="596" y="130">act: {sub: spiffe://…/agent}</text>
              <text x="596" y="146">aud: https://tickets/mcp</text>
              <text x="596" y="162">scope: tickets:read · cnf: cert</text>
            </g>
            <!-- resource server -->
            <rect x="900" y="72" width="110" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="955" y="98" text-anchor="middle" font-weight="600">MCP server</text>
            <text x="955" y="118" text-anchor="middle" font-size="11">verifies</text>
            <g font-family="JetBrains Mono, monospace" font-size="11">
              <text x="955" y="136" text-anchor="middle">aud ✓</text>
              <text x="955" y="152" text-anchor="middle">scope ✓</text>
              <text x="955" y="168" text-anchor="middle">cnf ✓</text>
            </g>
            <!-- arrows -->
            <g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#arrD)">
              <path d="M194 72 C 250 72, 260 112, 300 112"/>
              <path d="M194 182 C 250 182, 260 142, 300 142"/>
              <line x1="500" y1="127" x2="580" y2="127"/>
              <line x1="830" y1="127" x2="900" y2="127"/>
            </g>
            <g font-size="11" fill="#97A59F">
              <text x="238" y="60">subject_token</text>
              <text x="238" y="205">actor_token</text>
              <text x="540" y="116" text-anchor="middle">narrow aud + scope</text>
              <text x="865" y="116" text-anchor="middle">over mTLS</text>
            </g>
          </g>
        </svg>
