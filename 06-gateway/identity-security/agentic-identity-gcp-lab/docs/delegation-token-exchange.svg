<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-label="The STS exchanges the user's subject token and the agent's actor token for one delegated token that names both, and the MCP server verifies it." style="color: #E4EAE7">
  <title>The STS exchanges the user's subject token and the agent's actor token for one delegated token that names both, and the MCP server verifies it.</title>
  <rect x="0" y="0" width="980" height="250" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- user -->
    <rect x="18" y="40" width="176" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="106" y="64" text-anchor="middle" font-weight="600">User (front-end)</text>
    <text x="106" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">id token · sub=u-ana</text>
    <!-- agent -->
    <rect x="18" y="150" width="176" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="106" y="174" text-anchor="middle" font-weight="600">Agent (runtime)</text>
    <text x="106" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11">actor token · cnf=cert</text>
    <!-- STS -->
    <rect x="268" y="92" width="184" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="360" y="118" text-anchor="middle" font-weight="600">STS / Auth Manager</text>
    <text x="360" y="138" text-anchor="middle" font-size="11.5">RFC 8693 token exchange</text>
    <!-- token: the subject -->
    <rect x="540" y="72" width="236" height="110" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="658" y="94" text-anchor="middle" font-weight="600">Delegated token</text>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#7ADACF">
      <text x="556" y="114">sub: u-ana</text>
      <text x="556" y="130">act: {sub: spiffe://…/agent}</text>
      <text x="556" y="146">aud: https://tickets/mcp</text>
      <text x="556" y="162">scope: tickets:read · cnf: cert</text>
    </g>
    <!-- resource server -->
    <rect x="840" y="72" width="120" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="900" y="98" text-anchor="middle" font-weight="600">MCP server</text>
    <text x="900" y="118" text-anchor="middle" font-size="11" fill="#97A59F">verifies</text>
    <g font-family="JetBrains Mono, monospace" font-size="11">
      <text x="900" y="136" text-anchor="middle">aud ✓</text>
      <text x="900" y="152" text-anchor="middle">scope ✓</text>
      <text x="900" y="168" text-anchor="middle">cnf ✓</text>
    </g>
    <!-- arrows -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arrD)">
      <path d="M194 72 C 232 72, 236 112, 266 112"/>
      <path d="M194 182 C 232 182, 236 142, 266 142"/>
      <path d="M452 127 L538 127"/>
      <path d="M776 127 L838 127"/>
    </g>
    <g font-size="11" fill="#97A59F">
      <text x="204" y="58">subject_token</text>
      <text x="204" y="208">actor_token</text>
      <text x="496" y="106" text-anchor="middle">narrow aud</text>
      <text x="496" y="119" text-anchor="middle">and scope</text>
      <text x="807" y="106" text-anchor="middle">over</text>
      <text x="807" y="119" text-anchor="middle">mTLS</text>
    </g>
  </g>
</svg>
