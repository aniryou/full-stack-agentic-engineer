<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-label="Three parties share one tool call: the user asks, the model selects the tool and its arguments from a context window that holds instructions and untrusted data in one channel, and the agent runtime makes the call with a credential, under its own authority or on behalf of the user." style="color: #E4EAE7">
  <title>Three parties share one tool call: the user asks, the model selects the tool and its arguments from a context window that holds instructions and untrusted data in one channel, and the agent runtime makes the call with a credential, under its own authority or on behalf of the user.</title>
  <rect x="0" y="0" width="940" height="300" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- edge labels, above the chain -->
    <g font-size="11" fill="#97A59F" text-anchor="middle">
      <text x="172" y="42">the ask</text>
      <text x="408" y="42">reads</text>
      <text x="588" y="42">a tool call</text>
      <text x="778" y="42">the call, with a credential</text>
    </g>
    <!-- user -->
    <rect x="24" y="54" width="128" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="88" y="88" text-anchor="middle" font-weight="600">User</text>
    <text x="88" y="108" text-anchor="middle" font-size="11" fill="#97A59F">interactive,</text>
    <text x="88" y="123" text-anchor="middle" font-size="11" fill="#97A59F">gives consent</text>
    <!-- context window: the attack surface -->
    <rect x="192" y="54" width="196" height="88" rx="6" fill="#3A2C25" stroke="#E39A62" stroke-width="1.2"/>
    <text x="290" y="78" text-anchor="middle" font-weight="600">Context window</text>
    <text x="290" y="98" text-anchor="middle" font-size="11">prompts, tool results,</text>
    <text x="290" y="113" text-anchor="middle" font-size="11">web pages, documents,</text>
    <text x="290" y="128" text-anchor="middle" font-size="11">messages from other agents</text>
    <!-- model -->
    <rect x="428" y="54" width="140" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="498" y="88" text-anchor="middle" font-weight="600">Model</text>
    <text x="498" y="108" text-anchor="middle" font-size="11" fill="#97A59F">selects the tools</text>
    <text x="498" y="123" text-anchor="middle" font-size="11" fill="#97A59F">and the arguments</text>
    <!-- agent runtime: the subject -->
    <rect x="608" y="54" width="150" height="88" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="683" y="88" text-anchor="middle" font-weight="600">Agent runtime</text>
    <text x="683" y="108" text-anchor="middle" font-size="11.5" fill="#7ADACF">its own identity,</text>
    <text x="683" y="123" text-anchor="middle" font-size="11.5" fill="#7ADACF">holds the credentials</text>
    <!-- tool -->
    <rect x="798" y="54" width="118" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="857" y="88" text-anchor="middle" font-weight="600">Tool / API</text>
    <text x="857" y="108" text-anchor="middle" font-size="11" fill="#97A59F">the privileged</text>
    <text x="857" y="123" text-anchor="middle" font-size="11" fill="#97A59F">action</text>
    <!-- arrows -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none">
      <path d="M152 98 L190 98" marker-end="url(#arr)"/>
      <path d="M388 98 L426 98" marker-end="url(#arr)"/>
      <path d="M568 98 L606 98" marker-end="url(#arr)"/>
      <path d="M758 98 L796 98" marker-end="url(#arr)"/>
    </g>
    <!-- who did what, under the chain -->
    <g font-size="11" text-anchor="middle">
      <text x="88" y="164" fill="#97A59F">the user asked</text>
      <text x="88" y="178" fill="#97A59F">for a different thing</text>
      <text x="290" y="164" fill="#E39A62">anything the agent reads</text>
      <text x="290" y="178" fill="#E39A62">is an attack surface</text>
      <text x="498" y="164" fill="#97A59F">the model decided</text>
      <text x="683" y="164" fill="#7ADACF">the agent runtime</text>
      <text x="683" y="178" fill="#7ADACF">did the call</text>
    </g>
    <!-- classical IAM, bottom left -->
    <g font-size="11" fill="#97A59F">
      <text x="24" y="220">Classical IAM assumes that the caller of an API</text>
      <text x="24" y="234">is the entity that decided to call it.</text>
      <text x="24" y="254" fill="#E39A62">Here, three parties share one call: the confused</text>
      <text x="24" y="268" fill="#E39A62">deputy is the default state of an agent.</text>
    </g>
    <!-- the two authorities, bottom right -->
    <rect x="414" y="196" width="502" height="90" rx="8" fill="none" stroke="#97A59F" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="665" y="213" text-anchor="middle" font-size="11" fill="#97A59F">every action is under one of two authorities (tokens, policy and logs show which)</text>
    <rect x="428" y="224" width="232" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="544" y="244" text-anchor="middle" font-size="11" font-weight="600">own authority:</text>
    <text x="544" y="260" text-anchor="middle" font-size="11" fill="#97A59F">the agent's identity and permissions</text>
    <rect x="670" y="224" width="232" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="786" y="244" text-anchor="middle" font-size="11" font-weight="600">on behalf of a user (delegated):</text>
    <text x="786" y="260" text-anchor="middle" font-size="11" fill="#97A59F">the user's consent and permissions</text>
  </g>
</svg>
