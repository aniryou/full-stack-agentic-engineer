<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-label="Reference architecture: a user authenticates at the front-end and reaches an agent on Agent Runtime with its own Agent Identity and a runtime policy plugin; the agent calls Gemini behind Model Armor floor settings; Auth Manager brokers user-delegated credentials; all agent egress passes through Agent Gateway, which enforces IAM per SPIFFE ID, VPC-SC MCP conditions and Model Armor, before reaching an MCP server on Cloud Run, a peer agent over A2A, or Google MCP and SaaS APIs; the MCP server reaches data in a VPC-SC perimeter with its own upstream token; every layer emits audit events with both identities; a governance plane of Agent Registry, IAM, Org Policy, VPC-SC and Security Command Center spans the whole." style="color: #E4EAE7">
  <title>Reference architecture: a user authenticates at the front-end and reaches an agent on Agent Runtime with its own Agent Identity and a runtime policy plugin; the agent calls Gemini behind Model Armor floor settings; Auth Manager brokers user-delegated credentials; all agent egress passes through Agent Gateway, which enforces IAM per SPIFFE ID, VPC-SC MCP conditions and Model Armor, before reaching an MCP server on Cloud Run, a peer agent over A2A, or Google MCP and SaaS APIs; the MCP server reaches data in a VPC-SC perimeter with its own upstream token; every layer emits audit events with both identities; a governance plane of Agent Registry, IAM, Org Policy, VPC-SC and Security Command Center spans the whole.</title>
  <rect x="0" y="0" width="1100" height="680" rx="8" fill="#161E1C"/>
          <defs>
            <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
            <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
          </defs>
          <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
            <!-- governance plane -->
            <rect x="30" y="20" width="1040" height="46" rx="6" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="5 4"/>
            <text x="550" y="41" text-anchor="middle" font-weight="600">Governance plane</text>
            <text x="550" y="57" text-anchor="middle" font-size="11.5" fill="#97A59F">Agent Registry · IAM allow / deny / Principal Access Boundary · Org Policy custom constraints · VPC Service Controls · Security Command Center agent dashboard</text>

            <!-- row 1: user, front-end, runtime, gemini -->
            <rect x="30" y="110" width="110" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="85" y="138" text-anchor="middle" font-weight="600">User</text>
            <text x="85" y="156" text-anchor="middle" font-size="11" fill="#97A59F">IdP login (OIDC)</text>

            <rect x="190" y="110" width="140" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="260" y="138" text-anchor="middle" font-weight="600">Front-end</text>
            <text x="260" y="156" text-anchor="middle" font-size="11" fill="#97A59F">renders confirmations</text>

            <rect x="430" y="92" width="270" height="100" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
            <text x="565" y="116" text-anchor="middle" font-weight="600">Agent Runtime (Agent Engine)</text>
            <g font-family="JetBrains Mono, monospace" font-size="11">
              <text x="565" y="136" text-anchor="middle">identity_type = AGENT_IDENTITY</text>
              <text x="565" y="152" text-anchor="middle">ADK loop · SecurityPlugin</text>
            </g>
            <text x="565" y="176" text-anchor="middle" font-size="11" fill="#7ADACF">PEP: runtime — policy, confirmation, audit</text>

            <rect x="820" y="110" width="250" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="945" y="134" text-anchor="middle" font-weight="600">Gemini · Model Armor floor</text>
            <text x="945" y="152" text-anchor="middle" font-size="11" fill="#97A59F">PEP: model — prompt &amp; response screening</text>

            <!-- row 2: auth manager, gateway -->
            <rect x="30" y="270" width="230" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="145" y="294" text-anchor="middle" font-weight="600">Auth Manager</text>
            <text x="145" y="312" text-anchor="middle" font-size="11" fill="#97A59F">vault + broker: 3LO · 2LO · API keys</text>
            <text x="145" y="328" text-anchor="middle" font-size="11" fill="#97A59F">IAM: roles/agentidentity.user per provider</text>

            <rect x="430" y="262" width="270" height="90" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <text x="565" y="286" text-anchor="middle" font-weight="600">Agent Gateway</text>
            <text x="565" y="304" text-anchor="middle" font-size="11" fill="#97A59F">mTLS + DPoP · IAP/IAM per SPIFFE ID</text>
            <text x="565" y="320" text-anchor="middle" font-size="11" fill="#97A59F">VPC-SC mcp.toolName / isReadOnly · Model Armor</text>
            <text x="565" y="338" text-anchor="middle" font-size="11" fill="#7ADACF">PEP: network</text>

            <!-- row 3: destinations -->
            <rect x="170" y="430" width="272" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="306" y="452" text-anchor="middle" font-weight="600">MCP server (Cloud Run)</text>
            <text x="306" y="470" text-anchor="middle" font-size="11" fill="#97A59F">functional-type=mcp-server · in Agent Registry</text>
            <text x="306" y="486" text-anchor="middle" font-size="11" fill="#97A59F">OAuth 2.1 resource server: PRM · aud · scope→tool</text>
            <text x="306" y="502" text-anchor="middle" font-size="11" fill="#97A59F">readOnlyHint / destructiveHint</text>

            <rect x="470" y="430" width="190" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="565" y="452" text-anchor="middle" font-weight="600">Peer agent (A2A)</text>
            <text x="565" y="470" text-anchor="middle" font-size="11" fill="#97A59F">signed Agent Card</text>
            <text x="565" y="486" text-anchor="middle" font-size="11" fill="#97A59F">re-authorizes every hop</text>

            <rect x="700" y="430" width="230" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="815" y="452" text-anchor="middle" font-weight="600">Google MCP · SaaS APIs</text>
            <text x="815" y="470" text-anchor="middle" font-size="11" fill="#97A59F">BigQuery MCP, Jira, GitHub…</text>
            <text x="815" y="486" text-anchor="middle" font-size="11" fill="#97A59F">credentials via Auth Manager</text>

            <!-- row 4: data + audit -->
            <rect x="170" y="580" width="272" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="306" y="602" text-anchor="middle" font-weight="600">Data (BigQuery · GCS · DB)</text>
            <text x="306" y="620" text-anchor="middle" font-size="11" fill="#97A59F">inside the VPC-SC perimeter · CMEK</text>

            <rect x="560" y="580" width="510" height="56" rx="6" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="5 4"/>
            <text x="815" y="602" text-anchor="middle" font-weight="600">Audit</text>
            <text x="815" y="620" text-anchor="middle" font-size="11" fill="#97A59F">Cloud Audit Logs (agent + user) · Agent Observability · gateway telemetry · BigQuery sink</text>

            <!-- arrows -->
            <g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#arrA)">
              <line x1="140" y1="142" x2="190" y2="142"/>
              <line x1="330" y1="142" x2="430" y2="142"/>
              <line x1="700" y1="142" x2="820" y2="142"/>
              <line x1="565" y1="192" x2="565" y2="262"/>
              <line x1="260" y1="307" x2="430" y2="307"/>
              <path d="M 480 352 L 480 400 L 306 400 L 306 430"/>
              <line x1="565" y1="352" x2="565" y2="430"/>
              <path d="M 650 352 L 650 400 L 815 400 L 815 430"/>
              <line x1="306" y1="514" x2="306" y2="580"/>
            </g>
            <g stroke="#97A59F" stroke-width="1" fill="none" stroke-dasharray="3 3" marker-end="url(#arrM)">
              <path d="M 700 184 L 1050 184 L 1050 580"/>
              <path d="M 145 270 L 145 214 L 260 214 L 260 174"/>
            </g>
            <path d="M 700 344 L 1050 344" stroke="#97A59F" stroke-width="1" fill="none" stroke-dasharray="3 3"/>

            <!-- arrow labels -->
            <g font-size="11" fill="#97A59F">
              <text x="165" y="132" text-anchor="middle">id token</text>
              <text x="380" y="132" text-anchor="middle">user + consent</text>
              <text x="760" y="132" text-anchor="middle">prompts / responses</text>
              <text x="575" y="232" text-anchor="start">own authority: cert-bound token</text>
              <text x="575" y="246" text-anchor="start">delegated: user + agent (act)</text>
              <text x="345" y="296" text-anchor="middle">delegated creds (3LO)</text>
              <text x="152" y="238" text-anchor="start">consent redirect</text>
              <text x="395" y="392" text-anchor="middle">token for this audience only</text>
              <text x="735" y="392" text-anchor="middle">brokered credential</text>
              <text x="316" y="552" text-anchor="start">separate upstream token</text>
              <text x="316" y="566" text-anchor="start">(never forwarded)</text>
              <text x="1044" y="470" text-anchor="end">audit (agent + user)</text>
            </g>
          </g>
        </svg>
