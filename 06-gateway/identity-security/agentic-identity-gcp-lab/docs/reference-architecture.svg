<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="644" viewBox="0 0 1000 644" role="img" aria-label="The user reaches the agent on Agent Runtime through the front-end, and the agent reaches MCP servers, peer agents and APIs through Agent Gateway." style="color: #E4EAE7">
  <title>The user reaches the agent on Agent Runtime through the front-end, and the agent reaches MCP servers, peer agents and APIs through Agent Gateway.</title>
  <rect x="0" y="0" width="1000" height="644" rx="8" fill="#161E1C"/>
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#97A59F"/></marker>
  </defs>
  <g font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- governance plane -->
    <rect x="20" y="16" width="960" height="46" rx="6" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="500" y="37" text-anchor="middle" font-weight="600">Governance plane</text>
    <text x="500" y="53" text-anchor="middle" font-size="11.5" fill="#97A59F">Agent Registry · IAM allow / deny / Principal Access Boundary · Org Policy custom constraints · VPC Service Controls · Security Command Center agent dashboard</text>

    <!-- row 1: user, front-end, runtime, gemini -->
    <rect x="20" y="112" width="116" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="78" y="140" text-anchor="middle" font-weight="600">User</text>
    <text x="78" y="158" text-anchor="middle" font-size="11" fill="#97A59F">IdP login (OIDC)</text>

    <rect x="206" y="112" width="148" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="280" y="140" text-anchor="middle" font-weight="600">Front-end</text>
    <text x="280" y="158" text-anchor="middle" font-size="11" fill="#97A59F">renders confirmations</text>

    <rect x="426" y="88" width="244" height="112" rx="6" fill="#16302A" stroke="#4CC5B7" stroke-width="1.4"/>
    <text x="548" y="112" text-anchor="middle" font-weight="600">Agent Runtime (Agent Engine)</text>
    <g font-family="JetBrains Mono, monospace" font-size="11">
      <text x="548" y="132" text-anchor="middle">identity_type = AGENT_IDENTITY</text>
      <text x="548" y="148" text-anchor="middle">ADK loop · SecurityPlugin</text>
    </g>
    <text x="548" y="170" text-anchor="middle" font-size="11" fill="#7ADACF">PEP: runtime</text>
    <text x="548" y="186" text-anchor="middle" font-size="11" fill="#7ADACF">policy, confirmation, audit</text>

    <rect x="754" y="108" width="226" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="867" y="132" text-anchor="middle" font-weight="600">Gemini · Model Armor floor</text>
    <text x="867" y="150" text-anchor="middle" font-size="11" fill="#7ADACF">PEP: model</text>
    <text x="867" y="166" text-anchor="middle" font-size="11" fill="#97A59F">prompt and response screening</text>

    <!-- row 2: auth manager, gateway -->
    <rect x="20" y="272" width="256" height="74" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="148" y="296" text-anchor="middle" font-weight="600">Auth Manager</text>
    <text x="148" y="314" text-anchor="middle" font-size="11" fill="#97A59F">vault + broker: 3LO · 2LO · API keys</text>
    <text x="148" y="330" text-anchor="middle" font-size="11" fill="#97A59F">IAM: roles/agentidentity.user per provider</text>

    <rect x="426" y="256" width="244" height="106" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="548" y="280" text-anchor="middle" font-weight="600">Agent Gateway</text>
    <text x="548" y="298" text-anchor="middle" font-size="11" fill="#97A59F">mTLS + DPoP · IAP/IAM per SPIFFE ID</text>
    <text x="548" y="314" text-anchor="middle" font-size="11" fill="#97A59F">VPC-SC mcp.toolName / isReadOnly</text>
    <text x="548" y="330" text-anchor="middle" font-size="11" fill="#97A59F">Model Armor</text>
    <text x="548" y="350" text-anchor="middle" font-size="11" fill="#7ADACF">PEP: network</text>

    <!-- row 3: destinations -->
    <rect x="36" y="420" width="314" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="193" y="442" text-anchor="middle" font-weight="600">MCP server (Cloud Run)</text>
    <text x="193" y="460" text-anchor="middle" font-size="11" fill="#97A59F">functional-type=mcp-server · in Agent Registry</text>
    <text x="193" y="476" text-anchor="middle" font-size="11" fill="#97A59F">OAuth 2.1 resource server: PRM · aud · scope→tool</text>
    <text x="193" y="492" text-anchor="middle" font-size="11" fill="#97A59F">readOnlyHint / destructiveHint</text>

    <rect x="453" y="420" width="190" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="548" y="442" text-anchor="middle" font-weight="600">Peer agent (A2A)</text>
    <text x="548" y="460" text-anchor="middle" font-size="11" fill="#97A59F">signed Agent Card</text>
    <text x="548" y="476" text-anchor="middle" font-size="11" fill="#97A59F">re-authorizes every hop</text>

    <rect x="683" y="420" width="230" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="798" y="442" text-anchor="middle" font-weight="600">Google MCP · SaaS APIs</text>
    <text x="798" y="460" text-anchor="middle" font-size="11" fill="#97A59F">BigQuery MCP, Jira, GitHub…</text>
    <text x="798" y="476" text-anchor="middle" font-size="11" fill="#97A59F">credentials via Auth Manager</text>

    <!-- row 4: data + audit -->
    <rect x="36" y="568" width="314" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="193" y="590" text-anchor="middle" font-weight="600">Data (BigQuery · GCS · DB)</text>
    <text x="193" y="608" text-anchor="middle" font-size="11" fill="#97A59F">inside the VPC-SC perimeter · CMEK</text>

    <rect x="440" y="568" width="540" height="56" rx="6" fill="none" stroke="#97A59F" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="710" y="590" text-anchor="middle" font-weight="600">Audit</text>
    <text x="710" y="608" text-anchor="middle" font-size="11" fill="#97A59F">Cloud Audit Logs (agent + user) · Agent Observability · gateway telemetry · BigQuery sink</text>

    <!-- request paths: solid -->
    <g stroke="#97A59F" stroke-width="1.2" fill="none" marker-end="url(#arrA)">
      <path d="M136 144 L204 144"/>
      <path d="M354 144 L424 144"/>
      <path d="M670 144 L752 144"/>
      <path d="M548 200 L548 254"/>
      <path d="M276 309 L424 309"/>
      <path d="M470 362 L470 392 L193 392 L193 418"/>
      <path d="M548 362 L548 418"/>
      <path d="M626 362 L626 392 L798 392 L798 418"/>
      <path d="M193 504 L193 566"/>
    </g>
    <!-- audit and consent flows: dashed -->
    <g stroke="#97A59F" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#arrM)">
      <path d="M670 192 L962 192 L962 566"/>
      <path d="M148 272 L148 224 L280 224 L280 178"/>
    </g>
    <path d="M670 352 L962 352" stroke="#97A59F" stroke-width="1" fill="none" stroke-dasharray="4 3"/>

    <!-- arrow labels -->
    <g font-size="11" fill="#97A59F">
      <text x="170" y="136" text-anchor="middle">id token</text>
      <text x="389" y="124" text-anchor="middle">user +</text>
      <text x="389" y="137" text-anchor="middle">consent</text>
      <text x="711" y="124" text-anchor="middle">prompts /</text>
      <text x="711" y="137" text-anchor="middle">responses</text>
      <text x="558" y="222">own authority: cert-bound token</text>
      <text x="558" y="236">delegated: user + agent (act)</text>
      <text x="350" y="301" text-anchor="middle">delegated creds (3LO)</text>
      <text x="156" y="252">consent redirect</text>
      <text x="320" y="384" text-anchor="middle">token for this audience only</text>
      <text x="712" y="384" text-anchor="middle">brokered credential</text>
      <text x="203" y="532">separate upstream token</text>
      <text x="203" y="546">(never forwarded)</text>
      <text x="954" y="344" text-anchor="end">audit (agent + user)</text>
    </g>
  </g>
</svg>
